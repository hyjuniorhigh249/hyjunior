<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昊學文教 - 員工管理系統 v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* 列印專用 CSS */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: flex !important; flex-wrap: wrap; justify-content: center; gap: 20px; }
            .page-break { page-break-after: always; }
            body { background: white; }
        }
        .print-only { display: none; }
        
        /* 鏡頭掃描框樣式優化 */
        #qr-reader { border: none !important; }
        #qr-reader__scan_region { background: #f8fafc; border-radius: 0.5rem; overflow: hidden; }
        #qr-reader__dashboard_section_csr button { background: #059669; color: white; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-blue-800 text-white shadow-md p-4 flex justify-between items-center no-print">
        <h1 class="text-xl font-bold">昊學文教行政系統 - 員工管理 v3.0</h1>
        <div class="space-x-2 flex items-center">
            <div class="relative">
                <button onclick="toggleColumnMenu()" class="bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-bold hover:bg-blue-600 transition">
                    ⚙️ 自訂欄位
                </button>
                <div id="columnMenu" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-xl z-50 hidden border border-gray-200 text-gray-800 text-sm p-2">
                    <div class="font-bold border-b pb-1 mb-2">顯示/隱藏欄位</div>
                    <label class="flex items-center space-x-2 mb-1"><input type="checkbox" checked onchange="toggleCol('col-serial')" class="col-toggle"><span>員工編號</span></label>
                    <label class="flex items-center space-x-2 mb-1"><input type="checkbox" checked onchange="toggleCol('col-name')" class="col-toggle" disabled><span class="text-gray-400">姓名(必顯)</span></label>
                    <label class="flex items-center space-x-2 mb-1"><input type="checkbox" checked onchange="toggleCol('col-role')" class="col-toggle"><span>身份別</span></label>
                    <label class="flex items-center space-x-2 mb-1"><input type="checkbox" checked onchange="toggleCol('col-status')" class="col-toggle"><span>狀態</span></label>
                    <label class="flex items-center space-x-2 mb-1"><input type="checkbox" checked onchange="toggleCol('col-contact')" class="col-toggle"><span>聯絡/科目</span></label>
                    <label class="flex items-center space-x-2 mb-1"><input type="checkbox" checked onchange="toggleCol('col-salary')" class="col-toggle"><span>薪資設定</span></label>
                    <label class="flex items-center space-x-2 mb-1"><input type="checkbox" checked onchange="toggleCol('col-files')" class="col-toggle"><span>檔案資料</span></label>
                    <label class="flex items-center space-x-2 mb-1"><input type="checkbox" checked onchange="toggleCol('col-qr')" class="col-toggle"><span>員工QR碼</span></label>
                </div>
            </div>

            <button onclick="openAttendanceModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-md font-bold hover:bg-emerald-700 transition">
                📷 鏡頭考勤打卡
            </button>
            <button onclick="printSelectedQRs()" class="bg-indigo-600 text-white px-4 py-2 rounded-md font-bold hover:bg-indigo-700 transition">
                🖨️ 列印所選 QR
            </button>
            <button onclick="openModal()" class="bg-white text-blue-800 px-4 py-2 rounded-md font-bold hover:bg-gray-100 transition">
                + 新增員工
            </button>
        </div>
    </nav>

    <div class="p-6 max-w-full mx-auto no-print">
        <div class="bg-white rounded-lg shadow-md overflow-x-auto">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-blue-100 text-blue-800 border-b-2 border-blue-200">
                        <th class="p-4 font-semibold text-center w-10">
                            <input type="checkbox" id="selectAllQR" onchange="toggleAllCheckboxes()" class="w-4 h-4 cursor-pointer">
                        </th>
                        <th class="p-4 font-semibold col-serial">編號</th>
                        <th class="p-4 font-semibold col-name">姓名 (藝名)</th>
                        <th class="p-4 font-semibold col-role">身份別</th>
                        <th class="p-4 font-semibold col-status">狀態</th>
                        <th class="p-4 font-semibold col-contact">手機 / 可授課科目</th>
                        <th class="p-4 font-semibold col-salary">薪資設定</th>
                        <th class="p-4 font-semibold col-files">檔案資料</th>
                        <th class="p-4 font-semibold col-qr">員工 QR 碼</th>
                        <th class="p-4 font-semibold text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="employeeList" class="divide-y divide-gray-200 text-sm">
                    <tr><td colspan="10" class="p-8 text-center text-gray-500">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="employeeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 flex justify-center items-center no-print">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-800">新增員工</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto no-scrollbar flex-1">
                <form id="employeeForm" onsubmit="saveEmployee(event)" class="space-y-6">
                    <input type="hidden" id="employeeId">
                    
                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">員工編號 (系統自動產生)</label>
                            <input type="text" id="employee_serial" readonly class="w-full border border-gray-300 rounded-md p-2 bg-gray-100 text-gray-600 outline-none font-mono">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">在/離職狀態</label>
                            <select id="status" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none font-bold">
                                <option value="在職" class="text-green-600">🟢 在職</option>
                                <option value="離職" class="text-red-600">🔴 離職</option>
                            </select>
                        </div>
                        <div class="col-span-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">身份別 (必填)</label>
                            <select id="role_type" required onchange="toggleSalaryFields()" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="全職行政">全職行政</option>
                                <option value="兼職行政">兼職行政</option>
                                <option value="兼職授課">兼職授課</option>
                                <option value="團隊授課">團隊授課</option>
                            </select>
                        </div>

                        <div class="col-span-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">姓名 (必填)</label>
                            <input type="text" id="name" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">藝名 (系統連動用)</label>
                            <input type="text" id="stage_name" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">手機 (必填)</label>
                            <input type="text" id="phone" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>

                        <div id="monthlySalaryArea" class="col-span-3 bg-blue-50 p-3 rounded border border-blue-100">
                            <label class="block text-sm font-bold text-blue-800 mb-1">固定月薪 (元)</label>
                            <input type="number" id="monthly_salary" value="0" class="w-1/3 border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div id="hourlyRateArea" class="col-span-3 bg-emerald-50 p-3 rounded border border-emerald-100 hidden">
                            <label class="block text-sm font-bold text-emerald-800 mb-1">每小時行政薪資 (元)</label>
                            <input type="number" id="hourly_rate" value="0" class="w-1/3 border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div id="teacherSalaryTip" class="col-span-3 hidden bg-amber-50 text-amber-800 p-3 rounded-md border border-amber-200 text-sm">
                            💡 提示：授課老師身份之每小時薪資「因課而異」，此處無法設定。未來將於「班級管理」與「個指排課」中單獨呈現與計算。
                        </div>

                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">可授課科目 (必填，如：國文)</label>
                            <input type="text" id="teachable_subjects" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">可授課年級</label>
                            <input type="text" id="teachable_grades" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <hr class="my-4 border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800">上傳資料 (選填)</h3>
                    <p class="text-xs text-gray-500 mb-2">支援圖片或 PDF。若重新上傳將覆蓋舊檔。點擊藍字可查看已上傳檔案。</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">最高學歷證明</label>
                            <input type="file" id="file_education" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_education" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">良民證</label>
                            <input type="file" id="file_police" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_police" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">講師合約</label>
                            <input type="file" id="file_contract" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_contract" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">存摺封面</label>
                            <input type="file" id="file_bank" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_bank" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">身份證正反面</label>
                            <input type="file" id="file_idcard" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_idcard" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">履歷表</label>
                            <input type="file" id="file_resume" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_resume" class="mt-1 text-xs hidden"></div>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="p-4 border-t bg-gray-50 rounded-b-xl flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-5 py-2 bg-gray-300 text-gray-700 rounded-md font-bold hover:bg-gray-400 transition">取消</button>
                <button type="submit" form="employeeForm" id="saveBtn" class="px-5 py-2 bg-blue-600 text-white rounded-md font-bold hover:bg-blue-700 transition">儲存資料</button>
            </div>
        </div>
    </div>

    <div id="attendanceModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 flex justify-center items-center no-print">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 class="text-2xl font-bold text-gray-800">📷 鏡頭考勤打卡系統</h2>
                <button onclick="closeAttendanceModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto no-scrollbar flex-1 grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="flex flex-col border-r pr-4">
                    <h3 class="font-bold text-lg mb-2 text-slate-700 text-center">請將員工 QR 碼對準鏡頭</h3>
                    <div id="qr-reader" class="w-full h-[300px] bg-slate-100 rounded-lg shadow-inner flex items-center justify-center"></div>
                    
                    <div id="clockStatusMsg" class="mt-6 p-4 bg-slate-50 border rounded-lg text-center text-lg font-bold text-slate-700 min-h-[80px] shadow-sm">
                        等待鏡頭掃描...
                    </div>

                    <div class="mt-4 pt-4 border-t space-y-2">
                        <p class="text-xs font-bold text-gray-600">手動補登 (限管理員)：</p>
                        <div class="flex gap-2">
                            <select id="manualEmpSelect" class="flex-1 border p-2 text-sm rounded bg-white outline-none"></select>
                            <button onclick="manualClock('in')" class="bg-emerald-600 text-white px-3 py-1 text-sm font-bold rounded">補上班</button>
                            <button onclick="manualClock('out')" class="bg-orange-600 text-white px-3 py-1 text-sm font-bold rounded">補下班</button>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg text-slate-700">今日打卡動態</h3>
                        <button onclick="exportAttendanceToExcel()" class="bg-emerald-700 text-white text-sm px-3 py-1.5 rounded font-bold hover:bg-emerald-800 transition shadow-sm">
                            📥 匯出結算 EXCEL
                        </button>
                    </div>
                    <div class="border rounded-md overflow-hidden flex-1 max-h-[450px] overflow-y-auto bg-white shadow-sm">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-100 text-slate-700 sticky top-0">
                                <tr>
                                    <th class="p-3">姓名(身份)</th>
                                    <th class="p-3">時間動態</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceLogList" class="divide-y">
                                <tr><td colspan="2" class="p-4 text-center text-gray-400">暫無今日資料</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="printArea" class="print-only"></div>

    <script>
        // ==========================================
        // 1. 初始化
        // ==========================================
        const SUPABASE_URL = 'https://hlelxeiwamvrntsxnram.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM';
        const empSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let globalEmployees = [];
        let html5QrcodeScanner = null;

        // 載入自訂欄位設定
        function loadColumnPrefs() {
            const prefs = JSON.parse(localStorage.getItem('empColPrefs')) || {};
            const toggles = document.querySelectorAll('.col-toggle');
            toggles.forEach(t => {
                const colClass = t.getAttribute('onchange').match(/'([^']+)'/)[1];
                if(colClass === 'col-name') return; // 姓名不可隱藏
                if (prefs[colClass] !== undefined) {
                    t.checked = prefs[colClass];
                    applyColStyle(colClass, t.checked);
                }
            });
        }

        function toggleColumnMenu() {
            document.getElementById('columnMenu').classList.toggle('hidden');
        }

        function toggleCol(colClass) {
            const isChecked = document.querySelector(`input[onchange="toggleCol('${colClass}')"]`).checked;
            applyColStyle(colClass, isChecked);
            
            // 儲存設定
            const prefs = JSON.parse(localStorage.getItem('empColPrefs')) || {};
            prefs[colClass] = isChecked;
            localStorage.setItem('empColPrefs', JSON.stringify(prefs));
        }

        function applyColStyle(colClass, isVisible) {
            const els = document.querySelectorAll(`.${colClass}`);
            els.forEach(el => { el.style.display = isVisible ? '' : 'none'; });
        }

        // ==========================================
        // 2. 核心讀取與渲染
        // ==========================================
        async function fetchEmployees() {
            const listContainer = document.getElementById('employeeList');
            if (!listContainer) return;
            
            try {
                const { data, error } = await empSupabase
                    .from('employees')
                    .select('*')
                    .order('employee_serial', { ascending: true });

                if (error) throw error;

                listContainer.innerHTML = '';
                globalEmployees = data;
                
                const manualSelect = document.getElementById('manualEmpSelect');
                if(manualSelect) {
                    manualSelect.innerHTML = data.filter(e => e.status !== '離職').map(e => `<option value="${e.id}">${e.name}</option>`).join('');
                }

                if (!data || data.length === 0) {
                    listContainer.innerHTML = '<tr><td colspan="10" class="p-8 text-center text-gray-500">目前沒有員工資料</td></tr>';
                    return;
                }

                data.forEach(emp => {
                    // 正確對應舊有檔案的欄位名稱
                    let docsHtml = '';
                    if(emp.education_cert_url) docsHtml += `<span class="inline-block bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded mr-1 mb-1">學歷</span>`;
                    if(emp.police_check_url) docsHtml += `<span class="inline-block bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded mr-1 mb-1">良民</span>`;
                    if(emp.contract_url) docsHtml += `<span class="inline-block bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded mr-1 mb-1">合約</span>`;
                    if(emp.bank_passbook_url) docsHtml += `<span class="inline-block bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded mr-1 mb-1">存摺</span>`;
                    if(emp.id_card_url) docsHtml += `<span class="inline-block bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded mr-1 mb-1">身分</span>`;
                    if(emp.resume_url) docsHtml += `<span class="inline-block bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded mr-1 mb-1">履歷</span>`;
                    if(!docsHtml) docsHtml = '<span class="text-gray-300 text-xs">-</span>';

                    let salaryStr = '';
                    if (emp.role_type === '全職行政') salaryStr = `月: $${emp.monthly_salary || 0}`;
                    else if (emp.role_type === '兼職行政') salaryStr = `時: $${emp.hourly_rate || 0}`;
                    else salaryStr = `<span class="text-blue-500 font-medium text-xs">依課核算</span>`;

                    const statusColor = emp.status === '離職' ? 'text-red-500 font-bold' : 'text-green-600 font-bold';

                    const row = `
                        <tr class="hover:bg-gray-50 transition border-b">
                            <td class="p-3 text-center">
                                <input type="checkbox" class="qr-cb w-4 h-4 cursor-pointer" value="${emp.id}">
                            </td>
                            <td class="p-3 font-mono text-gray-500 col-serial">${emp.employee_serial || '未定'}</td>
                            <td class="p-3 col-name">
                                <div class="font-bold text-gray-900">${emp.name}</div>
                                <div class="text-[10px] text-blue-600">${emp.stage_name}</div>
                            </td>
                            <td class="p-3 text-gray-700 col-role">${emp.role_type || '全職行政'}</td>
                            <td class="p-3 col-status ${statusColor}">${emp.status || '在職'}</td>
                            <td class="p-3 text-xs text-gray-600 col-contact">
                                <div>📱 ${emp.phone}</div>
                                <div class="mt-0.5 text-gray-400">📚 ${emp.teachable_subjects}</div>
                            </td>
                            <td class="p-3 text-sm text-gray-700 col-salary">${salaryStr}</td>
                            <td class="p-3 col-files max-w-[120px] whitespace-normal">${docsHtml}</td>
                            <td class="p-3 col-qr">
                                <img id="qr_img_${emp.id}" class="w-12 h-12 inline-block border bg-white">
                            </td>
                            <td class="p-3 text-center space-x-1">
                                <button onclick="editEmployee('${emp.id}')" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs hover:bg-yellow-600">編輯</button>
                                <button onclick="deleteEmployee('${emp.id}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">刪除</button>
                            </td>
                        </tr>
                    `;
                    listContainer.innerHTML += row;

                    // 產生 Base64 圖片 QR
                    setTimeout(() => {
                        QRCode.toDataURL(emp.id, { width: 100, margin: 1 }, function (err, url) {
                            if(!err) document.getElementById(`qr_img_${emp.id}`).src = url;
                        });
                    }, 10);
                });

                loadColumnPrefs(); // 套用自訂欄位
            } catch (err) {
                console.error(err);
            }
        }

        function toggleAllCheckboxes() {
            const isChecked = document.getElementById('selectAllQR').checked;
            document.querySelectorAll('.qr-cb').forEach(cb => cb.checked = isChecked);
        }

        // ==========================================
        // 3. 新增與編輯表單控制
        // ==========================================
        async function generateSerial() {
            const rocYear = new Date().getFullYear() - 1911;
            const prefix = rocYear.toString();
            
            const { data } = await empSupabase
                .from('employees')
                .select('employee_serial')
                .like('employee_serial', `${prefix}%`)
                .order('employee_serial', { ascending: false })
                .limit(1);

            if (data && data.length > 0 && data[0].employee_serial) {
                const lastNum = parseInt(data[0].employee_serial.slice(3));
                return `${prefix}${(lastNum + 1).toString().padStart(3, '0')}`;
            } else {
                return `${prefix}001`;
            }
        }

        function toggleSalaryFields() {
            const role = document.getElementById('role_type').value;
            document.getElementById('monthlySalaryArea').classList.add('hidden');
            document.getElementById('hourlyRateArea').classList.add('hidden');
            document.getElementById('teacherSalaryTip').classList.add('hidden');

            if (role === '全職行政') document.getElementById('monthlySalaryArea').classList.remove('hidden');
            else if (role === '兼職行政') document.getElementById('hourlyRateArea').classList.remove('hidden');
            else document.getElementById('teacherSalaryTip').classList.remove('hidden');
        }

        async function openModal() {
            document.getElementById('employeeForm').reset();
            document.getElementById('employeeId').value = '';
            document.getElementById('modalTitle').innerText = '新增員工';
            document.getElementById('employee_serial').value = await generateSerial(); // 自動取號
            document.getElementById('status').value = '在職';
            
            // 清空檔案連結顯示
            ['education', 'police', 'contract', 'bank', 'idcard', 'resume'].forEach(f => {
                document.getElementById(`link_${f}`).classList.add('hidden');
            });
            
            toggleSalaryFields();
            document.getElementById('employeeModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('employeeModal').classList.add('hidden'); }

        function editEmployee(id) {
            const emp = globalEmployees.find(e => e.id === id);
            if (!emp) return;
            
            document.getElementById('modalTitle').innerText = '編輯員工';
            document.getElementById('employeeId').value = emp.id;
            document.getElementById('employee_serial').value = emp.employee_serial || '需重新儲存以產生';
            document.getElementById('status').value = emp.status || '在職';
            document.getElementById('name').value = emp.name;
            document.getElementById('stage_name').value = emp.stage_name;
            document.getElementById('role_type').value = emp.role_type || '全職行政';
            document.getElementById('monthly_salary').value = emp.monthly_salary || 0;
            document.getElementById('hourly_rate').value = emp.hourly_rate || 0;
            document.getElementById('phone').value = emp.phone;
            document.getElementById('teachable_subjects').value = emp.teachable_subjects;
            document.getElementById('teachable_grades').value = emp.teachable_grades;
            
            // 恢復舊檔案連結
            const fileMaps = [
                { dbCol: 'education_cert_url', linkId: 'link_education', label: '學歷' },
                { dbCol: 'police_check_url', linkId: 'link_police', label: '良民證' },
                { dbCol: 'contract_url', linkId: 'link_contract', label: '合約' },
                { dbCol: 'bank_passbook_url', linkId: 'link_bank', label: '存摺' },
                { dbCol: 'id_card_url', linkId: 'link_idcard', label: '身分證' },
                { dbCol: 'resume_url', linkId: 'link_resume', label: '履歷' }
            ];

            fileMaps.forEach(f => {
                const linkDiv = document.getElementById(f.linkId);
                if (emp[f.dbCol]) {
                    linkDiv.innerHTML = `<a href="${emp[f.dbCol]}" target="_blank" class="text-blue-600 underline font-bold">查看已存${f.label}</a>`;
                    linkDiv.classList.remove('hidden');
                } else {
                    linkDiv.classList.add('hidden');
                }
            });

            toggleSalaryFields();
            document.getElementById('employeeModal').classList.remove('hidden');
        }

        // ==========================================
        // 4. 儲存與上傳
        // ==========================================
        async function uploadFile(fileInputId, employeeId, filePrefix) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput.files || fileInput.files.length === 0) return null;
            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const filePath = `${employeeId}_${filePrefix}_${Date.now()}.${fileExt}`;
            const { data, error } = await empSupabase.storage.from('employee_documents').upload(filePath, file, { upsert: true });
            if (error) return null;
            const { data: publicUrlData } = empSupabase.storage.from('employee_documents').getPublicUrl(filePath);
            return publicUrlData.publicUrl;
        }

        async function saveEmployee(event) {
            event.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = '處理中...';
            
            const empId = document.getElementById('employeeId').value;
            const isEditing = empId !== '';

            const basicData = {
                employee_serial: document.getElementById('employee_serial').value,
                status: document.getElementById('status').value,
                name: document.getElementById('name').value,
                stage_name: document.getElementById('stage_name').value,
                role_type: document.getElementById('role_type').value,
                monthly_salary: parseFloat(document.getElementById('monthly_salary').value) || 0,
                hourly_rate: parseFloat(document.getElementById('hourly_rate').value) || 0,
                phone: document.getElementById('phone').value,
                teachable_subjects: document.getElementById('teachable_subjects').value,
                teachable_grades: document.getElementById('teachable_grades').value
            };

            try {
                let currentEmpId = empId;
                if (!isEditing) {
                    const { data, error } = await empSupabase.from('employees').insert([basicData]).select();
                    if (error) throw error;
                    currentEmpId = data[0].id;
                } else {
                    const { error } = await empSupabase.from('employees').update(basicData).eq('id', currentEmpId);
                    if (error) throw error;
                }

                // 明確對應每個檔案欄位，確保不遺漏
                const fileUpdates = {};
                const eduUrl = await uploadFile('file_education', currentEmpId, 'education');
                if (eduUrl) fileUpdates.education_cert_url = eduUrl;
                const polUrl = await uploadFile('file_police', currentEmpId, 'police');
                if (polUrl) fileUpdates.police_check_url = polUrl;
                const conUrl = await uploadFile('file_contract', currentEmpId, 'contract');
                if (conUrl) fileUpdates.contract_url = conUrl;
                const bankUrl = await uploadFile('file_bank', currentEmpId, 'bank');
                if (bankUrl) fileUpdates.bank_passbook_url = bankUrl;
                const idUrl = await uploadFile('file_idcard', currentEmpId, 'idcard');
                if (idUrl) fileUpdates.id_card_url = idUrl;
                const resUrl = await uploadFile('file_resume', currentEmpId, 'resume');
                if (resUrl) fileUpdates.resume_url = resUrl;

                if (Object.keys(fileUpdates).length > 0) {
                    await empSupabase.from('employees').update(fileUpdates).eq('id', currentEmpId);
                }

                alert("儲存成功！");
                closeModal();
                fetchEmployees();
            } catch (err) {
                alert("錯誤：" + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '儲存資料';
            }
        }

        async function deleteEmployee(id) {
            if (confirm("確定要刪除此員工嗎？(這會連動刪除考勤)")) {
                await empSupabase.from('employees').delete().eq('id', id);
                fetchEmployees();
            }
        }

        // ==========================================
        // 5. 鏡頭考勤系統 (防呆與離職阻擋)
        // ==========================================
        function openAttendanceModal() {
            document.getElementById('attendanceModal').classList.remove('hidden');
            fetchTodayAttendance();
            
            // 啟動鏡頭
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
                html5QrcodeScanner.render(onScanSuccess, (err) => {/* ignore scan errors */});
            }
        }
        
        function closeAttendanceModal() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().then(() => { html5QrcodeScanner = null; });
            }
            document.getElementById('attendanceModal').classList.add('hidden');
        }

        let isProcessingScan = false;
        async function onScanSuccess(decodedText) {
            if(isProcessingScan) return;
            isProcessingScan = true;
            if(html5QrcodeScanner) html5QrcodeScanner.pause();
            
            await executeClockAction(decodedText);
            
            // 等待 3 秒後自動恢復掃描，避免連續逼逼逼
            setTimeout(() => {
                if(html5QrcodeScanner) html5QrcodeScanner.resume();
                document.getElementById('clockStatusMsg').innerHTML = '等待下一位員工掃描...';
                isProcessingScan = false;
            }, 3000);
        }

        async function manualClock(type) {
            const empId = document.getElementById('manualEmpSelect').value;
            if(empId) await executeClockAction(empId, type);
        }

        async function executeClockAction(empId, forcedType = null) {
            const emp = globalEmployees.find(e => e.id === empId);
            const msgBox = document.getElementById('clockStatusMsg');
            
            if(!emp) {
                msgBox.innerHTML = '❌ <span class="text-red-500">無效的 QR 碼！</span>';
                return;
            }
            if(emp.status === '離職') {
                msgBox.innerHTML = `🚫 <span class="text-red-600 font-bold">考勤拒絕：${emp.name} 已設定為離職狀態</span>`;
                return;
            }

            const todayStr = new Date().toISOString().split('T')[0];
            const { data } = await empSupabase.from('employee_attendance').select('*').eq('employee_id', empId).eq('date', todayStr).maybeSingle();
            const nowISO = new Date().toISOString();

            if (!data) {
                if(forcedType === 'out') {
                    msgBox.innerHTML = `❌ <span class="text-orange-500">${emp.name} 今日無上班紀錄，無法打下班卡</span>`;
                    return;
                }
                await empSupabase.from('employee_attendance').insert([{ employee_id: empId, clock_in: nowISO, date: todayStr }]);
                msgBox.innerHTML = `🟢 <span class="text-green-600">${emp.name} 上班打卡成功！</span><br><span class="text-xs text-gray-400">${new Date().toLocaleTimeString()}</span>`;
            } else {
                if(forcedType === 'in') {
                    msgBox.innerHTML = `🟡 <span class="text-amber-600">${emp.name} 今日已打過上班卡</span>`;
                    return;
                }
                await empSupabase.from('employee_attendance').update({ clock_out: nowISO }).eq('id', data.id);
                msgBox.innerHTML = `🔔 <span class="text-orange-600">${emp.name} 下班打卡成功！</span><br><span class="text-xs text-gray-400">${new Date().toLocaleTimeString()}</span>`;
            }
            fetchTodayAttendance();
        }

        async function fetchTodayAttendance() {
            const container = document.getElementById('attendanceLogList');
            const todayStr = new Date().toISOString().split('T')[0];
            
            const { data } = await empSupabase.from('employee_attendance').select(`*, employees(name, role_type)`).eq('date', todayStr).order('created_at', { ascending: false });

            if(!data || data.length === 0) {
                container.innerHTML = '<tr><td colspan="2" class="p-4 text-center text-gray-400">今日暫無打卡動態</td></tr>';
                return;
            }

            container.innerHTML = data.map(log => {
                const empName = log.employees ? log.employees.name : '未知員工';
                const inTime = log.clock_in ? new Date(log.clock_in).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--';
                const outTime = log.clock_out ? new Date(log.clock_out).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '<span class="text-red-400 animate-pulse">未下班</span>';
                return `
                    <tr class="hover:bg-slate-50 border-b">
                        <td class="p-3 font-bold">${empName}</td>
                        <td class="p-3"><span class="text-green-600 font-medium">${inTime}</span> ~ <span>${outTime}</span></td>
                    </tr>
                `;
            }).join('');
        }

        // ==========================================
        // 6. 匯出 Excel
        // ==========================================
        async function exportAttendanceToExcel() {
            const { data } = await empSupabase.from('employee_attendance').select(`*, employees(employee_serial, name, role_type, hourly_rate, monthly_salary)`).order('date', { ascending: false });
            if(!data) { alert("暫無資料"); return; }

            const excelRows = data.map(log => {
                const emp = log.employees || {};
                let hoursWorked = 0;
                if(log.clock_in && log.clock_out) hoursWorked = ((new Date(log.clock_out) - new Date(log.clock_in)) / (1000 * 60 * 60)).toFixed(2);
                let calculatedPay = emp.role_type === '兼職行政' ? (hoursWorked * (emp.hourly_rate || 0)).toFixed(0) : "無(月薪/排課)";

                return {
                    "打卡日期": log.date,
                    "員工編號": emp.employee_serial || '',
                    "員工姓名": emp.name || '',
                    "身份類別": emp.role_type || '',
                    "上班時間": log.clock_in ? new Date(log.clock_in).toLocaleString() : '',
                    "下班時間": log.clock_out ? new Date(log.clock_out).toLocaleString() : '未下班',
                    "總工時": parseFloat(hoursWorked),
                    "兼職薪資估算": calculatedPay
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "考勤紀錄");
            XLSX.writeFile(workbook, `昊學_員工考勤匯出_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // ==========================================
        // 7. QR碼 完美列印機制 (Base64 Image)
        // ==========================================
        function printSelectedQRs() {
            const checkboxes = document.querySelectorAll('.qr-cb:checked');
            if(checkboxes.length === 0) { alert("請先在左側勾選要列印的員工！"); return; }
            
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = ''; 

            let count = 0;
            checkboxes.forEach((cb) => {
                const emp = globalEmployees.find(e => e.id === cb.value);
                if(emp) {
                    const card = document.createElement('div');
                    card.className = "p-6 border-2 border-dashed text-center inline-block m-2 bg-white flex flex-col items-center justify-center";
                    card.style.width = "240px";
                    card.style.height = "320px";
                    
                    // 使用 img 標籤存放 Base64，保證印表機印得出來
                    card.innerHTML = `
                        <h2 class="text-2xl font-black text-slate-800">${emp.name}</h2>
                        <p class="text-sm text-blue-600 font-bold mb-3">${emp.role_type} | ${emp.employee_serial}</p>
                        <img id="print_img_${emp.id}" class="w-32 h-32 mx-auto mb-2">
                        <p class="text-[11px] text-gray-500 font-bold mt-2">昊學文教 考勤專用卡</p>
                    `;
                    printArea.appendChild(card);

                    // 轉換 QR 為圖片網址
                    QRCode.toDataURL(emp.id, { width: 256, margin: 1 }, function (err, url) {
                        if(!err) document.getElementById(`print_img_${emp.id}`).src = url;
                        count++;
                        // 等所有勾選的 QR 圖都轉好後再觸發列印
                        if(count === checkboxes.length) {
                            setTimeout(() => { window.print(); }, 300);
                        }
                    });
                }
            });
        }

        window.onload = fetchEmployees;
    </script>
