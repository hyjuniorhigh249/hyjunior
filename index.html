<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>浩元行政管理系統 v1.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f9; font-size: 13px; }
        .tab-content { display: none; }
        .tab-active { display: block; }
        .nav-btn.active { background-color: #1e293b; color: white; }
        .form-input { @apply w-full px-3 py-1.5 border border-slate-200 rounded-lg bg-white focus:ring-2 focus:ring-slate-400 outline-none transition-all; }
        .stu-table th { position: sticky; top: 0; background: #fff; z-index: 10; padding: 10px; border-bottom: 2px solid #edf2f7; }
        .stu-table td { padding: 8px 10px; border-bottom: 1px solid #edf2f7; }
        /* 搜尋框高亮效果 */
        .search-highlight { background-color: #fef08a; padding: 0 2px; border-radius: 2px; }
    </style>
</head>
<body class="min-h-screen">

    <div class="flex flex-col md:flex-row min-h-screen">
        <nav class="w-full md:w-40 bg-white border-r border-slate-200 p-3 flex flex-col gap-1 shrink-0">
            <div class="font-black text-lg mb-4 text-slate-800 border-b pb-2 text-center">浩元行政</div>
            <button onclick="showTab('stu-mgr')" id="nav-stu-mgr" class="nav-btn active w-full text-left px-3 py-2 rounded-lg font-bold text-slate-500 transition border border-transparent">👤 學生總檔</button>
            <button onclick="showTab('class-mgr')" id="nav-class-mgr" class="nav-btn w-full text-left px-3 py-2 rounded-lg font-bold text-slate-500 transition border border-transparent">👥 班級管理</button>
            <div class="mt-auto pt-3 border-t border-slate-100">
                <button class="w-full text-left px-3 py-2 text-slate-300 cursor-not-allowed font-bold">📢 訊息發送</button>
                <button class="w-full text-left px-3 py-2 text-slate-300 cursor-not-allowed font-bold">✍️ 成績登記</button>
            </div>
        </nav>

        <main class="flex-1 flex flex-col min-h-0">
            
            <div class="bg-white border-b border-slate-200 p-3 px-6 flex items-center gap-4 shadow-sm z-20">
                <div class="relative flex-1 max-w-2xl">
                    <span class="absolute left-3 top-2 text-slate-400">🔍</span>
                    <input type="text" id="global-search" oninput="executeSearch()" 
                        placeholder="搜尋學生姓名、學校、電話、地址、班級..." 
                        class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-full bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-800 outline-none transition-all font-bold">
                </div>
                <div id="search-status" class="text-[11px] font-bold text-slate-400 italic"></div>
            </div>

            <div class="flex-1 overflow-y-auto p-4">
                
                <div id="tab-stu-mgr" class="tab-content tab-active space-y-4 max-w-7xl mx-auto">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-black text-slate-700 flex items-center gap-2">快速新增學生</h3>
                            <button onclick="handleFormSubmit()" class="bg-slate-800 text-white px-5 py-1.5 rounded-lg font-bold hover:bg-slate-700 transition">確認儲存</button>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
                            <input type="text" id="f-name" class="form-input font-bold" placeholder="姓名*">
                            <input type="text" id="f-school" class="form-input" placeholder="學校">
                            <input type="text" id="f-telP" class="form-input" placeholder="爸爸電話">
                            <input type="text" id="f-telM" class="form-input" placeholder="媽媽電話">
                            <input type="text" id="f-telO" class="form-input" placeholder="選填電話">
                            <input type="text" id="f-addr" class="form-input" placeholder="地址">
                            <input type="text" id="f-note" class="form-input" placeholder="備註">
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="stu-table w-full text-left border-collapse">
                                <thead class="text-[11px] font-black text-slate-400 uppercase">
                                    <tr>
                                        <th class="w-20">姓名</th>
                                        <th class="w-32">班級</th>
                                        <th class="w-28">學校</th>
                                        <th class="w-40">家長電話</th>
                                        <th>地址</th>
                                        <th class="w-32">備註</th>
                                        <th class="w-12 text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="stu-table-body" class="text-slate-600"></tbody>
                            </table>
                        </div>
                        <div class="p-2 px-4 bg-slate-50 border-t flex justify-end">
                            <span id="stu-count" class="text-[10px] font-bold text-slate-400 uppercase"></span>
                        </div>
                    </div>
                </div>

                <div id="tab-class-mgr" class="tab-content max-w-5xl mx-auto space-y-4">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex gap-2 mb-6 max-w-md">
                            <input type="text" id="new-class-name" placeholder="新增班級名稱" class="form-input font-bold">
                            <button onclick="addClass()" class="bg-slate-800 text-white px-4 py-1.5 rounded-lg font-bold shrink-0">建立班級</button>
                        </div>
                        <div id="class-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const STORAGE_KEY = 'haoyuan_v18_data';
        let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { students: [], classes: [] };
        let currentKeyword = "";

        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

        // --- 搜尋核心功能 ---
        function executeSearch() {
            currentKeyword = document.getElementById('global-search').value.toLowerCase().trim();
            const activeTab = document.querySelector('.tab-active').id;
            
            if (activeTab === 'tab-stu-mgr') renderStuTable();
            if (activeTab === 'tab-class-mgr') renderClassMgr();

            document.getElementById('search-status').innerText = currentKeyword ? `正在篩選關鍵字: "${currentKeyword}"` : "";
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('tab-active'));
            document.getElementById(`tab-${tabId}`).classList.add('tab-active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`nav-${tabId}`).classList.add('active');
            executeSearch(); // 切換分頁時自動套用當前搜尋條件
        }

        // --- 學生管理邏輯 ---
        function handleFormSubmit() {
            const fields = ['f-name', 'f-school', 'f-telP', 'f-telM', 'f-telO', 'f-addr', 'f-note'];
            const values = {};
            fields.forEach(id => values[id.replace('f-', '')] = document.getElementById(id).value.trim());

            if (!values.name) return alert('姓名為必填！');

            data.students.unshift({ id: Date.now(), ...values });
            save();
            fields.forEach(id => document.getElementById(id).value = '');
            executeSearch();
        }

        function renderStuTable() {
            const body = document.getElementById('stu-table-body');
            
            // 篩選邏輯
            const filtered = data.students.filter(s => {
                const myClasses = data.classes.filter(c => c.members.includes(s.name)).map(c => c.name).join(' ');
                const combinedText = `${s.name} ${s.school} ${s.telP} ${s.telM} ${s.telO} ${s.addr} ${s.note} ${myClasses}`.toLowerCase();
                return combinedText.includes(currentKeyword);
            });

            document.getElementById('stu-count').innerText = `SHOWING ${filtered.length} OF ${data.students.length} STUDENTS`;
            
            body.innerHTML = filtered.map((s, idx) => {
                const myClasses = data.classes.filter(c => c.members.includes(s.name)).map(c => c.name).join(', ');
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="font-bold text-slate-800">${s.name}</td>
                        <td><span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-bold">${myClasses || '-'}</span></td>
                        <td class="text-slate-500">${s.school || '-'}</td>
                        <td class="text-[11px] leading-tight text-slate-500">
                            ${s.telP ? '父:'+s.telP : ''} ${s.telM ? ' 母:'+s.telM : ''}
                        </td>
                        <td class="text-xs truncate max-w-[200px]" title="${s.addr}">${s.addr || '-'}</td>
                        <td class="text-xs text-slate-400 italic">${s.note || '-'}</td>
                        <td class="text-center">
                            <button onclick="deleteStu(${s.id})" class="text-slate-300 hover:text-rose-500 transition">✕</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function deleteStu(id) {
            if(confirm('刪除？')) {
                data.students = data.students.filter(s => s.id !== id);
                save(); executeSearch();
            }
        }

        // --- 班級管理邏輯 ---
        function addClass() {
            const name = document.getElementById('new-class-name').value.trim();
            if(!name || data.classes.some(c => c.name === name)) return;
            data.classes.push({ name, members: [] });
            document.getElementById('new-class-name').value = '';
            save(); executeSearch();
        }

        function renderClassMgr() {
            const container = document.getElementById('class-list-container');
            
            // 班級篩選：若班級名稱符合，或班級內有成員符合關鍵字
            const filteredClasses = data.classes.filter(cls => {
                const nameMatch = cls.name.toLowerCase().includes(currentKeyword);
                const memberMatch = cls.members.some(m => m.toLowerCase().includes(currentKeyword));
                return nameMatch || memberMatch;
            });

            container.innerHTML = filteredClasses.map((cls) => {
                const originalIdx = data.classes.findIndex(c => c.name === cls.name);
                return `
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                    <div class="flex justify-between items-center mb-3 border-b pb-2">
                        <h4 class="font-bold text-slate-700">${cls.name}</h4>
                        <button onclick="deleteClass(${originalIdx})" class="text-slate-300 hover:text-rose-500">✕</button>
                    </div>
                    <div class="flex flex-wrap gap-1">
                        ${data.students.map(s => {
                            const isMember = cls.members.includes(s.name);
                            // 在班級管理中，若有搜尋關鍵字，未符合的學生按鈕變淡
                            const isMatch = s.name.toLowerCase().includes(currentKeyword);
                            const opacity = (currentKeyword && !isMatch && !cls.name.toLowerCase().includes(currentKeyword)) ? 'opacity-20' : 'opacity-100';
                            
                            return `
                                <button onclick="toggleMember(${originalIdx}, '${s.name}')" 
                                    class="px-2 py-1 rounded text-[11px] font-bold border transition ${opacity}
                                    ${isMember ? 'bg-slate-800 border-slate-800 text-white' : 'bg-white text-slate-300 border-slate-100'}">
                                    ${s.name}
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `}).join('');
        }

        function toggleMember(cIdx, sName) {
            const m = data.classes[cIdx].members;
            const i = m.indexOf(sName);
            i === -1 ? m.push(sName) : m.splice(i, 1);
            save(); executeSearch();
        }

        function deleteClass(idx) { if(confirm('刪除？')) { data.classes.splice(idx, 1); save(); executeSearch(); } }

        window.onload = () => { executeSearch(); };
    </script>
</body>
</html>
