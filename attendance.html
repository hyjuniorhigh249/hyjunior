<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>浩元行政系統 - 點名與教學日誌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Inter", "Microsoft JhengHei", sans-serif; background: #f1f5f9; overflow: hidden; }
        .main-grid { display: grid; grid-template-columns: 280px 1fr 320px; height: 100vh; gap: 1px; background: #cbd5e1; }
        .pane { background: white; display: flex; flex-direction: column; overflow: hidden; }
        .canvas-area { background-color: #94a3b8; overflow: auto; display: flex; flex-direction: column; align-items: center; }
        .grid-container { background: #f8fafc; border: 2px solid #475569; border-radius: 20px; padding: 40px; margin: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); display: grid; gap: 12px; width: fit-content; }
        
        .slot { width: 85px; height: 85px; border-radius: 12px; font-weight: 800; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.1s; background: white; border: 1px solid #e2e8f0; }
        .slot.is-hallway { background: #cbd5e1 !important; border: none !important; cursor: default; }
        .slot.is-blocked { background: #fca5a5 !important; color: white !important; font-weight: 900; }
        .slot.is-blocked::after { content: "XX"; }
        .slot.has-student { cursor: pointer; }
        .status-present { background: #10b981 !important; color: white !important; }
        
        .stu-item { transition: background 0.1s; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .stu-item:hover { background: #f8fafc; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s; background: #f8fafc; }
        .stu-item.active .accordion-content { max-height: 100px; padding: 6px 16px; }
        .blackboard { background: #1e293b; color: #f8fafc; border-radius: 6px; width: 400px; padding: 10px 0; text-align: center; font-weight: 900; letter-spacing: 2em; text-indent: 2em; margin-top: 25px; }
        .diary-input { width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.75rem; font-size: 0.875rem; font-weight: 700; }
    </style>
</head>
<body>

<div class="main-grid">
    <div class="pane">
        <div class="p-5 border-b bg-white">
            <h2 class="font-black text-slate-800 text-lg mb-4">今日名單</h2>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-emerald-50 p-2 rounded-xl text-center"><span id="stat-all-present" class="block font-black text-xl text-emerald-600">0</span><span class="text-[10px] font-bold text-emerald-700">已到</span></div>
                <div class="bg-slate-50 p-2 rounded-xl text-center"><span id="stat-all-pending" class="block font-black text-xl text-slate-400">0</span><span class="text-[10px] font-bold text-slate-500">待點</span></div>
            </div>
        </div>
        <div id="all-student-list" class="flex-1 overflow-y-auto"></div>
    </div>

    <div class="pane canvas-area">
        <div class="w-full bg-white/95 backdrop-blur sticky top-0 z-20 px-4 py-3 border-b flex justify-between items-center">
            <input type="text" id="global-search" placeholder="全域點名..." class="w-60 px-4 py-2 bg-slate-100 rounded-full font-bold text-sm outline-none">
            <select id="class-switcher" onchange="switchClass(this.value)" class="bg-slate-800 text-white font-black text-xs px-4 py-2 rounded-lg"></select>
        </div>
        <div class="blackboard text-xs">黑板方向</div>
        <div id="seat-grid" class="grid-container"></div>
    </div>

    <div class="pane border-l">
        <div class="p-4 bg-slate-800 text-white font-black text-sm flex justify-between items-center"><span>📝 教學日誌</span></div>
        <div class="p-5 space-y-4 overflow-y-auto flex-1">
            <input type="text" data-field="progress" class="diary-input" placeholder="上課進度">
            <input type="text" data-field="homework" class="diary-input" placeholder="回家作業">
            <input type="number" data-field="avg_score" class="diary-input" placeholder="平均成績">
        </div>
    </div>
</div>

<script>
    const supabaseClient = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
    let db = { allClasses: [], activeClassId: null, attendance: {}, studentDetails: {} };

    async function init() {
        const { data: classes } = await supabaseClient.from('classes').select('*');
        db.allClasses = classes;
        const switcher = document.getElementById('class-switcher');
        classes.forEach(c => switcher.add(new Option(c.name, c.id)));
        if(classes.length > 0) switchClass(classes[0].id);
    }

    async function switchClass(id) {
        db.activeClassId = id;
        const cls = db.allClasses.find(c => c.id === id);
        // 取得綁定教室
        const { data: room } = await supabaseClient.from('rooms').select('*').eq('id', cls.room_id).single();
        const { data: seats } = await supabaseClient.from('class_seats').select('*').eq('class_id', id);
        
        renderSeats(room, seats);
    }

    function renderSeats(room, seats) {
        const grid = document.getElementById('seat-grid');
        const layout = room.layout_config || {};
        const size = room.grid_size || { rows: 5, cols: 8 };
        grid.style.gridTemplateColumns = `repeat(${size.cols}, 85px)`;
        grid.innerHTML = "";
        
        const seatMap = Object.fromEntries(seats?.map(s => [`${s.row_index}-${s.col_index}`, s]) || []);

        for (let r = 0; r < size.rows; r++) {
            for (let c = 0; c < size.cols; c++) {
                const key = `${r}-${c}`;
                const state = layout[key] || 'normal';
                const div = document.createElement('div');

                if (state === 'hallway') div.className = "slot is-hallway";
                else if (state === 'blocked') div.className = "slot is-blocked";
                else {
                    const seat = seatMap[key];
                    div.className = seat ? "slot has-student" : "slot is-empty";
                    if(seat) div.innerHTML = `<span>${seat.student_name}</span>`;
                }
                grid.appendChild(div);
            }
        }
    }
    window.onload = init;
</script>
</body>
</html>
