<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昊學文教行政系統 - 個指管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <div class="flex-1 flex flex-col overflow-y-auto p-8">
            
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-gray-900">個別指導管理</h1>
                <div class="text-sm text-gray-500">當前系統時間：<span id="current-time-display"></span></div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-8">
                
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col h-[600px]">
                    <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-blue-600 text-white text-xs rounded-full flex items-center justify-center mr-2">1</span>
                        選擇學生名單
                    </h2>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-600 mb-1">依智慧年級篩選 (7月自動升級)</label>
                        <select id="filter-grade" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50">
                            <option value="ALL">全部年級</option>
                            <option value="小一">小一</option><option value="小二">小二</option><option value="小三">小三</option>
                            <option value="小四">小四</option><option value="小五">小五</option><option value="小六">小六</option>
                            <option value="國一">國一</option><option value="國二">國二</option><option value="國三">國三</option>
                            <option value="高一">高一</option><option value="高二">高二</option><option value="高三">高三</option>
                        </select>
                    </div>

                    <div class="flex-1 border border-gray-200 rounded-lg p-3 overflow-y-auto space-y-2 bg-slate-50" id="student-list-container">
                        <p class="text-sm text-gray-400 text-center py-8 font-bold">正在從資料庫載入名單...</p>
                    </div>
                    
                    <div class="mt-3 text-xs font-bold text-slate-500 text-right" id="selected-count-display">
                        已選定：0 位學生
                    </div>
                </div>

                <div class="xl:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-blue-600 text-white text-xs rounded-full flex items-center justify-center mr-2">2</span>
                        設定班型與學費細項
                    </h2>
                    
                    <form id="individual-class-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">1. 班型</label>
                            <select id="class-type" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50">
                                <option value="一對一">一對一</option>
                                <option value="一對二">一對二</option>
                                <option value="一對四">一對四</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">2. 適用年級</label>
                            <select id="class-grade" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50">
                                <option value="小一">小一</option><option value="小二">小二</option><option value="小三">小三</option>
                                <option value="小四">小四</option><option value="小五">小五</option><option value="小六">小六</option>
                                <option value="國一">國一</option><option value="國二">國二</option><option value="國三">國三</option>
                                <option value="高一">高一</option><option value="高二">高二</option><option value="高三">高三</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">3. 課程級別</label>
                            <select id="course-level" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50">
                                <option value="國中小">國中小</option>
                                <option value="高中">高中</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">4. 科目</label>
                            <div class="flex space-x-1">
                                <select id="subject" class="flex-1 border border-gray-300 rounded px-2 py-2 text-sm focus:outline-none focus:border-blue-500 bg-slate-50">
                                    <option value="國文">國文</option><option value="英文">英文</option><option value="數學">數學</option>
                                    <option value="自然">自然</option><option value="社會">社會</option><option value="物理">物理</option>
                                    <option value="化學">化學</option><option value="生物">生物</option><option value="地科">地科</option>
                                    <option value="理化">理化</option><option value="地理">地理</option><option value="歷史">歷史</option>
                                    <option value="公民">公民</option><option value="多益">多益</option><option value="英檢">英檢</option>
                                    <option value="程式">程式</option><option value="日文">日文</option>
                                </select>
                                <button type="button" id="btn-add-subject" class="bg-gray-200 text-gray-700 px-2 rounded hover:bg-gray-300 text-xs font-bold transition">+ 新增</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">5. 每堂時數 (小時)</label>
                            <select id="hours-per-session" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50">
                                <option value="0.5">0.5</option><option value="1" selected>1</option><option value="1.5">1.5</option>
                                <option value="2">2</option><option value="2.5">2.5</option><option value="3">3</option>
                                <option value="3.5">3.5</option><option value="4">4</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">6. 每週堂數</label>
                            <select id="sessions-per-week" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50">
                                <option value="週一堂">週一堂</option><option value="週二堂">週二堂</option>
                                <option value="週三堂">週三堂</option><option value="週四堂">週四堂</option>
                                <option value="週五堂">週五堂</option><option value="週六堂">週六堂</option>
                                <option value="週七堂">週七堂</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">7. 總週數 (1~48)</label>
                            <input type="number" id="total-weeks" min="1" max="48" value="12" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">8. 總堂數 (自動)</label>
                            <input type="text" id="total-sessions" readonly class="w-full bg-slate-100 border border-gray-200 rounded px-3 py-2 font-mono text-gray-500 cursor-not-allowed">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">9. 總時數 (自動)</label>
                            <input type="text" id="total-hours" readonly class="w-full bg-slate-100 border border-gray-200 rounded px-3 py-2 font-mono text-gray-500 cursor-not-allowed">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-orange-600 mb-1">10. 學費基底 (自動)</label>
                            <input type="text" id="tuition-base" readonly class="w-full bg-orange-50 border border-orange-200 rounded px-3 py-2 font-mono font-bold text-orange-700 cursor-not-allowed">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">11. 教材費 (自動每堂$50)</label>
                            <input type="text" id="materials-fee" readonly class="w-full bg-slate-100 border border-gray-200 rounded px-3 py-2 font-mono text-gray-500 cursor-not-allowed">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">12. 雜費</label>
                            <input type="number" id="misc-fee" min="0" value="0" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 font-bold">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-emerald-600 mb-1">13. 優惠折抵金額</label>
                            <input type="number" id="discount" min="0" value="0" class="w-full border border-emerald-300 rounded px-3 py-2 focus:outline-none focus:border-emerald-500 bg-emerald-50 font-bold text-emerald-700">
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-600 mb-1">14. 優惠原因說明</label>
                            <input type="text" id="discount-reason" placeholder="如：無折扣免填 / 兄弟姊妹合報九折" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50">
                        </div>

                        <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 md:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-4 items-center my-1 shadow-sm">
                            <div class="md:col-span-2">
                                <span class="text-base font-black text-blue-800 block">15. 應繳總學費金額：</span>
                                <span class="text-xs font-bold text-blue-600 mt-1">(公式：學費 + 教材費 + 雜費 - 優惠)</span>
                            </div>
                            <input type="text" id="total-tuition" readonly class="w-full bg-white border-2 border-blue-400 rounded-lg px-4 py-2 text-2xl font-mono font-black text-blue-700 text-right shadow-inner">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">16. 排課起始日</label>
                            <input type="date" id="start-date" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                            <span class="text-xs font-bold text-slate-400 block mt-1" id="end-date-preview">預計結束：--</span>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">17. 經手承辦人</label>
                            <input type="text" id="operator" value="系統管理員" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">18. 開單日期 (今日)</label>
                            <input type="date" id="issue-date" readonly class="w-full bg-slate-100 border border-gray-200 rounded px-3 py-2 text-gray-500 cursor-not-allowed">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-rose-600 mb-1">19. 繳費期限 (預設3日後)</label>
                            <input type="date" id="due-date" class="w-full border border-rose-300 rounded px-3 py-2 focus:outline-none focus:border-rose-500 bg-rose-50 font-bold text-rose-700">
                        </div>

                        <div class="md:col-span-2 flex items-end justify-end space-x-3 pt-4">
                            <button type="button" id="btn-reset" class="px-5 py-2.5 border border-slate-300 text-slate-600 font-bold rounded-lg hover:bg-slate-100 transition shadow-sm">清空重填</button>
                            <button type="submit" class="flex-1 md:flex-none px-8 py-2.5 bg-blue-600 text-white font-black rounded-lg hover:bg-blue-700 shadow-md transition transform hover:-translate-y-0.5">🚀 確立個指班別開單</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800">已設立個指班別列表</h2>
                    <span class="text-xs font-bold bg-slate-100 text-slate-500 px-3 py-1 rounded-full border border-slate-200" id="total-records-count">共 0 筆資料</span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-sm font-bold border-b border-slate-200">
                                <th class="p-3">開單日期</th>
                                <th class="p-3">學生名單</th>
                                <th class="p-3">班型/級別</th>
                                <th class="p-3">科目/時數</th>
                                <th class="p-3">期間 (推算週日)</th>
                                <th class="p-3 text-right">總金額</th>
                                <th class="p-3">承辦人</th>
                                <th class="p-3 text-center">操作動作</th>
                            </tr>
                        </thead>
                        <tbody id="classes-list-table-body" class="text-sm divide-y divide-slate-100">
                            <tr>
                                <td colspan="8" class="p-6 text-center text-slate-400 font-bold">正在讀取現有開班紀錄...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto border border-slate-200">
            <h3 class="text-xl font-black text-slate-800 mb-5 pb-3 border-b">⚙️ 快速修改資料夾欄位</h3>
            <div class="space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">雜費金額</label>
                    <input type="number" id="edit-misc-fee" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">優惠金額</label>
                    <input type="number" id="edit-discount" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">優惠原因</label>
                    <input type="text" id="edit-discount-reason" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">繳費期限</label>
                    <input type="date" id="edit-due-date" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6 pt-4 border-t">
                <button type="button" id="btn-close-modal" class="px-5 py-2 border border-slate-300 text-slate-600 rounded-lg font-bold hover:bg-slate-100 transition">取消</button>
                <button type="button" id="btn-save-modal" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-black shadow-md transition">確認儲存</button>
            </div>
        </div>
    </div>

    <script>
        // 核心設定
        const SUPABASE_URL = 'https://hlelxeiwamvrntsxnram.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allStudents = [];
        let currentEditingRecord = null;

        // 強制啟動模式
        async function init() {
            setupDates();
            await fetchStudents();
            await fetchIndividualClasses();
            bindCalculationEvents();
            setupSubjectHandler();
        }
        window.onload = init;

        // 1. 日期初始化處理
        function setupDates() {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            
            document.getElementById('current-time-display').innerText = today.toLocaleString('zh-TW');
            document.getElementById('issue-date').value = todayStr;
            document.getElementById('start-date').value = todayStr;
            
            const dueDate = new Date();
            dueDate.setDate(today.getDate() + 3);
            document.getElementById('due-date').value = dueDate.toISOString().split('T')[0];
            
            updateEndDatePreview();
        }

        // 【精準同步換算點】：修改為與 billing.html 邏輯完全對齊的專業級距換算公式
        function calculateGradeByBaseYear(gradeBaseYear) {
            if (!gradeBaseYear) return "未設定";
            const today = new Date();
            const currentMonth = today.getMonth() + 1; 
            
            // 與 billing.html 的 getAcademicYear() 完全同等邏輯
            const academicYear = currentMonth >= 7 ? today.getFullYear() : today.getFullYear() - 1;
            
            // 計算精準年級數字 (7 代表國一、10 代表高一)
            const gradeNum = academicYear - parseInt(gradeBaseYear) + 1;
            
            if (gradeNum === 1) return "小一";
            if (gradeNum === 2) return "小二";
            if (gradeNum === 3) return "小三";
            if (gradeNum === 4) return "小四";
            if (gradeNum === 5) return "小五";
            if (gradeNum === 6) return "小六";
            if (gradeNum === 7) return "國一";
            if (gradeNum === 8) return "國二";
            if (gradeNum === 9) return "國三";
            if (gradeNum === 10) return "高一";
            if (gradeNum === 11) return "高二";
            if (gradeNum === 12) return "高三";
            return "已畢業";
        }

        // 2. 從「學生總檔」撈取資料
        async function fetchStudents() {
            try {
                const { data, error } = await sb
                    .from('students')
                    .select('id, name, grade_base_year')
                    .order('name');
                
                if (error) throw error;
                
                allStudents = data || [];
                renderStudentList();
            } catch (err) {
                console.error("載入學生檔案失敗:", err);
                document.getElementById('student-list-container').innerHTML = 
                    `<p class="text-sm text-rose-500 font-bold text-center py-4 bg-rose-50 rounded border border-rose-200">讀取失敗，請確認資料庫狀態</p>`;
            }
        }

        // 渲染名單
        function renderStudentList() {
            const filterGrade = document.getElementById('filter-grade').value;
            const container = document.getElementById('student-list-container');
            container.innerHTML = "";
            
            let filtered = allStudents.map(s => {
                return {
                    id: s.id,
                    name: s.name,
                    calculatedGrade: calculateGradeByBaseYear(s.grade_base_year)
                }
            });

            if (filterGrade !== "ALL") {
                filtered = filtered.filter(s => s.calculatedGrade === filterGrade);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400 font-bold text-center py-6">此年級目前無學生資料</p>`;
                return;
            }

            filtered.forEach(student => {
                const div = document.createElement('label');
                div.className = "flex items-center space-x-3 p-2.5 bg-white hover:bg-blue-50 rounded-lg border border-slate-100 cursor-pointer transition text-sm shadow-sm";
                div.innerHTML = `
                    <input type="checkbox" name="selected-students" value="${student.id}" data-name="${student.name}" class="student-checkbox w-4 h-4 text-blue-600 rounded border-slate-300">
                    <span class="font-bold text-slate-700">${student.name}</span>
                    <span class="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded ml-auto">${student.calculatedGrade}</span>
                `;
                container.appendChild(div);
            });

            document.querySelectorAll('.student-checkbox').forEach(cb => {
                cb.addEventListener('change', countSelectedStudents);
            });
        }

        function countSelectedStudents() {
            const checked = document.querySelectorAll('.student-checkbox:checked');
            document.getElementById('selected-count-display').innerText = `已選定：${checked.length} 位學生`;
        }

        document.getElementById('filter-grade').addEventListener('change', renderStudentList);

        // 3. 智慧計費
        function performCalculations() {
            const hoursPerSession = parseFloat(document.getElementById('hours-per-session').value) || 0;
            const sessionsPerWeekStr = document.getElementById('sessions-per-week').value;
            let weekSessionsNum = 1;
            if (sessionsPerWeekStr === "週一堂") weekSessionsNum = 1;
            else if (sessionsPerWeekStr === "週二堂") weekSessionsNum = 2;
            else if (sessionsPerWeekStr === "週三堂") weekSessionsNum = 3;
            else if (sessionsPerWeekStr === "週四堂") weekSessionsNum = 4;
            else if (sessionsPerWeekStr === "週五堂") weekSessionsNum = 5;
            else if (sessionsPerWeekStr === "週六堂") weekSessionsNum = 6;
            else if (sessionsPerWeekStr === "週七堂") weekSessionsNum = 7;

            const totalWeeks = parseInt(document.getElementById('total-weeks').value) || 0;

            const totalSessions = weekSessionsNum * totalWeeks;
            document.getElementById('total-sessions').value = totalSessions + " 堂";

            const totalHours = hoursPerSession * totalSessions;
            document.getElementById('total-hours').value = totalHours.toFixed(1) + " 小時";

            const classType = document.getElementById('class-type').value; 
            const courseLevel = document.getElementById('course-level').value; 
            
            let hourlyRate = 0;

            if (courseLevel === "國中小") {
                if (classType === "一對一") hourlyRate = 1200;
                else if (classType === "一對二") hourlyRate = 800;
                else if (classType === "一對四") hourlyRate = 600;
            } else { 
                if (classType === "一對一") hourlyRate = 1450;
                else if (classType === "一對二") hourlyRate = 1000;
                else if (classType === "一對四") hourlyRate = 800;
            }

            if (sessionsPerWeekStr === "週二堂") {
                if (classType === "一對一") hourlyRate -= 150;
                else if (classType === "一對二") hourlyRate -= 100;
                else if (classType === "一對四") hourlyRate -= 50;
            } else if (weekSessionsNum >= 3) { 
                if (classType === "一對一") hourlyRate -= 300; 
                else if (classType === "一對二") hourlyRate -= 200; 
                else if (classType === "一對四") hourlyRate -= 100; 
            }

            const tuitionBase = hourlyRate * totalHours;
            document.getElementById('tuition-base').value = Math.round(tuitionBase);

            const materialsFee = 50 * totalSessions;
            document.getElementById('materials-fee').value = materialsFee;

            const miscFee = parseFloat(document.getElementById('misc-fee').value) || 0;
            const discount = parseFloat(document.getElementById('discount').value) || 0;

            const totalTuition = tuitionBase + materialsFee + miscFee - discount;
            document.getElementById('total-tuition').value = Math.round(totalTuition);
        }

        function updateEndDatePreview() {
            const startDateVal = document.getElementById('start-date').value;
            const totalWeeks = parseInt(document.getElementById('total-weeks').value) || 0;
            if (!startDateVal || totalWeeks <= 0) return;

            let startDate = new Date(startDateVal);
            let targetDate = new Date(startDate.getTime() + (totalWeeks * 7 * 24 * 60 * 60 * 1000));
            
            let dayOfWeek = targetDate.getDay();
            let daysToSunday = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
            
            let endSunday = new Date(targetDate.getTime() + (daysToSunday * 24 * 60 * 60 * 1000));
            const endSundayStr = endSunday.toISOString().split('T')[0];
            
            document.getElementById('end-date-preview').innerText = `預計結束：${endSundayStr}`;
            document.getElementById('end-date-preview').setAttribute('data-date', endSundayStr);
        }

        function bindCalculationEvents() {
            const targets = ['class-type', 'course-level', 'hours-per-session', 'sessions-per-week', 'total-weeks', 'misc-fee', 'discount'];
            targets.forEach(id => {
                document.getElementById(id).addEventListener('change', performCalculations);
                document.getElementById(id).addEventListener('input', performCalculations);
            });
            
            document.getElementById('total-weeks').addEventListener('input', updateEndDatePreview);
            document.getElementById('start-date').addEventListener('change', updateEndDatePreview);
            
            performCalculations();
        }

        function setupSubjectHandler() {
            document.getElementById('btn-add-subject').addEventListener('click', () => {
                const newSubject = prompt("請輸入想要新增的新科目名稱：");
                if (newSubject && newSubject.trim() !== "") {
                    const select = document.getElementById('subject');
                    const opt = document.createElement('option');
                    opt.value = newSubject.trim();
                    opt.innerText = newSubject.trim();
                    opt.selected = true;
                    select.appendChild(opt);
                }
            });
        }

        document.getElementById('individual-class-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const checkedBoxes = document.querySelectorAll('.student-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert("⚠️ 請先在左側欄位篩選並勾選欲加入此個指班別的學生！");
                return;
            }

            const studentIdsArray = [];
            checkedBoxes.forEach(cb => {
                studentIdsArray.push({
                    student_id: cb.value,
                    student_name: cb.getAttribute('data-name')
                });
            });

            updateEndDatePreview();
            const endDateStr = document.getElementById('end-date-preview').getAttribute('data-date');

            const insertData = {
                student_ids: studentIdsArray,
                class_type: document.getElementById('class-type').value,
                grade: document.getElementById('class-grade').value,
                course_level: document.getElementById('course-level').value,
                subject: document.getElementById('subject').value,
                hours_per_session: parseFloat(document.getElementById('hours-per-session').value),
                sessions_per_week: document.getElementById('sessions-per-week').value,
                total_weeks: parseInt(document.getElementById('total-weeks').value),
                total_sessions: parseInt(document.getElementById('total-sessions').value),
                total_hours: parseFloat(document.getElementById('total-hours').value),
                tuition: parseFloat(document.getElementById('tuition-base').value),
                materials_fee: parseFloat(document.getElementById('materials-fee').value),
                misc_fee: parseFloat(document.getElementById('misc-fee').value) || 0,
                discount: parseFloat(document.getElementById('discount').value) || 0,
                discount_reason: document.getElementById('discount-reason').value,
                total_tuition: parseFloat(document.getElementById('total-tuition').value),
                start_date: document.getElementById('start-date').value,
                end_date: endDateStr,
                operator: document.getElementById('operator').value,
                issue_date: document.getElementById('issue-date').value,
                due_date: document.getElementById('due-date').value
            };

            try {
                const { error } = await sb
                    .from('individual_classes')
                    .insert([insertData]);

                if (error) throw error;

                alert("🎉 個指班別設立成功！即刻連動至繳費作業系統。");
                
                document.getElementById('individual-class-form').reset();
                setupDates();
                performCalculations();
                renderStudentList();
                await fetchIndividualClasses();

            } catch (err) {
                console.error("儲存失敗:", err);
                alert("資料庫寫入失敗，請確認 Supabase 設定。");
            }
        });

        async function fetchIndividualClasses() {
            try {
                const { data, error } = await sb
                    .from('individual_classes')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const tbody = document.getElementById('classes-list-table-body');
                document.getElementById('total-records-count').innerText = `共 ${data.length} 筆資料`;
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400 font-bold">目前尚無已創立的紀錄</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    const studentNames = item.student_ids ? item.student_ids.map(s => s.student_name).join(', ') : '未命名';
                    
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                    tr.innerHTML = `
                        <td class="p-3 font-mono text-slate-500">${item.issue_date}</td>
                        <td class="p-3"><span class="font-bold text-blue-700 bg-blue-50 border border-blue-100 px-2.5 py-1 rounded-lg">${studentNames}</span></td>
                        <td class="p-3 font-bold text-slate-700">${item.class_type} / <span class="text-xs bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded">${item.course_level}</span></td>
                        <td class="p-3 font-bold text-slate-600">${item.subject} <span class="text-xs text-slate-400 font-normal">(${item.hours_per_session}H * ${item.total_sessions})</span></td>
                        <td class="p-3 text-xs font-mono font-bold text-slate-500">${item.start_date} ~ <br>${item.end_date}</td>
                        <td class="p-3 text-right font-mono font-black text-rose-600 text-base">$${item.total_tuition}</td>
                        <td class="p-3 font-bold text-slate-500">${item.operator}</td>
                        <td class="p-3 text-center space-x-1 whitespace-nowrap">
                            <button onclick="openEditModal('${item.id}', ${item.misc_fee}, ${item.discount}, '${item.discount_reason || ''}', '${item.due_date}')" class="text-xs font-bold bg-amber-100 text-amber-700 border border-amber-200 px-2.5 py-1.5 rounded hover:bg-amber-200 transition">編輯</button>
                            <button onclick="deleteClass('${item.id}')" class="text-xs font-bold bg-rose-100 text-rose-700 border border-rose-200 px-2.5 py-1.5 rounded hover:bg-rose-200 transition">刪除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error("讀取開班紀錄失敗:", err);
            }
        }

        async function deleteClass(id) {
            if (!confirm("⚠️ 確定要刪除此個指班別嗎？")) return;
            try {
                const { error } = await sb
                    .from('individual_classes')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                alert("🗑️ 已成功刪除。");
                await fetchIndividualClasses();
            } catch (err) {
                alert("刪除失敗。");
            }
        }

        function openEditModal(id, miscFee, discount, reason, dueDate) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-misc-fee').value = miscFee;
            document.getElementById('edit-discount').value = discount;
            document.getElementById('edit-discount-reason').value = reason;
            document.getElementById('edit-due-date').value = dueDate;
            
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        document.getElementById('btn-close-modal').addEventListener('click', () => {
            const modal = document.getElementById('edit-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        document.getElementById('btn-save-modal').addEventListener('click', async () => {
            const id = document.getElementById('edit-id').value;
            const miscFee = parseFloat(document.getElementById('edit-misc-fee').value) || 0;
            const discount = parseFloat(document.getElementById('edit-discount').value) || 0;
            const reason = document.getElementById('edit-discount-reason').value;
            const dueDate = document.getElementById('edit-due-date').value;

            try {
                const { data: orig, error: fetchErr } = await sb
                    .from('individual_classes')
                    .select('tuition, materials_fee')
                    .eq('id', id)
                    .single();

                if (fetchErr) throw fetchErr;

                const newTotal = orig.tuition + orig.materials_fee + miscFee - discount;

                const { error: updateErr } = await sb
                    .from('individual_classes')
                    .update({
                        misc_fee: miscFee,
                        discount: discount,
                        discount_reason: reason,
                        due_date: dueDate,
                        total_tuition: newTotal
                    })
                    .eq('id', id);

                if (updateErr) throw updateErr;

                alert("✅ 欄位修改成功！總應繳金額已自動完成更新。");
                document.getElementById('edit-modal').classList.add('hidden');
                await fetchIndividualClasses();

            } catch (err) {
                console.error(err);
                alert("修改更新失敗。");
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            document.getElementById('individual-class-form').reset();
            setupDates();
            performCalculations();
            renderStudentList();
        });
    </script>
</body>
</html>
