<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點名與課堂表現 - 浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; }
        .canvas-container {
            background: white; border-radius: 2.5rem; border: 1px solid #e2e8f0;
            padding: 3rem; min-height: 700px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .grid-canvas {
            display: grid; gap: 10px; background: #f8fafc;
            padding: 20px; border-radius: 1.5rem; border: 2px solid #cbd5e1;
        }
        /* 座位狀態樣式 */
        .slot {
            aspect-ratio: 1/1; width: 85px; border-radius: 0.8rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }
        .slot.is-hallway { background: #e2e8f0; cursor: default; opacity: 0.5; }
        .slot.is-hallway::after { content: "走 廊"; font-size: 10px; font-weight: 800; color: #94a3b8; }
        
        /* 點名狀態顏色 */
        .status-pending { background: white; border-color: #e2e8f0; color: #64748b; }
        .status-present { background: #10b981; border-color: #059669; color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .status-absent { background: #ef4444; border-color: #dc2626; color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .status-late { background: #f59e0b; border-color: #d97706; color: white; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        
        .slot:active { transform: scale(0.95); }
        .label-badge { font-size: 9px; font-weight: 900; opacity: 0.6; margin-bottom: 2px; }
        .stu-name { font-size: 15px; font-weight: 900; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-[1500px] mx-auto">
        <!-- 頂部導航 -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-black text-slate-800 tracking-tighter">點名與成績管理</h1>
                <p class="text-slate-400 font-bold mt-1">點擊座位即可切換出席狀態</p>
            </div>

            <div class="flex items-center gap-4 bg-white p-3 rounded-3xl shadow-xl border border-slate-100">
                <div class="px-4 border-r border-slate-100">
                    <label class="block text-[10px] font-black text-blue-600 uppercase mb-1">班級</label>
                    <select id="class-select" onchange="loadAttendanceData(this.value)" class="font-black text-slate-700 outline-none bg-transparent">
                        <option value="">選擇班級...</option>
                    </select>
                </div>
                <div class="px-4">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">上課教室</label>
                    <select id="room-select" disabled class="font-black text-slate-700 outline-none bg-transparent">
                        <option value="">自動載入...</option>
                    </select>
                </div>
                <button onclick="saveAttendance()" class="bg-slate-800 text-white px-8 py-3 rounded-2xl font-black hover:bg-slate-700 shadow-lg transition active:scale-95">提交點名表</button>
            </div>
        </header>

        <div class="flex gap-10">
            <!-- 左側名單與統計 (維持與格局編輯器一致) -->
            <div class="w-80 shrink-0">
                <div class="bg-white rounded-[2.5rem] p-8 border border-slate-200 shadow-sm sticky top-8">
                    <div class="mb-8">
                        <h3 class="text-xs font-black text-slate-400 tracking-widest uppercase mb-4">今日出席統計</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-emerald-50 p-4 rounded-2xl">
                                <span class="block text-emerald-600 font-black text-2xl" id="count-present">0</span>
                                <span class="text-[10px] font-bold text-emerald-800">出席</span>
                            </div>
                            <div class="bg-rose-50 p-4 rounded-2xl">
                                <span class="block text-rose-600 font-black text-2xl" id="count-absent">0</span>
                                <span class="text-[10px] font-bold text-rose-800">缺席</span>
                            </div>
                        </div>
                    </div>

                    <h3 class="text-xs font-black text-slate-400 tracking-widest uppercase mb-4">學生清單</h3>
                    <div id="student-list" class="space-y-2 max-h-[400px] overflow-y-auto pr-2">
                        <p class="text-center py-10 text-slate-300 font-bold text-sm">載入中...</p>
                    </div>
                    
                    <button onclick="allPresent()" class="w-full mt-6 py-3 bg-emerald-100 text-emerald-700 rounded-xl font-black text-sm hover:bg-emerald-200 transition">一鍵全員出席</button>
                </div>
            </div>

            <!-- 右側視覺化網格 -->
            <div class="flex-1 canvas-container">
                <div class="w-full max-w-xl bg-slate-100 text-slate-400 py-3 font-black rounded-2xl mb-16 tracking-[3em] text-center text-xs">黑 板</div>
                <div id="attendance-grid" class="grid-canvas"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let state = {
            currentClassId: null,
            currentRoomId: null,
            grid: { rows: 0, cols: 0 },
            roomLayout: {},
            seats: [], // 存放從 class_seats 撈出來的原始資料
            attendance: {} // { "學生名": "present" | "absent" | "late" }
        };

        async function init() {
            const { data: classes } = await supabaseClient.from('classes').select('*').eq('is_archived', false).order('name');
            const { data: rooms } = await supabaseClient.from('rooms').select('*').order('name');
            
            const cSelect = document.getElementById('class-select');
            classes?.forEach(c => cSelect.add(new Option(c.name, c.id)));
            
            const rSelect = document.getElementById('room-select');
            rooms?.forEach(r => rSelect.add(new Option(r.name, r.id)));
        }

        async function loadAttendanceData(classId) {
            if(!classId) return;
            state.currentClassId = classId;
            
            // 1. 獲取班級資訊（包含它目前在那間教室）
            const { data: cls } = await supabaseClient.from('classes').select('room_id, members').eq('id', classId).single();
            state.currentRoomId = cls.room_id;
            document.getElementById('room-select').value = cls.room_id;

            // 2. 獲取教室格局 (Rooms)
            const { data: room } = await supabaseClient.from('rooms').select('*').eq('id', cls.room_id).single();
            state.grid = room.grid_size;
            state.roomLayout = room.layout_config || {};

            // 3. 獲取座位分布 (Class_Seats)
            const { data: seats } = await supabaseClient.from('class_seats').select('*').eq('class_id', classId).eq('room_id', cls.room_id);
            state.seats = seats;

            // 初始化點名狀態（預設為 pending）
            state.attendance = {};
            cls.members.forEach(name => state.attendance[name] = 'pending');

            render();
        }

        function render() {
            const grid = document.getElementById('attendance-grid');
            grid.innerHTML = "";
            grid.style.gridTemplateColumns = `repeat(${state.grid.cols}, 1fr)`;

            // 為了效能，建立一個座標查詢地圖
            const seatMap = {};
            state.seats.forEach(s => seatMap[`${s.row_index}-${s.col_index}`] = s);

            for (let r = 0; r < state.grid.rows; r++) {
                for (let c = 0; c < state.grid.cols; c++) {
                    const key = `${r}-${c}`;
                    const seatInfo = seatMap[key];
                    const slot = document.createElement('div');
                    
                    if (state.roomLayout[key] === 'hallway') {
                        slot.className = 'slot is-hallway';
                    } else if (seatInfo && seatInfo.student_name) {
                        const name = seatInfo.student_name;
                        const status = state.attendance[name] || 'pending';
                        slot.className = `slot status-${status}`;
                        slot.innerHTML = `
                            <span class="label-badge">${seatInfo.seat_label}</span>
                            <span class="stu-name">${name}</span>
                        `;
                        slot.onclick = () => toggleStatus(name);
                    } else {
                        slot.className = 'slot border-dashed border-slate-200 opacity-30'; // 空位
                    }
                    grid.appendChild(slot);
                }
            }
            updateStats();
        }

        function toggleStatus(name) {
            const cycle = { 'pending': 'present', 'present': 'absent', 'absent': 'late', 'late': 'present' };
            state.attendance[name] = cycle[state.attendance[name]] || 'present';
            render();
        }

        function allPresent() {
            Object.keys(state.attendance).forEach(name => state.attendance[name] = 'present');
            render();
        }

        function updateStats() {
            const vals = Object.values(state.attendance);
            document.getElementById('count-present').innerText = vals.filter(v => v === 'present' || v === 'late').length;
            document.getElementById('count-absent').innerText = vals.filter(v => v === 'absent').length;
            
            // 更新左側名單
            const list = document.getElementById('student-list');
            list.innerHTML = Object.entries(state.attendance).map(([name, status]) => {
                const dotColor = { 'present': 'bg-emerald-500', 'absent': 'bg-rose-500', 'late': 'bg-amber-500', 'pending': 'bg-slate-300' }[status];
                return `
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl">
                        <span class="font-bold text-slate-700">${name}</span>
                        <span class="w-3 h-3 rounded-full ${dotColor}"></span>
                    </div>
                `;
            }).join('');
        }

        async function saveAttendance() {
            // 這裡可以串接到你的 attendance_logs 資料表
            alert("點名資料已暫存 (此處需依據您的 logs 表結構進行 insert)");
            console.log("提交數據：", state.attendance);
        }

        window.onload = init;
    </script>
</body>
</html>
