<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>昊學行政系統 - 教學成績</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Inter", "Microsoft JhengHei", sans-serif; background: #f1f5f9; }
        .diary-input {
            width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.5rem;
            padding: 0.75rem; font-size: 0.875rem; font-weight: 700; outline: none; transition: border-color 0.2s;
        }
        .diary-input:focus { border-color: #10b981; background-color: #ffffff; }
    </style>
</head>
<body class="p-8 flex justify-center">

<div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    <div class="bg-slate-800 p-6 flex gap-4 items-center justify-between">
        <div class="flex items-center gap-4">
            <h2 class="text-white font-black text-xl tracking-widest">📝 教學日誌</h2>
            <input type="date" id="log-date" onchange="loadDiary()" class="bg-slate-700 text-white border-none rounded-lg px-3 py-1.5 font-bold outline-none">
            <select id="class-switcher" onchange="loadDiary()" class="bg-slate-700 text-white rounded-lg px-3 py-1.5 font-bold outline-none">
                <option value="">選擇班別...</option>
            </select>
        </div>
        <button onclick="copyContactLogs()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg transition-colors shadow-md">
            📋 複製聯絡本
        </button>
    </div>

    <div class="p-8 space-y-6">
        <div class="grid grid-cols-2 gap-6">
            <div>
                <label class="text-xs font-black text-slate-500 mb-2 block">上課進度</label>
                <input type="text" id="field-progress" data-field="progress" class="diary-input" placeholder="例如：4-3 ~ 4-4">
            </div>
            <div>
                <label class="text-xs font-black text-slate-500 mb-2 block">發放講義</label>
                <input type="text" id="field-handouts" data-field="handouts" class="diary-input" placeholder="有發放哪些講義？">
            </div>
            <div>
                <label class="text-xs font-black text-slate-500 mb-2 block">回家作業</label>
                <input type="text" id="field-homework" data-field="homework" class="diary-input">
            </div>
            <div>
                <label class="text-xs font-black text-slate-500 mb-2 block">下週考試 / 測驗範圍</label>
                <input type="text" id="field-next-exam" data-field="next_exam" class="diary-input">
            </div>
        </div>

        <div class="pt-6 border-t border-slate-100 flex flex-col items-center">
            <label class="text-sm font-black text-slate-500 mb-3 block">本次測驗平均成績</label>
            <div class="relative w-48">
                <input type="number" id="field-avg-score" data-field="avg_score" class="diary-input text-center text-3xl text-emerald-600 font-black" style="height: 70px;">
                <span class="absolute right-4 top-6 text-emerald-300 font-bold">分</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ✅ 已經替換為你真實的 Supabase 連線資訊
    const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');

    // 紀錄目前畫面上這筆日誌在資料庫裡的 ID
    let currentLogId = null;

    window.onload = () => {
        const d = new Date();
        document.getElementById('log-date').value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        init();
    };

    async function init() {
        // 1. 綁定所有的輸入框，只要打字離開框框，就會自動觸發 saveClassLog 存檔
        document.querySelectorAll('[data-field]').forEach(el => {
            el.addEventListener('change', e => saveClassLog(e.target.dataset.field, e.target.value));
        });

        // 2. 真正去 Supabase 撈取班級列表
        try {
            const { data: classes, error } = await sb.from('classes').select('id, name');
            if (error) throw error;
            
            const switcher = document.getElementById('class-switcher');
            classes.forEach(c => {
                switcher.add(new Option(c.name, c.id));
            });
        } catch (err) {
            console.error("載入班級清單失敗", err);
        }
    }

    async function loadDiary() {
        const selectedDate = document.getElementById('log-date').value;
        const classId = document.getElementById('class-switcher').value;
        
        // 切換班級或日期時，先清空畫面舊資料
        document.getElementById('field-progress').value = '';
        document.getElementById('field-handouts').value = '';
        document.getElementById('field-homework').value = '';
        document.getElementById('field-next-exam').value = '';
        document.getElementById('field-avg-score').value = '';
        currentLogId = null;

        if(!classId || !selectedDate) return;

        try {
            // 真正去 Supabase 撈取這天、這班的 class_logs
            const { data: log, error } = await sb.from('class_logs')
                .select('*')
                .eq('class_id', classId)
                .eq('log_date', selectedDate)
                .maybeSingle(); // 只抓一筆，找不到也不會報錯

            if (error) throw error;

            if (log) {
                // 如果資料庫有紀錄，就把文字塞回畫面中
                currentLogId = log.id;
                document.getElementById('field-progress').value = log.progress || '';
                document.getElementById('field-handouts').value = log.handouts || '';
                document.getElementById('field-homework').value = log.homework || '';
                document.getElementById('field-next-exam').value = log.next_exam || '';
                document.getElementById('field-avg-score').value = log.avg_score || '';
            }
        } catch (err) {
            console.error("讀取教學日誌失敗", err);
        }
    }

    async function saveClassLog(field, value) {
        const selectedDate = document.getElementById('log-date').value;
        const classId = document.getElementById('class-switcher').value;
        
        if(!classId) {
            alert('請先在右上角選擇班級，才能開始紀錄喔！');
            document.getElementById(`field-${field.replace('_', '-')}`).value = ''; // 清空剛才亂打的字
            return;
        }

        try {
            let payload = {};
            payload[field] = value;

            if (currentLogId) {
                // 如果已經有紀錄，就用 UPDATE 更新
                const { error } = await sb.from('class_logs').update(payload).eq('id', currentLogId);
                if (error) throw error;
            } else {
                // 如果是這天這個班級的第一筆字，就用 INSERT 新增
                payload.class_id = classId;
                payload.log_date = selectedDate;
                const { data: newLog, error } = await sb.from('class_logs').insert([payload]).select().single();
                if (error) throw error;
                currentLogId = newLog.id; // 記住剛剛產生的新日誌 ID
            }
        } catch (err) {
            alert("自動存檔失敗，請檢查網路連線");
            console.error("儲存失敗", err);
        }
    }

    function copyContactLogs() {
        const dateVal = document.getElementById('log-date').value;
        const dateObj = new Date(dateVal);
        const dateStr = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
        
        const switcher = document.getElementById('class-switcher');
        const className = switcher.options[switcher.selectedIndex]?.text || '';
        
        const progress = document.getElementById('field-progress').value;
        const handouts = document.getElementById('field-handouts').value;
        const homework = document.getElementById('field-homework').value;
        const nextExam = document.getElementById('field-next-exam').value;
        const avgScore = document.getElementById('field-avg-score').value;

        let msg = `家長您好\n以下為 ${dateStr} ${className} 課堂狀況：\n`;
        if(progress) msg += `上課範圍：${progress}\n`;
        if(handouts) msg += `發放資料：${handouts}\n`;
        if(homework) msg += `回家作業：${homework}\n`;
        if(nextExam) msg += `下週考試：${nextExam}\n`;
        if(avgScore) msg += `平均分數：${avgScore}分\n`;
        msg += `考卷內容已於課堂上檢討完畢`;

        navigator.clipboard.writeText(msg).then(() => alert('✅ 聯絡本訊息已成功複製！可以直接貼到 LINE 囉！'));
    }
</script>
</body>
</html>
