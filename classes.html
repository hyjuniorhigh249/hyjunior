<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>班級組織與成員管理 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black text-slate-800">班級組織與成員管理</h1>
            <button onclick="openClassModal()" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-black shadow-md">＋ 建立新主班級</button>
        </header>
        <div id="classes-container" class="space-y-6"></div>
    </div>

    <div id="class-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 id="class-modal-title" class="text-lg font-black mb-4">設定主班級</h3>
            <input type="hidden" id="cls-id">
            <input type="text" id="cls-name" class="w-full p-2 border rounded-lg mb-3 font-bold" placeholder="主班級名稱*">
            <div class="grid grid-cols-2 gap-2 mb-3">
                <input type="date" id="cls-start" class="w-full p-2 border rounded-lg font-bold text-sm" placeholder="開課日">
                <input type="date" id="cls-end" class="w-full p-2 border rounded-lg font-bold text-sm" placeholder="結業日">
            </div>
            <div class="grid grid-cols-3 gap-2 mb-3">
                <div><label class="text-[10px] text-slate-400 font-bold">學費</label><input type="number" id="cls-fee" class="w-full p-2 border rounded-lg font-bold" value="0"></div>
                <div><label class="text-[10px] text-slate-400 font-bold">教材費</label><input type="number" id="cls-textbook" class="w-full p-2 border rounded-lg font-bold" value="0"></div>
                <div><label class="text-[10px] text-slate-400 font-bold">雜費</label><input type="number" id="cls-misc" class="w-full p-2 border rounded-lg font-bold" value="0"></div>
            </div>
            <input type="text" id="cls-note" class="w-full p-2 border rounded-lg mb-4 font-bold" placeholder="備註">
            <div class="flex gap-2">
                <button onclick="closeModal('class-modal')" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold">取消</button>
                <button onclick="saveClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-bold">儲存</button>
            </div>
        </div>
    </div>

    <div id="sub-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 id="sub-modal-title" class="text-lg font-black mb-4">設定子班別</h3>
            <input type="hidden" id="sub-clsId"><input type="hidden" id="sub-idx">
            <input type="text" id="sub-name" class="w-full p-2 border rounded-lg mb-3 font-bold" placeholder="子班別名稱*">
            <div class="grid grid-cols-2 gap-2 mb-3">
                <select id="sub-day" class="w-full p-2 border rounded-lg font-bold text-sm col-span-2">
                    <option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="0">星期日</option>
                </select>
                <input type="time" id="sub-start" class="w-full p-2 border rounded-lg font-bold text-sm">
                <input type="time" id="sub-end" class="w-full p-2 border rounded-lg font-bold text-sm">
            </div>
            <div class="grid grid-cols-3 gap-2 mb-4">
                <div><label class="text-[10px] text-slate-400 font-bold">學費</label><input type="number" id="sub-fee" class="w-full p-2 border rounded-lg font-bold"></div>
                <div><label class="text-[10px] text-slate-400 font-bold">教材費</label><input type="number" id="sub-textbook" class="w-full p-2 border rounded-lg font-bold"></div>
                <div><label class="text-[10px] text-slate-400 font-bold">雜費</label><input type="number" id="sub-misc" class="w-full p-2 border rounded-lg font-bold"></div>
            </div>
            <input type="text" id="sub-teacher" class="w-full p-2 border rounded-lg font-bold mb-4" placeholder="授課老師">
            <div class="flex gap-2">
                <button onclick="closeModal('sub-modal')" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold">取消</button>
                <button onclick="saveSubClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-bold">儲存</button>
            </div>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
        let allClassData = [];
        const dayMap = { '0': '日', '1': '一', '2': '二', '3': '三', '4': '四', '5': '五', '6': '六' };

        async function init() {
            const { data } = await sb.from('classes').select('*').order('created_at', { ascending: false });
            allClassData = data || []; render();
        }

        function render() {
            document.getElementById('classes-container').innerHTML = allClassData.map(cls => `
                <div class="bg-white p-6 rounded-2xl border shadow-sm relative">
                    <div class="flex justify-between items-start mb-4 border-b pb-4">
                        <div>
                            <h4 class="font-black text-xl">${cls.name} <span class="text-xs text-slate-400 ml-2">(預設: 學費$${cls.default_fee||0}, 教材$${cls.default_textbook_fee||0}, 雜費$${cls.default_misc_fee||0})</span></h4>
                            <p class="text-xs text-slate-500 font-bold mt-1">期間：${cls.start_date||'未定'} ~ ${cls.end_date||'未定'}</p>
                        </div>
                        <div class="flex flex-col gap-2 items-end">
                            <div class="flex gap-2"><button onclick="openClassModal('${cls.id}')" class="text-[10px] bg-slate-100 px-3 py-1 rounded font-black">編輯</button></div>
                            <button onclick="openSubModal('${cls.id}')" class="text-xs bg-emerald-500 text-white px-4 py-1.5 rounded-lg font-black">＋ 新增子班別</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${(cls.sub_classes || []).map((sub, idx) => `
                            <div class="bg-slate-50 p-4 rounded-xl border relative">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <p class="font-black text-sm">${sub.name} <span class="text-[10px] text-emerald-600 ml-1">(學$${sub.fee||0}+教$${sub.textbook_fee||0}+雜$${sub.misc_fee||0})</span></p>
                                        <p class="text-[10px] text-slate-500 font-bold mt-0.5">每週${sub.day ? dayMap[sub.day] : '未定'} | ${sub.start||'--:--'} ~ ${sub.end||'--:--'}</p>
                                    </div>
                                    <div class="flex gap-1"><button onclick="openSubModal('${cls.id}', ${idx})" class="text-[9px] bg-slate-200 px-2 py-1 rounded font-black">編輯</button></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openClassModal(id = null) {
            document.getElementById('cls-id').value = id || '';
            const cls = id ? allClassData.find(c => c.id === id) : {};
            document.getElementById('cls-name').value = cls.name || '';
            document.getElementById('cls-start').value = cls.start_date || '';
            document.getElementById('cls-end').value = cls.end_date || '';
            document.getElementById('cls-fee').value = cls.default_fee || 0;
            document.getElementById('cls-textbook').value = cls.default_textbook_fee || 0;
            document.getElementById('cls-misc').value = cls.default_misc_fee || 0;
            document.getElementById('cls-note').value = cls.note || '';
            document.getElementById('class-modal').classList.add('active');
        }

        async function saveClass() {
            const payload = {
                name: document.getElementById('cls-name').value.trim(),
                start_date: document.getElementById('cls-start').value || null,
                end_date: document.getElementById('cls-end').value || null,
                default_fee: parseInt(document.getElementById('cls-fee').value) || 0,
                default_textbook_fee: parseInt(document.getElementById('cls-textbook').value) || 0,
                default_misc_fee: parseInt(document.getElementById('cls-misc').value) || 0,
                note: document.getElementById('cls-note').value.trim()
            };
            if(!payload.name) return;
            const id = document.getElementById('cls-id').value;
            if(id) await sb.from('classes').update(payload).eq('id', id);
            else { payload.sub_classes = []; await sb.from('classes').insert([payload]); }
            closeModal('class-modal'); init();
        }

        function openSubModal(clsId, idx = null) {
            const cls = allClassData.find(c => c.id === clsId);
            document.getElementById('sub-clsId').value = clsId; document.getElementById('sub-idx').value = idx ?? '';
            const sub = idx !== null ? cls.sub_classes[idx] : {};
            document.getElementById('sub-name').value = sub.name || '';
            document.getElementById('sub-fee').value = sub.fee !== undefined ? sub.fee : (cls.default_fee || 0);
            document.getElementById('sub-textbook').value = sub.textbook_fee !== undefined ? sub.textbook_fee : (cls.default_textbook_fee || 0);
            document.getElementById('sub-misc').value = sub.misc_fee !== undefined ? sub.misc_fee : (cls.default_misc_fee || 0);
            document.getElementById('sub-day').value = sub.day || '1';
            document.getElementById('sub-start').value = sub.start || ''; document.getElementById('sub-end').value = sub.end || '';
            document.getElementById('sub-teacher').value = sub.teacher || '';
            document.getElementById('sub-modal').classList.add('active');
        }

        async function saveSubClass() {
            const clsId = document.getElementById('sub-clsId').value, idxStr = document.getElementById('sub-idx').value;
            const cls = allClassData.find(c => c.id === clsId);
            let subs = cls.sub_classes ? [...cls.sub_classes] : [];
            const data = {
                name: document.getElementById('sub-name').value.trim(),
                fee: parseInt(document.getElementById('sub-fee').value) || 0,
                textbook_fee: parseInt(document.getElementById('sub-textbook').value) || 0,
                misc_fee: parseInt(document.getElementById('sub-misc').value) || 0,
                day: document.getElementById('sub-day').value,
                start: document.getElementById('sub-start').value, end: document.getElementById('sub-end').value,
                teacher: document.getElementById('sub-teacher').value.trim()
            };
            if(!data.name) return;
            if(idxStr !== '') subs[parseInt(idxStr)] = { ...subs[parseInt(idxStr)], ...data };
            else subs.push({ ...data, members: [], room_id: null });
            await sb.from('classes').update({ sub_classes: subs }).eq('id', clsId);
            closeModal('sub-modal'); init();
        }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = init;
    </script>
</body>
</html>
