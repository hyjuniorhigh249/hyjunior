<!-- 更新後的右側資訊欄 -->
<div class="w-96 space-y-4">
    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
        <h3 class="font-black text-slate-800 mb-4 border-b pb-2">今日聯絡本</h3>
        
        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase">發放資料</label>
                <input type="text" id="log-handouts" class="w-full bg-slate-50 border-none rounded-lg p-2 text-sm font-bold">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase">上課進度</label>
                <textarea id="log-progress" class="w-full bg-slate-50 border-none rounded-lg p-2 text-sm font-bold h-20"></textarea>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase">回家作業</label>
                <input type="text" id="log-homework" class="w-full bg-slate-50 border-none rounded-lg p-2 text-sm font-bold">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] font-black text-blue-500">本週考試 (自動帶入)</label>
                    <input type="text" id="log-this-exam" class="w-full bg-blue-50 border-none rounded-lg p-2 text-sm font-bold text-blue-700">
                </div>
                <div>
                    <label class="text-[10px] font-black text-rose-500">下週考試</label>
                    <input type="text" id="log-next-exam" class="w-full bg-rose-50 border-none rounded-lg p-2 text-sm font-bold text-rose-700">
                </div>
            </div>
            <div class="pt-4 border-t">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-black text-slate-500">班級平均分數</span>
                    <span id="avg-display" class="text-2xl font-black text-emerald-500">0.0</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 自動帶入上週內容與計算平均
    async function fetchLastWeekExam(classId) {
        // 抓取該班級最近一次的紀錄
        const { data } = await supabaseClient
            .from('class_logs')
            .select('next_exam')
            .eq('class_id', classId)
            .order('log_date', { ascending: false })
            .limit(1);
        
        if (data && data[0]) {
            document.getElementById('log-this-exam').value = data[0].next_exam;
        }
    }

    function calculateAverage() {
        const scores = Array.from(document.querySelectorAll('.score-input'))
            .map(input => parseFloat(input.value))
            .filter(val => !isNaN(val));
        
        const avg = scores.length > 0 ? (scores.reduce((a, b) => a + b) / scores.length).toFixed(1) : 0;
        document.getElementById('avg-display').innerText = avg;
        return avg;
    }

    // 監聽所有成績輸入框，即時計算平均
    document.addEventListener('input', (e) => {
        if (e.target.classList.contains('score-input')) {
            calculateAverage();
        }
    });
</script>
