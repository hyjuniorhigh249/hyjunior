<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教學成績與學習報告管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">教學成績與學習報告管理</h1>

        <div class="mb-8 p-5 bg-blue-50 border border-blue-100 rounded-lg flex flex-wrap gap-6 items-center">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">選擇年級</label>
                <select id="grade-selector" class="border border-gray-300 p-2 rounded w-48 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- 請選擇年級 --</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">選擇學生 <span class="text-xs text-gray-500 font-normal">(選擇後才能發送推播)</span></label>
                <select id="student-selector" class="border border-gray-300 p-2 rounded w-56 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- 請先選擇年級 --</option>
                </select>
            </div>
            <div id="bind-status" class="mt-5 text-sm font-bold text-red-500"></div>
        </div>

        <div class="flex space-x-2 mb-6">
            <button id="btn-tab-group" onclick="switchTab('group')" class="px-6 py-2 rounded-t-lg font-bold bg-blue-600 text-white transition-colors">
                團班教學日誌
            </button>
            <button id="btn-tab-indiv" onclick="switchTab('indiv')" class="px-6 py-2 rounded-t-lg font-bold bg-gray-200 text-gray-600 hover:bg-gray-300 transition-colors">
                個指學習報告
            </button>
        </div>

        <div id="tab-group" class="block bg-gray-50 p-6 rounded-b-lg border border-gray-200">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">日誌日期</label>
                    <input type="date" id="log-date" class="w-full border border-gray-300 p-2 rounded" onchange="loadDiary()">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">選擇班級與子班別</label>
                    <select id="class-switcher" class="w-full border border-gray-300 p-2 rounded" onchange="loadDiary()">
                        <option value="">-- 請選擇班級 --</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">上課範圍 (進度)</label>
                    <textarea id="field-progress" data-field="progress" class="w-full border border-gray-300 p-2 rounded h-20"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">發放資料</label>
                    <textarea id="field-handouts" data-field="handouts" class="w-full border border-gray-300 p-2 rounded h-20"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">回家作業</label>
                    <textarea id="field-homework" data-field="homework" class="w-full border border-gray-300 p-2 rounded h-20"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">下週考試</label>
                    <input type="text" id="field-next-exam" data-field="next_exam" class="w-full border border-gray-300 p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">平均分數</label>
                    <input type="number" id="field-avg-score" data-field="avg_score" class="w-full border border-gray-300 p-2 rounded">
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 mt-6">
                <button onclick="manualSaveGroupLog()" class="w-full sm:w-1/3 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded shadow-lg transition-colors flex justify-center items-center">
                    💾 儲存團班日誌
                </button>
                <button onclick="sendLineMessage('group')" class="w-full sm:w-2/3 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded shadow-lg transition-colors flex justify-center items-center">
                    透過官方 LINE 發送給家長
                </button>
            </div>
        </div>

        <div id="tab-indiv" class="hidden bg-yellow-50 p-6 rounded-b-lg border border-yellow-200">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">學生姓名</label>
                    <input type="text" id="ind-name" placeholder="請先於上方選單選擇學生" class="w-full border border-gray-300 p-2 rounded bg-white">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">授課講師</label>
                    <input type="text" id="ind-teacher" placeholder="請輸入講師名稱" class="w-full border border-gray-300 p-2 rounded bg-white">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">上課日期</label>
                    <input type="date" id="ind-date" class="w-full border border-gray-300 p-2 rounded bg-white">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">下次課程日期</label>
                    <input type="date" id="ind-next-date" class="w-full border border-gray-300 p-2 rounded bg-white">
                </div>
            </div>

            <div class="grid grid-cols-1 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">小考成績 (0~100)</label>
                    <div class="flex items-center space-x-4">
                        <input type="number" id="ind-quiz" min="0" max="100" placeholder="成績" class="w-32 border border-gray-300 p-2 rounded bg-white">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="ind-no-quiz" class="w-5 h-5 text-blue-600 rounded" onchange="toggleQuizInput()">
                            <span class="font-bold text-gray-700">無小考</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">課程內容</label>
                    <textarea id="ind-content" placeholder="請輸入今日課程內容" class="w-full border border-gray-300 p-2 rounded h-20 bg-white"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">講評</label>
                    <textarea id="ind-comment" placeholder="請輸入對學生的講評與回饋" class="w-full border border-gray-300 p-2 rounded h-20 bg-white"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">作業內容</label>
                    <textarea id="ind-homework" placeholder="請輸入回家作業" class="w-full border border-gray-300 p-2 rounded h-20 bg-white"></textarea>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 mt-6">
                <button onclick="saveIndividualLog()" class="w-full sm:w-1/3 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded shadow-lg transition-colors flex justify-center items-center">
                    💾 儲存學習報告
                </button>
                <button onclick="sendLineMessage('indiv')" class="w-full sm:w-2/3 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded shadow-lg transition-colors flex justify-center items-center">
                    透過官方 LINE 發送給家長
                </button>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Supabase
        const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');

        let currentLogId = null;
        let allStudents = [];
        let currentStudentId = null;
        let currentStudentName = '';
        let currentParentLineId = null;

        window.onload = () => {
            const d = new Date();
            const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            document.getElementById('log-date').value = todayStr;
            document.getElementById('ind-date').value = todayStr;
            
            init();
            loadGlobalStudents();
        };

        // ==================== 畫面與頁籤邏輯 ====================
        function switchTab(tabName) {
            const tabGroup = document.getElementById('tab-group');
            const tabIndiv = document.getElementById('tab-indiv');
            const btnGroup = document.getElementById('btn-tab-group');
            const btnIndiv = document.getElementById('btn-tab-indiv');

            if (tabName === 'group') {
                tabGroup.classList.remove('hidden');
                tabIndiv.classList.add('hidden');
                btnGroup.classList.replace('bg-gray-200', 'bg-blue-600');
                btnGroup.classList.replace('text-gray-600', 'text-white');
                btnIndiv.classList.replace('bg-blue-600', 'bg-gray-200');
                btnIndiv.classList.replace('text-white', 'text-gray-600');
            } else {
                tabGroup.classList.add('hidden');
                tabIndiv.classList.remove('hidden');
                btnIndiv.classList.replace('bg-gray-200', 'bg-blue-600');
                btnIndiv.classList.replace('text-gray-600', 'text-white');
                btnGroup.classList.replace('bg-blue-600', 'bg-gray-200');
                btnGroup.classList.replace('text-white', 'text-gray-600');
            }
        }

        function toggleQuizInput() {
            const isNoQuiz = document.getElementById('ind-no-quiz').checked;
            const quizInput = document.getElementById('ind-quiz');
            if (isNoQuiz) {
                quizInput.value = '';
                quizInput.disabled = true;
                quizInput.classList.add('bg-gray-100');
            } else {
                quizInput.disabled = false;
                quizInput.classList.remove('bg-gray-100');
            }
        }

        // ==================== 年級智慧換算邏輯 ====================
        function calculateGradeDisplay(baseYear) {
            if (!baseYear) return '未設定年級';

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1; // 1~12月

            // 每年 7 月換學年度：大於等於 7 月算新學年度，否則算去年的學年度
            const academicYear = currentMonth >= 7 ? currentYear : currentYear - 1;

            // 計算年齡差（入學後的第幾年）
            const gradeNum = academicYear - parseInt(baseYear) + 1;

            if (gradeNum <= 0) return '幼兒園/未入學';
            
            switch (gradeNum) {
                case 1: return '小一';
                case 2: return '小二';
                case 3: return '小三';
                case 4: return '小四';
                case 5: return '小五';
                case 6: return '小六';
                case 7: return '國七';
                case 8: return '國八';
                case 9: return '國九';
                case 10: return '高一';
                case 11: return '高二';
                case 12: return '高三';
                default: return '已畢業';
            }
        }

        // ==================== 全域學生與年級資料載入 ====================
        async function loadGlobalStudents() {
            try {
                // 精準撈取 grade_base_year 欄位
                const { data, error } = await sb.from('students').select('id, name, grade_base_year, parent_line_id');
                if (error) throw error;
                
                allStudents = data || [];
                
                // 替每位學生套用智慧年級換算
                allStudents.forEach(s => {
                    s.displayGrade = calculateGradeDisplay(s.grade_base_year);
                });

                // 抓取不重複的中文年級清單
                const grades = [...new Set(allStudents.map(s => s.displayGrade))];
                
                // 為了讓選單看起來順眼，可以簡單定義一下排序規則（從小一排到高三）
                const gradeOrder = ['幼兒園/未入學', '小一', '小二', '小三', '小四', '小五', '小六', '國七', '國八', '國九', '高一', '高二', '高三', '已畢業', '未設定年級'];
                grades.sort((a, b) => {
                    let indexA = gradeOrder.indexOf(a);
                    let indexB = gradeOrder.indexOf(b);
                    // 如果找不到對應的，排到最後面
                    if(indexA === -1) indexA = 999;
                    if(indexB === -1) indexB = 999;
                    return indexA - indexB;
                });

                const gradeSelect = document.getElementById('grade-selector');
                
                // 清空並重新寫入中文年級選項
                gradeSelect.innerHTML = '<option value="">-- 請選擇年級 --</option>';
                grades.forEach(g => {
                    gradeSelect.add(new Option(g, g));
                });

                // 年級選單變更事件：連動更新學生選單
                gradeSelect.addEventListener('change', (e) => {
                    const selectedGrade = e.target.value;
                    const studentSelect = document.getElementById('student-selector');
                    studentSelect.innerHTML = '<option value="">-- 請選擇學生 --</option>';
                    
                    // 利用計算出來的 displayGrade 進行過濾
                    const filteredStudents = allStudents.filter(s => s.displayGrade === selectedGrade);
                    
                    filteredStudents.forEach(s => {
                        const bindStatusText = s.parent_line_id ? '🟢 已綁定' : '🔴 未綁定';
                        studentSelect.add(new Option(`${s.name} [${bindStatusText}]`, s.id));
                    });
                    
                    resetStudentSelection();
                });

                document.getElementById('student-selector').addEventListener('change', (e) => {
                    const stuId = e.target.value;
                    const student = allStudents.find(s => s.id === stuId);
                    const statusDiv = document.getElementById('bind-status');
                    
                    if (student) {
                        currentStudentId = student.id;
                        currentStudentName = student.name;
                        currentParentLineId = student.parent_line_id;
                        document.getElementById('ind-name').value = student.name;

                        if (student.parent_line_id) {
                            statusDiv.innerHTML = `✅ 系統已鎖定：可向 ${student.name} 的家長發送 LINE 通知`;
                            statusDiv.className = "mt-5 text-sm font-bold text-green-600";
                        } else {
                            statusDiv.innerHTML = `⚠️ 注意：${student.name} 尚未綁定家長 LINE 帳號，無法發送通知`;
                            statusDiv.className = "mt-5 text-sm font-bold text-red-500";
                        }
                    } else {
                        resetStudentSelection();
                    }
                });
            } catch (err) {
                console.error("載入學生資料庫失敗", err);
                alert("學生名單載入失敗，請確認 Supabase 的 students 表格是否包含 grade_base_year 欄位！");
            }
        }

        function resetStudentSelection() {
            currentStudentId = null;
            currentStudentName = '';
            currentParentLineId = null;
            document.getElementById('ind-name').value = '';
            document.getElementById('bind-status').innerHTML = '';
        }

        // ==================== 團班教學日誌邏輯 ====================
        async function init() {
            document.querySelectorAll('#tab-group [data-field]').forEach(el => {
                el.addEventListener('change', e => saveClassLog(e.target.dataset.field, e.target.value));
            });

            try {
                const { data: classes, error } = await sb.from('classes').select('id, name, sub_classes');
                if (error) throw error;
                
                const switcher = document.getElementById('class-switcher');
                classes.forEach(c => {
                    (c.sub_classes || []).forEach((sub, i) => {
                        switcher.add(new Option(`${c.name} - ${sub.name}`, `${c.id}_${i}`));
                    });
                });
            } catch (err) {
                console.error("載入班級清單失敗", err);
            }
        }

        async function loadDiary() {
            const selectedDate = document.getElementById('log-date').value;
            const val = document.getElementById('class-switcher').value;
            
            document.querySelectorAll('#tab-group [data-field]').forEach(el => el.value = '');
            currentLogId = null;

            if(!val || !selectedDate) return;
            const [classId, subIdx] = val.split('_');

            try {
                const { data: log, error } = await sb.from('class_logs')
                    .select('*')
                    .eq('class_id', classId)
                    .eq('sub_idx', parseInt(subIdx))
                    .eq('log_date', selectedDate)
                    .maybeSingle();

                if (error) throw error;
                if (log) {
                    currentLogId = log.id;
                    document.getElementById('field-progress').value = log.progress || '';
                    document.getElementById('field-handouts').value = log.handouts || '';
                    document.getElementById('field-homework').value = log.homework || '';
                    document.getElementById('field-next-exam').value = log.next_exam || '';
                    document.getElementById('field-avg-score').value = log.avg_score || '';
                }
            } catch (err) {
                console.error("讀取教學日誌失敗", err);
            }
        }

        async function saveClassLog(field, value) {
            const selectedDate = document.getElementById('log-date').value;
            const val = document.getElementById('class-switcher').value;
            
            if(!val) {
                alert('請先在左上角選擇「班級與子班別」，才能儲存團班紀錄喔！');
                document.getElementById(`field-${field.replace('_', '-')}`).value = '';
                return;
            }

            const [classId, subIdx] = val.split('_');

            try {
                let payload = {};
                payload[field] = value;

                if (currentLogId) {
                    const { error } = await sb.from('class_logs').update(payload).eq('id', currentLogId);
                    if (error) throw error;
                } else {
                    payload.class_id = classId;
                    payload.sub_idx = parseInt(subIdx);
                    payload.log_date = selectedDate;
                    const { data: newLog, error } = await sb.from('class_logs').insert([payload]).select().single();
                    if (error) throw error;
                    currentLogId = newLog.id; 
                }
            } catch (err) {
                console.error("自動存檔失敗", err);
            }
        }

        function manualSaveGroupLog() {
            const val = document.getElementById('class-switcher').value;
            if(!val) {
                alert('請先選擇班級與子班別！');
                return;
            }
            alert('✅ 團班教學日誌已儲存更新完畢！');
        }

        // ==================== 個指學習報告儲存邏輯 ====================
        async function saveIndividualLog() {
            if (!currentStudentId) {
                alert("請先在最上方的「選擇學生」下拉選單中指定學生！");
                return;
            }

            const date = document.getElementById('ind-date').value;
            const teacher = document.getElementById('ind-teacher').value;
            const content = document.getElementById('ind-content').value;
            const comment = document.getElementById('ind-comment').value;
            const homework = document.getElementById('ind-homework').value;
            const nextDate = document.getElementById('ind-next-date').value;
            
            const isNoQuiz = document.getElementById('ind-no-quiz').checked;
            const quizScore = document.getElementById('ind-quiz').value;

            const payload = {
                student_id: currentStudentId,
                log_date: date,
                teacher: teacher,
                content: content,
                comment: comment,
                homework: homework,
                next_date: nextDate || null,
                is_no_quiz: isNoQuiz,
                quiz_score: isNoQuiz ? null : (quizScore ? parseInt(quizScore) : null)
            };

            try {
                const { error } = await sb.from('individual_logs').insert([payload]);
                
                if (error) {
                    if(error.code === '42P01') {
                        alert('儲存失敗！⚠️ 請記得先到 Supabase 新增名為 `individual_logs` 的表格喔！');
                    } else {
                        throw error;
                    }
                } else {
                    alert(`✅ 成功！${currentStudentName} 的學習報告已儲存。`);
                }
            } catch (err) {
                console.error("儲存個指報告失敗:", err);
                alert("儲存失敗，請確認資料庫權限設定是否已開啟 (Enable insert for anon)。");
            }
        }

        // ==================== LINE 官方帳號推播邏輯 ====================
        async function sendLineMessage(mode) {
            if (!currentStudentId) {
                alert("發送前，請先在最上方的「選擇學生」下拉選單中指定要發送的學生！");
                return;
            }

            if (!currentParentLineId) {
                alert(`⚠️ ${currentStudentName} 尚未綁定家長的 LINE 帳號，無法發送！`);
                return;
            }

            let msgContent = "";

            if (mode === 'group') {
                const dateVal = document.getElementById('log-date').value;
                const switcher = document.getElementById('class-switcher');
                if (!switcher.value) { alert("請先選擇班級！"); return; }
                const className = switcher.options[switcher.selectedIndex]?.text || '';
                
                const progress = document.getElementById('field-progress').value;
                const handouts = document.getElementById('field-handouts').value;
                const homework = document.getElementById('field-homework').value;
                const nextExam = document.getElementById('field-next-exam').value;
                const avgScore = document.getElementById('field-avg-score').value;

                msgContent = `家長您好\n以下為 ${dateVal} ${className} 的課堂狀況\n【學生：${currentStudentName}】\n`;
                if(progress) msgContent += `📖 上課範圍：\n${progress}\n`;
                if(handouts) msgContent += `📝 發放資料：\n${handouts}\n`;
                if(homework) msgContent += `🏠 回家作業：\n${homework}\n`;
                if(nextExam) msgContent += `💯 下週考試：\n${nextExam}\n`;
                if(avgScore) msgContent += `📊 班級平均：${avgScore}分\n`;
                msgContent += `\n考卷內容已於課堂上檢討完畢。`;

            } else if (mode === 'indiv') {
                const stuName = document.getElementById('ind-name').value;
                const date = document.getElementById('ind-date').value;
                const teacher = document.getElementById('ind-teacher').value;
                const content = document.getElementById('ind-content').value;
                const comment = document.getElementById('ind-comment').value;
                const homework = document.getElementById('ind-homework').value;
                const nextDate = document.getElementById('ind-next-date').value;
                
                const isNoQuiz = document.getElementById('ind-no-quiz').checked;
                const quizScore = document.getElementById('ind-quiz').value;
                const finalQuizText = isNoQuiz ? '無小考' : (quizScore ? `${quizScore} 分` : '未登錄');

                msgContent = `家長您好\n以下為 ${stuName} 的【個別指導學習報告】\n\n`;
                msgContent += `📅 上課日期：${date}\n`;
                if(teacher) msgContent += `👨‍🏫 授課講師：${teacher}\n`;
                if(content) msgContent += `📖 課程內容：\n${content}\n\n`;
                msgContent += `💯 小考成績：${finalQuizText}\n`;
                if(comment) msgContent += `💬 講師講評：\n${comment}\n\n`;
                if(homework) msgContent += `🏠 作業內容：\n${homework}\n\n`;
                if(nextDate) msgContent += `🔜 下次上課日期：${nextDate}`;
            }

            const confirmSend = confirm(`即將發送 LINE 通知給 ${currentStudentName} 的家長，確定嗎？`);
            if (!confirmSend) return;

            try {
                const { data, error } = await sb.functions.invoke('send-line-notify', {
                    body: { userId: currentParentLineId, message: msgContent }
                });
                if (error) throw error;
                alert(`✅ 成功！已透過官方 LINE 傳送紀錄給 ${currentStudentName} 的家長。`);
            } catch (err) {
                console.error("發送 LINE 訊息失敗:", err);
                alert("發送失敗，請確認您的 Edge Function 狀態或網路連線。");
            }
        }
    </script>
</body>
</html>
