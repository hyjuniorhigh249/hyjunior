<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級與班別管理 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black text-slate-800">班級組織與成員管理</h1>
            <button onclick="openClassModal()" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-black hover:bg-slate-700">＋ 建立新班級</button>
        </header>
        <div id="classes-container" class="space-y-6"></div>
    </div>

    <div id="student-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[24px] p-6 w-full max-w-sm shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-lg font-black mb-4">加入學生至班級</h3>
            <div class="space-y-2 mb-4">
                <input type="text" id="stu-search" oninput="filterStudents()" placeholder="搜尋姓名..." class="w-full p-2 border rounded-lg text-sm font-bold">
                <select id="stu-grade-filter" onchange="filterStudents()" class="w-full p-2 border rounded-lg text-sm font-bold">
                    <option value="">所有年級</option>
                    <script>
                        const grades = ["小一", "小二", "小三", "小四", "小五", "小六", "七年級", "八年級", "九年級", "高一", "高二", "高三"];
                        grades.forEach((g, i) => document.write(`<option value="${i+1}">${g}</option>`));
                    </script>
                </select>
            </div>
            <input type="hidden" id="stu-parent-id">
            <div id="student-list-container" class="flex-1 overflow-y-auto space-y-1"></div>
            <button onclick="closeModal('student-modal')" class="w-full py-2 mt-4 bg-slate-100 rounded-xl font-bold">關閉</button>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
        let allClassData = [], allStudents = [];

        async function init() {
            const { data: classes } = await supabaseClient.from('classes').select('*').order('created_at', { ascending: false });
            const { data: students } = await supabaseClient.from('students').select('name, grade_base_year, initial_grade');
            allClassData = classes || [];
            allStudents = students || [];
            render();
        }

        // 精準邏輯：6月(含)前視為上一學年，7月後視為新學年
        function getStudentGrade(s) {
            if (!s.grade_base_year) return 0;
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;
            const effectiveYear = (currentMonth < 7) ? currentYear - 1 : currentYear;
            const initialGrade = s.initial_grade || 1;
            return (effectiveYear - s.grade_base_year) + initialGrade;
        }

        function render() {
            const container = document.getElementById('classes-container');
            container.innerHTML = allClassData.map(cls => `
                <div class="bg-white p-6 rounded-2xl border shadow-sm">
                    <h4 class="font-black text-lg mb-4">${cls.name}</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${(cls.sub_classes || []).map(sub => `
                            <div class="bg-slate-50 p-4 rounded-xl border">
                                <p class="font-black text-sm mb-2">${sub.name}</p>
                                <button onclick="openStudentModal('${cls.id}')" class="text-[9px] bg-blue-600 text-white px-2 py-1 rounded font-black">＋ 加入</button>
                                <div class="flex flex-wrap gap-1 mt-2">
                                    ${(cls.members || []).map(m => `<span class="bg-white px-2 py-0.5 rounded border text-[10px] font-bold">${m}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function filterStudents() {
            const keyword = document.getElementById('stu-search').value.toLowerCase();
            const filterGrade = document.getElementById('stu-grade-filter').value;
            const container = document.getElementById('student-list-container');
            
            const filtered = allStudents.filter(s => {
                const grade = getStudentGrade(s);
                const matchName = s.name.toLowerCase().includes(keyword);
                const matchGrade = filterGrade === "" || String(grade) === filterGrade;
                return matchName && matchGrade;
            });

            container.innerHTML = filtered.map(s => {
                const grade = getStudentGrade(s);
                return `
                <div class="flex justify-between items-center p-2 hover:bg-slate-50 cursor-pointer border-b" onclick="addStudent('${document.getElementById('stu-parent-id').value}', '${s.name}')">
                    <span class="font-bold text-sm">${s.name} <span class="text-[9px] text-slate-400">(${grade}年級)</span></span>
                    <span class="text-[10px] text-blue-500 font-bold">加入</span>
                </div>`;
            }).join('');
        }

        async function openStudentModal(clsId) {
            document.getElementById('stu-parent-id').value = clsId;
            filterStudents();
            document.getElementById('student-modal').classList.add('active');
        }

        async function addStudent(clsId, stuName) {
            const cls = allClassData.find(c => c.id === clsId);
            if((cls.members || []).includes(stuName)) return alert("學生已存在");
            await supabaseClient.from('classes').update({ members: [...(cls.members || []), stuName] }).eq('id', clsId);
            alert("加入成功"); init();
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function openClassModal() { /* 父班級 Modal 邏輯 */ }
        window.onload = init;
    </script>
</body>
</html>
