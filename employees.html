<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昊學文教 - 員工管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 隱藏捲軸但保留捲動功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-blue-800 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">昊學文教行政系統 - 員工管理</h1>
        <button onclick="openModal()" class="bg-white text-blue-800 px-4 py-2 rounded-md font-bold hover:bg-gray-100 transition">
            + 新增員工
        </button>
    </nav>

    <div class="p-6 max-w-7xl mx-auto">
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-blue-100 text-blue-800 border-b-2 border-blue-200">
                        <th class="p-4 font-semibold">姓名 (藝名)</th>
                        <th class="p-4 font-semibold">手機</th>
                        <th class="p-4 font-semibold">可授課科目</th>
                        <th class="p-4 font-semibold">可授課年級</th>
                        <th class="p-4 font-semibold">檔案資料</th>
                        <th class="p-4 font-semibold text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="employeeList" class="divide-y divide-gray-200">
                    <tr><td colspan="6" class="p-8 text-center text-gray-500">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="employeeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-center items-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-800">新增員工</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto no-scrollbar flex-1">
                <form id="employeeForm" onsubmit="saveEmployee(event)" class="space-y-6">
                    <input type="hidden" id="employeeId">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">姓名 (必填)</label>
                            <input type="text" id="name" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">藝名 (必填 - 系統連動用)</label>
                            <input type="text" id="stage_name" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">手機 (必填)</label>
                            <input type="text" id="phone" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">可授課科目 (必填，如：國文、英文)</label>
                            <input type="text" id="teachable_subjects" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">可授課年級 (必填，如：國一、高二)</label>
                            <input type="text" id="teachable_grades" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <hr class="my-4 border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800">上傳資料 (選填，可後續補交)</h3>
                    <p class="text-sm text-gray-500 mb-4">支援格式：圖片(JPG/PNG) 或 PDF。若重新上傳將會覆蓋舊檔。</p>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="border p-3 rounded-md bg-gray-50">
                            <label class="block text-sm font-medium text-gray-700 mb-1">最高學歷證明</label>
                            <input type="file" id="file_education" accept="image/*,.pdf" class="w-full text-sm">
                            <div id="link_education" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-3 rounded-md bg-gray-50">
                            <label class="block text-sm font-medium text-gray-700 mb-1">良民證</label>
                            <input type="file" id="file_police" accept="image/*,.pdf" class="w-full text-sm">
                            <div id="link_police" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-3 rounded-md bg-gray-50">
                            <label class="block text-sm font-medium text-gray-700 mb-1">講師合約</label>
                            <input type="file" id="file_contract" accept="image/*,.pdf" class="w-full text-sm">
                            <div id="link_contract" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-3 rounded-md bg-gray-50">
                            <label class="block text-sm font-medium text-gray-700 mb-1">存摺封面</label>
                            <input type="file" id="file_bank" accept="image/*,.pdf" class="w-full text-sm">
                            <div id="link_bank" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-3 rounded-md bg-gray-50">
                            <label class="block text-sm font-medium text-gray-700 mb-1">身份證正反面</label>
                            <input type="file" id="file_idcard" accept="image/*,.pdf" class="w-full text-sm">
                            <div id="link_idcard" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-3 rounded-md bg-gray-50">
                            <label class="block text-sm font-medium text-gray-700 mb-1">履歷表</label>
                            <input type="file" id="file_resume" accept="image/*,.pdf" class="w-full text-sm">
                            <div id="link_resume" class="mt-1 text-xs hidden"></div>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="p-4 border-t bg-gray-50 rounded-b-xl flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-5 py-2 bg-gray-300 text-gray-700 rounded-md font-bold hover:bg-gray-400 transition">取消</button>
                <button type="submit" form="employeeForm" id="saveBtn" class="px-5 py-2 bg-blue-600 text-white rounded-md font-bold hover:bg-blue-700 transition">
                    儲存資料
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 初始化 Supabase
        // ==========================================
        const SUPABASE_URL = 'https://hlelxeiwamvrntsxnram.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 全域變數：暫存員工資料
        let globalEmployees = [];

        // ==========================================
        // 2. 核心功能：讀取員工列表
        // ==========================================
        async function fetchEmployees() {
            const listContainer = document.getElementById('employeeList');
            if (!listContainer) return;
            listContainer.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500">載入中...</td></tr>';
            
            try {
                const { data, error } = await supabase
                    .from('employees')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error("讀取失敗", error);
                    listContainer.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-red-500 font-bold">讀取失敗！請確認是否已在 Supabase 建立 employees 資料表。</td></tr>';
                    return;
                }

                listContainer.innerHTML = '';
                globalEmployees = data; // 存入全域變數
                
                if (!data || data.length === 0) {
                    listContainer.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500">目前沒有員工資料</td></tr>';
                    return;
                }

                data.forEach(emp => {
                    // 產生檔案狀態小標籤
                    let docsHtml = '';
                    if(emp.education_cert_url) docsHtml += `<a href="${emp.education_cert_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1 hover:bg-green-200">學歷</a>`;
                    if(emp.police_check_url) docsHtml += `<a href="${emp.police_check_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1 hover:bg-green-200">良民證</a>`;
                    if(emp.contract_url) docsHtml += `<a href="${emp.contract_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1 hover:bg-green-200">合約</a>`;
                    if(emp.bank_passbook_url) docsHtml += `<a href="${emp.bank_passbook_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1 hover:bg-green-200">存摺</a>`;
                    if(emp.id_card_url) docsHtml += `<a href="${emp.id_card_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1 hover:bg-green-200">身分證</a>`;
                    if(emp.resume_url) docsHtml += `<a href="${emp.resume_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1 hover:bg-green-200">履歷</a>`;
                    if(!docsHtml) docsHtml = '<span class="text-gray-400 text-sm">無檔案</span>';

                    const row = `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-4 border-b">
                                <div class="font-bold text-gray-900">${emp.name}</div>
                                <div class="text-sm text-blue-600">${emp.stage_name}</div>
                            </td>
                            <td class="p-4 border-b text-gray-700">${emp.phone}</td>
                            <td class="p-4 border-b text-gray-700">${emp.teachable_subjects}</td>
                            <td class="p-4 border-b text-gray-700">${emp.teachable_grades}</td>
                            <td class="p-4 border-b">${docsHtml}</td>
                            <td class="p-4 border-b text-center space-x-2">
                                <button onclick="editEmployee('${emp.id}')" class="bg-yellow-500 text-white px-3 py-1 rounded text-sm hover:bg-yellow-600">編輯</button>
                                <button onclick="deleteEmployee('${emp.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">刪除</button>
                            </td>
                        </tr>
                    `;
                    listContainer.innerHTML += row;
                });
            } catch (err) {
                console.error("執行讀取時發生錯誤", err);
            }
        }

        // ==========================================
        // 3. UI 控制：開啟/關閉 彈出視窗
        // ==========================================
        function openModal() {
            document.getElementById('employeeForm').reset();
            document.getElementById('employeeId').value = '';
            document.getElementById('modalTitle').innerText = '新增員工';
            
            // 清空檔案上傳的既有連結提示
            const linkDivs = ['link_education', 'link_police', 'link_contract', 'link_bank', 'link_idcard', 'link_resume'];
            linkDivs.forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).innerHTML = '';
            });

            document.getElementById('employeeModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('employeeModal').classList.add('hidden');
        }

        function editEmployee(id) {
            const emp = globalEmployees.find(e => e.id === id);
            if (!emp) return;

            openModal();
            document.getElementById('modalTitle').innerText = '編輯員工';
            document.getElementById('employeeId').value = emp.id;
            document.getElementById('name').value = emp.name;
            document.getElementById('stage_name').value = emp.stage_name;
            document.getElementById('phone').value = emp.phone;
            document.getElementById('teachable_subjects').value = emp.teachable_subjects;
            document.getElementById('teachable_grades').value = emp.teachable_grades;

            // 顯示既有檔案的連結
            const fileMaps = [
                { dbCol: 'education_cert_url', linkId: 'link_education', label: '已上傳學歷' },
                { dbCol: 'police_check_url', linkId: 'link_police', label: '已上傳良民證' },
                { dbCol: 'contract_url', linkId: 'link_contract', label: '已上傳合約' },
                { dbCol: 'bank_passbook_url', linkId: 'link_bank', label: '已上傳存摺' },
                { dbCol: 'id_card_url', linkId: 'link_idcard', label: '已上傳身分證' },
                { dbCol: 'resume_url', linkId: 'link_resume', label: '已上傳履歷' }
            ];

            fileMaps.forEach(file => {
                if (emp[file.dbCol]) {
                    const linkDiv = document.getElementById(file.linkId);
                    linkDiv.innerHTML = `<a href="${emp[file.dbCol]}" target="_blank" class="text-blue-500 hover:underline">✓ 檢視${file.label}</a> (若選擇新檔將覆蓋)`;
                    linkDiv.classList.remove('hidden');
                }
            });
        }

        // ==========================================
        // 4. 檔案上傳專用函數 (上傳至 Supabase Storage)
        // ==========================================
        async function uploadFile(fileInputId, employeeId, filePrefix) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput.files || fileInput.files.length === 0) return null;

            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const filePath = `${employeeId}_${filePrefix}_${Date.now()}.${fileExt}`;

            const { data, error } = await supabase.storage
                .from('employee_documents')
                .upload(filePath, file, { upsert: true });

            if (error) {
                console.error(`${filePrefix} 上傳失敗`, error);
                alert(`檔案 ${filePrefix} 上傳失敗: ` + error.message);
                return null;
            }

            const { data: publicUrlData } = supabase.storage
                .from('employee_documents')
                .getPublicUrl(filePath);

            return publicUrlData.publicUrl;
        }

        // ==========================================
        // 5. 核心功能：儲存員工資料與檔案
        // ==========================================
        async function saveEmployee(event) {
            event.preventDefault();
            
            const btn = document.getElementById('saveBtn');
            btn.innerText = '儲存中...(若有檔案上傳請稍候)';
            btn.disabled = true;

            const empId = document.getElementById('employeeId').value;
            const isEditing = empId !== '';

            const basicData = {
                name: document.getElementById('name').value,
                stage_name: document.getElementById('stage_name').value,
                phone: document.getElementById('phone').value,
                teachable_subjects: document.getElementById('teachable_subjects').value,
                teachable_grades: document.getElementById('teachable_grades').value
            };

            try {
                let currentEmpId = empId;

                if (!isEditing) {
                    const { data, error } = await supabase
                        .from('employees')
                        .insert([basicData])
                        .select();
                    
                    if (error) throw error;
                    currentEmpId = data[0].id;
                } else {
                    const { error } = await supabase
                        .from('employees')
                        .update(basicData)
                        .eq('id', currentEmpId);
                    if (error) throw error;
                }

                const updatesWithFiles = {};
                
                const eduUrl = await uploadFile('file_education', currentEmpId, 'education');
                if (eduUrl) updatesWithFiles.education_cert_url = eduUrl;

                const policeUrl = await uploadFile('file_police', currentEmpId, 'police');
                if (policeUrl) updatesWithFiles.police_check_url = policeUrl;

                const contractUrl = await uploadFile('file_contract', currentEmpId, 'contract');
                if (contractUrl) updatesWithFiles.contract_url = contractUrl;

                const bankUrl = await uploadFile('file_bank', currentEmpId, 'bank');
                if (bankUrl) updatesWithFiles.bank_passbook_url = bankUrl;

                const idcardUrl = await uploadFile('file_idcard', currentEmpId, 'idcard');
                if (idcardUrl) updatesWithFiles.id_card_url = idcardUrl;

                const resumeUrl = await uploadFile('file_resume', currentEmpId, 'resume');
                if (resumeUrl) updatesWithFiles.resume_url = resumeUrl;

                if (Object.keys(updatesWithFiles).length > 0) {
                    const { error: fileUpdateError } = await supabase
                        .from('employees')
                        .update(updatesWithFiles)
                        .eq('id', currentEmpId);
                    
                    if (fileUpdateError) throw fileUpdateError;
                }

                alert(isEditing ? "更新成功！" : "新增成功！");
                closeModal();
                fetchEmployees();

            } catch (error) {
                console.error("儲存失敗", error);
                alert("儲存失敗：" + error.message);
            } finally {
                btn.innerText = '儲存資料';
                btn.disabled = false;
            }
        }

        // ==========================================
        // 6. 核心功能：刪除員工
        // ==========================================
        async function deleteEmployee(id) {
            if (!confirm("確定要刪除這位員工嗎？(注意：不會刪除已上傳的檔案紀錄)")) return;
            
            const { error } = await supabase
                .from('employees')
                .delete()
                .eq('id', id);

            if (error) {
                console.error("刪除失敗", error);
                alert("刪除失敗");
            } else {
                fetchEmployees();
            }
        }

        window.onload = fetchEmployees;
    </script>
</body>
</html>
