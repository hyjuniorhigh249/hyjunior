<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Inter", "Microsoft JhengHei", sans-serif; background: #f1f5f9; overflow: hidden; }
        .main-grid { display: grid; grid-template-columns: 280px 1fr 320px; height: 100vh; gap: 1px; background: #cbd5e1; }
        .pane { background: white; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 教室視覺區塊 - 確保橫向展開 */
        .canvas-area { background-color: #94a3b8; overflow: auto; display: flex; flex-direction: column; align-items: center; }
        .grid-container { 
            background: #f8fafc; border: 2px solid #475569; border-radius: 20px; 
            padding: 40px; margin: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: grid; /* 使用 Grid 佈局 */
            gap: 12px;
            width: fit-content; /* 關鍵：根據內容寬度自動撐開，不縮成一列 */
        }
        
        .slot {
            width: 85px; height: 85px; border-radius: 12px; font-weight: 800; font-size: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; border: 1px solid #e2e8f0; transition: all 0.1s; background: white;
        }
        .slot.is-hallway { background: #cbd5e1 !important; border: none !important; cursor: default; }
        .slot.is-hallway::after { content: "走廊"; color: #64748b; font-size: 10px; font-weight: 900; }
        .status-present { background: #10b981 !important; color: white !important; border-color: #059669; }
        
        /* 左側學生清單緊湊化 */
        .stu-item { transition: background 0.1s; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .stu-item:hover { background: #f8fafc; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: #f8fafc; }
        .stu-item.active .accordion-content { max-height: 100px; padding: 6px 16px 10px 16px; border-top: 1px solid #edf2f7; }

        .blackboard { 
            background: #1e293b; color: #f8fafc; border-radius: 6px; 
            width: 400px; padding: 10px 0; text-align: center;
            font-weight: 900; letter-spacing: 2em; text-indent: 2em;
            margin-top: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="main-grid">
    <!-- 左欄：全日名單 -->
    <div class="pane">
        <div class="p-5 border-b bg-white">
            <h2 class="font-black text-slate-800 text-lg mb-4">今日全天名單</h2>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-emerald-50 p-2 rounded-xl border border-emerald-100 text-center">
                    <span id="stat-all-present" class="block font-black text-xl text-emerald-600">0</span>
                    <span class="text-[10px] font-bold text-emerald-700">已到</span>
                </div>
                <div class="bg-slate-50 p-2 rounded-xl border border-slate-200 text-center">
                    <span id="stat-all-pending" class="block font-black text-xl text-slate-400">0</span>
                    <span class="text-[10px] font-bold text-slate-500">待點</span>
                </div>
            </div>
        </div>
        <div id="all-student-list" class="flex-1 overflow-y-auto"></div>
    </div>

    <!-- 中欄：點名教室 -->
    <div class="pane canvas-area">
        <div class="w-full bg-white/95 backdrop-blur sticky top-0 z-20 px-4 py-3 border-b flex justify-between items-center">
            <div class="relative w-80">
                <input type="text" id="global-search" placeholder="全域點名 (輸入姓名)..." 
                       class="w-full pl-10 pr-4 py-2 bg-slate-100 rounded-full font-bold text-sm outline-none focus:ring-2 ring-emerald-500">
                <span class="absolute left-3.5 top-2">🔍</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[11px] font-black text-slate-400">切換教室：</span>
                <select id="class-switcher" onchange="switchClass(this.value)" class="bg-slate-800 text-white font-black text-xs px-4 py-2 rounded-lg shadow-lg outline-none cursor-pointer"></select>
            </div>
        </div>

        <div class="blackboard text-xs">黑板方向</div>

        <div id="seat-grid" class="grid-container">
            <!-- 座位會在此依欄數橫向排列 -->
        </div>
    </div>

    <!-- 右欄：聯絡簿 (純中文) -->
    <div class="pane border-l">
        <div class="p-4 bg-slate-800 text-white font-black text-sm tracking-widest flex justify-between items-center">
            <span>📝 教學日誌</span>
            <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded">自動儲存中</span>
        </div>
        <div class="p-5 space-y-5 overflow-y-auto flex-1">
            <div>
                <label class="text-[11px] font-black text-slate-400 mb-1.5 block">上課進度</label>
                <textarea data-field="progress" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-bold outline-none focus:border-emerald-500" placeholder="請輸入今日授課內容..."></textarea>
            </div>
            <div>
                <label class="text-[11px] font-black text-slate-400 mb-1.5 block">發放講義</label>
                <input type="text" data-field="handouts" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-bold outline-none" placeholder="例如：單元三講義">
            </div>
            <div>
                <label class="text-[11px] font-black text-slate-400 mb-1.5 block">回家作業</label>
                <textarea data-field="homework" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-bold outline-none" placeholder="請輸入作業範圍..."></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[11px] font-black text-slate-400 mb-1.5 block">本週考試</label>
                    <input type="text" data-field="this_week_exam" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs font-bold outline-none">
                </div>
                <div>
                    <label class="text-[11px] font-black text-slate-400 mb-1.5 block">下週考試</label>
                    <input type="text" data-field="next_exam" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs font-bold outline-none">
                </div>
            </div>
            <div class="pt-4 border-t border-slate-100">
                <label class="text-[11px] font-black text-slate-500 mb-2.5 block text-center">本次測驗平均成績</label>
                <div class="relative">
                    <input type="number" data-field="avg_score" class="w-full bg-emerald-50 border-2 border-emerald-100 rounded-2xl p-4 text-3xl font-black text-emerald-700 outline-none text-center">
                    <span class="absolute right-6 top-6 text-emerald-300 font-bold">分</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Supabase 配置
    const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let db = { allClasses: [], activeClassId: null, attendance: {}, studentDetails: {} };

    async function init() {
        const todayDay = new Date().getDay();
        const todayStr = new Date().toISOString().split('T')[0];

        // 讀取班級
        const { data: todayClasses } = await supabaseClient.from('classes').select('*, rooms(*)').eq('schedule_day', todayDay);
        if (!todayClasses || todayClasses.length === 0) return;
        db.allClasses = todayClasses;

        // 讀取學生與點名狀態
        const allMemberNames = [...new Set(todayClasses.flatMap(c => c.members || []))];
        const [stRes, logRes] = await Promise.all([
            supabaseClient.from('students').select('*').in('name', allMemberNames),
            supabaseClient.from('attendance_logs').select('*').in('class_id', todayClasses.map(c => c.id)).eq('date', todayStr)
        ]);

        stRes.data?.forEach(s => db.studentDetails[s.name] = s);
        allMemberNames.forEach(name => {
            const isPresent = logRes.data?.some(l => l.student_name === name && l.status === 'present');
            db.attendance[name] = isPresent ? 'present' : 'pending';
        });

        // 初始化班級切換器
        const switcher = document.getElementById('class-switcher');
        todayClasses.forEach(c => switcher.add(new Option(c.name, c.id)));
        
        // 全域快速點名
        document.getElementById('global-search').addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                const name = e.target.value.trim();
                if (db.attendance[name]) updateAttendance(name, 'present');
                e.target.value = '';
            }
        });

        // 自動儲存聯絡簿
        document.querySelectorAll('[data-field]').forEach(el => {
            el.addEventListener('change', e => saveClassLog(e.target.dataset.field, e.target.value));
        });

        switchClass(todayClasses[0].id);
    }

    async function switchClass(id) {
        db.activeClassId = id;
        const cls = db.allClasses.find(c => c.id === id);
        const today = new Date().toISOString().split('T')[0];

        const { data: diary } = await supabaseClient.from('class_logs').select('*').eq('class_id', id).eq('log_date', today).maybeSingle();
        document.querySelectorAll('[data-field]').forEach(el => el.value = diary ? (diary[el.dataset.field] || '') : '');

        renderSeats(cls);
        renderFullList();
        updateStats();
    }

    async function renderSeats(cls) {
        const container = document.getElementById('seat-grid');
        const { data: seats } = await supabaseClient.from('class_seats').select('*').eq('class_id', cls.id);
        const room = cls.rooms;
        
        // 修正：明確設定 Grid 欄數，確保橫向展開
        container.style.gridTemplateColumns = `repeat(${room.grid_size.cols}, 85px)`;
        container.innerHTML = "";

        const seatMap = Object.fromEntries(seats?.map(s => [`${s.row_index}-${s.col_index}`, s]) || []);
        const layout = room.layout_config || {};

        for (let r = 0; r < room.grid_size.rows; r++) {
            for (let c = 0; c < room.grid_size.cols; c++) {
                const key = `${r}-${c}`;
                const div = document.createElement('div');
                const seat = seatMap[key];

                if (layout[key] === 'hallway') {
                    div.className = "slot is-hallway";
                } else if (seat && seat.student_name) {
                    const name = seat.student_name;
                    const status = db.attendance[name];
                    div.className = `slot status-${status}`;
                    const label = seat.seat_label && seat.seat_label !== "null" ? seat.seat_label : "";
                    div.innerHTML = `<span class="text-[9px] opacity-40 mb-1 font-black">${label}</span><span class="leading-none">${name}</span>`;
                    div.onclick = () => updateAttendance(name, status === 'present' ? 'pending' : 'present');
                } else {
                    div.className = "slot border-dashed opacity-10 bg-slate-50";
                }
                container.appendChild(div);
            }
        }
    }

    function renderFullList() {
        const list = document.getElementById('all-student-list');
        list.innerHTML = "";

        const sorted = Object.keys(db.attendance).sort((a,b) => {
            if (db.attendance[a] === 'pending' && db.attendance[b] !== 'pending') return -1;
            if (db.attendance[a] !== 'pending' && db.attendance[b] === 'pending') return 1;
            return a.localeCompare(b, 'zh-Hant');
        });

        sorted.forEach(name => {
            const info = db.studentDetails[name] || {};
            const status = db.attendance[name];
            const div = document.createElement('div');
            div.className = `stu-item ${status === 'present' ? 'opacity-50' : ''}`;
            div.innerHTML = `
                <div class="flex justify-between items-center py-2.5 px-4 font-bold text-sm">
                    <span class="text-slate-700">${name}</span>
                    <span class="text-[9px] font-black px-2 py-0.5 rounded-full ${status === 'present' ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'}">
                        ${status === 'present' ? '已到' : '待點'}
                    </span>
                </div>
                <div class="accordion-content text-[11px] font-bold text-slate-500 space-y-1">
                    <div>父：${info.tel_p || '--'}</div>
                    <div>母：${info.tel_m || '--'}</div>
                    <div>本：${info.tel_o || '--'}</div>
                </div>
            `;
            div.onclick = () => div.classList.toggle('active');
            list.appendChild(div);
        });
    }

    async function updateAttendance(name, status) {
        db.attendance[name] = status;
        const today = new Date().toISOString().split('T')[0];
        updateStats();
        renderFullList();
        renderSeats(db.allClasses.find(c => c.id === db.activeClassId));

        const targetCids = db.allClasses.filter(c => c.members?.includes(name)).map(c => c.id);
        const tasks = targetCids.map(cid => 
            supabaseClient.from('attendance_logs').upsert({
                class_id: cid, student_name: name, date: today, status
            }, { onConflict: 'class_id, student_name, date' })
        );
        await Promise.all(tasks);
    }

    async function saveClassLog(field, value) {
        const today = new Date().toISOString().split('T')[0];
        await supabaseClient.from('class_logs').upsert({ class_id: db.activeClassId, log_date: today, [field]: value }, { onConflict: 'class_id, log_date' });
    }

    function updateStats() {
        const vals = Object.values(db.attendance);
        document.getElementById('stat-all-present').innerText = vals.filter(v => v === 'present').length;
        document.getElementById('stat-all-pending').innerText = vals.filter(v => v === 'pending').length;
    }

    window.onload = init;
</script>
</body>
</html>
