<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>班級組織與成員管理 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black text-slate-800">班級組織與成員管理</h1>
            <button onclick="openClassModal()" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-black shadow-md hover:bg-slate-700 transition">＋ 建立新主班級</button>
        </header>
        <div id="classes-container" class="space-y-6"></div>
    </div>

    <!-- 1. 新增/編輯主班級 Modal -->
    <div id="class-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 id="class-modal-title" class="text-lg font-black mb-4">設定主班級</h3>
            <input type="hidden" id="cls-id">
            
            <label class="block text-xs font-bold text-slate-400 mb-1">主班級名稱*</label>
            <input type="text" id="cls-name" class="w-full p-2 border rounded-lg mb-3 font-bold">
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">開課日期</label>
                    <input type="date" id="cls-start" class="w-full p-2 border rounded-lg font-bold text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">結業日期</label>
                    <input type="date" id="cls-end" class="w-full p-2 border rounded-lg font-bold text-sm">
                </div>
            </div>
            
            <label class="block text-xs font-bold text-slate-400 mb-1">預設學費 (元)*</label>
            <input type="number" id="cls-fee" class="w-full p-2 border rounded-lg mb-3 font-bold text-emerald-600" value="0">
            
            <label class="block text-xs font-bold text-slate-400 mb-1">備註</label>
            <input type="text" id="cls-note" class="w-full p-2 border rounded-lg mb-6 font-bold">
            
            <div class="flex gap-2">
                <button onclick="closeModal('class-modal')" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold hover:bg-slate-200">取消</button>
                <button onclick="saveClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700">儲存</button>
            </div>
        </div>
    </div>

    <!-- 2. 新增/編輯子班別 Modal -->
    <div id="sub-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 id="sub-modal-title" class="text-lg font-black mb-4">設定子班別</h3>
            <input type="hidden" id="sub-clsId">
            <input type="hidden" id="sub-idx">
            
            <label class="block text-xs font-bold text-slate-400 mb-1">子班別名稱*</label>
            <input type="text" id="sub-name" class="w-full p-2 border rounded-lg mb-3 font-bold">
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-slate-400 mb-1">每週上課日*</label>
                    <select id="sub-day" class="w-full p-2 border rounded-lg font-bold text-sm">
                        <option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option>
                        <option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="0">星期日</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">開始時間</label>
                    <input type="time" id="sub-start" class="w-full p-2 border rounded-lg font-bold text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">結束時間</label>
                    <input type="time" id="sub-end" class="w-full p-2 border rounded-lg font-bold text-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">授課老師</label>
                    <input type="text" id="sub-teacher" class="w-full p-2 border rounded-lg font-bold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">班別學費 (元)*</label>
                    <input type="number" id="sub-fee" class="w-full p-2 border rounded-lg font-bold text-emerald-600">
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="closeModal('sub-modal')" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold hover:bg-slate-200">取消</button>
                <button onclick="saveSubClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700">儲存</button>
            </div>
        </div>
    </div>

    <!-- 3. 加入學生 Modal -->
    <div id="student-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-lg font-black mb-4">加入學生至子班別</h3>
            <select id="grade-filter" onchange="filterStudents()" class="w-full p-2 border rounded-lg mb-2 font-bold text-sm">
                <option value="">全部年級</option>
                <script>
                    const grades = ['小一','小二','小三','小四','小五','小六','國一','國二','國三','高一','高二','高三'];
                    grades.forEach((g,i) => document.write(`<option value="${i+1}">${g}</option>`));
                </script>
            </select>
            <input type="text" id="stu-search" oninput="filterStudents()" placeholder="搜尋姓名..." class="w-full p-2 border rounded-lg text-sm font-bold mb-4">
            <div id="student-list-container" class="flex-1 overflow-y-auto space-y-1"></div>
            <button onclick="closeModal('student-modal')" class="w-full py-2 mt-4 bg-slate-100 rounded-xl font-bold">完成</button>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
        let allClassData = [], allStudents = [], targetClassId = '', targetSubIdx = 0;
        const dayMap = { '0': '日', '1': '一', '2': '二', '3': '三', '4': '四', '5': '五', '6': '六' };

        async function init() {
            const { data: classes } = await sb.from('classes').select('*').order('created_at', { ascending: false });
            const { data: students } = await sb.from('students').select('*');
            allClassData = classes || [];
            allStudents = students || [];
            render();
        }

        function render() {
            document.getElementById('classes-container').innerHTML = allClassData.map(cls => `
                <div class="bg-white p-6 rounded-2xl border shadow-sm relative">
                    <div class="flex justify-between items-start mb-4 border-b pb-4">
                        <div>
                            <h4 class="font-black text-xl text-slate-800">${cls.name} <span class="text-sm text-emerald-600 bg-emerald-50 px-2 py-1 rounded ml-2">預設學費: $${cls.default_fee || 0}</span></h4>
                            <p class="text-xs text-slate-500 font-bold mt-1">
                                修業期間：${cls.start_date ? cls.start_date.replace(/-/g, '/') : '未設定'} ~ ${cls.end_date ? cls.end_date.replace(/-/g, '/') : '未設定'}
                            </p>
                        </div>
                        <div class="flex flex-col gap-2 items-end">
                            <div class="flex gap-2">
                                <button onclick="openClassModal('${cls.id}')" class="text-[10px] bg-slate-100 text-slate-600 px-3 py-1 rounded font-black">編輯主班級</button>
                                <button onclick="deleteClass('${cls.id}')" class="text-[10px] bg-red-50 text-red-500 px-3 py-1 rounded font-black">刪除</button>
                            </div>
                            <button onclick="openSubModal('${cls.id}')" class="text-xs bg-emerald-500 text-white px-4 py-1.5 rounded-lg font-black shadow-sm">＋ 新增子班別</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${(cls.sub_classes || []).map((sub, idx) => `
                            <div class="bg-slate-50 p-4 rounded-xl border relative">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <p class="font-black text-sm text-slate-800">${sub.name} <span class="text-[10px] text-emerald-600 ml-1">($${sub.fee || 0})</span></p>
                                        <p class="text-[10px] text-slate-500 font-bold mt-0.5">每週${sub.day ? dayMap[sub.day] : '未定'} | ${sub.start || '--:--'} ~ ${sub.end || '--:--'}</p>
                                    </div>
                                    <div class="flex gap-1">
                                        <button onclick="openSubModal('${cls.id}', ${idx})" class="text-[9px] bg-slate-200 text-slate-700 px-2 py-1 rounded font-black">編輯</button>
                                        <button onclick="deleteSub('${cls.id}', ${idx})" class="text-[9px] bg-red-200 text-red-700 px-2 py-1 rounded font-black">刪除</button>
                                        <button onclick="openStudentModal('${cls.id}', ${idx})" class="text-[9px] bg-blue-600 text-white px-2 py-1 rounded font-black">＋ 加入學生</button>
                                    </div>
                                </div>
                                <div class="flex flex-wrap gap-1 mt-2 pt-2 border-t border-slate-200">
                                    ${(sub.members || []).map(m => `
                                        <span class="bg-white px-2 py-0.5 rounded border text-[10px] font-bold flex items-center gap-1 shadow-sm">
                                            ${m} <span onclick="removeStudent('${cls.id}', ${idx}, '${m}')" class="text-red-400 cursor-pointer hover:text-red-600 text-xs">×</span>
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openClassModal(id = null) {
            document.getElementById('cls-id').value = id || '';
            if(id) {
                const cls = allClassData.find(c => c.id === id);
                document.getElementById('class-modal-title').innerText = "編輯主班級";
                document.getElementById('cls-name').value = cls.name || '';
                document.getElementById('cls-start').value = cls.start_date || '';
                document.getElementById('cls-end').value = cls.end_date || '';
                document.getElementById('cls-fee').value = cls.default_fee || 0;
                document.getElementById('cls-note').value = cls.note || '';
            } else {
                document.getElementById('class-modal-title').innerText = "新增主班級";
                document.getElementById('cls-name').value = '';
                document.getElementById('cls-start').value = '';
                document.getElementById('cls-end').value = '';
                document.getElementById('cls-fee').value = 0;
                document.getElementById('cls-note').value = '';
            }
            document.getElementById('class-modal').classList.add('active');
        }

        async function saveClass() {
            const id = document.getElementById('cls-id').value;
            const name = document.getElementById('cls-name').value.trim();
            const default_fee = parseInt(document.getElementById('cls-fee').value) || 0;
            const payload = { name, start_date: document.getElementById('cls-start').value || null, end_date: document.getElementById('cls-end').value || null, note: document.getElementById('cls-note').value.trim(), default_fee };
            
            if(!name) return alert("主班級名稱為必填！");
            if(id) await sb.from('classes').update(payload).eq('id', id);
            else { payload.sub_classes = []; await sb.from('classes').insert([payload]); }
            closeModal('class-modal'); init();
        }

        function openSubModal(clsId, idx = null) {
            const cls = allClassData.find(c => c.id === clsId);
            document.getElementById('sub-clsId').value = clsId;
            document.getElementById('sub-idx').value = idx !== null ? idx : '';
            
            if(idx !== null) {
                const sub = cls.sub_classes[idx];
                document.getElementById('sub-modal-title').innerText = "編輯子班別";
                document.getElementById('sub-name').value = sub.name || '';
                document.getElementById('sub-day').value = sub.day || '1';
                document.getElementById('sub-start').value = sub.start || '';
                document.getElementById('sub-end').value = sub.end || '';
                document.getElementById('sub-teacher').value = sub.teacher || '';
                document.getElementById('sub-fee').value = sub.fee !== undefined ? sub.fee : (cls.default_fee || 0);
            } else {
                document.getElementById('sub-modal-title').innerText = "新增子班別";
                document.getElementById('sub-name').value = '';
                document.getElementById('sub-day').value = '1';
                document.getElementById('sub-start').value = '';
                document.getElementById('sub-end').value = '';
                document.getElementById('sub-teacher').value = '';
                document.getElementById('sub-fee').value = cls.default_fee || 0; // 自動帶入主班級學費
            }
            document.getElementById('sub-modal').classList.add('active');
        }

        async function saveSubClass() {
            const clsId = document.getElementById('sub-clsId').value;
            const idxStr = document.getElementById('sub-idx').value;
            const name = document.getElementById('sub-name').value.trim();
            const fee = parseInt(document.getElementById('sub-fee').value) || 0;
            
            if(!name) return alert("名稱必填！");
            const cls = allClassData.find(c => c.id === clsId);
            let subs = cls.sub_classes ? [...cls.sub_classes] : [];
            const data = { name, fee, day: document.getElementById('sub-day').value, start: document.getElementById('sub-start').value, end: document.getElementById('sub-end').value, teacher: document.getElementById('sub-teacher').value.trim() };
            
            if(idxStr !== '') subs[parseInt(idxStr)] = { ...subs[parseInt(idxStr)], ...data };
            else subs.push({ ...data, members: [], room_id: null });

            await sb.from('classes').update({ sub_classes: subs }).eq('id', clsId);
            closeModal('sub-modal'); init();
        }

        // 學生加入/移除邏輯省略部分同前，確保功能正常
        async function deleteClass(id) { if(confirm("確定刪除？")) { await sb.from('classes').delete().eq('id', id); init(); } }
        async function deleteSub(clsId, idx) { if(confirm("確定刪除？")) { const cls = allClassData.find(c => c.id === clsId); let subs = [...cls.sub_classes]; subs.splice(idx, 1); await sb.from('classes').update({ sub_classes: subs }).eq('id', clsId); init(); } }
        
        function getAcademicYear() { const d = new Date(); return (d.getMonth() + 1) >= 7 ? d.getFullYear() : d.getFullYear() - 1; }
        function calculateDisplayGrade(baseYear) { if (!baseYear) return null; const grade = getAcademicYear() - baseYear + 1; return grade > 12 ? 13 : grade; }
        function openStudentModal(clsId, idx) { targetClassId = clsId; targetSubIdx = idx; document.getElementById('stu-search').value = ''; document.getElementById('grade-filter').value = ''; filterStudents(); document.getElementById('student-modal').classList.add('active'); }
        function filterStudents() {
            const k = document.getElementById('stu-search').value.toLowerCase(), g = document.getElementById('grade-filter').value;
            const cls = allClassData.find(c => c.id === targetClassId), currentMembers = cls.sub_classes[targetSubIdx].members || [];
            const filtered = allStudents.filter(s => s.name.toLowerCase().includes(k) && (g === "" || String(calculateDisplayGrade(s.grade_base_year)) === g));
            document.getElementById('student-list-container').innerHTML = filtered.map(s => {
                const isAdded = currentMembers.includes(s.name);
                return `<div class="p-2 border-b flex justify-between items-center ${isAdded ? 'bg-slate-50 opacity-50' : 'cursor-pointer hover:bg-slate-100'}" onclick="${isAdded ? '' : `addStudent('${s.name}')`}"><span class="font-bold text-sm">${s.name}</span>${isAdded ? '<span class="text-[9px] font-black">已加入</span>' : '<span class="text-[9px] font-black text-blue-500">加入</span>'}</div>`;
            }).join('');
        }
        async function addStudent(name) { const cls = allClassData.find(c => c.id === targetClassId); let subs = [...cls.sub_classes]; subs[targetSubIdx].members = [...(subs[targetSubIdx].members || []), name]; await sb.from('classes').update({ sub_classes: subs }).eq('id', targetClassId); cls.sub_classes = subs; filterStudents(); render(); }
        async function removeStudent(clsId, idx, name) { if(confirm(`移除 ${name}？`)) { const cls = allClassData.find(c => c.id === clsId); let subs = [...cls.sub_classes]; subs[idx].members = subs[idx].members.filter(m => m !== name); await sb.from('classes').update({ sub_classes: subs }).eq('id', clsId); init(); } }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = init;
    </script>
</body>
</html>
