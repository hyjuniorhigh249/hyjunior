<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>班級組織與成員管理 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black text-slate-800">班級組織與成員管理</h1>
            <button onclick="alert('請至資料庫後台建立新班級')" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-black">＋ 建立新班級</button>
        </header>
        <div id="debug-msg" class="text-rose-500 font-bold mb-4"></div>
        <div id="classes-container" class="space-y-6"></div>
    </div>

    <div id="student-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[24px] p-6 w-full max-w-sm shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-lg font-black mb-4">加入學生</h3>
            <input type="text" id="stu-search" oninput="filterStudents()" placeholder="搜尋姓名..." class="w-full p-2 border rounded-lg text-sm font-bold mb-4">
            <div id="student-list-container" class="flex-1 overflow-y-auto space-y-1"></div>
            <button onclick="closeModal('student-modal')" class="w-full py-2 mt-4 bg-slate-100 rounded-xl font-bold">關閉</button>
        </div>
    </div>

    <script>
        // 修改變數名稱為 supabaseClient 以避免與 CDN 衝突
        const supabaseClient = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
        
        let allClassData = [], allStudents = [], targetClassId = '', targetSubIdx = 0;

        async function init() {
            try {
                // 使用 supabaseClient
                const { data: classes, error: cErr } = await supabaseClient.from('classes').select('*');
                const { data: students, error: sErr } = await supabaseClient.from('students').select('*');
                
                if (cErr) throw cErr;
                
                allClassData = classes || [];
                allStudents = students || [];
                
                render();
            } catch (err) {
                console.error("資料載入錯誤:", err);
                document.getElementById('debug-msg').innerText = "資料載入失敗，請確認網路與權限。";
            }
        }

        function render() {
            const container = document.getElementById('classes-container');
            container.innerHTML = allClassData.map(cls => `
                <div class="bg-white p-6 rounded-2xl border shadow-sm">
                    <div class="flex justify-between mb-4">
                        <h4 class="font-black text-lg">${cls.name || '未命名班級'}</h4>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${(cls.sub_classes || []).map((sub, idx) => `
                            <div class="bg-slate-50 p-4 rounded-xl border">
                                <div class="flex justify-between mb-2">
                                    <p class="font-black text-sm">${sub.name || '未命名子班'}</p>
                                    <button onclick="openStudentModal('${cls.id}', ${idx})" class="text-[9px] bg-blue-600 text-white px-2 py-1 rounded font-black">＋ 加入</button>
                                </div>
                                <div class="flex flex-wrap gap-1">${(sub.members || []).map(m => `<span class="bg-white px-2 py-0.5 rounded border text-[10px] font-bold">${m}</span>`).join('')}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openStudentModal(clsId, idx) { 
            targetClassId = clsId; targetSubIdx = idx; 
            document.getElementById('student-modal').classList.add('active'); 
        }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = init;
    </script>
</body>
</html>
