<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點名與成績登記 - 浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; color: #1e293b; }
        .seat-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1rem;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .seat-card.absent { background-color: #fff1f2; border-color: #fecdd3; }
        .score-input {
            width: 100%;
            border-bottom: 2px solid #e2e8f0;
            text-align: center;
            font-weight: 800;
            outline: none;
            transition: border-color 0.2s;
        }
        .score-input:focus { border-color: #3b82f6; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-3xl font-black text-slate-800">點名與紀錄</h1>
                <p id="today-info" class="text-slate-400 font-bold mt-1 text-sm">載入中...</p>
            </div>
            <div class="flex gap-2">
                <button onclick="saveAll()" class="bg-slate-800 text-white px-6 py-2 rounded-xl font-bold hover:bg-slate-700 transition">儲存今日紀錄</button>
            </div>
        </header>

        <div id="class-selector" class="flex gap-2 mb-8 overflow-x-auto pb-2">
            </div>

        <div id="attendance-view" class="hidden">
            <div class="mb-6 flex items-center justify-between bg-blue-50 p-4 rounded-2xl">
                <div>
                    <span id="current-class-name" class="text-blue-700 font-black text-lg">選擇班級</span>
                    <span id="current-class-time" class="ml-3 text-blue-500 text-sm font-bold"></span>
                </div>
                <div class="text-xs font-bold text-blue-400 uppercase tracking-widest">教室位置模擬</div>
            </div>

            <div id="student-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                </div>
        </div>

        <div id="no-class-msg" class="hidden py-20 text-center">
            <p class="text-slate-300 font-bold text-xl">今日目前無排定課程</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let todayClasses = [];
        let selectedClass = null;

        async function init() {
            const now = new Date();
            const day = now.getDay(); 
            const daysCh = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            document.getElementById('today-info').innerText = `${now.getMonth()+1}月${now.getDate()}日 ${daysCh[day]} · 課堂即時記錄`;

            try {
                const { data, error } = await supabaseClient
                    .from('classes')
                    .select('*')
                    .eq('schedule_day', day)
                    .eq('is_archived', false)
                    .order('schedule_start', { ascending: true });

                if (error) throw error;
                todayClasses = data;

                if (todayClasses.length > 0) {
                    renderClassButtons();
                    selectClass(0); // 預設選取第一個班級
                } else {
                    document.getElementById('no-class-msg').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderClassButtons() {
            const container = document.getElementById('class-selector');
            container.innerHTML = todayClasses.map((cls, index) => `
                <button onclick="selectClass(${index})" id="btn-cls-${index}" class="class-btn shrink-0 px-5 py-2 rounded-full border border-slate-200 font-bold text-sm transition-all bg-white text-slate-600 hover:border-slate-800">
                    ${cls.name} (${cls.schedule_start?.slice(0,5)})
                </button>
            `).join('');
        }

        function selectClass(index) {
            selectedClass = todayClasses[index];
            
            // UI 切換
            document.querySelectorAll('.class-btn').forEach(b => b.className = "class-btn shrink-0 px-5 py-2 rounded-full border border-slate-200 font-bold text-sm transition-all bg-white text-slate-600 hover:border-slate-800");
            document.getElementById(`btn-cls-${index}`).className = "class-btn shrink-0 px-5 py-2 rounded-full border border-slate-800 font-bold text-sm transition-all bg-slate-800 text-white shadow-lg";

            document.getElementById('attendance-view').classList.remove('hidden');
            document.getElementById('current-class-name').innerText = selectedClass.name;
            document.getElementById('current-class-time').innerText = `${selectedClass.schedule_start?.slice(0,5)} - ${selectedClass.schedule_end?.slice(0,5)}`;

            renderStudents();
        }

        function renderStudents() {
            const grid = document.getElementById('student-grid');
            if (!selectedClass.members || selectedClass.members.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-10 text-center text-slate-400 font-bold">此班級尚無學生</div>`;
                return;
            }

            grid.innerHTML = selectedClass.members.map(name => `
                <div class="seat-card flex flex-col items-center gap-3" id="seat-${name}">
                    <div class="flex justify-between w-full items-start">
                        <span class="text-[10px] font-black text-slate-300">SEAT</span>
                        <button onclick="toggleAbsent('${name}')" class="text-[10px] font-black px-2 py-0.5 rounded border border-slate-100 hover:bg-slate-50">點名</button>
                    </div>
                    <p class="text-lg font-black text-slate-800">${name}</p>
                    <div class="w-full mt-2">
                        <p class="text-[10px] font-black text-slate-400 uppercase text-center mb-1">今日成績/表現</p>
                        <input type="text" placeholder="--" class="score-input bg-transparent" id="score-${name}">
                    </div>
                </div>
            `).join('');
        }

        function toggleAbsent(name) {
            const card = document.getElementById(`seat-${name}`);
            card.classList.toggle('absent');
            const input = document.getElementById(`score-${name}`);
            if (card.classList.contains('absent')) {
                input.value = "缺席";
                input.disabled = true;
            } else {
                input.value = "";
                input.disabled = false;
            }
        }

        function saveAll() {
            // 這裡可以串接您想要儲存成績或點名的資料表邏輯
            alert(`已暫存「${selectedClass.name}」的紀錄。實際儲存邏輯可根據後端需求擴充點名表。`);
        }

        window.onload = init;
    </script>
</body>
</html>
