<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級與班別管理 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; color: #1e293b; font-size: 13px; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black text-slate-800">班級與子班別管理</h1>
            <button onclick="openClassModal()" class="bg-slate-800 text-white px-5 py-1.5 rounded-lg text-sm font-black hover:bg-slate-700">＋ 建立新班級</button>
        </header>
        <div id="classes-container" class="space-y-6"></div>
    </div>

    <div id="class-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[24px] p-6 w-full max-w-md shadow-2xl">
            <h3 id="modal-title" class="text-lg font-black mb-5">設定班級資訊</h3>
            <input type="hidden" id="m-class-id">
            <div class="space-y-3">
                <input type="text" id="m-class-name" placeholder="班級名稱*" class="w-full p-2.5 border rounded-xl font-bold">
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="m-class-start" class="p-2 border rounded-lg text-xs" placeholder="開課日">
                    <input type="date" id="m-class-end" class="p-2 border rounded-lg text-xs" placeholder="結業日">
                </div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeModal('class-modal')" class="flex-1 py-2 font-bold text-slate-400">取消</button>
                <button onclick="saveClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-black">儲存班級</button>
            </div>
        </div>
    </div>

    <div id="subclass-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[24px] p-6 w-full max-w-sm shadow-2xl">
            <h3 id="sub-modal-title" class="text-lg font-black mb-4">新增子班別</h3>
            <input type="hidden" id="sub-parent-id">
            <input type="hidden" id="sub-edit-index" value="-1">
            <div class="space-y-3">
                <input type="text" id="sub-name" placeholder="班別名稱*" class="w-full p-2 border rounded-lg font-bold">
                <input type="text" id="sub-teacher" placeholder="任課老師*" class="w-full p-2 border rounded-lg font-bold">
                <select id="sub-day" class="w-full p-2 border rounded-lg font-bold">
                    <option value="1">每週一</option><option value="2">每週二</option><option value="3">每週三</option>
                    <option value="4">每週四</option><option value="5">每週五</option><option value="6">每週六</option><option value="0">每週日</option>
                </select>
                <div class="grid grid-cols-2 gap-2">
                    <input type="time" id="sub-start" class="p-2 border rounded-lg">
                    <input type="time" id="sub-end" class="p-2 border rounded-lg">
                </div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeModal('subclass-modal')" class="flex-1 py-2 font-bold text-slate-400">取消</button>
                <button onclick="saveSubClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-black">儲存班別</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allClassData = [];
        const DAYS = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

        async function fetchClasses() {
            const { data } = await supabaseClient.from('classes').select('*').order('created_at', { ascending: false });
            allClassData = data || [];
            document.getElementById('classes-container').innerHTML = allClassData.map(cls => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h4 class="font-black text-lg text-slate-800">${cls.name}</h4>
                            <p class="text-[10px] text-slate-400 font-bold">期間: ${cls.start_date || '未定'} ~ ${cls.end_date || '未定'}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openClassModal('${cls.id}')" class="text-[10px] bg-slate-100 px-3 py-1 rounded font-black text-slate-600">編輯班級</button>
                            <button onclick="deleteClass('${cls.id}')" class="text-[10px] bg-rose-50 px-3 py-1 rounded font-black text-rose-500">刪除</button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        ${(cls.sub_classes || []).map((sub, idx) => `
                            <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <div>
                                    <p class="font-black text-slate-700 text-sm">${sub.name}</p>
                                    <p class="text-[10px] text-slate-400 font-bold">${sub.teacher} | ${DAYS[sub.day]} ${sub.start}-${sub.end}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="openSubClassModal('${cls.id}', ${idx})" class="text-[10px] text-slate-400 font-bold hover:text-slate-800">編輯</button>
                                    <button onclick="deleteSubClass('${cls.id}', ${idx})" class="text-[10px] text-rose-400 font-bold hover:text-rose-600">刪除</button>
                                </div>
                            </div>
                        `).join('')}
                        <button onclick="openSubClassModal('${cls.id}')" class="w-full py-2 mt-2 border-2 border-dashed border-slate-200 rounded-xl text-[10px] font-black text-slate-400 hover:border-slate-300 hover:text-slate-600">＋ 新增子班別</button>
                    </div>
                </div>
            `).join('');
        }

        // --- 邏輯保持：儲存與刪除 ---
        function openClassModal(id = null) {
            const cls = allClassData.find(x => x.id === id);
            document.getElementById('m-class-id').value = id || "";
            document.getElementById('m-class-name').value = cls ? cls.name : "";
            openModal('class-modal');
        }

        function openSubClassModal(parentId, index = -1) {
            document.getElementById('sub-parent-id').value = parentId;
            document.getElementById('sub-edit-index').value = index;
            if (index > -1) {
                const sub = allClassData.find(c => c.id === parentId).sub_classes[index];
                document.getElementById('sub-name').value = sub.name;
                document.getElementById('sub-teacher').value = sub.teacher;
                document.getElementById('sub-day').value = sub.day;
                document.getElementById('sub-start').value = sub.start;
                document.getElementById('sub-end').value = sub.end;
            }
            openModal('subclass-modal');
        }

        async function saveSubClass() {
            const parentId = document.getElementById('sub-parent-id').value;
            const index = parseInt(document.getElementById('sub-edit-index').value);
            const cls = allClassData.find(c => c.id === parentId);
            const sub = {
                name: document.getElementById('sub-name').value,
                teacher: document.getElementById('sub-teacher').value,
                day: document.getElementById('sub-day').value,
                start: document.getElementById('sub-start').value,
                end: document.getElementById('sub-end').value
            };
            let subs = [...(cls.sub_classes || [])];
            if (index > -1) subs[index] = sub; else subs.push(sub);
            await supabaseClient.from('classes').update({ sub_classes: subs }).eq('id', parentId);
            closeModal('subclass-modal'); fetchClasses();
        }

        async function saveClass() { /* ...同前，略... */ closeModal('class-modal'); fetchClasses(); }
        async function deleteSubClass(parentId, index) { /* ...同前... */ }
        async function deleteClass(id) { /* ...同前... */ }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = () => fetchClasses();
    </script>
</body>
</html>
