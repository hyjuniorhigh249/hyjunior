<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浩元行政雲端系統 - 安全驗證</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; }
        .dashboard-content { display: none; }
    </style>
</head>
<body class="min-h-screen">

    <div id="auth-wall" class="fixed inset-0 z-[100] bg-slate-900 flex flex-col items-center justify-center p-6 text-white">
        <div class="w-full max-w-sm text-center">
            <h1 class="text-3xl font-black mb-2 italic text-white">浩元行政系統</h1>
            <p class="text-slate-400 mb-8 font-bold">請先驗證您的 Google 管理員帳號</p>
            
            <div id="auth-action-area">
                <button onclick="login()" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-black shadow-2xl hover:bg-slate-100 transition active:scale-95 flex items-center justify-center gap-3">
                    <img src="https://www.google.com/favicon.ico" class="w-5 h-5">
                    使用 Google 帳號登入
                </button>
            </div>

            <div id="access-denied" class="hidden mt-6 p-4 bg-red-500/10 border border-red-500/50 rounded-2xl text-red-400 text-sm font-bold">
                ⚠️ 您的帳號不在管理員白名單中，請聯繫系統管理員。
            </div>
        </div>
    </div>

    <main id="main-app" class="min-h-screen flex" style="display: none;">
        <div id="sidebar-container"></div>

        <div class="flex-1 p-8">
            <header class="mb-10">
                <h2 id="current-date" class="text-slate-400 font-bold text-sm mb-1 uppercase tracking-widest">---</h2>
                <h1 class="text-4xl font-black text-slate-800">營運數據概覽</h1>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 relative overflow-hidden group">
                    <div class="relative z-10">
                        <p class="text-slate-400 font-bold text-xs uppercase mb-1">目前學生總數</p>
                        <h3 id="stat-students" class="text-6xl font-black text-slate-800">0</h3>
                    </div>
                    <div class="absolute -right-4 -bottom-4 text-9xl opacity-[0.03] group-hover:opacity-[0.08] transition-all">👥</div>
                </div>

                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 relative overflow-hidden group">
                    <div class="relative z-10">
                        <p class="text-slate-400 font-bold text-xs uppercase mb-1">開課中班級</p>
                        <h3 id="stat-classes" class="text-6xl font-black text-slate-800">0</h3>
                    </div>
                    <div class="absolute -right-4 -bottom-4 text-9xl opacity-[0.03] group-hover:opacity-[0.08] transition-all">📚</div>
                </div>
            </div>

            <div class="mt-12 p-6 bg-blue-600 rounded-3xl text-white shadow-xl shadow-blue-200 flex items-center justify-between">
                <div>
                    <h4 class="text-xl font-black mb-1">今日行政提醒</h4>
                    <p class="opacity-80 font-medium">請確認所有學生到離班狀態均已透過通訊窗發送通知。</p>
                </div>
                <button onclick="startPiP()" class="bg-white text-blue-600 px-6 py-3 rounded-2xl font-black hover:bg-blue-50 transition active:scale-95">
                    立即開啟工具
                </button>
            </div>
        </div>
    </main>

    <script src="pip-tool.js"></script>
    <script src="sidebar.js"></script>
    
    <script>
        // Supabase 初始化 (請更換為您的金鑰)
        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseKey = 'YOUR_SUPABASE_KEY';
        const supabaseClient = supabasejs.createClient(supabaseUrl, supabaseKey);

        async function login() {
            await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        // 安全性檢查與數據讀取
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                const user = session.user;
                const { data: adminData, error } = await supabaseClient
                    .from('admins')
                    .select('email')
                    .eq('email', user.email)
                    .single();

                if (error || !adminData) {
                    document.getElementById('access-denied').classList.remove('hidden');
                    document.getElementById('auth-action-area').classList.add('hidden');
                    return;
                }

                document.getElementById('auth-wall').classList.add('hidden');
                document.getElementById('main-app').style.display = 'flex';
                document.getElementById('user-email-display').innerText = user.email;
                
                fetchStats();
            }
        });

        async function fetchStats() {
            const { count: sCount } = await supabaseClient.from('students').select('*', { count: 'exact', head: true });
            const { count: cCount } = await supabaseClient.from('classes').select('*', { count: 'exact', head: true });
            document.getElementById('stat-students').innerText = sCount || 0;
            document.getElementById('stat-classes').innerText = cCount || 0;
        }

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW', {
            year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
        });
    </script>
</body>
</html>
