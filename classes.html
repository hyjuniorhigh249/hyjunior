<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>班級組織與成員管理 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        
        /* 隱藏捲軸但可滾動 */
        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col overflow-hidden bg-slate-50">
    
    <header class="flex justify-between items-center mb-6 shrink-0 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <h1 class="text-2xl font-black text-slate-800">班級組織與成員管理</h1>
    </header>
    
    <div class="flex gap-6 flex-1 min-h-0">
        
        <div class="w-1/3 max-w-sm bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
            <div class="p-4 border-b bg-slate-50 flex justify-between items-center shrink-0">
                <h2 class="font-black text-slate-700">📂 班級列表</h2>
                <button onclick="openClassModal()" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded-lg font-black shadow-sm hover:bg-slate-700 transition">＋ 主班級</button>
            </div>
            <div id="left-class-list" class="flex-1 overflow-y-auto scroll-area">
                <p class="text-center py-10 text-slate-400 font-bold">讀取中...</p>
            </div>
        </div>

        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
            <div id="right-class-detail" class="flex-1 overflow-y-auto p-6 scroll-area bg-slate-50/50">
                <div class="flex items-center justify-center h-full text-slate-400 font-bold">請從左側選擇或建立班級</div>
            </div>
        </div>

    </div>

    <div id="class-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 id="class-modal-title" class="text-lg font-black mb-4">設定主班級</h3>
            <input type="hidden" id="cls-id">
            
            <label class="block text-xs font-bold text-slate-400 mb-1">主班級名稱*</label>
            <input type="text" id="cls-name" class="w-full p-2 border rounded-lg mb-3 font-bold bg-slate-50 focus:bg-white outline-none">
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">開課日期</label>
                    <input type="date" id="cls-start" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">結業日期</label>
                    <input type="date" id="cls-end" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50">
                </div>
            </div>
            
            <div class="grid grid-cols-3 gap-2 mb-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">預設學費</label><input type="number" id="cls-fee" class="w-full p-2 border rounded-lg font-bold text-emerald-600 bg-slate-50" value="0"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">教材費</label><input type="number" id="cls-textbook" class="w-full p-2 border rounded-lg font-bold bg-slate-50" value="0"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">雜費</label><input type="number" id="cls-misc" class="w-full p-2 border rounded-lg font-bold bg-slate-50" value="0"></div>
            </div>
            
            <label class="block text-xs font-bold text-slate-400 mb-1">備註</label>
            <input type="text" id="cls-note" class="w-full p-2 border rounded-lg mb-6 font-bold bg-slate-50">
            
            <div class="flex gap-2">
                <button onclick="closeModal('class-modal')" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold hover:bg-slate-200 text-slate-600">取消</button>
                <button onclick="saveClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700">儲存</button>
            </div>
        </div>
    </div>

    <div id="sub-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 id="sub-modal-title" class="text-lg font-black mb-4">設定子班別</h3>
            <input type="hidden" id="sub-clsId">
            <input type="hidden" id="sub-idx">
            
            <label class="block text-xs font-bold text-slate-400 mb-1">子班別名稱*</label>
            <input type="text" id="sub-name" class="w-full p-2 border rounded-lg mb-3 font-bold bg-slate-50">
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-slate-400 mb-1">每週上課日*</label>
                    <select id="sub-day" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50">
                        <option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option>
                        <option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="0">星期日</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">開始時間</label>
                    <input type="time" id="sub-start" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">結束時間</label>
                    <input type="time" id="sub-end" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">學費</label><input type="number" id="sub-fee" class="w-full p-2 border rounded-lg font-bold text-emerald-600 bg-slate-50"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">教材費</label><input type="number" id="sub-textbook" class="w-full p-2 border rounded-lg font-bold bg-slate-50"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">雜費</label><input type="number" id="sub-misc" class="w-full p-2 border rounded-lg font-bold bg-slate-50"></div>
            </div>

            <label class="block text-xs font-bold text-slate-400 mb-1">授課老師</label>
            <input type="text" id="sub-teacher" class="w-full p-2 border rounded-lg mb-6 font-bold bg-slate-50">

            <div class="flex gap-2">
                <button onclick="closeModal('sub-modal')" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold hover:bg-slate-200 text-slate-600">取消</button>
                <button onclick="saveSubClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700">儲存</button>
            </div>
        </div>
    </div>

    <div id="student-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-lg font-black mb-4">加入學生至子班別</h3>
            <select id="grade-filter" onchange="filterStudents()" class="w-full p-2 border rounded-lg mb-2 font-bold text-sm bg-slate-50">
                <option value="">全部年級</option>
                <script>
                    const grades = ['小一','小二','小三','小四','小五','小六','國一','國二','國三','高一','高二','高三'];
                    grades.forEach((g,i) => document.write(`<option value="${i+1}">${g}</option>`));
                </script>
            </select>
            <input type="text" id="stu-search" oninput="filterStudents()" placeholder="搜尋姓名..." class="w-full p-2 border rounded-lg text-sm font-bold mb-4 bg-slate-50 outline-none focus:bg-white">
            <div id="student-list-container" class="flex-1 overflow-y-auto space-y-1 scroll-area"></div>
            <button onclick="closeModal('student-modal')" class="w-full py-3 mt-4 bg-slate-100 text-slate-700 hover:bg-slate-200 transition rounded-xl font-black">完成</button>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
        let allClassData = [], allStudents = [], targetClassId = '', targetSubIdx = 0;
        let selectedClassId = null; // 紀錄左側目前選取的班級 ID
        let stuMap = {}; // 用來翻譯 student_id 到 姓名
        const dayMap = { '0': '日', '1': '一', '2': '二', '3': '三', '4': '四', '5': '五', '6': '六' };

        async function init() {
            const { data: classes } = await sb.from('classes').select('*').order('created_at', { ascending: false });
            const { data: students } = await sb.from('students').select('*');
            allClassData = classes || [];
            allStudents = students || [];
            
            // 建立姓名翻譯字典
            stuMap = {};
            allStudents.forEach(s => { stuMap[s.id] = s.name; });

            // 如果有資料且尚未選取，預設選取第一筆
            if (allClassData.length > 0 && !selectedClassId) {
                selectedClassId = allClassData[0].id;
            }

            render();
        }

        // 智能顯示學生名稱 (相容舊版名字與新版 UUID)
        function getMemberDisplayName(m) {
            if (stuMap[m]) return stuMap[m]; // 是 UUID 且找得到人
            if (m.length > 20) return '已刪除學生'; // 是 UUID 但找不到人
            return m; // 是舊版的中文名字字串
        }

        function selectClass(id) {
            selectedClassId = id;
            render();
        }

        function render() {
            // =========================
            // 1. 渲染左側班級列表
            // =========================
            const leftList = document.getElementById('left-class-list');
            if (allClassData.length === 0) {
                leftList.innerHTML = '<p class="text-center py-10 text-slate-400 font-bold">目前無班級資料</p>';
            } else {
                leftList.innerHTML = allClassData.map(cls => `
                    <div onclick="selectClass('${cls.id}')" class="p-4 border-b cursor-pointer transition-colors ${cls.id === selectedClassId ? 'bg-blue-50 border-l-4 border-l-blue-600' : 'bg-white hover:bg-slate-50 border-l-4 border-l-transparent'}">
                        <h4 class="font-black text-slate-800 ${cls.id === selectedClassId ? 'text-blue-800' : ''}">${cls.name}</h4>
                        <p class="text-[10px] text-slate-500 font-bold mt-1">
                            ${cls.start_date ? cls.start_date.replace(/-/g, '/') : '未定'} ~ ${cls.end_date ? cls.end_date.replace(/-/g, '/') : '未定'}
                        </p>
                    </div>
                `).join('');
            }

            // =========================
            // 2. 渲染右側詳細面板
            // =========================
            const rightPane = document.getElementById('right-class-detail');
            const cls = allClassData.find(c => c.id === selectedClassId);
            
            if (!cls) {
                rightPane.innerHTML = `<div class="flex items-center justify-center h-full text-slate-400 font-bold">請從左側選擇或建立班級</div>`;
                return;
            }

            rightPane.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 relative">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="font-black text-2xl text-slate-800">${cls.name}</h2>
                            <div class="flex gap-2 mt-2">
                                <span class="text-[11px] text-slate-500 bg-slate-100 px-2 py-1 rounded font-bold border">
                                    預設：學費 $${cls.default_fee||0} | 教材 $${cls.default_textbook_fee||0} | 雜費 $${cls.default_misc_fee||0}
                                </span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openClassModal('${cls.id}')" class="text-xs bg-slate-100 text-slate-600 px-4 py-2 rounded-lg font-black hover:bg-slate-200 transition shadow-sm">⚙️ 編輯</button>
                            <button onclick="deleteClass('${cls.id}')" class="text-xs bg-rose-50 text-rose-600 px-4 py-2 rounded-lg font-black hover:bg-rose-100 transition shadow-sm">🗑️ 刪除</button>
                        </div>
                    </div>
                    <div class="absolute -bottom-4 right-6">
                        <button onclick="openSubModal('${cls.id}')" class="text-sm bg-emerald-500 text-white px-5 py-2 rounded-full font-black shadow-lg hover:bg-emerald-600 transition hover:-translate-y-1">＋ 新增子班別</button>
                    </div>
                </div>

                <h3 class="font-black text-slate-700 text-lg mb-4 ml-1">📚 子班別與學生名單</h3>
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                    ${(!cls.sub_classes || cls.sub_classes.length === 0) ? '<div class="col-span-full text-center py-10 text-slate-400 font-bold bg-white rounded-xl border border-dashed">尚無子班別</div>' : ''}
                    ${(cls.sub_classes || []).map((sub, idx) => `
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-3 border-b pb-3">
                                <div>
                                    <p class="font-black text-base text-slate-800 flex items-center gap-2">
                                        ${sub.name} 
                                        <span class="text-[10px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100 tracking-wider">
                                            $${sub.fee||0} / $${sub.textbook_fee||0} / $${sub.misc_fee||0}
                                        </span>
                                    </p>
                                    <p class="text-xs text-slate-500 font-bold mt-1.5 flex items-center gap-1">
                                        🕒 每週${sub.day ? dayMap[sub.day] : '未定'} | ${sub.start || '--:--'} ~ ${sub.end || '--:--'}
                                    </p>
                                    <p class="text-[11px] text-blue-600 font-bold mt-1 bg-blue-50 w-fit px-2 py-0.5 rounded">👨‍🏫 老師：${sub.teacher || '未定'}</p>
                                </div>
                                <div class="flex gap-1 flex-col h-fit">
                                    <button onclick="openSubModal('${cls.id}', ${idx})" class="text-[10px] bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg font-black hover:bg-slate-200 text-left">⚙️ 編輯</button>
                                    <button onclick="deleteSub('${cls.id}', ${idx})" class="text-[10px] bg-rose-50 text-rose-500 px-3 py-1.5 rounded-lg font-black hover:bg-rose-100 text-left">🗑️ 刪除</button>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-slate-400">目前人數: ${(sub.members||[]).length}</span>
                                <button onclick="openStudentModal('${cls.id}', ${idx})" class="text-[10px] bg-blue-600 text-white px-3 py-1 rounded shadow hover:bg-blue-700 font-black">＋ 加入學生</button>
                            </div>
                            
                            <div class="flex flex-wrap gap-1.5 bg-slate-50 p-2 rounded-lg min-h-[50px] items-start content-start border border-slate-100">
                                ${(sub.members || []).map(m => `
                                    <span class="bg-white px-2 py-1 rounded border border-slate-200 text-xs font-bold text-slate-700 flex items-center gap-1.5 shadow-sm">
                                        ${getMemberDisplayName(m)} 
                                        <span onclick="removeStudent('${cls.id}', ${idx}, '${m}')" class="text-slate-300 cursor-pointer hover:text-rose-500 hover:bg-rose-50 rounded-full w-4 h-4 flex items-center justify-center transition">×</span>
                                    </span>
                                `).join('')}
                                ${(sub.members || []).length === 0 ? '<span class="text-xs text-slate-400 font-bold p-1">尚未加入學生</span>' : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // ==========================================
        // Modal 與資料儲存操作
        // ==========================================
        function openClassModal(id = null) {
            document.getElementById('cls-id').value = id || '';
            if(id) {
                const cls = allClassData.find(c => c.id === id);
                document.getElementById('class-modal-title').innerText = "編輯主班級";
                document.getElementById('cls-name').value = cls.name || '';
                document.getElementById('cls-start').value = cls.start_date || '';
                document.getElementById('cls-end').value = cls.end_date || '';
                document.getElementById('cls-fee').value = cls.default_fee || 0;
                document.getElementById('cls-textbook').value = cls.default_textbook_fee || 0;
                document.getElementById('cls-misc').value = cls.default_misc_fee || 0;
                document.getElementById('cls-note').value = cls.note || '';
            } else {
                document.getElementById('class-modal-title').innerText = "新增主班級";
                document.getElementById('cls-name').value = '';
                document.getElementById('cls-start').value = '';
                document.getElementById('cls-end').value = '';
                document.getElementById('cls-fee').value = 0;
                document.getElementById('cls-textbook').value = 0;
                document.getElementById('cls-misc').value = 0;
                document.getElementById('cls-note').value = '';
            }
            document.getElementById('class-modal').classList.add('active');
        }

        async function saveClass() {
            const id = document.getElementById('cls-id').value;
            const name = document.getElementById('cls-name').value.trim();
            const payload = { 
                name, 
                start_date: document.getElementById('cls-start').value || null, 
                end_date: document.getElementById('cls-end').value || null, 
                note: document.getElementById('cls-note').value.trim(), 
                default_fee: parseInt(document.getElementById('cls-fee').value) || 0,
                default_textbook_fee: parseInt(document.getElementById('cls-textbook').value) || 0,
                default_misc_fee: parseInt(document.getElementById('cls-misc').value) || 0
            };
            
            if(!name) return alert("主班級名稱為必填！");
            
            if(id) {
                await sb.from('classes').update(payload).eq('id', id);
            } else { 
                payload.sub_classes = []; 
                const { data } = await sb.from('classes').insert([payload]).select();
                if(data && data.length > 0) selectedClassId = data[0].id; // 新增後自動選取
            }
            closeModal('class-modal'); 
            init();
        }

        function openSubModal(clsId, idx = null) {
            const cls = allClassData.find(c => c.id === clsId);
            document.getElementById('sub-clsId').value = clsId;
            document.getElementById('sub-idx').value = idx !== null ? idx : '';
            
            if(idx !== null) {
                const sub = cls.sub_classes[idx];
                document.getElementById('sub-modal-title').innerText = "編輯子班別";
                document.getElementById('sub-name').value = sub.name || '';
                document.getElementById('sub-day').value = sub.day || '1';
                document.getElementById('sub-start').value = sub.start || '';
                document.getElementById('sub-end').value = sub.end || '';
                document.getElementById('sub-teacher').value = sub.teacher || '';
                document.getElementById('sub-fee').value = sub.fee !== undefined ? sub.fee : (cls.default_fee || 0);
                document.getElementById('sub-textbook').value = sub.textbook_fee !== undefined ? sub.textbook_fee : (cls.default_textbook_fee || 0);
                document.getElementById('sub-misc').value = sub.misc_fee !== undefined ? sub.misc_fee : (cls.default_misc_fee || 0);
            } else {
                document.getElementById('sub-modal-title').innerText = "新增子班別";
                document.getElementById('sub-name').value = '';
                document.getElementById('sub-day').value = '1';
                document.getElementById('sub-start').value = '';
                document.getElementById('sub-end').value = '';
                document.getElementById('sub-teacher').value = '';
                document.getElementById('sub-fee').value = cls.default_fee || 0; 
                document.getElementById('sub-textbook').value = cls.default_textbook_fee || 0; 
                document.getElementById('sub-misc').value = cls.default_misc_fee || 0; 
            }
            document.getElementById('sub-modal').classList.add('active');
        }

        async function saveSubClass() {
            const clsId = document.getElementById('sub-clsId').value;
            const idxStr = document.getElementById('sub-idx').value;
            const name = document.getElementById('sub-name').value.trim();
            
            if(!name) return alert("名稱必填！");
            const cls = allClassData.find(c => c.id === clsId);
            let subs = cls.sub_classes ? [...cls.sub_classes] : [];
            const data = { 
                name, 
                fee: parseInt(document.getElementById('sub-fee').value) || 0,
                textbook_fee: parseInt(document.getElementById('sub-textbook').value) || 0,
                misc_fee: parseInt(document.getElementById('sub-misc').value) || 0,
                day: document.getElementById('sub-day').value, 
                start: document.getElementById('sub-start').value, 
                end: document.getElementById('sub-end').value, 
                teacher: document.getElementById('sub-teacher').value.trim() 
            };
            
            if(idxStr !== '') subs[parseInt(idxStr)] = { ...subs[parseInt(idxStr)], ...data };
            else subs.push({ ...data, members: [], room_id: null });

            await sb.from('classes').update({ sub_classes: subs }).eq('id', clsId);
            closeModal('sub-modal'); 
            init();
        }

        async function deleteClass(id) { 
            if(confirm("確定要刪除整個主班級與底下的所有子班別嗎？\n注意：此動作無法復原！")) { 
                await sb.from('classes').delete().eq('id', id); 
                selectedClassId = null; // 重置選取狀態
                init(); 
            } 
        }

        async function deleteSub(clsId, idx) { 
            if(confirm("確定要刪除此子班別嗎？")) { 
                const cls = allClassData.find(c => c.id === clsId); 
                let subs = [...cls.sub_classes]; 
                subs.splice(idx, 1); 
                await sb.from('classes').update({ sub_classes: subs }).eq('id', clsId); 
                init(); 
            } 
        }

        // ==========================================
        // 學生名單操作 (改用 UUID 連動)
        // ==========================================
        function getAcademicYear() { const d = new Date(); return (d.getMonth() + 1) >= 7 ? d.getFullYear() : d.getFullYear() - 1; }
        function calculateDisplayGrade(baseYear) { if (!baseYear) return null; const grade = getAcademicYear() - baseYear + 1; return grade > 12 ? 13 : grade; }
        
        function openStudentModal(clsId, idx) { 
            targetClassId = clsId; 
            targetSubIdx = idx; 
            document.getElementById('stu-search').value = ''; 
            document.getElementById('grade-filter').value = ''; 
            filterStudents(); 
            document.getElementById('student-modal').classList.add('active'); 
        }

        function filterStudents() {
            const k = document.getElementById('stu-search').value.toLowerCase();
            const g = document.getElementById('grade-filter').value;
            const cls = allClassData.find(c => c.id === targetClassId);
            const currentMembers = cls.sub_classes[targetSubIdx].members || [];
            
            const filtered = allStudents.filter(s => 
                s.name.toLowerCase().includes(k) && 
                (g === "" || String(calculateDisplayGrade(s.grade_base_year)) === g)
            );
            
            document.getElementById('student-list-container').innerHTML = filtered.map(s => {
                // ✅ 同時檢查 UUID 與 舊版名字 是否已存在名單中
                const isAdded = currentMembers.includes(s.id) || currentMembers.includes(s.name);
                return `<div class="p-3 border-b flex justify-between items-center ${isAdded ? 'bg-slate-50 opacity-50' : 'cursor-pointer hover:bg-slate-100 transition'}" onclick="${isAdded ? '' : `addStudent('${s.id}')`}">
                    <span class="font-bold text-sm text-slate-700">${s.name}</span>
                    ${isAdded ? '<span class="text-[10px] font-black text-slate-400 border px-1.5 py-0.5 rounded bg-white">已加入</span>' : '<span class="text-[10px] font-black text-white bg-blue-600 px-3 py-1 rounded shadow hover:bg-blue-700">＋ 加入</span>'}
                </div>`;
            }).join('');
        }

        async function addStudent(stuId) { 
            const cls = allClassData.find(c => c.id === targetClassId); 
            let subs = [...cls.sub_classes]; 
            // ✅ 現在加入名單的是 student_id (UUID)
            subs[targetSubIdx].members = [...(subs[targetSubIdx].members || []), stuId]; 
            await sb.from('classes').update({ sub_classes: subs }).eq('id', targetClassId); 
            cls.sub_classes = subs; 
            filterStudents(); 
            render(); 
        }

        async function removeStudent(clsId, idx, memberValue) { 
            const dispName = getMemberDisplayName(memberValue);
            if(confirm(`確定要將 ${dispName} 從這個班別移除嗎？`)) { 
                const cls = allClassData.find(c => c.id === clsId); 
                let subs = [...cls.sub_classes]; 
                // ✅ 無論他是舊版名字還是新版 UUID，精準移除該值
                subs[idx].members = subs[idx].members.filter(m => m !== memberValue); 
                await sb.from('classes').update({ sub_classes: subs }).eq('id', clsId); 
                init(); 
            } 
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = init;
    </script>
</body>
</html>
