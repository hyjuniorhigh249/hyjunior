<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>昊學行政系統 - 點名系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: "Inter", "Microsoft JhengHei", sans-serif; background: #f1f5f9; }
        .main-grid { display: grid; grid-template-columns: 320px 1fr; height: 100vh; gap: 1px; background: #cbd5e1; }
        .pane { background: white; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .grid-container { background: #f8fafc; border: 2px solid #475569; border-radius: 20px; padding: 40px; margin: 30px; display: grid; gap: 12px; width: fit-content; }
        .slot { width: 85px; height: 85px; border-radius: 12px; font-weight: 800; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; cursor: pointer; border: 1px solid #e2e8f0; }
        .slot.disabled { cursor: not-allowed; opacity: 0.6; pointer-events: none; }
        .status-in { background: #10b981 !important; color: white !important; }
        .status-out { background: #3b82f6 !important; color: white !important; }
        .status-leave { background: #f59e0b !important; color: white !important; }
    </style>
</head>
<body>

<div class="main-grid">
    <div class="pane z-10 shadow-lg">
        <div class="p-4 border-b bg-white space-y-3">
            <h2 class="font-black text-slate-800 text-lg">📅 點名系統</h2>
            
            <input type="date" id="date-selector" onchange="loadDateData()" class="w-full bg-slate-100 p-2 rounded-lg font-bold text-sm outline-none">
            <select id="class-switcher" onchange="switchClass(this.value)" class="w-full bg-slate-800 text-white font-black text-sm px-4 py-2 rounded-lg outline-none">
                <option value="">載入中...</option>
            </select>

            <div id="attendance-mode-toggle" class="flex rounded-lg overflow-hidden border border-slate-200 p-1 bg-slate-50">
                <button id="btn-mode-in" onclick="setMode('in')" class="flex-1 py-1 text-sm font-bold rounded-md bg-emerald-500 text-white shadow">進班打卡</button>
                <button id="btn-mode-out" onclick="setMode('out')" class="flex-1 py-1 text-sm font-bold rounded-md text-slate-500 hover:bg-slate-200">離班打卡</button>
            </div>
            <p id="date-warning" class="text-xs font-bold text-red-500 hidden text-center">⚠️ 非今日，無法進行進/離班打卡操作</p>
        </div>

        <div id="student-list" class="flex-1 overflow-y-auto p-2 space-y-2 bg-slate-50">
            </div>
        
        <div class="p-3 border-t bg-white">
            <button onclick="openLeaveStatsModal()" class="w-full bg-orange-100 text-orange-700 font-bold py-2 rounded-lg hover:bg-orange-200 transition">📊 查看請假統計</button>
        </div>
    </div>

    <div class="pane bg-slate-300 relative overflow-auto flex items-center pt-10">
        <div class="absolute top-0 w-full bg-white/90 backdrop-blur px-6 py-3 border-b flex justify-between items-center z-20">
            <div class="flex items-center gap-3">
                <div class="relative w-72">
                    <input type="text" id="global-search" placeholder="輸入學號/姓名 (Enter)" class="w-full pl-10 pr-4 py-2 bg-slate-100 rounded-full font-bold text-sm outline-none">
                    <span class="absolute left-3.5 top-2">🔍</span>
                </div>
                <button id="btn-qr" onclick="openQRScanner()" class="bg-blue-600 text-white font-black text-sm px-4 py-2 rounded-full shadow-md hover:bg-blue-700 transition">
                    📷 掃碼點名
                </button>
            </div>
            <div id="class-info-display" class="text-sm font-black text-slate-600">
                授課老師：載入中 | 時間：載入中
            </div>
        </div>

        <div id="seat-grid" class="grid-container mt-12">
            <div class="text-slate-400 font-bold p-8 text-center col-span-full">請選擇日期與班別</div>
        </div>
    </div>
</div>

<script>
    // Supabase 初始化 (保留您原有的金鑰)
    const supabaseClient = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');

    let db = { 
        allClasses: [], allRooms: [], studentDetails: {}, idToName: {},
        activeClassId: null, activeSubIdx: null, 
        currentRoom: null, currentSeats: [], currentAttendance: []
    };

    let currentMode = 'in'; // 'in' (進班) 或 'out' (離班)
    let isToday = true;

    // 取得今天日期與現在時間
    function getLocalToday() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function getNowTimeStr() {
        return new Date().toLocaleTimeString('en-GB'); // HH:MM:SS
    }

    // 初始化網頁：設定今天日期並拉取基本資料
    window.onload = async () => {
        document.getElementById('date-selector').value = getLocalToday();
        
        // 抓取基礎資料
        const { data: classes } = await supabaseClient.from('classes').select('*');
        const { data: rooms } = await supabaseClient.from('rooms').select('*');
        const { data: students } = await supabaseClient.from('students').select('*');
        
        db.allClasses = classes || [];
        db.allRooms = rooms || [];
        
        // 建立學生查找表
        (students || []).forEach(s => {
            db.studentDetails[s.name] = s;
            const fullId = (s.student_id_prefix || '') + (s.student_id_suffix || '');
            if(fullId) db.idToName[fullId] = s.name;
        });

        // 產生班級下拉選單
        const switcher = document.getElementById('class-switcher');
        switcher.innerHTML = '<option value="">請選擇子班別...</option>';
        let firstVal = null;
        
        db.allClasses.forEach(c => {
            (c.sub_classes || []).forEach((sub, idx) => {
                const val = `${c.id}_${idx}`;
                if (!firstVal) firstVal = val;
                switcher.add(new Option(`${c.name} - ${sub.name}`, val));
            });
        });

        if (firstVal) {
            switcher.value = firstVal;
            loadDateData(); // 觸發資料載入
        }
    };

    // 切換進/離班打卡模式
    function setMode(mode) {
        if (!isToday) return;
        currentMode = mode;
        const btnIn = document.getElementById('btn-mode-in');
        const btnOut = document.getElementById('btn-mode-out');
        
        if(mode === 'in') {
            btnIn.className = "flex-1 py-1 text-sm font-bold rounded-md bg-emerald-500 text-white shadow";
            btnOut.className = "flex-1 py-1 text-sm font-bold rounded-md text-slate-500 hover:bg-slate-200";
        } else {
            btnOut.className = "flex-1 py-1 text-sm font-bold rounded-md bg-blue-500 text-white shadow";
            btnIn.className = "flex-1 py-1 text-sm font-bold rounded-md text-slate-500 hover:bg-slate-200";
        }
    }

    // 當日期改變時觸發
    function loadDateData() {
        const selectedDate = document.getElementById('date-selector').value;
        isToday = (selectedDate === getLocalToday());
        
        const searchInput = document.getElementById('global-search');
        const qrBtn = document.getElementById('btn-qr');
        const warning = document.getElementById('date-warning');
        
        // 防呆：非今日禁止打卡
        if (!isToday) {
            searchInput.disabled = true;
            qrBtn.disabled = true;
            qrBtn.classList.add('opacity-50', 'cursor-not-allowed');
            warning.classList.remove('hidden');
        } else {
            searchInput.disabled = false;
            qrBtn.disabled = false;
            qrBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            warning.classList.add('hidden');
        }

        switchClass(document.getElementById('class-switcher').value);
    }

    // 切換班級時，讀取對應的座位表與點名紀錄
    async function switchClass(val) {
        if (!val) return;
        document.getElementById('seat-grid').innerHTML = '<div class="p-8 text-center text-slate-400 font-bold col-span-full">載入資料中...</div>';
        
        const [mainId, subIdx] = val.split('_');
        db.activeClassId = mainId;
        db.activeSubIdx = parseInt(subIdx);

        const cls = db.allClasses.find(c => c.id === mainId);
        const sub = cls.sub_classes[db.activeSubIdx];
        const roomId = sub.room_id;
        const selectedDate = document.getElementById('date-selector').value;

        // 取得該日期的點名紀錄
        const { data: attendanceData } = await supabaseClient.from('attendance')
            .select('*')
            .eq('check_date', selectedDate);
        db.currentAttendance = attendanceData || [];

        // 渲染左側清單
        const membersObjects = (sub.members || []).map(name => db.studentDetails[name]).filter(s => s);
        renderStudentList(membersObjects);

        if (!roomId) {
            document.getElementById('seat-grid').innerHTML = "<div class='text-slate-400 font-bold col-span-full'>此子班別尚未綁定教室</div>";
            document.getElementById('seat-grid').style.gridTemplateColumns = "1fr";
            return;
        }

        db.currentRoom = db.allRooms.find(r => r.id === roomId);
        const { data: seats } = await supabaseClient.from('class_seats')
            .select('*').eq('class_id', mainId).eq('room_id', roomId).eq('seat_label', String(subIdx));
        
        db.currentSeats = seats || [];
        renderSeats(db.currentRoom, db.currentSeats);
    }

    // 渲染右側座位表
    function renderSeats(room, seats) {
        if(!room) return;
        const container = document.getElementById('seat-grid');
        const layout = room.layout_config || {};
        const size = room.grid_size || { rows: 5, cols: 8 };
        
        container.style.gridTemplateColumns = `repeat(${size.cols}, 85px)`;
        container.innerHTML = "";
        
        const seatMap = Object.fromEntries(seats.map(s => [`${s.row_index}-${s.col_index}`, s]));

        for (let r = 0; r < size.rows; r++) {
            for (let c = 0; c < size.cols; c++) {
                const key = `${r}-${c}`;
                const state = layout[key] || 'normal';
                const div = document.createElement('div');

                if (state === 'hallway') {
                    div.className = "slot is-hallway bg-slate-300 border-none cursor-default";
                    div.innerHTML = `<span class="text-[10px] font-bold text-slate-500">走廊</span>`;
                } else if (state === 'blocked') {
                    div.className = "slot is-blocked bg-red-200 border-red-400 cursor-default";
                    div.innerHTML = `<span class="text-white font-bold">XX</span>`;
                } else {
                    const seat = seatMap[key];
                    if (seat && seat.student_name) {
                        const student = db.studentDetails[seat.student_name];
                        const record = db.currentAttendance.find(a => a.student_id === student?.id) || {};
                        
                        let statusClass = '';
                        // 判斷視覺狀態
                        if (record.leave_type && record.leave_type !== 'none') statusClass = 'status-leave';
                        else if (record.check_out_time) statusClass = 'status-out';
                        else if (record.check_in_time) statusClass = 'status-in';

                        div.className = `slot ${statusClass} ${!isToday ? 'disabled' : ''}`;
                        div.innerHTML = `<span class="leading-none text-center font-bold break-words w-full px-1">${seat.student_name}</span>`;
                        
                        div.onclick = () => handleSeatClick(student);
                    } else {
                        div.className = "slot border-dashed border-slate-300 bg-slate-50 cursor-default opacity-50";
                    }
                }
                container.appendChild(div);
            }
        }
    }

    // 渲染左側學生清單與請假選單
    function renderStudentList(students) {
        const list = document.getElementById('student-list');
        list.innerHTML = '';
        
        students.forEach(stu => {
            const record = db.currentAttendance.find(a => a.student_id === stu.id) || {};
            
            const html = `
                <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 text-sm">
                    <div class="flex justify-between items-center mb-2 font-bold">
                        <span class="text-slate-800">${stu.name}</span>
                        <span class="text-[11px] text-slate-400">進:${record.check_in_time || '--'} | 離:${record.check_out_time || '--'}</span>
                    </div>
                    <div class="flex gap-2">
                        <select onchange="updateLeaveStatus('${stu.id}', this.value)" class="bg-slate-100 rounded px-2 py-1 outline-none font-bold text-xs text-slate-700">
                            <option value="none" ${!record.leave_type || record.leave_type==='none' ? 'selected' : ''}>正常</option>
                            <option value="事假" ${record.leave_type==='事假' ? 'selected' : ''}>事假</option>
                            <option value="病假" ${record.leave_type==='病假' ? 'selected' : ''}>病假</option>
                            <option value="喪假" ${record.leave_type==='喪假' ? 'selected' : ''}>喪假</option>
                        </select>
                        <input type="text" placeholder="請假事由..." value="${record.leave_reason || ''}" 
                               onchange="updateLeaveReason('${stu.id}', this.value)"
                               class="flex-1 bg-slate-50 border border-slate-200 rounded px-2 py-1 text-xs outline-none">
                    </div>
                </div>
            `;
            list.innerHTML += html;
        });
    }

    // 點擊座位執行進/離班打卡
    async function handleSeatClick(student) {
        if (!isToday || !student) return;
        
        const todayStr = getLocalToday();
        const timeNow = getNowTimeStr();
        
        let updateData = { student_id: student.id, check_date: todayStr };
        if (currentMode === 'in') {
            updateData.check_in_time = timeNow;
        } else {
            updateData.check_out_time = timeNow;
        }

        // 寫入 Supabase (若無當日紀錄則新增，有則更新)
        const { error } = await supabaseClient.from('attendance').upsert(updateData, { onConflict: 'student_id, check_date' });
        
        if(!error) {
            console.log(`${student.name} ${currentMode === 'in' ? '進班' : '離班'}打卡成功: ${timeNow}`);
            switchClass(document.getElementById('class-switcher').value); // 重新讀取畫面
        }
    }

    // 更新請假狀態
    async function updateLeaveStatus(studentId, leaveType) {
        const selectedDate = document.getElementById('date-selector').value;
        const { error } = await supabaseClient.from('attendance').upsert({
            student_id: studentId,
            check_date: selectedDate,
            leave_type: leaveType
        }, { onConflict: 'student_id, check_date' });

        if(!error) switchClass(document.getElementById('class-switcher').value);
    }

    // 更新請假事由
    async function updateLeaveReason(studentId, reason) {
        const selectedDate = document.getElementById('date-selector').value;
        await supabaseClient.from('attendance').upsert({
            student_id: studentId,
            check_date: selectedDate,
            leave_reason: reason
        }, { onConflict: 'student_id, check_date' });
    }
</script>
</body>
</html>
