<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>座位排班管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="p-8 bg-slate-100">
    <div class="max-w-6xl mx-auto">
        <div class="flex gap-4 mb-6">
            <select id="subclass-select" onchange="loadSubClass(this.value)" class="p-2 border rounded-lg font-bold">
                <option value="">選擇子班別</option>
            </select>
            <select id="room-select" onchange="loadRoom(this.value)" class="p-2 border rounded-lg font-bold">
                <option value="">選擇教室</option>
            </select>
            <button onclick="newRoom()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">+ 新增教室</button>
            <button onclick="toggleMode()" id="mode-btn" class="bg-amber-500 text-white px-4 py-2 rounded-lg font-bold">座位排班模式</button>
            <button onclick="saveAll()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">儲存</button>
        </div>
        <div class="flex gap-8">
            <div id="stu-list" class="w-48 bg-white p-4 rounded-xl border"></div>
            <div id="grid" class="grid bg-white p-4 rounded-xl border"></div>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
        let state = { mode: 'seating', roomId: '', subId: '', seats: {}, room: {grid_size:{cols:8,rows:5}, layout_config:{}}, members: [] };

        async function init() {
            const { data: classes } = await sb.from('classes').select('*');
            const sSelect = document.getElementById('subclass-select');
            classes.forEach(c => (c.sub_classes||[]).forEach((s,i) => sSelect.add(new Option(`${c.name}-${s.name}`, `${c.id}|${i}|${s.members.join(',')}`))));
            
            const { data: rooms } = await sb.from('rooms').select('*');
            const rSelect = document.getElementById('room-select');
            rooms.forEach(r => rSelect.add(new Option(r.name, r.id)));
        }

        function loadSubClass(val) {
            const [id, idx, members] = val.split('|');
            state.subId = id;
            state.members = members.split(',');
            document.getElementById('stu-list').innerHTML = state.members.map(m => `<div class="p-2 border rounded cursor-pointer hover:bg-slate-100" onclick="state.selectedStudent='${m}'">${m}</div>`).join('');
        }

        async function loadRoom(id) {
            state.roomId = id;
            const { data } = await sb.from('rooms').select('*').eq('id', id).single();
            state.room = data;
            renderGrid();
        }

        function toggleMode() {
            state.mode = state.mode === 'seating' ? 'edit' : 'seating';
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.style.gridTemplateColumns = `repeat(${state.room.grid_size.cols}, 60px)`;
            grid.innerHTML = '';
            for(let r=0; r<state.room.grid_size.rows; r++) {
                for(let c=0; c<state.room.grid_size.cols; c++) {
                    const key = `${r}-${c}`;
                    const config = state.room.layout_config[key] || 'normal';
                    const div = document.createElement('div');
                    div.className = `w-[60px] h-[60px] border flex items-center justify-center cursor-pointer ${config === 'hallway' ? 'bg-slate-300' : (config === 'blocked' ? 'bg-red-300' : 'bg-white')}`;
                    div.innerHTML = config === 'blocked' ? 'XX' : (state.seats[key] || '');
                    div.onclick = () => {
                        if(state.mode === 'edit') {
                             state.room.layout_config[key] = config === 'normal' ? 'blocked' : (config === 'blocked' ? 'hallway' : 'normal');
                        } else if(config === 'normal' && state.selectedStudent) {
                             state.seats[key] = state.selectedStudent;
                        }
                        renderGrid();
                    };
                    grid.appendChild(div);
                }
            }
        }
        
        async function newRoom() { const name = prompt("教室名稱"); if(name) await sb.from('rooms').insert([{name}]); location.reload(); }
        async function saveAll() {
            await sb.from('rooms').update({ layout_config: state.room.layout_config }).eq('id', state.roomId);
            alert("已儲存教室與座位配置");
        }
        window.onload = init;
    </script>
</body>
</html>
