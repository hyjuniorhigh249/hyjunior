<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>班級組織與成員管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="p-8 bg-slate-50">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black">班級組織與成員管理</h1>
            <button onclick="alert('請至資料庫後台建立新班級')" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-black">＋ 建立新班級</button>
        </header>
        <div id="classes-container" class="space-y-6"></div>
    </div>

    <div id="student-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-96 max-h-[90vh] flex flex-col">
            <h3 class="font-black mb-4">加入學生</h3>
            <select id="grade-filter" onchange="filterStudents()" class="w-full p-2 border rounded-lg mb-2 text-sm font-bold">
                <option value="">全部年級</option>
                <option value="1">小一</option><option value="7">國一</option><option value="10">高一</option>
            </select>
            <input type="text" id="stu-search" oninput="filterStudents()" placeholder="搜尋姓名..." class="w-full p-2 border rounded-lg text-sm mb-4">
            <div id="student-list-container" class="flex-1 overflow-y-auto space-y-1"></div>
            <button onclick="document.getElementById('student-modal').classList.add('hidden')" class="w-full py-2 mt-4 bg-slate-100 rounded-xl font-bold">關閉</button>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
        let allClassData = [], allStudents = [], targetClassId = '', targetSubIdx = 0;

        async function init() {
            const { data: classes } = await sb.from('classes').select('*');
            const { data: students } = await sb.from('students').select('*');
            allClassData = classes || [];
            allStudents = students || [];
            render();
        }

        function render() {
            document.getElementById('classes-container').innerHTML = allClassData.map(cls => `
                <div class="bg-white p-6 rounded-2xl border shadow-sm">
                    <div class="flex justify-between mb-4">
                        <h4 class="font-black text-lg">${cls.name}</h4>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        ${(cls.sub_classes || []).map((sub, i) => `
                            <div class="p-3 bg-slate-50 rounded-xl border">
                                <div class="flex justify-between mb-2">
                                    <span class="font-black text-sm">${sub.name}</span>
                                    <div class="space-x-1">
                                        <button onclick="openStudentModal('${cls.id}', ${i})" class="text-[10px] bg-blue-600 text-white px-2 py-1 rounded">＋加入</button>
                                    </div>
                                </div>
                                <div class="flex flex-wrap gap-1">${(sub.members || []).map(m => `<span class="bg-white px-1.5 py-0.5 border text-[9px] rounded font-bold">${m}</span>`).join('')}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openStudentModal(id, i) { targetClassId = id; targetSubIdx = i; filterStudents(); document.getElementById('student-modal').classList.remove('hidden'); }
        
        function filterStudents() {
            const keyword = document.getElementById('stu-search').value.toLowerCase();
            const grade = document.getElementById('grade-filter').value;
            document.getElementById('student-list-container').innerHTML = allStudents
                .filter(s => s.name.toLowerCase().includes(keyword))
                .map(s => `<div class="p-2 border-b cursor-pointer hover:bg-slate-100" onclick="addStudent('${s.name}')">${s.name}</div>`).join('');
        }

        async function addStudent(name) {
            const cls = allClassData.find(c => c.id === targetClassId);
            let subs = [...cls.sub_classes];
            subs[targetSubIdx].members = [...(subs[targetSubIdx].members || []), name];
            await sb.from('classes').update({ sub_classes: subs }).eq('id', targetClassId);
            init();
        }
        window.onload = init;
    </script>
</body>
</html>
