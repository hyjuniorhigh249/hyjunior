<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>座位排班管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="p-8 bg-slate-100">
    <div class="max-w-6xl mx-auto">
        <div class="flex gap-4 mb-6">
            <select id="subclass-select" onchange="loadSubClass(this.value)" class="p-2 border rounded-lg font-bold"></select>
            <select id="room-select" onchange="loadRoom(this.value)" class="p-2 border rounded-lg font-bold"></select>
            <button onclick="newRoom()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">+ 新增教室</button>
            <button onclick="toggleMode()" id="mode-btn" class="bg-amber-500 text-white px-4 py-2 rounded-lg font-bold">切換：排座位/教室設定</button>
            <button onclick="copySeats()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold">複製其他班座位</button>
        </div>
        <div class="flex gap-8">
            <div id="stu-list" class="w-48 space-y-2"></div>
            <div id="grid" class="grid bg-white p-4 rounded-xl border"></div>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', '...');
        let state = { mode: 'seating', roomId: '', subId: '', seats: {}, room: {}, members: [] };

        async function init() {
            const { data: classes } = await sb.from('classes').select('*');
            const select = document.getElementById('subclass-select');
            classes.forEach(c => (c.sub_classes||[]).forEach((s,i) => select.add(new Option(`${c.name}-${s.name}`, `${c.id}|${i}|${s.members.join(',')}`))));
            loadRooms();
        }

        async function loadRooms() {
            const { data: rooms } = await sb.from('rooms').select('*');
            const rSelect = document.getElementById('room-select');
            rooms.forEach(r => rSelect.add(new Option(r.name, r.id)));
        }

        async function loadRoom(id) {
            state.roomId = id;
            const { data } = await sb.from('rooms').select('*').eq('id', id).single();
            state.room = data;
            renderGrid();
        }

        function toggleMode() {
            state.mode = state.mode === 'seating' ? 'edit' : 'seating';
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.style.gridTemplateColumns = `repeat(${state.room.grid_size.cols}, 60px)`;
            grid.innerHTML = '';
            for(let r=0; r<state.room.grid_size.rows; r++) {
                for(let c=0; c<state.room.grid_size.cols; c++) {
                    const key = `${r}-${c}`;
                    const config = state.room.layout_config[key] || 'normal';
                    const div = document.createElement('div');
                    div.className = `w-[60px] h-[60px] border flex items-center justify-center cursor-pointer ${config === 'hallway' ? 'bg-slate-300' : (config === 'blocked' ? 'bg-red-300' : 'bg-white')}`;
                    div.innerHTML = config === 'blocked' ? 'XX' : (state.seats[key] || '');
                    div.onclick = () => handleCellClick(key, config);
                    grid.appendChild(div);
                }
            }
        }

        function handleCellClick(key, config) {
            if(state.mode === 'edit') {
                if(config === 'normal') state.room.layout_config[key] = 'blocked';
                else if(config === 'blocked') state.room.layout_config[key] = 'hallway';
                else state.room.layout_config[key] = 'normal';
            } else {
                if(config !== 'normal') return;
                state.seats[key] = state.selectedStudent;
            }
            renderGrid();
        }

        async function copySeats() {
            const sourceId = prompt("輸入來源班別ID:");
            const { data } = await sb.from('class_seats').select('*').eq('class_id', sourceId).eq('room_id', state.roomId);
            state.seats = {};
            data.forEach(s => {
                if(state.members.includes(s.student_name)) state.seats[`${s.row_index}-${s.col_index}`] = s.student_name;
            });
            renderGrid();
        }
        
        window.onload = init;
    </script>
</body>
</html>
