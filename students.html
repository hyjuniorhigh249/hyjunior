<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生總檔 - 浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f9; font-size: 13px; }
        .form-input { @apply w-full px-3 py-1.5 border border-slate-200 rounded-lg bg-white focus:ring-2 focus:ring-slate-800 outline-none transition-all font-bold; }
        .stu-table th { position: sticky; top: 0; background: #fff; z-index: 10; padding: 8px 10px; border-bottom: 2px solid #edf2f7; }
        .stu-table td { padding: 6px 10px; border-bottom: 1px solid #f1f5f9; }
        .stu-row { cursor: pointer; transition: all 0.2s; }
        .stu-row:hover { background-color: #f8fafc !important; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        .detail-label { @apply text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1; }
    </style>
</head>
<body class="min-h-screen flex">

    <nav class="w-40 bg-white border-r border-slate-200 p-3 flex flex-col gap-1 shrink-0">
        <div class="font-black text-lg mb-4 text-slate-800 border-b pb-2 text-center italic">浩元行政</div>
        <a href="index.html" class="px-3 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-50 text-sm">🏠 首頁概況</a>
        <a href="students.html" class="px-3 py-2 rounded-lg bg-slate-800 text-white text-sm shadow-md">👤 學生總檔</a>
        <a href="classes.html" class="px-3 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-50 text-sm">👥 班級管理</a>
    </nav>

    <main id="main-content" class="flex-1 flex flex-col min-h-0 relative">
        <div class="bg-white border-b border-slate-200 p-2 px-6 flex items-center justify-between shadow-sm z-20">
            <div class="relative flex-1 max-w-2xl">
                <span class="absolute left-3 top-2 text-slate-400">🔍</span>
                <input type="text" id="global-search" oninput="fetchData()" 
                    placeholder="搜尋姓名、電話、學校、班級..." 
                    class="w-full pl-10 pr-4 py-1.5 border border-slate-200 rounded-full bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-800 outline-none transition-all font-bold">
            </div>
            <div id="status-indicator" class="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-100">
                <div id="status-dot" class="w-2 h-2 bg-emerald-500 rounded-full"></div>
                <span id="status-text" class="text-[10px] font-black text-emerald-600 uppercase">連線正常</span>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 max-w-7xl mx-auto">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-black text-slate-700 text-xs">快速錄入新學生</h3>
                    <button onclick="handleAddStudent()" class="bg-slate-800 text-white px-6 py-1.5 rounded-lg font-black hover:bg-slate-700 shadow-md">確認入庫</button>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-2">
                    <input type="text" id="f-name" class="form-input" placeholder="姓名*">
                    <input type="text" id="f-telO" class="form-input text-emerald-600" placeholder="本人電話">
                    <input type="text" id="f-telP" class="form-input" placeholder="爸爸電話">
                    <input type="text" id="f-telM" class="form-input" placeholder="媽媽電話">
                    <input type="text" id="f-school" class="form-input" placeholder="學校">
                    <input type="text" id="f-addr" class="form-input" placeholder="地址">
                    <input type="text" id="f-note" class="form-input font-normal italic col-span-2" placeholder="備註">
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-w-7xl mx-auto">
                <div class="overflow-x-auto">
                    <table class="stu-table w-full text-left border-collapse">
                        <thead class="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-slate-50">
                            <tr>
                                <th class="w-20">姓名</th>
                                <th class="w-28 text-emerald-600">本人電話</th>
                                <th class="w-28">爸爸電話</th>
                                <th class="w-28">媽媽電話</th>
                                <th class="w-32">所屬班級</th>
                                <th class="w-24">學校</th>
                                <th class="w-12 text-center">加班</th>
                                <th class="w-12 text-center">刪除</th>
                            </tr>
                        </thead>
                        <tbody id="stu-table-body" class="text-slate-600"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="detail-modal" class="modal fixed inset-0 z-[60] items-center justify-center p-4">
        <div class="bg-white rounded-[32px] p-8 w-full max-w-2xl shadow-2xl relative">
            <div class="flex justify-between items-center mb-8 border-b pb-4">
                <div>
                    <h3 class="text-2xl font-black text-slate-800">修改學生資訊</h3>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">浩元行政系統 - 檔案編輯</p>
                </div>
                <button onclick="closeModal('detail-modal')" class="text-slate-300 hover:text-slate-800 text-2xl transition">✕</button>
            </div>
            
            <input type="hidden" id="edit-id">
            
            <div class="grid grid-cols-2 gap-x-8 gap-y-4">
                <div class="space-y-4">
                    <div>
                        <label class="detail-label block">學生姓名*</label>
                        <input type="text" id="edit-name" class="form-input w-full" placeholder="請輸入姓名">
                    </div>
                    <div>
                        <label class="detail-label block">本人手機</label>
                        <input type="text" id="edit-telO" class="form-input w-full text-emerald-600" placeholder="本人手機號碼">
                    </div>
                    <div>
                        <label class="detail-label block">就讀學校</label>
                        <input type="text" id="edit-school" class="form-input w-full" placeholder="目前就讀學校">
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="detail-label block">爸爸電話</label>
                        <input type="text" id="edit-telP" class="form-input w-full" placeholder="父親聯繫電話">
                    </div>
                    <div>
                        <label class="detail-label block">媽媽電話</label>
                        <input type="text" id="edit-telM" class="form-input w-full" placeholder="母親聯繫電話">
                    </div>
                    <div>
                        <label class="detail-label block">通訊地址</label>
                        <input type="text" id="edit-addr" class="form-input w-full" placeholder="寄送講義地址">
                    </div>
                </div>

                <div class="col-span-2 mt-2">
                    <label class="detail-label block">備註資訊</label>
                    <textarea id="edit-note" class="form-input w-full h-24 font-normal italic leading-relaxed" placeholder="輸入其他特殊狀況備註..."></textarea>
                </div>
            </div>

            <div class="mt-8 flex gap-3">
                <button onclick="closeModal('detail-modal')" class="flex-1 py-3 bg-slate-50 text-slate-500 rounded-xl font-black hover:bg-slate-100 transition">取消返回</button>
                <button onclick="saveStudentEdit()" class="flex-1 py-3 bg-slate-800 text-white rounded-xl font-black shadow-lg hover:bg-slate-700 transition active:scale-95">儲存所有修改</button>
            </div>
        </div>
    </div>

    <div id="quick-class-modal" class="modal fixed inset-0 z-[70] items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl">
            <h3 class="text-xl font-black mb-1">分配班級</h3>
            <p id="target-stu-name" class="text-slate-400 font-bold mb-6 text-xs"></p>
            <div id="class-options" class="space-y-2 max-h-64 overflow-y-auto mb-6 pr-2"></div>
            <button onclick="closeModal('quick-class-modal')" class="w-full py-3 bg-slate-100 rounded-xl font-bold text-slate-500">返回</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let students = [], classes = [], selectedName = "";

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = "index.html"; return; }
            fetchData();
        }

        async function fetchData() {
            updateStatus('syncing');
            const keyword = document.getElementById('global-search').value.toLowerCase().trim();
            const { data: classData } = await supabaseClient.from('classes').select('*');
            const { data: stuData } = await supabaseClient.from('students').select('*').order('created_at', { ascending: false });

            classes = classData || [];
            students = stuData || [];
            renderTable(keyword);
            updateStatus('ready');
        }

        function renderTable(keyword) {
            const body = document.getElementById('stu-table-body');
            const filtered = students.filter(s => {
                const myClsNames = classes.filter(c => c.members.includes(s.name)).map(c => c.name).join(' ');
                const content = `${s.name} ${s.tel_o} ${s.tel_p} ${s.tel_m} ${s.school} ${myClsNames}`.toLowerCase();
                return content.includes(keyword);
            });

            body.innerHTML = filtered.map(s => {
                const myCls = classes.filter(c => c.members.includes(s.name));
                return `
                <tr class="stu-row" onclick="openEditModal('${s.id}')">
                    <td class="font-black text-slate-800">${s.name}</td>
                    <td class="font-bold text-emerald-600 font-mono">${s.tel_o || '-'}</td>
                    <td class="font-mono text-slate-500">${s.tel_p || '-'}</td>
                    <td class="font-mono text-slate-500">${s.tel_m || '-'}</td>
                    <td>
                        <div class="flex flex-wrap gap-1">
                            ${myCls.length > 0 ? myCls.map(c => `<span class="px-1.5 py-0.5 bg-slate-800 text-white text-[9px] rounded font-bold">${c.name}</span>`).join('') : '<span class="text-slate-300">未入班</span>'}
                        </div>
                    </td>
                    <td class="text-slate-500 font-bold truncate max-w-[100px]">${s.school || '-'}</td>
                    <td class="text-center" onclick="event.stopPropagation()">
                        <button onclick="openQuickClass('${s.name}')" class="text-base hover:scale-125 transition">➕</button>
                    </td>
                    <td class="text-center" onclick="event.stopPropagation()">
                        <button onclick="deleteStu('${s.id}')" class="text-slate-300 hover:text-rose-500 transition">✕</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function openEditModal(id) {
            const s = students.find(x => x.id === id);
            if (!s) return;
            document.getElementById('edit-id').value = s.id;
            document.getElementById('edit-name').value = s.name;
            document.getElementById('edit-telO').value = s.tel_o || '';
            document.getElementById('edit-telP').value = s.tel_p || '';
            document.getElementById('edit-telM').value = s.tel_m || '';
            document.getElementById('edit-school').value = s.school || '';
            document.getElementById('edit-addr').value = s.addr || '';
            document.getElementById('edit-note').value = s.note || '';
            document.getElementById('detail-modal').classList.add('active');
        }

        async function saveStudentEdit() {
            const id = document.getElementById('edit-id').value;
            const updates = {
                name: document.getElementById('edit-name').value,
                tel_o: document.getElementById('edit-telO').value,
                tel_p: document.getElementById('edit-telP').value,
                tel_m: document.getElementById('edit-telM').value,
                school: document.getElementById('edit-school').value,
                addr: document.getElementById('edit-addr').value,
                note: document.getElementById('edit-note').value
            };
            const { error } = await supabaseClient.from('students').update(updates).eq('id', id);
            if (!error) { closeModal('detail-modal'); fetchData(); }
            else alert("更新失敗：" + error.message);
        }

        async function handleAddStudent() {
            const name = document.getElementById('f-name').value.trim();
            if (!name) return alert("請輸入姓名");
            const { error } = await supabaseClient.from('students').insert([{
                name, tel_o: document.getElementById('f-telO').value,
                tel_p: document.getElementById('f-telP').value, tel_m: document.getElementById('f-telM').value,
                school: document.getElementById('f-school').value, addr: document.getElementById('f-addr').value,
                note: document.getElementById('f-note').value
            }]);
            if (!error) { 
                ['f-name','f-telO','f-telP','f-telM','f-school','f-addr','f-note'].forEach(id => document.getElementById(id).value = '');
                fetchData(); 
            }
        }

        function openQuickClass(name) {
            selectedName = name;
            document.getElementById('target-stu-name').innerText = `加入 ${name} 至活躍班級`;
            const options = document.getElementById('class-options');
            options.innerHTML = classes.filter(c => !c.is_archived).map(c => {
                const isMember = c.members && c.members.includes(name);
                return `<button onclick="${isMember ? '' : `addToClass('${c.id}')`}" class="w-full text-left p-3 rounded-xl border font-bold flex justify-between items-center ${isMember ? 'bg-slate-50 text-slate-300' : 'hover:bg-slate-800 hover:text-white border-slate-200'}">
                    ${c.name} ${isMember ? '<span class="text-[9px]">已在班</span>' : ''}
                </button>`;
            }).join('');
            document.getElementById('quick-class-modal').classList.add('active');
        }

        async function addToClass(cid) {
            const cls = classes.find(c => c.id === cid);
            await supabaseClient.from('classes').update({ members: [...(cls.members || []), selectedName] }).eq('id', cid);
            closeModal('quick-class-modal'); fetchData();
        }

        async function deleteStu(id) {
            if (confirm("確定刪除此學生？")) {
                await supabaseClient.from('students').delete().eq('id', id);
                fetchData();
            }
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function updateStatus(state) {
            const dot = document.getElementById('status-dot'), text = document.getElementById('status-text');
            if (state === 'syncing') { dot.className = "w-2 h-2 bg-amber-500 rounded-full animate-pulse"; text.innerText = "同步中"; }
            else { dot.className = "w-2 h-2 bg-emerald-500 rounded-full"; text.innerText = "連線正常"; }
        }

        window.onload = init;
    </script>
</body>
</html>
