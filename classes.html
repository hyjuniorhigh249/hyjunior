<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級與班別管理 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; color: #1e293b; font-size: 13px; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-open .accordion-content { max-height: 2000px; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-black text-slate-800">班級組織與班別管理</h1>
                <p id="status-text" class="text-[10px] font-bold text-slate-400 mt-0.5">連線檢查中...</p>
            </div>
            <button onclick="openCreateModal()" class="bg-slate-800 text-white px-5 py-1.5 rounded-lg text-sm font-black hover:bg-slate-700 shadow transition active:scale-95">＋ 建立新班級</button>
        </header>

        <div id="classes-container" class="space-y-4"></div>
    </div>

    <div id="class-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[24px] p-6 w-full max-w-lg shadow-2xl">
            <h3 id="modal-title" class="text-lg font-black mb-5">設定班級資訊</h3>
            <input type="hidden" id="m-class-id">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">班級名稱*</label>
                    <input type="text" id="m-class-name" class="w-full p-2.5 border border-slate-200 rounded-xl font-bold">
                </div>
                <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded-xl">
                    <div><label class="text-[10px] font-black text-slate-500 uppercase ml-1">開課日</label><input type="date" id="m-class-start-date" class="w-full p-2 border border-slate-200 rounded-lg text-xs font-bold"></div>
                    <div><label class="text-[10px] font-black text-slate-500 uppercase ml-1">結業日</label><input type="date" id="m-class-end-date" class="w-full p-2 border border-slate-200 rounded-lg text-xs font-bold"></div>
                </div>
                </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeModal('class-modal')" class="flex-1 py-2.5 font-bold text-slate-400">取消</button>
                <button id="save-btn" onclick="saveClass()" class="flex-1 py-2.5 bg-slate-800 text-white rounded-xl font-black">儲存班級</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function init() { fetchClasses(); }

        async function fetchClasses() {
            const { data } = await supabaseClient.from('classes').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('classes-container');
            container.innerHTML = (data || []).map(cls => `
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
                    <div class="p-4 flex items-center justify-between cursor-pointer" onclick="this.parentElement.classList.toggle('accordion-open')">
                        <h4 class="font-black text-lg text-slate-800">${cls.name}</h4>
                        <div class="text-[10px] text-slate-400 font-bold">期間: ${cls.start_date || '未定'} ~ ${cls.end_date || '未定'}</div>
                    </div>
                    <div class="accordion-content p-4 border-t border-slate-100 bg-slate-50">
                        <div class="mb-4">
                            <p class="text-[10px] font-black text-slate-400 uppercase mb-2">子班別列表</p>
                            </div>
                        <button class="text-xs bg-slate-800 text-white px-3 py-1 rounded font-bold">＋ 新增子班別</button>
                    </div>
                </div>
            `).join('');
        }

        function openCreateModal() { document.getElementById('class-modal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        async function saveClass() { 
            /* 儲存邏輯：將 name, start_date, end_date 存入 Supabase */
            closeModal('class-modal'); fetchClasses(); 
        }

        window.onload = init;
    </script>
</body>
</html>
