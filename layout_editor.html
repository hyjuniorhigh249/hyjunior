<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>座位排班管理 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; }
        .grid-canvas { display: grid; gap: 8px; background: #fff; padding: 20px; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: fit-content; }
        .slot { aspect-ratio: 1/1; width: 65px; background: white; border: 2px solid #e2e8f0; border-radius: 0.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s; }
        .slot:hover { border-color: #3b82f6; }
        .slot.is-hallway { background: #cbd5e1; border: none; cursor: default; }
        .slot.is-blocked { background: #fca5a5; border-color: #ef4444; color: white; font-weight: 900; }
        .slot.is-blocked::after { content: "XX"; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-slate-800">座位排班管理</h1>
            <div class="flex gap-2">
                <button onclick="openRoomModal()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-black">+ 新增教室</button>
            </div>
        </header>

        <div class="flex gap-2 mb-6 items-center bg-white p-4 rounded-xl shadow-sm border">
            <select id="subclass-select" onchange="loadSubClass(this.value)" class="p-2 rounded-lg font-bold border outline-none cursor-pointer">
                <option value="">1. 選擇子班別</option>
            </select>
            <span class="text-slate-400 font-bold">▶</span>
            <select id="room-select" onchange="bindRoom(this.value)" class="p-2 rounded-lg font-bold border outline-none cursor-pointer">
                <option value="">2. 為此班選擇教室</option>
            </select>
            <div class="ml-auto flex gap-2">
                <button onclick="openCopyModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-black">複製其他班座位</button>
                <button onclick="openEditRoomModal()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-black">修改教室排數</button>
                <button onclick="toggleMode()" id="mode-btn" class="bg-amber-500 text-white px-4 py-2 rounded-lg font-black">目前模式: 排座位</button>
                <button onclick="saveAll()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-black shadow-lg">儲存所有設定</button>
            </div>
        </div>

        <div class="flex gap-6">
            <div id="unassigned-list" class="w-48 space-y-2 max-h-[600px] overflow-y-auto pr-2"></div>
            <div id="editor-grid" class="grid-canvas"></div>
        </div>
    </div>

    <div id="room-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 id="room-modal-title" class="text-lg font-black mb-4">設定教室</h3>
            <input type="hidden" id="room-id">
            <label class="block text-xs font-bold text-slate-400 mb-1">教室名稱</label>
            <input type="text" id="room-name" class="w-full p-2 border rounded-lg mb-3 font-bold">
            <div class="grid grid-cols-2 gap-2 mb-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">橫向列數 (Rows)</label>
                    <input type="number" id="room-rows" value="5" class="w-full p-2 border rounded-lg font-bold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">直向排數 (Cols)</label>
                    <input type="number" id="room-cols" value="8" class="w-full p-2 border rounded-lg font-bold">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="closeModal('room-modal')" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold">取消</button>
                <button onclick="saveRoomSetup()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-bold">確定</button>
            </div>
        </div>
    </div>

    <div id="copy-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-black mb-4">複製座位</h3>
            <p class="text-xs text-slate-400 font-bold mb-4">僅會複製「同時存在於來源班級與目前班級」的學生座位。</p>
            <select id="copy-source-select" class="w-full p-2 border rounded-lg mb-6 font-bold"></select>
            <div class="flex gap-2">
                <button onclick="closeModal('copy-modal')" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold">取消</button>
                <button onclick="executeCopy()" class="flex-1 py-2 bg-emerald-600 text-white rounded-xl font-bold">執行複製</button>
            </div>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
        let state = { 
            mode: 'seating', 
            allClasses: [], allRooms: [],
            currentClassId: null, currentSubIdx: null, currentRoomId: null, 
            studentSeating: {}, layoutConfig: {}, members: [], selectedStudent: null,
            rows: 5, cols: 8
        };

        async function init() {
            const { data: classes } = await sb.from('classes').select('*');
            const { data: rooms } = await sb.from('rooms').select('*');
            state.allClasses = classes || [];
            state.allRooms = rooms || [];

            const sSelect = document.getElementById('subclass-select');
            sSelect.innerHTML = '<option value="">1. 選擇子班別</option>';
            state.allClasses.forEach(c => {
                (c.sub_classes || []).forEach((sub, i) => {
                    sSelect.add(new Option(`${c.name} - ${sub.name}`, `${c.id}_${i}`));
                });
            });

            refreshRoomSelect();
        }

        function refreshRoomSelect() {
            const rSelect = document.getElementById('room-select');
            rSelect.innerHTML = '<option value="">2. 為此班選擇教室</option>';
            state.allRooms.forEach(r => rSelect.add(new Option(r.name, r.id)));
        }

        async function loadSubClass(val) {
            if(!val) return;
            const [clsId, idx] = val.split('_');
            state.currentClassId = clsId;
            state.currentSubIdx = parseInt(idx);
            
            const cls = state.allClasses.find(c => c.id === clsId);
            state.members = cls.sub_classes[idx].members || [];
            
            const roomId = cls.sub_classes[idx].room_id; 
            if(roomId) {
                document.getElementById('room-select').value = roomId;
                await loadRoom(roomId);
            } else {
                document.getElementById('room-select').value = "";
                document.getElementById('editor-grid').innerHTML = "";
                updateSidebar();
            }
        }

        async function bindRoom(roomId) {
            if(!state.currentClassId || !roomId) return;
            const cls = state.allClasses.find(c => c.id === state.currentClassId);
            cls.sub_classes[state.currentSubIdx].room_id = roomId;
            await sb.from('classes').update({ sub_classes: cls.sub_classes }).eq('id', state.currentClassId);
            await loadRoom(roomId);
        }

        async function loadRoom(roomId) {
            state.currentRoomId = roomId;
            const room = state.allRooms.find(r => r.id === roomId);
            state.layoutConfig = room.layout_config || {};
            state.rows = room.grid_size?.rows || 5;
            state.cols = room.grid_size?.cols || 8;

            // 讀取座位 (關鍵修正：利用 seat_label 區分同一教室下的不同子班別)
            const { data: seats, error } = await sb.from('class_seats').select('*')
                .eq('class_id', state.currentClassId)
                .eq('room_id', roomId)
                .eq('seat_label', String(state.currentSubIdx));
            
            if(error) console.error("讀取座位失敗:", error);

            state.studentSeating = {};
            seats?.forEach(s => state.studentSeating[`${s.row_index}-${s.col_index}`] = s.student_name);
            
            updateSidebar();
            renderGrid();
        }

        function toggleMode() {
            if(!state.currentRoomId) return alert("請先選擇教室");
            state.mode = state.mode === 'seating' ? 'edit' : 'seating';
            const btn = document.getElementById('mode-btn');
            if(state.mode === 'seating') {
                btn.innerText = "目前模式: 排座位";
                btn.className = "bg-amber-500 text-white px-4 py-2 rounded-lg font-black";
            } else {
                btn.innerText = "目前模式: 點擊設定XX/走廊";
                btn.className = "bg-rose-600 text-white px-4 py-2 rounded-lg font-black";
            }
            state.selectedStudent = null;
            updateSidebar();
        }

        function updateSidebar() {
            const list = document.getElementById('unassigned-list');
            if(state.mode === 'edit') {
                list.innerHTML = `<div class="p-4 bg-rose-50 text-rose-600 font-bold rounded-xl text-sm border border-rose-200">您現在處於教室設定模式。<br><br>請直接點擊右側格子來切換「正常 / XX(不可坐) / 走廊」。</div>`;
                return;
            }
            const assigned = Object.values(state.studentSeating);
            list.innerHTML = state.members
                .filter(m => !assigned.includes(m))
                .map(m => `
                    <div onclick="selectStudent('${m}')" 
                         class="p-3 bg-white rounded-xl font-bold border cursor-pointer transition ${state.selectedStudent === m ? 'border-blue-500 bg-blue-50 shadow-md' : 'hover:border-blue-300'}">
                        ${m}
                    </div>
                `).join('');
            if(list.innerHTML === '') list.innerHTML = `<div class="text-sm text-slate-400 font-bold p-2">所有學生皆已入座</div>`;
        }

        function selectStudent(name) { state.selectedStudent = name; updateSidebar(); }

        function renderGrid() {
            if(!state.currentRoomId) return;
            const grid = document.getElementById('editor-grid');
            grid.style.gridTemplateColumns = `repeat(${state.cols}, 1fr)`;
            grid.innerHTML = "";
            
            for (let r = 0; r < state.rows; r++) {
                for (let c = 0; c < state.cols; c++) {
                    const key = `${r}-${c}`;
                    const configState = state.layoutConfig[key] || 'normal';
                    const div = document.createElement('div');
                    div.className = `slot ${configState === 'hallway' ? 'is-hallway' : ''} ${configState === 'blocked' ? 'is-blocked' : ''}`;
                    
                    if (configState === 'normal' && state.studentSeating[key]) {
                        div.innerHTML = `<span class="font-black text-xs text-slate-700">${state.studentSeating[key]}</span>`;
                    }

                    div.onclick = () => handleSlotClick(key, configState);
                    grid.appendChild(div);
                }
            }
        }

        function handleSlotClick(key, configState) {
            if (state.mode === 'edit') {
                if (configState === 'normal') state.layoutConfig[key] = 'blocked';
                else if (configState === 'blocked') state.layoutConfig[key] = 'hallway';
                else state.layoutConfig[key] = 'normal';
                
                if(state.layoutConfig[key] !== 'normal' && state.studentSeating[key]) {
                    delete state.studentSeating[key];
                }
            } else {
                if (configState !== 'normal') return;
                if (state.selectedStudent) {
                    state.studentSeating[key] = state.selectedStudent;
                    state.selectedStudent = null;
                } else if (state.studentSeating[key]) {
                    delete state.studentSeating[key];
                }
            }
            updateSidebar();
            renderGrid();
        }

        async function saveAll() {
            if(!state.currentRoomId) return alert("請先選擇教室");
            
            try {
                // 1. 儲存教室底圖 (XX, 走廊)
                const { error: roomErr } = await sb.from('rooms').update({ layout_config: state.layoutConfig }).eq('id', state.currentRoomId);
                if(roomErr) throw new Error("儲存教室配置失敗: " + roomErr.message);
                
                // 2. 刪除舊座位 (透過 class_id, room_id, seat_label 來定位子班別)
                const { error: delErr } = await sb.from('class_seats').delete()
                    .eq('class_id', state.currentClassId)
                    .eq('room_id', state.currentRoomId)
                    .eq('seat_label', String(state.currentSubIdx));
                
                if(delErr) throw new Error("清理舊座位失敗: " + delErr.message);
                
                // 3. 準備新座位資料
                const insertData = Object.entries(state.studentSeating).map(([key, name]) => ({
                    class_id: state.currentClassId, 
                    room_id: state.currentRoomId, 
                    student_name: name,
                    row_index: parseInt(key.split('-')[0]), 
                    col_index: parseInt(key.split('-')[1]),
                    seat_label: String(state.currentSubIdx) // 將子班別索引存於此
                }));
                
                if(insertData.length > 0) {
                    const { error: insErr } = await sb.from('class_seats').insert(insertData);
                    if(insErr) throw new Error("儲存新座位失敗: " + insErr.message);
                }
                
                alert("✅ 儲存成功！");
            } catch (err) {
                alert("儲存時發生錯誤：\n" + err.message);
            }
        }

        // --- 教室 CRUD Modal ---
        function openRoomModal() {
            document.getElementById('room-id').value = '';
            document.getElementById('room-name').value = '';
            document.getElementById('room-rows').value = 5;
            document.getElementById('room-cols').value = 8;
            document.getElementById('room-modal-title').innerText = "新增教室";
            document.getElementById('room-modal').classList.add('active');
        }
        function openEditRoomModal() {
            if(!state.currentRoomId) return alert("請先選擇教室");
            const r = state.allRooms.find(x => x.id === state.currentRoomId);
            document.getElementById('room-id').value = r.id;
            document.getElementById('room-name').value = r.name;
            document.getElementById('room-rows').value = state.rows;
            document.getElementById('room-cols').value = state.cols;
            document.getElementById('room-modal-title').innerText = "修改目前教室";
            document.getElementById('room-modal').classList.add('active');
        }
        async function saveRoomSetup() {
            const id = document.getElementById('room-id').value;
            const name = document.getElementById('room-name').value;
            const rows = parseInt(document.getElementById('room-rows').value);
            const cols = parseInt(document.getElementById('room-cols').value);
            
            if(!name) return alert("請輸入名稱");
            
            if(id) {
                await sb.from('rooms').update({ name, grid_size: {rows, cols} }).eq('id', id);
            } else {
                await sb.from('rooms').insert([{ name, grid_size: {rows, cols}, layout_config: {} }]);
            }
            closeModal('room-modal');
            window.location.reload(); 
        }

        // --- 複製座位功能 ---
        function openCopyModal() {
            if(!state.currentRoomId) return alert("請先設定本班別的教室！");
            const select = document.getElementById('copy-source-select');
            select.innerHTML = '<option value="">請選擇來源子班別...</option>';
            state.allClasses.forEach(c => {
                (c.sub_classes || []).forEach((sub, i) => {
                    const uniqueId = `${c.id}_${i}`;
                    if(uniqueId !== `${state.currentClassId}_${state.currentSubIdx}`) {
                        select.add(new Option(`${c.name} - ${sub.name}`, uniqueId));
                    }
                });
            });
            document.getElementById('copy-modal').classList.add('active');
        }

        async function executeCopy() {
            const sourceVal = document.getElementById('copy-source-select').value;
            if(!sourceVal) return alert("請選擇來源");

            const [sourceClassId, sourceSubIdx] = sourceVal.split('_');

            // 利用 seat_label 過濾來源子班別
            const { data: seats, error } = await sb.from('class_seats').select('*')
                .eq('class_id', sourceClassId)
                .eq('room_id', state.currentRoomId)
                .eq('seat_label', String(sourceSubIdx));
            
            if(error) return alert("讀取來源座位失敗: " + error.message);
            if(!seats || seats.length === 0) return alert("該來源班別在此教室沒有設定座位。");

            let copyCount = 0;
            seats.forEach(s => {
                if(state.members.includes(s.student_name)) {
                    state.studentSeating[`${s.row_index}-${s.col_index}`] = s.student_name;
                    copyCount++;
                }
            });

            closeModal('copy-modal');
            updateSidebar();
            renderGrid();
            alert(`✅ 複製成功！共複製了 ${copyCount} 位學生的座位。(未報名本班別的學生已被自動略過)`);
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = init;
    </script>
</body>
</html>
