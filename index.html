<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浩元行政雲端系統 - 首頁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; }
        .nav-btn:hover { background-color: #f1f5f9; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body class="min-h-screen flex">

    <nav class="w-44 bg-white border-r border-slate-200 p-4 flex flex-col shrink-0 shadow-sm">
        <div class="font-black text-xl mb-8 text-slate-800 border-b pb-2 text-center italic">浩元行政</div>
        <div class="space-y-1">
            <a href="index.html" class="flex items-center gap-2 px-3 py-2 rounded-lg font-bold bg-slate-800 text-white text-sm">🏠 首頁概況</a>
            <a href="students.html" class="flex items-center gap-2 px-3 py-2 rounded-lg font-bold text-slate-500 nav-btn text-sm">👤 學生總檔</a>
            <a href="classes.html" class="flex items-center gap-2 px-3 py-2 rounded-lg font-bold text-slate-500 nav-btn text-sm">👥 班級管理</a>
        </div>
        
        <div class="mt-auto pt-4 border-t border-slate-100">
            <div id="user-info" class="mb-3 px-2 hidden">
                <p class="text-[10px] font-bold text-slate-400 uppercase">目前登入</p>
                <p id="user-email" class="text-xs font-black text-slate-600 truncate"></p>
            </div>
            <button id="login-btn" onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold text-xs shadow-md hover:bg-blue-700 transition">Google 登入</button>
            <button id="logout-btn" onclick="logout()" class="w-full border border-slate-200 text-slate-400 py-2 rounded-lg font-bold text-xs hover:bg-slate-50 transition hidden">登出</button>
        </div>
    </nav>

    <main class="flex-1 p-8 overflow-y-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-black text-slate-800">系統概況儀表板</h1>
                <p class="text-slate-400 font-bold">歡迎回來，這是今日的營運數據</p>
            </div>
            <div id="current-date" class="text-right font-black text-slate-400 text-sm"></div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card p-6 rounded-2xl shadow-sm border">
                <p class="text-xs font-black text-slate-400 uppercase tracking-widest">總學生人數</p>
                <div class="flex items-end gap-2 mt-2">
                    <span id="stat-students" class="text-4xl font-black text-slate-800">--</span>
                    <span class="text-slate-400 font-bold mb-1">位</span>
                </div>
            </div>
            <div class="glass-card p-6 rounded-2xl shadow-sm border">
                <p class="text-xs font-black text-slate-400 uppercase tracking-widest">目前班級數</p>
                <div class="flex items-end gap-2 mt-2">
                    <span id="stat-classes" class="text-4xl font-black text-slate-800">--</span>
                    <span class="text-slate-400 font-bold mb-1">班</span>
                </div>
            </div>
            <div class="glass-card p-6 rounded-2xl shadow-sm border border-blue-100 bg-blue-50/30">
                <p class="text-xs font-black text-blue-400 uppercase tracking-widest">系統連線狀態</p>
                <div class="flex items-center gap-2 mt-3">
                    <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span class="text-emerald-600 font-black text-lg">雲端同步中</span>
                </div>
            </div>
        </div>

        <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
            <h3 class="font-black text-lg text-slate-700 mb-6">快速功能跳轉</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="location.href='students.html'" class="flex flex-col items-center p-6 rounded-2xl border-2 border-slate-50 hover:border-slate-800 hover:bg-slate-50 transition group">
                    <span class="text-3xl mb-2 group-hover:scale-110 transition">✍️</span>
                    <span class="font-black text-slate-600">錄入新學生</span>
                </button>
                <button onclick="location.href='classes.html'" class="flex flex-col items-center p-6 rounded-2xl border-2 border-slate-50 hover:border-slate-800 hover:bg-slate-50 transition group">
                    <span class="text-3xl mb-2 group-hover:scale-110 transition">🏫</span>
                    <span class="font-black text-slate-600">班級編排</span>
                </button>
                <div class="flex flex-col items-center p-6 rounded-2xl border-2 border-slate-50 bg-slate-50/50 opacity-40 cursor-not-allowed">
                    <span class="text-3xl mb-2">📊</span>
                    <span class="font-black text-slate-400">成績報表</span>
                </div>
                <div class="flex flex-col items-center p-6 rounded-2xl border-2 border-slate-50 bg-slate-50/50 opacity-40 cursor-not-allowed">
                    <span class="text-3xl mb-2">✉️</span>
                    <span class="font-black text-slate-400">群發訊息</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Supabase 初始化
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 登入功能
        async function login() {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/index.html' }
            });
            if (error) alert("登入失敗：" + error.message);
        }

        // 登出功能
        async function logout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        // 檢查登入狀態並抓取數據
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;
                fetchStats();
            }
        }

        // 抓取雲端統計數據
        async function fetchStats() {
            // 抓取學生總數
            const { count: studentCount, error: sError } = await supabase
                .from('students')
                .select('*', { count: 'exact', head: true });
            
            // 抓取班級總數
            const { count: classCount, error: cError } = await supabase
                .from('classes')
                .select('*', { count: 'exact', head: true });

            if (!sError) document.getElementById('stat-students').innerText = studentCount || 0;
            if (!cError) document.getElementById('stat-classes').innerText = classCount || 0;
        }

        // 顯示日期
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW', {
            year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
        });

        window.onload = checkUser;
    </script>
</body>
</html>
