<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浩元行政管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="pip-tool.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; }
        .nav-btn { @apply flex items-center w-full px-4 py-3.5 rounded-xl font-bold text-slate-400 hover:bg-slate-800 hover:text-white transition-all mb-2 ease-in-out; }
        .nav-btn.active { @apply bg-slate-800 text-white shadow-lg ring-1 ring-slate-700; }
        .nav-icon { @apply mr-3 text-lg; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-56 bg-slate-900 p-5 flex flex-col shrink-0 shadow-2xl">
        <div class="mb-10 px-2">
            <div class="text-2xl font-black text-white tracking-tighter italic">浩元行政</div>
            <div class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.2em] mt-1">Management Hub</div>
        </div>

        <nav class="flex-1">
            <p class="text-[10px] font-black text-slate-600 uppercase tracking-widest mb-4 ml-2">主選單</p>
            
            <button onclick="changePage('dashboard.html', this)" class="nav-btn active">
                <span class="nav-icon">📊</span>
                <span class="text-sm">首頁儀表板</span>
            </button>

            <button onclick="changePage('students.html', this)" class="nav-btn">
                <span class="nav-icon">👤</span>
                <span class="text-sm">學生總檔</span>
            </button>

            <button onclick="changePage('classes.html', this)" class="nav-btn">
                <span class="nav-icon">👥</span>
                <span class="text-sm">班級管理</span>
            </button>
        </nav>

        <div class="mt-auto pt-6 border-t border-slate-800">
            <button onclick="startPiP()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-white rounded-2xl font-black text-xs shadow-lg shadow-emerald-900/20 transition-all active:scale-95 flex flex-col items-center gap-1">
                <span class="text-lg">📱</span>
                開啟迷你通訊窗
            </button>
            <div class="text-[9px] text-slate-600 text-center mt-3 font-medium">版本 v2.4.0</div>
        </div>
    </aside>

    <main class="flex-1 bg-slate-100 relative">
        <iframe id="main-content" src="dashboard.html" class="w-full h-full border-none"></iframe>
    </main>

    <script>
        function changePage(url, btn) {
            // 切換 iframe 內容
            const iframe = document.getElementById('main-content');
            
            // 加入淡出效果
            iframe.style.opacity = '0';
            setTimeout(() => {
                iframe.src = url;
                iframe.style.opacity = '1';
            }, 150);

            // 更新按鈕樣式
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
