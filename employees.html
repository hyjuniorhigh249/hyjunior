<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昊學文教 - 員工管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
            .page-break { page-break-after: always; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-blue-800 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">昊學文教行政系統 - 員工管理系統 v2.0</h1>
        <div class="space-x-2">
            <button onclick="openAttendanceModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-md font-bold hover:bg-emerald-700 transition">
                🕒 考勤打卡/匯出
            </button>
            <button onclick="printAllQRs()" class="bg-indigo-600 text-white px-4 py-2 rounded-md font-bold hover:bg-indigo-700 transition">
                🖨️ 合併列印 QR
            </button>
            <button onclick="openModal()" class="bg-white text-blue-800 px-4 py-2 rounded-md font-bold hover:bg-gray-100 transition">
                + 新增員工
            </button>
        </div>
    </nav>

    <div class="p-6 max-w-7xl mx-auto">
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-blue-100 text-blue-800 border-b-2 border-blue-200">
                        <th class="p-4 font-semibold">姓名 (藝名)</th>
                        <th class="p-4 font-semibold">身份別</th>
                        <th class="p-4 font-semibold">手機 / 可授課科目</th>
                        <th class="p-4 font-semibold">薪資設定</th>
                        <th class="p-4 font-semibold">員工 QR 碼</th>
                        <th class="p-4 font-semibold text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="employeeList" class="divide-y divide-gray-200">
                    <tr><td colspan="6" class="p-8 text-center text-gray-500">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="employeeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 flex justify-center items-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-800">新增員工</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto no-scrollbar flex-1">
                <form id="employeeForm" onsubmit="saveEmployee(event)" class="space-y-6">
                    <input type="hidden" id="employeeId">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">姓名 (必填)</label>
                            <input type="text" id="name" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">藝名 (必填 - 系統連動用)</label>
                            <input type="text" id="stage_name" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">身份別 (必填)</label>
                            <select id="role_type" required onchange="toggleSalaryFields()" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="全職行政">全職行政</option>
                                <option value="兼職行政">兼職行政</option>
                                <option value="兼職授課">兼職授課</option>
                                <option value="團隊授課">團隊授課</option>
                            </select>
                        </div>

                        <div id="monthlySalaryArea" class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">固定月薪 (元)</label>
                            <input type="number" id="monthly_salary" value="0" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div id="hourlyRateArea" class="col-span-2 hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-1">每小時行政薪資 (元)</label>
                            <input type="number" id="hourly_rate" value="0" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div id="teacherSalaryTip" class="col-span-2 hidden bg-amber-50 text-amber-800 p-3 rounded-md border border-amber-200 text-sm">
                            💡 提示：授課老師身份之每小時薪資「因課而異」，此處無法設定。未來將於「班級管理」與「個指排課」中單獨呈現與計算。
                        </div>

                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">手機 (必填)</label>
                            <input type="text" id="phone" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">可授課科目 (必填)</label>
                            <input type="text" id="teachable_subjects" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">可授課年級 (必填)</label>
                            <input type="text" id="teachable_grades" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <hr class="my-4 border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800">上傳資料 (選填)</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">最高學歷證明</label>
                            <input type="file" id="file_education" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_education" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">良民證</label>
                            <input type="file" id="file_police" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_police" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">講師合約</label>
                            <input type="file" id="file_contract" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_contract" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">存摺封面</label>
                            <input type="file" id="file_bank" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_bank" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">身份證正反面</label>
                            <input type="file" id="file_idcard" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_idcard" class="mt-1 text-xs hidden"></div>
                        </div>
                        <div class="border p-2 rounded-md bg-gray-50">
                            <label class="block text-xs font-medium text-gray-700 mb-1">履歷表</label>
                            <input type="file" id="file_resume" accept="image/*,.pdf" class="w-full text-xs">
                            <div id="link_resume" class="mt-1 text-xs hidden"></div>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="p-4 border-t bg-gray-50 rounded-b-xl flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-5 py-2 bg-gray-300 text-gray-700 rounded-md font-bold hover:bg-gray-400 transition">取消</button>
                <button type="submit" form="employeeForm" id="saveBtn" class="px-5 py-2 bg-blue-600 text-white rounded-md font-bold hover:bg-blue-700 transition">儲存資料</button>
            </div>
        </div>
    </div>

    <div id="attendanceModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 flex justify-center items-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 class="text-2xl font-bold text-gray-800">🕒 員工考勤中心</h2>
                <button onclick="closeAttendanceModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto no-scrollbar flex-1 grid grid-cols-3 gap-6">
                <div class="col-span-1 bg-slate-100 p-4 rounded-lg flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-lg mb-2 text-slate-700">員工卡打卡模擬</h3>
                        <p class="text-xs text-gray-500 mb-4">（實務上使用QR條碼槍對準此欄位掃描輸入）</p>
                        <input type="text" id="qrInput" placeholder="請將游標點在此處並掃描QR碼..." onkeypress="handleQRScan(event)" class="w-full border border-gray-300 rounded p-2 text-sm bg-white mb-4 outline-none focus:ring-2 focus:ring-emerald-500">
                        <div class="space-y-2">
                            <p class="text-xs font-bold text-gray-600">手動快捷打卡測試：</p>
                            <select id="manualEmpSelect" class="w-full border p-2 text-sm rounded bg-white"></select>
                            <div class="grid grid-cols-2 gap-2 mt-2">
                                <button onclick="manualClock('in')" class="bg-emerald-600 text-white p-2 text-sm font-bold rounded hover:bg-emerald-700">上班打卡</button>
                                <button onclick="manualClock('out')" class="bg-orange-600 text-white p-2 text-sm font-bold rounded hover:bg-orange-700">下班打卡</button>
                            </div>
                        </div>
                    </div>
                    <div id="clockStatusMsg" class="mt-4 p-3 bg-white border rounded text-center text-sm font-bold text-slate-700 min-h-[50px]">
                        等待刷卡...
                    </div>
                </div>
                <div class="col-span-2 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg text-slate-700">今日打卡動態</h3>
                        <button onclick="exportAttendanceToExcel()" class="bg-emerald-700 text-white text-sm px-3 py-1.5 rounded font-bold hover:bg-emerald-800 transition">
                            📥 匯出考勤 EXCEL (.xlsx)
                        </button>
                    </div>
                    <div class="border rounded-md overflow-hidden flex-1 max-h-[350px] overflow-y-auto bg-white">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-100 text-slate-700">
                                <tr>
                                    <th class="p-3">姓名(身份別)</th>
                                    <th class="p-3">打卡日期</th>
                                    <th class="p-3">上班時間</th>
                                    <th class="p-3">下班時間</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceLogList" class="divide-y">
                                <tr><td colspan="4" class="p-4 text-center text-gray-400">暫無今日資料</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="printArea" class="hidden"></div>

    <script>
        // ==========================================
        // 1. 初始化 Supabase
        // ==========================================
        const SUPABASE_URL = 'https://hlelxeiwamvrntsxnram.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM';
        const empSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let globalEmployees = [];

        // ==========================================
        // 2. 核心功能：讀取員工列表並渲染
        // ==========================================
        async function fetchEmployees() {
            const listContainer = document.getElementById('employeeList');
            if (!listContainer) return;
            listContainer.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500">載入中...</td></tr>';
            
            try {
                const { data, error } = await empSupabase
                    .from('employees')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error("讀取失敗", error);
                    listContainer.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-red-500 font-bold">讀取失敗！請確認是否已執行 SQL 升級。</td></tr>';
                    return;
                }

                listContainer.innerHTML = '';
                globalEmployees = data;
                
                // 同步更新手動打卡下拉選單
                const manualSelect = document.getElementById('manualEmpSelect');
                if(manualSelect) {
                    manualSelect.innerHTML = data.map(e => `<option value="${e.id}">${e.name} (${e.stage_name})</option>`).join('');
                }

                if (!data || data.length === 0) {
                    listContainer.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500">目前沒有員工資料</td></tr>';
                    return;
                }

                data.forEach(emp => {
                    let docsHtml = '';
                    if(emp.education_cert_url) docsHtml += `<a href="${emp.education_cert_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1">學歷</a>`;
                    if(emp.police_check_url) docsHtml += `<a href="${emp.police_check_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1">良民證</a>`;
                    if(emp.contract_url) docsHtml += `<a href="${emp.contract_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1">合約</a>`;
                    if(emp.bank_passbook_url) docsHtml += `<a href="${emp.bank_passbook_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1">存摺</a>`;
                    if(emp.id_card_url) docsHtml += `<a href="${emp.id_card_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1">身分證</a>`;
                    if(emp.resume_url) docsHtml += `<a href="${emp.resume_url}" target="_blank" class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-1 mb-1">履歷</a>`;
                    if(!docsHtml) docsHtml = '<span class="text-gray-400 text-xs">無檔案</span>';

                    // 處理薪資顯示顯示方式
                    let salaryStr = '';
                    if (emp.role_type === '全職行政') salaryStr = `月薪: $${emp.monthly_salary || 0}`;
                    else if (emp.role_type === '兼職行政') salaryStr = `時薪: $${emp.hourly_rate || 0}`;
                    else salaryStr = `<span class="text-blue-600 font-medium">因課程而異</span>`;

                    const row = `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-4 border-b">
                                <div class="font-bold text-gray-900">${emp.name}</div>
                                <div class="text-sm text-blue-600">${emp.stage_name}</div>
                            </td>
                            <td class="p-4 border-b text-gray-700 font-semibold">${emp.role_type || '全職行政'}</td>
                            <td class="p-4 border-b text-xs text-gray-600">
                                <div>📱 ${emp.phone}</div>
                                <div class="mt-1 text-gray-400">📚 ${emp.teachable_subjects} (${emp.teachable_grades})</div>
                            </td>
                            <td class="p-4 border-b text-sm text-gray-700">${salaryStr}</td>
                            <td class="p-4 border-b">
                                <canvas id="qr_${emp.id}" class="w-16 h-16 inline-block border"></canvas>
                                <button onclick="printSingleQR('${emp.id}')" class="block text-[10px] text-blue-500 hover:underline mt-1">單獨列印</button>
                            </td>
                            <td class="p-4 border-b text-center space-x-2">
                                <button onclick="editEmployee('${emp.id}')" class="bg-yellow-500 text-white px-3 py-1 rounded text-sm hover:bg-yellow-600">編輯</button>
                                <button onclick="deleteEmployee('${emp.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">刪除</button>
                            </td>
                        </tr>
                    `;
                    listContainer.innerHTML += row;

                    // 異步渲染 QR 碼 (用 token 或 id 作為辨識)
                    setTimeout(() => {
                        QRCode.toCanvas(document.getElementById(`qr_${emp.id}`), emp.id, { width: 64, margin: 1 });
                    }, 50);
                });
            } catch (err) {
                console.error(err);
            }
        }

        // ==========================================
        // 3. UI 連動與控制
        // ==========================================
        function toggleSalaryFields() {
            const role = document.getElementById('role_type').value;
            document.getElementById('monthlySalaryArea').classList.add('hidden');
            document.getElementById('hourlyRateArea').classList.add('hidden');
            document.getElementById('teacherSalaryTip').classList.add('hidden');

            if (role === '全職行政') {
                document.getElementById('monthlySalaryArea').classList.remove('hidden');
            } else if (role === '兼職行政') {
                document.getElementById('hourlyRateArea').classList.remove('hidden');
            } else {
                document.getElementById('teacherSalaryTip').classList.remove('hidden');
            }
        }

        function openModal() {
            document.getElementById('employeeForm').reset();
            document.getElementById('employeeId').value = '';
            document.getElementById('modalTitle').innerText = '新增員工';
            toggleSalaryFields();
            document.getElementById('employeeModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('employeeModal').classList.add('hidden'); }

        function editEmployee(id) {
            const emp = globalEmployees.find(e => e.id === id);
            if (!emp) return;
            openModal();
            document.getElementById('modalTitle').innerText = '編輯員工';
            document.getElementById('employeeId').value = emp.id;
            document.getElementById('name').value = emp.name;
            document.getElementById('stage_name').value = emp.stage_name;
            document.getElementById('role_type').value = emp.role_type || '全職行政';
            document.getElementById('monthly_salary').value = emp.monthly_salary || 0;
            document.getElementById('hourly_rate').value = emp.hourly_rate || 0;
            document.getElementById('phone').value = emp.phone;
            document.getElementById('teachable_subjects').value = emp.teachable_subjects;
            document.getElementById('teachable_grades').value = emp.teachable_grades;
            toggleSalaryFields();
        }

        // ==========================================
        // 4. 檔案上傳與資料儲存
        // ==========================================
        async function uploadFile(fileInputId, employeeId, filePrefix) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput.files || fileInput.files.length === 0) return null;
            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const filePath = `${employeeId}_${filePrefix}_${Date.now()}.${fileExt}`;
            const { data, error } = await empSupabase.storage.from('employee_documents').upload(filePath, file, { upsert: true });
            if (error) return null;
            const { data: publicUrlData } = empSupabase.storage.from('employee_documents').getPublicUrl(filePath);
            return publicUrlData.publicUrl;
        }

        async function saveEmployee(event) {
            event.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            
            const empId = document.getElementById('employeeId').value;
            const isEditing = empId !== '';

            const basicData = {
                name: document.getElementById('name').value,
                stage_name: document.getElementById('stage_name').value,
                role_type: document.getElementById('role_type').value,
                monthly_salary: parseFloat(document.getElementById('monthly_salary').value) || 0,
                hourly_rate: parseFloat(document.getElementById('hourly_rate').value) || 0,
                phone: document.getElementById('phone').value,
                teachable_subjects: document.getElementById('teachable_subjects').value,
                teachable_grades: document.getElementById('teachable_grades').value
            };

            try {
                let currentEmpId = empId;
                if (!isEditing) {
                    const { data, error } = await empSupabase.from('employees').insert([basicData]).select();
                    if (error) throw error;
                    currentEmpId = data[0].id;
                } else {
                    const { error } = await empSupabase.from('employees').update(basicData).eq('id', currentEmpId);
                    if (error) throw error;
                }

                // 處理多檔案上传
                const files = ['education', 'police', 'contract', 'bank', 'idcard', 'resume'];
                const fileUpdates = {};
                for(let f of files) {
                    let url = await uploadFile(`file_${f}`, currentEmpId, f);
                    if(url) fileUpdates[`${f === 'education' ? 'education_cert' : f === 'idcard' ? 'id_card' : f === 'bank' ? 'bank_passbook' : f === 'police' ? 'police_check' : f}_url`] = url;
                }

                if (Object.keys(fileUpdates).length > 0) {
                    await empSupabase.from('employees').update(fileUpdates).eq('id', currentEmpId);
                }

                alert("儲存成功！");
                closeModal();
                fetchEmployees();
            } catch (err) {
                alert("錯誤：" + err.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteEmployee(id) {
            if (confirm("確定要刪除此員工嗎？")) {
                await empSupabase.from('employees').delete().eq('id', id);
                fetchEmployees();
            }
        }

        // ==========================================
        // 5. 智慧考勤打卡核心邏輯 (支援 QR 槍與快捷打卡)
        // ==========================================
        function openAttendanceModal() {
            document.getElementById('attendanceModal').classList.remove('hidden');
            fetchTodayAttendance();
            setTimeout(() => document.getElementById('qrInput').focus(), 100);
        }
        function closeAttendanceModal() { document.getElementById('attendanceModal').classList.add('hidden'); }

        // 自動捕捉條碼槍輸入並在按下 Enter 時進行智慧打卡
        async function handleQRScan(e) {
            if (e.key === 'Enter') {
                const empId = document.getElementById('qrInput').value.trim();
                document.getElementById('qrInput').value = '';
                if(empId) await executeClockAction(empId);
            }
        }

        // 手動打卡快捷按鈕
        async function manualClock(type) {
            const empId = document.getElementById('manualEmpSelect').value;
            await executeClockAction(empId, type);
        }

        // 核心智慧上下班自動判定判定程序
        async function executeClockAction(empId, forcedType = null) {
            const emp = globalEmployees.find(e => e.id === empId);
            const msgBox = document.getElementById('clockStatusMsg');
            if(!emp) {
                msgBox.innerHTML = '❌ <span class="text-red-500">無效的員工卡！</span>';
                return;
            }

            const todayStr = new Date().toISOString().split('T')[0];
            
            // 查詢今日是否有打卡紀錄
            const { data, error } = await empSupabase
                .from('employee_attendance')
                .select('*')
                .eq('employee_id', empId)
                .eq('date', todayStr)
                .maybeSingle();

            const nowISO = new Date().toISOString();

            if (!data) {
                // 今日第一次打卡 ➔ 必定為上班
                if(forcedType === 'out') {
                    msgBox.innerHTML = `❌ <span class="text-orange-500">${emp.name} 今日尚未有上班紀錄，無法打下班卡</span>`;
                    return;
                }
                await empSupabase.from('employee_attendance').insert([{ employee_id: empId, clock_in: nowISO, date: todayStr }]);
                msgBox.innerHTML = `🟢 <span class="text-green-600">${emp.name} 上班打卡成功！</span><br><span class="text-xs text-gray-400">${new Date().toLocaleTimeString()}</span>`;
            } else {
                // 今日已有打卡紀錄 ➔ 判定為下班
                if(forcedType === 'in') {
                    msgBox.innerHTML = `🟡 <span class="text-amber-600">${emp.name} 今日已打過上班卡</span>`;
                    return;
                }
                await empSupabase.from('employee_attendance').update({ clock_out: nowISO }).eq('id', data.id);
                msgBox.innerHTML = `🔔 <span class="text-orange-600">${emp.name} 下班打卡成功！</span><br><span class="text-xs text-gray-400">${new Date().toLocaleTimeString()}</span>`;
            }
            fetchTodayAttendance();
        }

        // 讀取打卡清單呈現
        async function fetchTodayAttendance() {
            const container = document.getElementById('attendanceLogList');
            const todayStr = new Date().toISOString().split('T')[0];
            
            const { data, error } = await empSupabase
                .from('employee_attendance')
                .select(`*, employees(name, role_type)`)
                .eq('date', todayStr)
                .order('created_at', { ascending: false });

            if(error || !data || data.length === 0) {
                container.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">今日暫無打卡動態</td></tr>';
                return;
            }

            container.innerHTML = data.map(log => {
                const empName = log.employees ? log.employees.name : '未知員工';
                const empRole = log.employees ? log.employees.role_type : '未知';
                const inTime = log.clock_in ? new Date(log.clock_in).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '---';
                const outTime = log.clock_out ? new Date(log.clock_out).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '<span class="text-red-400 animate-pulse">未下班</span>';
                return `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-bold">${empName} <span class="text-xs font-normal text-gray-400">(${empRole})</span></td>
                        <td class="p-3 text-gray-600">${log.date}</td>
                        <td class="p-3 text-green-600 font-medium">${inTime}</td>
                        <td class="p-3 font-medium">${outTime}</td>
                    </tr>
                `;
            }).join('');
        }

        // ==========================================
        // 6. 匯出完全智慧型考勤 Excel (包含所有時薪行政計算)
        // ==========================================
        async function exportAttendanceToExcel() {
            // 全撈歷史打卡紀錄作報表
            const { data, error } = await empSupabase
                .from('employee_attendance')
                .select(`*, employees(name, stage_name, role_type, hourly_rate, monthly_salary)`)
                .order('date', { ascending: false });

            if(error || !data) {
                alert("暫無考勤資料可匯出");
                return;
            }

            // 轉換整理成乾淨格式
            const excelRows = data.map(log => {
                const emp = log.employees || {};
                
                // 計算總工時 (以小時為單位)
                let hoursWorked = 0;
                if(log.clock_in && log.clock_out) {
                    hoursWorked = ((new Date(log.clock_out) - new Date(log.clock_in)) / (1000 * 60 * 60)).toFixed(2);
                }

                // 計算當班薪資 (僅限兼職行政自動換算)
                let calculatedPay = "課程核算 / 月薪制";
                if(emp.role_type === '兼職行政') {
                    calculatedPay = (hoursWorked * (emp.hourly_rate || 0)).toFixed(0);
                }

                return {
                    "打卡日期": log.date,
                    "員工姓名": emp.name || '',
                    "藝名": emp.stage_name || '',
                    "身份類別": emp.role_type || '',
                    "基本時薪/月薪設定": emp.role_type === '兼職行政' ? `$${emp.hourly_rate}/時` : emp.role_type === '全職行政' ? `$${emp.monthly_salary}/月` : "綁定課程",
                    "上班打卡": log.clock_in ? new Date(log.clock_in).toLocaleString() : '',
                    "下班打卡": log.clock_out ? new Date(log.clock_out).toLocaleString() : '未打卡',
                    "累計當日工時(小時)": parseFloat(hoursWorked),
                    "兼職行政當日薪酬": calculatedPay
                };
            });

            // 呼叫 SheetJS 函式庫生成檔案並下載
            const worksheet = XLSX.utils.json_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "員工考勤結算總表");
            XLSX.writeFile(workbook, `昊學文教_員工考勤結算表_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // ==========================================
        // 7. QR碼 個別列印與合併列印機制
        // ==========================================
        function printSingleQR(id) {
            const emp = globalEmployees.find(e => e.id === id);
            if (!emp) return;
            
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = `
                <div class="p-8 text-center flex flex-col items-center justify-center bg-white border" style="width:300px; margin:auto;">
                    <h2 class="text-xl font-bold text-slate-800">${emp.name} 的識別證</h2>
                    <p class="text-sm text-blue-600 mb-4">(${emp.role_type})</p>
                    <canvas id="print_canvas"></canvas>
                    <p class="text-xs text-gray-500 mt-2">昊學文教行政刷卡專用卡</p>
                </div>
            `;
            
            QRCode.toCanvas(document.getElementById('print_canvas'), emp.id, { width: 200 }, () => {
                window.print();
            });
        }

        function printAllQRs() {
            if(globalEmployees.length === 0) { alert("目前沒有員工可列印"); return; }
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = ''; // 清空

            globalEmployees.forEach((emp, index) => {
                const card = document.createElement('div');
                card.className = "p-6 border text-center inline-block m-4 page-break bg-white shadow-sm";
                card.style.width = "260px";
                card.innerHTML = `
                    <h2 class="text-lg font-bold">${emp.name}</h2>
                    <p class="text-xs text-blue-600 mb-2">${emp.stage_name} / ${emp.role_type}</p>
                    <canvas id="print_all_${emp.id}"></canvas>
                    <p class="text-[10px] text-gray-400 mt-2">昊學文教行政卡</p>
                `;
                printArea.appendChild(card);

                setTimeout(() => {
                    QRCode.toCanvas(document.getElementById(`print_all_${emp.id}`), emp.id, { width: 160, margin:1 });
                    if(index === globalEmployees.length - 1) {
                        window.print();
                    }
                }, index * 40);
            });
        }

        window.onload = fetchEmployees;
    </script>
</body>
</html>
