<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級與班別管理 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; color: #1e293b; font-size: 13px; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-open .accordion-content { max-height: 2000px; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-black text-slate-800">班級組織管理</h1>
            </div>
            <button onclick="openClassModal()" class="bg-slate-800 text-white px-5 py-1.5 rounded-lg text-sm font-black hover:bg-slate-700">＋ 建立新班級</button>
        </header>
        <div id="classes-container" class="space-y-4"></div>
    </div>

    <div id="class-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[24px] p-6 w-full max-w-md shadow-2xl">
            <h3 id="modal-title" class="text-lg font-black mb-5">設定班級資訊</h3>
            <input type="hidden" id="m-class-id">
            <div class="space-y-3">
                <input type="text" id="m-class-name" placeholder="班級名稱*" class="w-full p-2.5 border rounded-xl font-bold">
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="m-class-start" class="p-2 border rounded-lg text-xs" placeholder="開課日">
                    <input type="date" id="m-class-end" class="p-2 border rounded-lg text-xs" placeholder="結業日">
                </div>
                <textarea id="m-class-note" placeholder="備註說明..." class="w-full p-2.5 border rounded-xl h-20"></textarea>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeModal('class-modal')" class="flex-1 py-2 font-bold text-slate-400">取消</button>
                <button onclick="saveClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-black">儲存</button>
            </div>
        </div>
    </div>

    <div id="subclass-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[24px] p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-black mb-4">新增子班別</h3>
            <input type="hidden" id="sub-class-parent-id">
            <div class="space-y-3">
                <input type="text" id="sub-name" placeholder="班別名稱*" class="w-full p-2 border rounded-lg font-bold">
                <input type="text" id="sub-teacher" placeholder="任課老師*" class="w-full p-2 border rounded-lg font-bold">
                <select id="sub-day" class="w-full p-2 border rounded-lg font-bold">
                    <option value="1">每週一</option><option value="2">每週二</option><option value="3">每週三</option>
                    <option value="4">每週四</option><option value="5">每週五</option><option value="6">每週六</option><option value="0">每週日</option>
                </select>
                <div class="grid grid-cols-2 gap-2">
                    <input type="time" id="sub-start" class="p-2 border rounded-lg">
                    <input type="time" id="sub-end" class="p-2 border rounded-lg">
                </div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeModal('subclass-modal')" class="flex-1 py-2 font-bold text-slate-400">取消</button>
                <button onclick="saveSubClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-black">儲存</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allClassData = [];
        const DAYS = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

        async function fetchClasses() {
            const { data } = await supabaseClient.from('classes').select('*').order('created_at', { ascending: false });
            allClassData = data || [];
            document.getElementById('classes-container').innerHTML = allClassData.map(cls => `
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
                    <div class="p-4 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition" onclick="this.parentElement.classList.toggle('accordion-open')">
                        <div>
                            <h4 class="font-black text-lg text-slate-800">${cls.name}</h4>
                            <p class="text-[10px] text-slate-400 font-bold">期間: ${cls.start_date || '未定'} ~ ${cls.end_date || '未定'} | ${cls.note || ''}</p>
                        </div>
                        <div class="flex gap-2" onclick="event.stopPropagation()">
                            <button onclick="openClassModal('${cls.id}')" class="text-[10px] bg-slate-100 px-3 py-1 rounded font-black text-slate-600">編輯</button>
                            <button onclick="deleteClass('${cls.id}')" class="text-[10px] bg-rose-50 px-3 py-1 rounded font-black text-rose-500">刪除</button>
                            <button onclick="openSubClassModal('${cls.id}')" class="text-[10px] bg-slate-800 text-white px-3 py-1 rounded font-black hover:bg-slate-700">＋ 新增班別</button>
                        </div>
                    </div>
                    <div class="accordion-content p-4 border-t border-slate-100 bg-slate-50 space-y-2">
                        ${(cls.sub_classes || []).map((sub, idx) => `
                            <div class="flex justify-between items-center bg-white p-3 rounded-lg border border-slate-200">
                                <div>
                                    <p class="font-black text-slate-700">${sub.name}</p>
                                    <p class="text-[10px] text-slate-400 font-bold">${sub.teacher} | ${DAYS[sub.day]} ${sub.start}-${sub.end}</p>
                                </div>
                                <button onclick="deleteSubClass('${cls.id}', ${idx})" class="text-[10px] text-rose-400 font-bold hover:text-rose-600">刪除</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // --- 班級(父)相關邏輯 ---
        function openClassModal(id = null) {
            if(id) {
                const cls = allClassData.find(c => c.id === id);
                document.getElementById('m-class-id').value = cls.id;
                document.getElementById('m-class-name').value = cls.name;
                document.getElementById('m-class-start').value = cls.start_date || "";
                document.getElementById('m-class-end').value = cls.end_date || "";
                document.getElementById('m-class-note').value = cls.note || "";
            } else {
                document.getElementById('m-class-id').value = "";
                document.getElementById('m-class-name').value = "";
            }
            openModal('class-modal');
        }

        async function saveClass() {
            const id = document.getElementById('m-class-id').value;
            const payload = {
                name: document.getElementById('m-class-name').value,
                start_date: document.getElementById('m-class-start').value || null,
                end_date: document.getElementById('m-class-end').value || null,
                note: document.getElementById('m-class-note').value
            };
            if(id) await supabaseClient.from('classes').update(payload).eq('id', id);
            else await supabaseClient.from('classes').insert([payload]);
            closeModal('class-modal'); fetchClasses();
        }

        async function deleteClass(id) { if(confirm("確定刪除此班級？")) { await supabaseClient.from('classes').delete().eq('id', id); fetchClasses(); } }

        // --- 班別(子)相關邏輯 ---
        function openSubClassModal(parentId) {
            document.getElementById('sub-class-parent-id').value = parentId;
            openModal('subclass-modal');
        }

        async function saveSubClass() {
            const parentId = document.getElementById('sub-class-parent-id').value;
            const cls = allClassData.find(c => c.id === parentId);
            const sub = {
                name: document.getElementById('sub-name').value,
                teacher: document.getElementById('sub-teacher').value,
                day: document.getElementById('sub-day').value,
                start: document.getElementById('sub-start').value,
                end: document.getElementById('sub-end').value
            };
            await supabaseClient.from('classes').update({ sub_classes: [...(cls.sub_classes || []), sub] }).eq('id', parentId);
            closeModal('subclass-modal'); fetchClasses();
        }

        async function deleteSubClass(parentId, index) {
            const cls = allClassData.find(c => c.id === parentId);
            const updatedSubs = cls.sub_classes.filter((_, i) => i !== index);
            await supabaseClient.from('classes').update({ sub_classes: updatedSubs }).eq('id', parentId);
            fetchClasses();
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = () => fetchClasses();
    </script>
</body>
</html>
