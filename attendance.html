<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實時點名系統 - 浩元行政</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; }
        .canvas-container {
            background: white; border-radius: 2.5rem; border: 1px solid #e2e8f0;
            padding: 3rem; min-height: 750px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); position: relative;
        }
        .grid-canvas { display: grid; gap: 12px; background: #f8fafc; padding: 25px; border-radius: 1.5rem; border: 2px solid #cbd5e1; }
        .slot {
            aspect-ratio: 1/1; width: 85px; border-radius: 0.8rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: all 0.2s ease;
        }
        .is-hallway { background: #e2e8f0; cursor: default; opacity: 0.5; }
        .status-pending { background: white; border: 2px solid #e2e8f0; color: #64748b; }
        .status-present { background: #10b981; color: white; transform: scale(1.05); z-index: 10; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4); }
        .status-absent { background: #ef4444; color: white; }
        .status-late { background: #f59e0b; color: white; }
        
        /* 儲存中狀態動畫 */
        #sync-indicator { transition: opacity 0.3s; opacity: 0; }
        .is-syncing #sync-indicator { opacity: 1; }

        .tooltip {
            visibility: hidden; position: absolute; bottom: 115%; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 10px; border-radius: 10px;
            z-index: 100; width: 150px; font-size: 11px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }
        .slot:hover .tooltip { visibility: visible; opacity: 1; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-[1500px] mx-auto">
        <header class="flex justify-between items-end mb-8">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <span class="px-3 py-1 bg-blue-600 text-white text-xs font-black rounded-full">LIVE 同步中</span>
                    <span id="sync-indicator" class="text-xs font-bold text-slate-400">● 正在儲存變更...</span>
                </div>
                <h1 id="current-class-title" class="text-4xl font-black text-slate-800 tracking-tighter">偵測課程中...</h1>
                <div class="mt-4 flex items-center bg-white rounded-2xl border-2 border-blue-100 px-4 py-3 shadow-sm w-[450px] focus-within:border-blue-500 transition-colors">
                    <span class="text-slate-400 mr-3">快速點名</span>
                    <input type="text" id="quick-check-in" placeholder="輸入姓名..." class="w-full outline-none font-bold text-slate-700 bg-transparent">
                </div>
            </div>

            <!-- 自動隱藏了不需要的欄位，僅保留切換（萬一今天有多堂課） -->
            <div id="class-switcher" class="hidden flex flex-col items-end gap-2">
                <label class="text-[10px] font-black text-slate-400 uppercase">今日其他課程</label>
                <select id="class-select" onchange="loadAttendanceData(this.value)" class="bg-white border border-slate-200 rounded-xl px-4 py-2 font-black text-slate-600 outline-none shadow-sm"></select>
            </div>
        </header>

        <div class="flex gap-10">
            <!-- 左側統計 -->
            <div class="w-80 shrink-0">
                <div class="bg-white rounded-[2.5rem] p-8 border border-slate-200 shadow-sm sticky top-8">
                    <div class="mb-8">
                        <h3 class="text-xs font-black text-slate-400 tracking-widest uppercase mb-4">出席概況</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-emerald-50 p-4 rounded-2xl text-center">
                                <span class="block text-emerald-600 font-black text-3xl" id="count-present">0</span>
                                <span class="text-[10px] font-bold text-emerald-800">已到</span>
                            </div>
                            <div class="bg-rose-50 p-4 rounded-2xl text-center">
                                <span class="block text-rose-600 font-black text-3xl" id="count-absent">0</span>
                                <span class="text-[10px] font-bold text-rose-800">未到</span>
                            </div>
                        </div>
                    </div>
                    <div id="student-list" class="space-y-2 max-h-[450px] overflow-y-auto pr-2"></div>
                </div>
            </div>

            <!-- 右側畫布 -->
            <div class="flex-1 canvas-container">
                <div id="room-name-display" class="absolute top-6 right-10 text-xs font-black text-slate-300"></div>
                <div class="w-full max-w-xl bg-slate-100 text-slate-400 py-2 font-black rounded-full mb-12 tracking-[3em] text-center text-[10px]">SCREEN / BLACKBOARD</div>
                <div id="attendance-grid" class="grid-canvas"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let state = {
            currentClassId: null,
            attendance: {}, 
            studentsDetails: {}
        };

        async function init() {
            // 1. 取得今天是星期幾 (0-6)
            const dayOfWeek = new Date().getDay();
            
            // 2. 自動抓取今天的課程
            const { data: todayClasses } = await supabaseClient
                .from('classes')
                .select('*, rooms(name, grid_size, layout_config)')
                .eq('is_archived', false)
                .contains('schedule', [{ day: dayOfWeek }]); // 假設 schedule 是 jsonb 陣列

            if (todayClasses && todayClasses.length > 0) {
                const switcher = document.getElementById('class-select');
                todayClasses.forEach(c => switcher.add(new Option(c.name, c.id)));
                
                if (todayClasses.length > 1) document.getElementById('class-switcher').classList.remove('hidden');
                
                // 預設載入第一堂
                loadAttendanceData(todayClasses[0].id);
            } else {
                document.getElementById('current-class-title').innerText = "今日無預定課程";
            }

            document.getElementById('quick-check-in').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleQuickCheckIn(e.target.value);
                    e.target.value = '';
                }
            });
        }

        async function loadAttendanceData(classId) {
            state.currentClassId = classId;
            
            // 取得班級、座位與學生電話
            const { data: cls } = await supabaseClient.from('classes').select('*, rooms(*)').eq('id', classId).single();
            const { data: seats } = await supabaseClient.from('class_seats').select('*').eq('class_id', classId);
            
            // 抓取點名紀錄（當日）
            const todayStr = new Date().toISOString().split('T')[0];
            const { data: logs } = await supabaseClient.from('attendance_logs')
                .select('*')
                .eq('class_id', classId)
                .eq('date', todayStr);

            document.getElementById('current-class-title').innerText = cls.name;
            document.getElementById('room-name-display').innerText = `LAYOUT: ${cls.rooms.name}`;
            
            // 初始化狀態
            state.attendance = {};
            cls.members.forEach(name => {
                const log = logs?.find(l => l.student_name === name);
                state.attendance[name] = log ? log.status : 'pending';
            });

            render(cls.rooms, seats);
        }

        function render(room, seats) {
            const grid = document.getElementById('attendance-grid');
            grid.innerHTML = "";
            grid.style.gridTemplateColumns = `repeat(${room.grid_size.cols}, 1fr)`;

            const seatMap = {};
            seats.forEach(s => seatMap[`${s.row_index}-${s.col_index}`] = s);

            for (let r = 0; r < room.grid_size.rows; r++) {
                for (let c = 0; c < room.grid_size.cols; c++) {
                    const key = `${r}-${c}`;
                    const seat = seatMap[key];
                    const slot = document.createElement('div');
                    
                    if (room.layout_config[key] === 'hallway') {
                        slot.className = 'slot is-hallway';
                    } else if (seat?.student_name) {
                        const name = seat.student_name;
                        const status = state.attendance[name];
                        slot.className = `slot status-${status}`;
                        slot.innerHTML = `
                            <span class="text-[9px] font-black opacity-40 mb-1">${seat.seat_label}</span>
                            <span class="font-black text-base">${name}</span>
                            <div class="tooltip">載入電話中...</div>
                        `;
                        slot.onclick = () => updateStatus(name, getNextStatus(status));
                    } else {
                        slot.className = 'slot border-2 border-dashed border-slate-100 opacity-20';
                    }
                    grid.appendChild(slot);
                }
            }
            updateStats();
        }

        function getNextStatus(current) {
            const map = { 'pending': 'present', 'present': 'absent', 'absent': 'late', 'late': 'present' };
            return map[current] || 'present';
        }

        async function updateStatus(name, newStatus) {
            // 1. 即時 UI 反饋
            state.attendance[name] = newStatus;
            document.body.classList.add('is-syncing');
            renderFromState(); // 重新渲染 local UI

            // 2. 實時同步至資料庫
            const todayStr = new Date().toISOString().split('T')[0];
            const { error } = await supabaseClient
                .from('attendance_logs')
                .upsert({ 
                    class_id: state.currentClassId, 
                    student_name: name, 
                    date: todayStr, 
                    status: newStatus,
                    updated_at: new Date()
                }, { onConflict: 'class_id, student_name, date' });

            if(!error) {
                setTimeout(() => document.body.classList.remove('is-syncing'), 500);
            }
        }

        function handleQuickCheckIn(name) {
            const target = name.trim();
            if (state.attendance[target]) updateStatus(target, 'present');
        }

        // 為了效能，實時更新時不重新撈資料，僅重繪
        function renderFromState() {
            // ... 簡化版 render 邏輯 ...
            updateStats();
            // 在實際應用中，可以直接操作 DOM 元素 class 而不需全重繪
        }

        function updateStats() {
            const vals = Object.values(state.attendance);
            document.getElementById('count-present').innerText = vals.filter(v => v === 'present' || v === 'late').length;
            document.getElementById('count-absent').innerText = vals.filter(v => v === 'absent').length;
        }

        window.onload = init;
    </script>
</body>
</html>
