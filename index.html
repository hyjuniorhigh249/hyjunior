<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="pip-tool.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; }
        /* 恢復您習慣的導覽列樣式 */
        .nav-btn { @apply w-full px-4 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 transition-all mb-1 text-left; }
        .nav-btn.active { @apply bg-slate-100 text-slate-900 border border-slate-200 shadow-sm; }
    </style>
</head>
<body class="flex h-screen bg-slate-50 overflow-hidden">

    <aside class="w-44 bg-white border-r border-slate-200 p-4 flex flex-col shrink-0">
        <div onclick="changePage('dashboard.html', null)" class="cursor-pointer mb-8 px-2 group">
            <h1 class="text-xl font-black text-slate-800 italic group-hover:text-blue-600 transition-colors">浩元行政</h1>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">System Home</p>
        </div>

        <nav class="space-y-1 flex-1">
            <button onclick="changePage('students.html', this)" class="nav-btn active">
                <span>👤 學生總檔</span>
            </button>
            <button onclick="changePage('classes.html', this)" class="nav-btn">
                <span>👥 班級管理</span>
            </button>
        </nav>

        <div class="mt-auto pt-4 border-t border-slate-100">
            <button onclick="startPiP()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-black text-xs shadow-sm transition-all active:scale-95">
                開啟迷你通訊窗
            </button>
        </div>
    </aside>

    <main class="flex-1 relative">
        <iframe id="main-content" src="students.html" class="w-full h-full border-none"></iframe>
    </main>

    <script>
        function changePage(url, btn) {
            document.getElementById('main-content').src = url;

            // 更新按鈕樣式
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) {
                btn.classList.add('active');
            } else {
                // 如果是點標題回首頁，不顯示任何按鈕高亮
            }
        }
    </script>
</body>
</html>
