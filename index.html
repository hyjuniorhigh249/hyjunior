<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浩元行政管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="pip-tool.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; }
        .nav-btn { @apply flex items-center w-full px-4 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 transition-all mb-1; }
        .nav-btn.active { @apply bg-slate-800 text-white shadow-lg; }
    </style>
</head>
<body class="flex h-screen bg-slate-100 overflow-hidden">

    <aside class="w-48 bg-white border-r border-slate-200 p-4 flex flex-col shrink-0">
        <div class="mb-8 px-2">
            <h1 class="text-xl font-black text-slate-800 italic">浩元行政</h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Management System</p>
        </div>

        <nav class="space-y-1 flex-1">
            <button onclick="changePage('students.html', this)" class="nav-btn active">
                <span>👤 學生總檔</span>
            </button>
            <button onclick="changePage('classes.html', this)" class="nav-btn">
                <span>👥 班級管理</span>
            </button>
        </nav>

        <div class="mt-auto pt-4 border-t">
            <button onclick="startPiP()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-black text-xs shadow-md transition-all active:scale-95">
                開啟迷你通訊窗
            </button>
        </div>
    </aside>

    <main class="flex-1 relative">
        <iframe id="main-content" src="students.html" class="w-full h-full border-none"></iframe>
    </main>

    <script>
        function changePage(url, btn) {
            // 切換 iframe 內容
            document.getElementById('main-content').src = url;

            // 更新按鈕樣式
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
