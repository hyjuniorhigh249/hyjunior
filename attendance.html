<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點名座位表 - 浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; }
        /* 模擬 Excel 座位格線 */
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* A-F 欄 */
            gap: 10px;
            background: #e2e8f0;
            padding: 15px;
            border-radius: 12px;
        }
        .seat-box {
            background: white;
            aspect-ratio: 1 / 1;
            border: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            font-size: 13px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .seat-box.empty { background: #f1f5f9; border-style: dashed; opacity: 0.6; }
        .seat-box.absent { background: #fee2e2; border-color: #fca5a5; }
        .score-input {
            width: 100%;
            border-bottom: 2px solid #94a3b8;
            text-align: center;
            outline: none;
            font-weight: 800;
            background: transparent;
            color: #1e293b;
        }
        .score-input:focus { border-color: #3b82f6; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-[1500px] mx-auto">
        <!-- 標頭 -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 id="current-class-title" class="text-3xl font-black text-slate-800">載入課程中...</h1>
                <p id="today-date" class="text-slate-400 font-bold text-sm mt-1"></p>
            </div>
            <div class="flex gap-3">
                <select id="class-select" onchange="loadClassData(this.value)" class="px-4 py-2 border-2 border-slate-200 rounded-xl font-bold bg-white outline-none focus:border-slate-800">
                    <option value="">選擇今日班級</option>
                </select>
                <button onclick="saveAllData()" class="bg-slate-800 text-white px-8 py-2 rounded-xl font-black hover:bg-slate-700 transition shadow-lg">儲存今日紀錄</button>
            </div>
        </header>

        <div class="flex gap-6">
            <!-- 左側：座位表區域 -->
            <div class="flex-1 bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                <div class="w-full bg-slate-100 text-slate-400 py-2 text-center font-black rounded-lg mb-8 tracking-[1.5em] text-sm">黑板方向</div>
                
                <div class="grid grid-cols-6 mb-3 px-4 text-center text-slate-400 font-black text-xs">
                    <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span>
                </div>

                <div id="seat-layout" class="seat-grid">
                    <!-- 座位由 JavaScript 生成 -->
                </div>
            </div>

            <!-- 右側：聯絡本資訊欄 -->
            <div class="w-96 space-y-4">
                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                    <h3 class="font-black text-slate-800 mb-5 border-b pb-3 flex items-center gap-2">
                        <span>📝</span> 今日聯絡本
                    </h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase">發放資料</label>
                            <input type="text" id="log-handouts" placeholder="例：段考複習卷" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold mt-1">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase">上課進度</label>
                            <textarea id="log-progress" placeholder="例：第三冊 2-3 完" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold mt-1 h-20"></textarea>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase">回家作業</label>
                            <input type="text" id="log-homework" placeholder="例：講義 P.45-50" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold mt-1">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] font-black text-blue-500 uppercase">本週考試 (自動帶入)</label>
                                <input type="text" id="log-this-exam" class="w-full bg-blue-50 border-none rounded-xl p-3 text-sm font-bold mt-1 text-blue-700">
                            </div>
                            <div>
                                <label class="text-[10px] font-black text-rose-500 uppercase">下週考試</label>
                                <input type="text" id="log-next-exam" placeholder="輸入預計考題" class="w-full bg-rose-50 border-none rounded-xl p-3 text-sm font-bold mt-1 text-rose-700">
                            </div>
                        </div>

                        <div class="pt-6 mt-2 border-t border-dashed flex justify-between items-end">
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase">班級平均分數</p>
                                <p id="avg-display" class="text-4xl font-black text-emerald-500 mt-1">0.0</p>
                            </div>
                            <div class="text-right text-[10px] font-bold text-slate-300">
                                AUTO CALCULATED
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 設定金鑰
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentClassId = null;

        async function init() {
            const now = new Date();
            const days = ["週日","週一","週二","週三","週四","週五","週六"];
            document.getElementById('today-date').innerText = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 (${days[now.getDay()]})`;

            // 抓取今日班級 (依據 schedule_day)
            const { data: classes, error } = await supabaseClient
                .from('classes')
                .select('*')
                .eq('schedule_day', now.getDay())
                .eq('is_archived', false);
            
            const select = document.getElementById('class-select');
            if(classes && classes.length > 0) {
                classes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.innerText = `${c.name} (${c.schedule_start?.slice(0,5)})`;
                    select.appendChild(opt);
                });
                // 預設載入第一個班級
                loadClassData(classes[0].id);
                select.value = classes[0].id;
            } else {
                document.getElementById('current-class-title').innerText = "今日無排定課程";
            }
        }

        async function loadClassData(classId) {
            if(!classId) return;
            currentClassId = classId;

            const { data: cls } = await supabaseClient.from('classes').select('*').eq('id', classId).single();
            document.getElementById('current-class-title').innerText = cls.name;

            // 1. 抓取座位配置 (若 class_seats 無資料則暫用 members 排序)
            const { data: seats } = await supabaseClient.from('class_seats').select('*').eq('class_id', classId);
            renderSeats(cls.members || [], seats || []);

            // 2. 自動帶入上週考試內容
            fetchLastWeekExam(classId);
        }

        async function fetchLastWeekExam(classId) {
            const { data } = await supabaseClient
                .from('class_logs')
                .select('next_exam')
                .eq('class_id', classId)
                .order('log_date', { ascending: false })
                .limit(1);
            
            const input = document.getElementById('log-this-exam');
            input.value = (data && data[0]) ? data[0].next_exam : "無紀錄";
        }

        function renderSeats(members, savedSeats) {
            const container = document.getElementById('seat-layout');
            container.innerHTML = "";
            
            // 建立 30 格 (6x5)
            for (let i = 0; i < 30; i++) {
                const seat = document.createElement('div');
                const studentName = members[i] || null;

                if (studentName) {
                    seat.className = "seat-box shadow-sm";
                    seat.id = `seat-${studentName}`;
                    seat.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-[9px] text-slate-400 font-black">#${i+1}</span>
                            <input type="checkbox" title="標記缺席" onchange="toggleAbsent(this, '${studentName}')" class="w-3 h-3 cursor-pointer">
                        </div>
                        <div class="text-center font-black text-slate-700 text-sm py-1">${studentName}</div>
                        <div>
                            <input type="number" class="score-input" placeholder="--" oninput="calculateAverage()">
                        </div>
                    `;
                } else {
                    seat.className = "seat-box empty";
                    seat.innerHTML = `<span class="m-auto text-slate-300 text-[10px] font-bold">VACANT</span>`;
                }
                container.appendChild(seat);
            }
            calculateAverage();
        }

        function toggleAbsent(cb, name) {
            const card = cb.closest('.seat-box');
            const scoreInput = card.querySelector('.score-input');
            if(cb.checked) {
                card.classList.add('absent');
                scoreInput.value = "";
                scoreInput.disabled = true;
                scoreInput.placeholder = "缺";
            } else {
                card.classList.remove('absent');
                scoreInput.disabled = false;
                scoreInput.placeholder = "--";
            }
            calculateAverage();
        }

        function calculateAverage() {
            const inputs = Array.from(document.querySelectorAll('.score-input'));
            const scores = inputs
                .map(i => parseFloat(i.value))
                .filter(v => !isNaN(v));
            
            const avg = scores.length > 0 ? (scores.reduce((a, b) => a + b) / scores.length).toFixed(1) : "0.0";
            document.getElementById('avg-display').innerText = avg;
            return avg;
        }

        async function saveAllData() {
            if(!currentClassId) return;

            const logData = {
                class_id: currentClassId,
                handouts: document.getElementById('log-handouts').value,
                progress: document.getElementById('log-progress').value,
                homework: document.getElementById('log-homework').value,
                this_week_exam: document.getElementById('log-this-exam').value,
                next_exam: document.getElementById('log-next-exam').value,
                avg_score: calculateAverage()
            };

            // 儲存至 class_logs (使用 upsert 避免重複)
            const { data: log, error: logErr } = await supabaseClient
                .from('class_logs')
                .upsert([logData], { onConflict: 'class_id, log_date' })
                .select();

            if(logErr) {
                alert("儲存失敗：" + logErr.message);
            } else {
                alert("今日課務與成績紀錄已成功儲存！");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
