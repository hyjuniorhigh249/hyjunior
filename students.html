<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生總檔 - 浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f9; font-size: 13px; }
        .form-input { @apply w-full px-4 py-2 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-800 outline-none transition-all font-bold text-slate-700; }
        .detail-label { @apply text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-1; }
        .stu-table th { position: sticky; top: 0; background: #fff; z-index: 10; padding: 10px; border-bottom: 2px solid #edf2f7; }
        .stu-table td { padding: 6px 10px; border-bottom: 1px solid #f1f5f9; }
        .stu-row { cursor: pointer; transition: all 0.2s; }
        .stu-row:hover { background-color: #f8fafc; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); transition: all 0.3s; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="min-h-screen flex">

    <div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shrink-0">
            <h1 class="text-xl font-black text-slate-800 tracking-tight">👥 學生名錄總檔</h1>
            <div class="flex gap-3">
                <input type="text" id="search-input" placeholder="搜尋姓名、電話或學校..." class="px-4 py-2 bg-slate-100 border-none rounded-xl text-xs font-bold w-64 focus:ring-2 focus:ring-slate-800 outline-none transition-all">
                <button onclick="openModal('add-modal')" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-black text-xs hover:bg-slate-700 transition shadow-lg active:scale-95">新增學生</button>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-6">
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left stu-table border-collapse">
                    <thead>
                        <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <th>學生姓名</th>
                            <th>就讀學校</th>
                            <th>年級</th>
                            <th>家長電話</th>
                            <th>緊急聯絡</th>
                        </tr>
                    </thead>
                    <tbody id="stu-list">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-black text-xl text-slate-800">學生詳細資料</h3>
                <button onclick="closeModal('detail-modal')" class="text-slate-300 hover:text-slate-600 transition text-2xl">×</button>
            </div>
            <div class="p-8 space-y-6" id="edit-form">
                <input type="hidden" id="edit-uuid">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="detail-label">學生姓名</label>
                        <input type="text" id="edit-name" class="form-input">
                    </div>
                    <div>
                        <label class="detail-label">年級</label>
                        <input type="text" id="edit-grade" class="form-input">
                    </div>
                </div>
                <div>
                    <label class="detail-label">就讀學校</label>
                    <input type="text" id="edit-school" class="form-input">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="detail-label">家長電話</label>
                        <input type="text" id="edit-parent_phone" class="form-input">
                    </div>
                    <div>
                        <label class="detail-label">緊急聯絡人</label>
                        <input type="text" id="edit-emergency_contact" class="form-input">
                    </div>
                </div>
                <div class="pt-6 flex gap-3">
                    <button onclick="saveStudentEdit()" class="flex-1 bg-slate-800 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-slate-700 transition">儲存修改</button>
                    <button onclick="deleteStu()" class="px-6 py-4 rounded-2xl font-bold text-red-400 hover:bg-red-50 transition">刪除</button>
                </div>
            </div>
        </div>
    </div>

    <div id="add-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8">
            <h3 class="font-black text-xl text-slate-800 mb-6">新增學生資料</h3>
            <div class="space-y-4">
                <input type="text" id="add-name" placeholder="學生姓名" class="form-input">
                <input type="text" id="add-school" placeholder="就讀學校" class="form-input">
                <input type="text" id="add-grade" placeholder="年級" class="form-input">
                <input type="text" id="add-parent_phone" placeholder="家長電話" class="form-input">
                <button onclick="addStudent()" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-black mt-4 shadow-lg">確認新增</button>
                <button onclick="closeModal('add-modal')" class="w-full text-slate-400 font-bold py-2">取消</button>
            </div>
        </div>
    </div>

    <script src="pip-tool.js"></script>
    <script src="sidebar.js"></script>
    <script>
        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseKey = 'YOUR_SUPABASE_KEY';
        const supabaseClient = supabasejs.createClient(supabaseUrl, supabaseKey);

        let students = [];
        let currentEditId = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', fetchData);
        document.getElementById('search-input').addEventListener('input', renderTable);

        async function fetchData() {
            const { data, error } = await supabaseClient.from('students').select('*').order('created_at', { ascending: false });
            if (!error) {
                students = data;
                renderTable();
            }
        }

        function renderTable() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const list = document.getElementById('stu-list');
            const filtered = students.filter(s => 
                (s.name || '').toLowerCase().includes(keyword) || 
                (s.school || '').toLowerCase().includes(keyword) ||
                (s.parent_phone || '').includes(keyword)
            );

            list.innerHTML = filtered.map(s => `
                <tr class="stu-row font-bold text-slate-700" onclick="openEditModal('${s.id}')">
                    <td>${s.name}</td>
                    <td class="text-slate-400">${s.school || '-'}</td>
                    <td><span class="bg-slate-100 px-2 py-1 rounded text-[10px]">${s.grade || '-'}</span></td>
                    <td class="font-mono text-xs">${s.parent_phone || '-'}</td>
                    <td class="text-slate-400 text-xs">${s.emergency_contact || '-'}</td>
                </tr>
            `).join('');
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function openEditModal(uuid) {
            const s = students.find(item => item.id === uuid);
            if (!s) return;
            currentEditId = uuid;
            document.getElementById('edit-name').value = s.name || '';
            document.getElementById('edit-grade').value = s.grade || '';
            document.getElementById('edit-school').value = s.school || '';
            document.getElementById('edit-parent_phone').value = s.parent_phone || '';
            document.getElementById('edit-emergency_contact').value = s.emergency_contact || '';
            openModal('detail-modal');
        }

        async function saveStudentEdit() {
            const updates = {
                name: document.getElementById('edit-name').value,
                grade: document.getElementById('edit-grade').value,
                school: document.getElementById('edit-school').value,
                parent_phone: document.getElementById('edit-parent_phone').value,
                emergency_contact: document.getElementById('edit-emergency_contact').value
            };

            const { data, error } = await supabaseClient
                .from('students')
                .update(updates)
                .eq('id', currentEditId)
                .select(); // 配合 RLS 檢查

            if (error) {
                alert("更新失敗：" + error.message);
            } else if (!data || data.length === 0) {
                alert("更新失敗：可能權限不足或資料不存在。");
            } else {
                closeModal('detail-modal');
                fetchData();
            }
        }

        async function addStudent() {
            const name = document.getElementById('add-name').value;
            if (!name) return alert("請輸入姓名");

            const { error } = await supabaseClient.from('students').insert([{
                name,
                school: document.getElementById('add-school').value,
                grade: document.getElementById('add-grade').value,
                parent_phone: document.getElementById('add-parent_phone').value
            }]);

            if (!error) {
                closeModal('add-modal');
                ['add-name', 'add-school', 'add-grade', 'add-parent_phone'].forEach(id => document.getElementById(id).value = '');
                fetchData();
            }
        }

        async function deleteStu() {
            if (confirm("確定要刪除這位學生嗎？此操作無法還原。")) {
                const { error } = await supabaseClient.from('students').delete().eq('id', currentEditId);
                if (!error) {
                    closeModal('detail-modal');
                    fetchData();
                }
            }
        }

        // 登出功能配合 sidebar.js
        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
