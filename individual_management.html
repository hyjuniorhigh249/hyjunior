<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昊學文教行政系統 - 個指管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <div class="flex-1 flex flex-col p-8 overflow-hidden">
            
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-200 shrink-0">
                <div class="flex items-center gap-6">
                    <h1 class="text-2xl font-bold text-gray-900">個別指導管理</h1>
                    <button onclick="toggleCreationSection()" id="btn-toggle-creation" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-black text-sm shadow-md transition transform hover:-translate-y-0.5 flex items-center gap-2">
                        <span>➕ 展開開單面板</span>
                    </button>
                </div>
                <div class="text-sm text-gray-500 font-bold bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200">
                    當前系統時間：<span id="current-time-display" class="text-blue-700"></span>
                </div>
            </div>

            <div id="creation-section" class="hidden mb-6 shrink-0 transition-all duration-300">
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-[500px]">
                    
                    <div class="flex flex-col border-r xl:border-gray-200 xl:pr-6 h-full min-h-0">
                        <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center shrink-0">
                            <span class="w-6 h-6 bg-blue-600 text-white text-xs rounded-full flex items-center justify-center mr-2">1</span>
                            選擇學生名單
                        </h2>
                        
                        <div class="mb-4 shrink-0">
                            <label class="block text-xs font-bold text-gray-500 mb-1">依智慧年級篩選 (7月自動升級)</label>
                            <select id="filter-grade" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                                <option value="ALL">全部年級</option>
                                <option value="小一">小一</option><option value="小二">小二</option><option value="小三">小三</option>
                                <option value="小四">小四</option><option value="小五">小五</option><option value="小六">小六</option>
                                <option value="國一">國一</option><option value="國二">國二</option><option value="國三">國三</option>
                                <option value="高一">高一</option><option value="高二">高二</option><option value="高三">高三</option>
                            </select>
                        </div>

                        <div class="flex-1 border border-gray-200 rounded-lg p-3 overflow-y-auto space-y-2 bg-slate-50 min-h-0" id="student-list-container">
                            <p class="text-sm text-gray-400 text-center py-6 font-bold">正在從資料庫載入名單...</p>
                        </div>
                        
                        <div class="mt-3 text-xs font-bold text-slate-500 text-right shrink-0" id="selected-count-display">
                            已選定：0 位學生
                        </div>
                    </div>

                    <div class="xl:col-span-2 flex flex-col xl:pl-2 h-full min-h-0 relative">
                        <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center shrink-0">
                            <span class="w-6 h-6 bg-blue-600 text-white text-xs rounded-full flex items-center justify-center mr-2">2</span>
                            設定班型與學費細項
                        </h2>
                        
                        <div class="flex-1 overflow-y-auto pr-2 min-h-0">
                            <form id="individual-class-form" class="grid grid-cols-1 md:grid-cols-3 gap-4 relative">
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">1. 班型</label>
                                    <select id="class-type" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                                        <option value="一對一">一對一</option><option value="一對二">一對二</option><option value="一對四">一對四</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">2. 適用年級</label>
                                    <select id="class-grade" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                                        <option value="小一">小一</option><option value="小二">小二</option><option value="小三">小三</option>
                                        <option value="小四">小四</option><option value="小五">小五</option><option value="小六">小六</option>
                                        <option value="國一">國一</option><option value="國二">國二</option><option value="國三">國三</option>
                                        <option value="高一">高一</option><option value="高二">高二</option><option value="高三">高三</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">3. 課程級別</label>
                                    <select id="course-level" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                                        <option value="國中小">國中小</option><option value="高中">高中</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">4. 科目</label>
                                    <div class="flex space-x-1">
                                        <select id="subject" class="flex-1 border border-gray-300 rounded px-2 py-2 text-sm focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                                            <option value="國文">國文</option><option value="英文">英文</option><option value="數學">數學</option>
                                            <option value="自然">自然</option><option value="社會">社會</option><option value="物理">物理</option>
                                            <option value="化學">化學</option><option value="生物">生物</option><option value="地科">地科</option>
                                            <option value="理化">理化</option><option value="地理">地理</option><option value="歷史">歷史</option>
                                            <option value="公民">公民</option><option value="多益">多益</option><option value="英檢">英檢</option>
                                            <option value="程式">程式</option><option value="日文">日文</option>
                                        </select>
                                        <button type="button" id="btn-add-subject" class="bg-gray-200 text-gray-700 px-2 rounded hover:bg-gray-300 text-xs font-bold transition">+ 新增</button>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">5. 每堂時數 (小時)</label>
                                    <select id="hours-per-session" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                                        <option value="0.5">0.5</option><option value="1" selected>1</option><option value="1.5">1.5</option>
                                        <option value="2">2</option><option value="2.5">2.5</option><option value="3">3</option>
                                        <option value="3.5">3.5</option><option value="4">4</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">6. 每週堂數</label>
                                    <select id="sessions-per-week" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                                        <option value="週一堂">週一堂</option><option value="週二堂">週二堂</option><option value="週三堂">週三堂</option>
                                        <option value="週四堂">週四堂</option><option value="週五堂">週五堂</option><option value="週六堂">週六堂</option><option value="週七堂">週七堂</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">7. 總週數 (1~48)</label>
                                    <input type="number" id="total-weeks" min="1" max="48" value="12" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold text-blue-700">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1">8. 總堂數 (自動)</label>
                                    <input type="text" id="total-sessions" readonly class="w-full bg-slate-100 border border-gray-200 rounded px-3 py-2 font-mono font-bold text-gray-500 cursor-not-allowed">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1">9. 總時數 (自動)</label>
                                    <input type="text" id="total-hours" readonly class="w-full bg-slate-100 border border-gray-200 rounded px-3 py-2 font-mono font-bold text-gray-500 cursor-not-allowed">
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-orange-600 mb-1">10. 學費基底 (自動)</label>
                                    <input type="text" id="tuition-base" readonly class="w-full bg-orange-50 border border-orange-200 rounded px-3 py-2 font-mono font-black text-orange-700 cursor-not-allowed">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1">11. 教材費 (自動每堂$50)</label>
                                    <input type="text" id="materials-fee" readonly class="w-full bg-slate-100 border border-gray-200 rounded px-3 py-2 font-mono font-bold text-gray-500 cursor-not-allowed">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">12. 雜費</label>
                                    <input type="number" id="misc-fee" min="0" value="0" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 font-bold">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-emerald-600 mb-1">13. 優惠折抵金額</label>
                                    <input type="number" id="discount" min="0" value="0" class="w-full border border-emerald-300 rounded px-3 py-2 bg-emerald-50 font-bold text-emerald-700">
                                </div>
                                <div class="md:col-span-2">
                                    <label class="block text-sm font-medium text-gray-600 mb-1">14. 優惠原因說明</label>
                                    <input type="text" id="discount-reason" placeholder="如：無折扣免填 / 兄弟姊妹合報九折" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                                </div>

                                <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 md:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-4 items-center my-1 shadow-sm">
                                    <div class="md:col-span-2">
                                        <span class="text-base font-black text-blue-800 block">15. 應繳總學費金額：</span>
                                        <span class="text-xs font-bold text-blue-600 mt-1">(公式：學費 + 教材費 + 雜費 - 優惠)</span>
                                    </div>
                                    <input type="text" id="total-tuition" readonly class="w-full bg-white border-2 border-blue-400 rounded-lg px-4 py-2 text-2xl font-mono font-black text-blue-700 text-right shadow-inner">
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">16. 排課起始日</label>
                                    <input type="date" id="start-date" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                                    <span class="text-[11px] font-black text-slate-400 block mt-1" id="end-date-preview">預計最末堂：--</span>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">17. 經手承辦人</label>
                                    <input type="text" id="operator" value="系統管理員" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-bold">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1">18. 開單日期 (今日)</label>
                                    <input type="date" id="issue-date" readonly class="w-full bg-slate-100 border border-gray-200 rounded px-3 py-2 text-gray-500 font-bold cursor-not-allowed">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-rose-600 mb-1">19. 繳費期限 (預設3日後)</label>
                                    <input type="date" id="due-date" class="w-full border border-rose-300 rounded px-3 py-2 focus:outline-none focus:border-rose-500 bg-rose-50 font-bold text-rose-700">
                                </div>

                                <div class="md:col-span-3 flex items-center justify-end space-x-3 pt-4 pb-2 sticky bottom-0 bg-white border-t border-slate-100 z-10 mt-2">
                                    <button type="button" id="btn-reset" class="px-5 py-2.5 border border-slate-300 text-slate-600 font-bold rounded-lg hover:bg-slate-100 transition shadow-sm">清空重填</button>
                                    <button type="submit" class="px-8 py-2.5 bg-blue-600 text-white font-black rounded-lg hover:bg-blue-700 shadow-md transition transform hover:-translate-y-0.5">🚀 確立個指班別開單</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col min-h-0">
                <div class="flex justify-between items-center mb-4 shrink-0">
                    <div class="flex items-center gap-3">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center">
                            <span class="w-6 h-6 bg-slate-800 text-white text-xs rounded-full flex items-center justify-center mr-2">3</span>
                            已設立個指班別列表
                        </h2>
                        <span class="text-xs text-slate-400 font-normal hidden md:inline">(系統已自動置頂「待排課」學生)</span>
                        <label class="flex items-center gap-1.5 text-xs font-bold text-slate-500 cursor-pointer hover:text-slate-700 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 ml-2">
                            <input type="checkbox" id="show-expired" class="w-3.5 h-3.5 rounded border-slate-300 cursor-pointer">
                            顯示過期班別
                        </label>
                    </div>
                    <span class="text-xs font-bold bg-slate-100 text-slate-500 px-3 py-1 rounded-full border border-slate-200" id="total-records-count">共 0 位學生</span>
                </div>
                
                <div class="overflow-y-auto flex-1 rounded-lg border border-slate-200 shadow-sm relative">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-slate-100 z-10 shadow-sm">
                            <tr class="text-slate-600 text-sm font-bold border-b border-slate-200">
                                <th class="p-3 w-10 text-center"></th>
                                <th class="p-3">學生姓名</th>
                                <th class="p-3">學校</th>
                                <th class="p-3">年級</th>
                                <th class="p-3">全域狀態摘要</th>
                                <th class="p-3 text-center">操作動作</th>
                            </tr>
                        </thead>
                        <tbody id="classes-list-table-body" class="text-sm divide-y divide-slate-200 bg-white">
                            <tr>
                                <td colspan="6" class="p-8 text-center text-slate-400 font-bold">正在讀取現有開班紀錄...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full p-8 relative max-h-[90vh] flex flex-col border border-slate-200">
            <h3 class="text-2xl font-black text-slate-800 mb-2">⚙️ 編輯個指班別全域設定</h3>
            <p class="text-sm font-bold text-amber-600 mb-6 pb-4 border-b border-slate-200 bg-amber-50 p-2 rounded">
                📝 溫馨提醒：為避免影響已連動的帳單紀錄，若需更換「學生名單」，請刪除此班別重新開單。其餘所有收費、堂數與設定參數皆可在此自由修改！
            </p>
            
            <div class="overflow-y-auto pr-2 flex-1 space-y-6">
                <input type="hidden" id="edit-id">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">班型</label><select id="edit-class-type" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold"><option value="一對一">一對一</option><option value="一對二">一對二</option><option value="一對四">一對四</option></select></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">適用年級</label><select id="edit-class-grade" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold"><option value="小一">小一</option><option value="小二">小二</option><option value="小三">小三</option><option value="小四">小四</option><option value="小五">小五</option><option value="小六">小六</option><option value="國一">國一</option><option value="國二">國二</option><option value="國三">國三</option><option value="高一">高一</option><option value="高二">高二</option><option value="高三">高三</option></select></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">課程級別</label><select id="edit-course-level" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold"><option value="國中小">國中小</option><option value="高中">高中</option></select></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">科目</label><select id="edit-subject" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold"><option value="國文">國文</option><option value="英文">英文</option><option value="數學">數學</option><option value="自然">自然</option><option value="社會">社會</option><option value="物理">物理</option><option value="化學">化學</option><option value="生物">生物</option><option value="地科">地科</option><option value="理化">理化</option><option value="地理">地理</option><option value="歷史">歷史</option><option value="公民">公民</option><option value="多益">多益</option><option value="英檢">英檢</option><option value="程式">程式</option><option value="日文">日文</option></select></div>
                    
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">每堂時數</label><select id="edit-hours-per-session" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold"><option value="0.5">0.5</option><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option><option value="2.5">2.5</option><option value="3">3</option><option value="3.5">3.5</option><option value="4">4</option></select></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">每週堂數</label><select id="edit-sessions-per-week" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold"><option value="週一堂">週一堂</option><option value="週二堂">週二堂</option><option value="週三堂">週三堂</option><option value="週四堂">週四堂</option><option value="週五堂">週五堂</option><option value="週六堂">週六堂</option><option value="週七堂">週七堂</option></select></div>
                    <div><label class="block text-xs font-bold text-blue-600 mb-1">總週數 (修改會連動全域)</label><input type="number" id="edit-total-weeks" min="1" max="48" class="w-full border-2 border-blue-300 rounded px-3 py-2 bg-blue-50 font-black text-blue-800 outline-none"></div>
                    
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">雜費</label><input type="number" id="edit-misc-fee" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold"></div>
                    <div><label class="block text-xs font-bold text-emerald-600 mb-1">優惠折抵金額</label><input type="number" id="edit-discount" class="w-full border border-emerald-300 rounded px-3 py-2 bg-emerald-50 font-bold text-emerald-700"></div>
                    <div class="md:col-span-3"><label class="block text-xs font-bold text-slate-500 mb-1">優惠原因說明</label><input type="text" id="edit-discount-reason" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold"></div>

                    <div><label class="block text-xs font-bold text-slate-500 mb-1">排課起始日</label><input type="date" id="edit-start-date" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold"></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">繳費期限</label><input type="date" id="edit-due-date" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold text-rose-600"></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">經手承辦人</label><input type="text" id="edit-operator" class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 font-bold"></div>
                </div>

                <div class="bg-slate-100 p-4 rounded-xl border border-slate-200 grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div><label class="block text-[10px] font-bold text-slate-400">總堂數</label><input type="text" id="edit-total-sessions" readonly class="w-full bg-transparent font-mono font-bold text-slate-600 outline-none"></div>
                    <div><label class="block text-[10px] font-bold text-slate-400">總時數</label><input type="text" id="edit-total-hours" readonly class="w-full bg-transparent font-mono font-bold text-slate-600 outline-none"></div>
                    <div><label class="block text-[10px] font-bold text-orange-600">學費基底</label><input type="text" id="edit-tuition-base" readonly class="w-full bg-transparent font-mono font-black text-orange-700 outline-none"></div>
                    <div><label class="block text-[10px] font-bold text-slate-400">教材費</label><input type="text" id="edit-materials-fee" readonly class="w-full bg-transparent font-mono font-bold text-slate-600 outline-none"></div>
                    
                    <div class="col-span-2"><label class="block text-[10px] font-bold text-slate-400">排課最末堂 (自動推算)</label><input type="date" id="edit-end-date" readonly class="w-full bg-transparent font-mono font-bold text-slate-600 outline-none cursor-not-allowed"></div>

            d.setDate(d.getDate() + (weeksToAdd * 7));

            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yy}-${mm}-${dd}`;

            const gradeNum = academicYear - parseInt(gradeBaseYear) + 1;
            
            if (gradeNum === 1) return "小一"; if (gradeNum === 2) return "小二"; if (gradeNum === 3) return "小三";
            if (gradeNum === 4) return "小四"; if (gradeNum === 5) return "小五"; if (gradeNum === 6) return "小六";
            if (gradeNum === 7) return "國一"; if (gradeNum === 8) return "國二"; if (gradeNum === 9) return "國三";
            if (gradeNum === 10) return "高一"; if (gradeNum === 11) return "高二"; if (gradeNum === 12) return "高三";

            const totalWeeks = parseInt(document.getElementById('total-weeks').value) || 0;
            const totalSessions = weekSessionsNum * totalWeeks;
            document.getElementById('total-sessions').value = totalSessions + " 堂";

            const totalHours = hoursPerSession * totalSessions;
            document.getElementById('total-hours').value = totalHours.toFixed(1) + " 小時";

            const classType = document.getElementById('class-type').value; 
            const courseLevel = document.getElementById('course-level').value; 
            let hourlyRate = 0;

            if (courseLevel === "國中小") {
                if (classType === "一對一") hourlyRate = 1200; else if (classType === "一對二") hourlyRate = 800; else hourlyRate = 600;
            } else { 
                if (classType === "一對一") hourlyRate = 1450; else if (classType === "一對二") hourlyRate = 1000; else hourlyRate = 800;
            }

            if (sessionsPerWeekStr === "週二堂") {
                if (classType === "一對一") hourlyRate -= 150; else if (classType === "一對二") hourlyRate -= 100; else hourlyRate -= 50;
            } else if (weekSessionsNum >= 3) { 
                if (classType === "一對一") hourlyRate -= 300; else if (classType === "一對二") hourlyRate -= 200; else hourlyRate -= 100; 
            }

            const tuitionBase = hourlyRate * totalHours;
            document.getElementById('tuition-base').value = Math.round(tuitionBase);
            const materialsFee = 50 * totalSessions;
            document.getElementById('materials-fee').value = materialsFee;

        // ==========================================
        // 🔥 先進先出 (FIFO) 專屬資金池沖銷引擎
        // ==========================================
        async function fetchIndividualClasses() {
            try {
                const { data: classes, error } = await sb.from('individual_classes').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                
                // 強制陣列轉換防呆
                classDataCache = (classes || []).map(c => {
                    if (typeof c.student_ids === 'string') {
                        try { c.student_ids = JSON.parse(c.student_ids); } catch(e) { c.student_ids = []; }
                    }
                    if (!Array.isArray(c.student_ids)) c.student_ids = [];
                    return c;
                });

                let payments = [];
                let bills = [];
                try {
                    const { data: p } = await sb.from('payment_logs').select('*');
                    payments = p || [];
                } catch(e) {}
                try {
                    const { data: b } = await sb.from('student_bills').select('*');
                    bills = b || [];
                } catch(e) {}
                
                // 計算每堂課真實應繳總額
                classDataCache.forEach(ic => {
                    const b = bills.find(x => x.class_id === ic.id && x.sub_idx === 0) || { discount_amount: Number(ic.discount) || 0 };
                    ic.actual_total_tuition = (Number(ic.tuition)||0) + (Number(ic.materials_fee)||0) + (Number(ic.misc_fee)||0) - b.discount_amount;
                });

                classPayments = {};

                // 建立每個學生的課程群組
                let studentClasses = {};
                classDataCache.forEach(ic => {
                    ic.student_ids.forEach(stu => {
                        if (!studentClasses[stu.student_id]) studentClasses[stu.student_id] = [];
                        studentClasses[stu.student_id].push(ic);
                    });
                });

                // 針對每一位學生獨立進行 FIFO 沖銷
                for (let stuId in studentClasses) {
                    // 將單據依開單日期由舊到新排序 (確保舊帳優先扣款)
                    studentClasses[stuId].sort((a, b) => new Date(a.issue_date || a.created_at) - new Date(b.issue_date || b.created_at));
                    
                    let stuPayments = payments.filter(p => p.student_id === stuId);
                    
                    // 建立學生的可用資金池 (錢包)
                    let allocatedPool = {}; 
                    let generalPool = 0; 
                    
                    stuPayments.forEach(p => {
                        if (Array.isArray(p.allocation_details) && p.allocation_details.length > 0) {
                            p.allocation_details.forEach(alloc => {
                                let cname = alloc.class_name;
                                if (!allocatedPool[cname]) allocatedPool[cname] = 0;
                                allocatedPool[cname] += (Number(alloc.amount) || 0);
                            });
                        } else {
                            generalPool += (Number(p.amount) || 0);
                        }
                    });

                    // 依序由舊單到新單沖銷
                    studentClasses[stuId].forEach(ic => {
                        let payable = ic.actual_total_tuition;
                        let paidForThis = 0;
                        const exactKey = `個指班-${ic.subject} (${ic.class_type})`;
                        
                        // 1. 精準名稱資金池扣款
                        if (allocatedPool[exactKey] > 0) {
                            let deduct = Math.min(payable, allocatedPool[exactKey]);
                            paidForThis += deduct;
                            allocatedPool[exactKey] -= deduct; // 扣完就沒了，新單不能再用
                            payable -= deduct;
                        }
                        
                        // 2. 模糊匹配資金池扣款 (容錯)
                        if (payable > 0) {
                            for (let key in allocatedPool) {
                                if (allocatedPool[key] > 0 && key.includes('個指') && key.includes(ic.subject)) {
                                    let deduct = Math.min(payable, allocatedPool[key]);
                                    paidForThis += deduct;
                                    allocatedPool[key] -= deduct;
                                    payable -= deduct;
                                }
                            }
                        }

                        // 3. 泛用資金池扣款 (舊版未選明細的繳款)
                        if (payable > 0 && generalPool > 0) {
                            let deduct = Math.min(payable, generalPool);
                            paidForThis += deduct;
                            generalPool -= deduct;
                            payable -= deduct;
                        }

                        if (!classPayments[ic.id]) classPayments[ic.id] = 0;
                        classPayments[ic.id] += paidForThis;
                    });
                }

                classSchedules = {};
                try {
                    const { data: schedules } = await sb.from('individual_schedules').select('individual_class_id, duration_hours');
                    if (schedules) {
                        schedules.forEach(s => {
                            if (!classSchedules[s.individual_class_id]) classSchedules[s.individual_class_id] = { count: 0, hours: 0 };
                            classSchedules[s.individual_class_id].count += 1;
                            classSchedules[s.individual_class_id].hours += parseFloat(s.duration_hours);
                        });
                    }
                } catch(e) {}

                renderIndividualClassesTable();
            } catch (err) { console.error("獲取資料失敗:", err); }
        }

        function renderIndividualClassesTable() {
            const showExpired = document.getElementById('show-expired').checked;
            const today = new Date().toISOString().split('T')[0];
            
            let displayData = classDataCache.filter(item => {
                if (showExpired) return true;
                if (!item.end_date) return true;
                return item.end_date >= today;
            });

            let studentsMap = {};

            displayData.forEach(cls => {
                if(!cls.student_ids || cls.student_ids.length === 0) return;
                
                const tuition = cls.actual_total_tuition;
                const paidAmt = classPayments[cls.id] || 0;
                
                const hasPayment = paidAmt > 0;
                const isPaidClear = tuition <= 0 ? true : (hasPayment && (tuition - paidAmt) <= 0.1);
                
                const schedInfo = classSchedules[cls.id] || { count: 0, hours: 0 };
                const hasSchedules = schedInfo.count > 0;

                cls._paidAmt = paidAmt;
                cls._isPaidClear = isPaidClear;
                cls._hasSchedules = hasSchedules;
                cls._hasPayment = hasPayment;

                let statusLevel = 0; 
                if (isPaidClear && !hasSchedules) statusLevel = 3;      
                else if (!isPaidClear && hasPayment) statusLevel = 2;   
                else if (!hasPayment) statusLevel = 1;                  
                else statusLevel = 0;                                   
                
                cls.student_ids.forEach(stu => {
                    if (!studentsMap[stu.student_id]) {
                        const stuInfo = allStudents.find(s => s.id === stu.student_id) || {};
                        studentsMap[stu.student_id] = {
                            id: stu.student_id,
                            name: stu.student_name || '未知學生',
                            school: stuInfo.school || '未填寫',
                            grade: calculateGradeByBaseYear(stuInfo.grade_base_year),
                            classes: [],
                            priority: 0 
                        };
                    }
                    studentsMap[stu.student_id].classes.push(cls);
                    studentsMap[stu.student_id].priority = Math.max(studentsMap[stu.student_id].priority, statusLevel);
                });
            });

            let groupedStudents = Object.values(studentsMap);
            groupedStudents.sort((a, b) => {
                if (a.priority !== b.priority) return b.priority - a.priority;
                return a.name.localeCompare(b.name);
            });

            const tbody = document.getElementById('classes-list-table-body');
            document.getElementById('total-records-count').innerText = `共 ${groupedStudents.length} 位學生`;
            tbody.innerHTML = "";

            if (groupedStudents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-bold">目前尚無符合的紀錄</td></tr>`;
                return;

            groupedStudents.forEach(stu => {

                } else if (stu.priority === 1) {

                } else {
                    statusBadge = `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-[11px] font-bold border border-emerald-200 shadow-sm">✅ 狀態正常</span>`;
                }

                const parentTr = document.createElement('tr');
                parentTr.className = "hover:bg-slate-50 transition border-b border-slate-200 cursor-pointer group";
                parentTr.onclick = () => toggleStudentRow(stu.id);
                parentTr.innerHTML = `
                    <td class="p-3 text-center text-slate-300 font-bold group-hover:text-blue-500 transition" id="icon-stu-${stu.id}">▶</td>
                    <td class="p-3 font-black text-blue-800 text-base group-hover:text-blue-600">${stu.name}</td>
                    <td class="p-3 font-bold text-slate-600">${stu.school}</td>

                const childTr = document.createElement('tr');
                childTr.id = `child-row-${stu.id}`;
                childTr.className = "hidden bg-slate-50 border-b border-slate-300 shadow-inner";

                    } else {

                            <button onclick="openFullEditModal('${cls.id}')" class="text-[11px] font-bold bg-amber-100 text-amber-700 border border-amber-200 px-2 py-1 rounded hover:bg-amber-200 transition mr-1">全域編輯</button>

                    childTableHtml += `

                childTableHtml += `</tbody></table></div>`;
                childTr.innerHTML = `<td colspan="6" class="p-0">${childTableHtml}</td>`;
                tbody.appendChild(childTr);
            });
        }

        async function openScheduleModal(id) {
            currentScheduleClass = classDataCache.find(c => c.id === id);
            if (!currentScheduleClass) return;

            const studentNames = currentScheduleClass.student_ids.map(s => s.student_name).join(', ');
            document.getElementById('sm-type-grade').innerText = `${currentScheduleClass.class_type} / ${currentScheduleClass.grade}`;
            document.getElementById('sm-subject-student').innerText = `${currentScheduleClass.subject} / ${studentNames}`;
            document.getElementById('sm-sessions-weeks').innerText = `${currentScheduleClass.total_sessions}堂 / 共${currentScheduleClass.total_weeks}週`;
            document.getElementById('sm-target-hours').innerText = `${currentScheduleClass.total_hours} H`;
            
            document.getElementById('sm-rows-container').innerHTML = '';
            
            try {
                const { data } = await sb.from('individual_schedules').select('*').eq('individual_class_id', id).order('class_date');
                if (data && data.length > 0) {
                    data.forEach(sched => {
                        addScheduleRow({
                            date: sched.class_date,
                            startTime: sched.start_time.substring(0,5),
                            endTime: sched.end_time.substring(0,5),
                            subject: sched.subject,
                            teacherId: sched.teacher_id,
                            rateLevel: sched.rate_level,
                            examType: sched.exam_type,
                            examMins: sched.exam_minutes
                        });
                    });
                } else {
                    addScheduleRow({
                        date: currentScheduleClass.start_date,
                        subject: currentScheduleClass.subject
                    });
                }
            } catch (err) { console.error("讀取排課失敗", err); }

            updateScheduleTotalHours();
            const modal = document.getElementById('schedule-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeScheduleModal() {
            document.getElementById('schedule-modal').classList.add('hidden');
            document.getElementById('schedule-modal').classList.remove('flex');
            currentScheduleClass = null;
        }

        function getDayOfWeekStr(dateStr) {
            if (!dateStr) return '';
            const days = ['日','一','二','三','四','五','六'];
            return `週${days[new Date(dateStr).getDay()]}`;
        }

        function handleTeacherChange(selectElem) {
            const tr = selectElem.closest('tr');
            const role = selectElem.options[selectElem.selectedIndex]?.getAttribute('data-role') || '';
            const rateSelect = tr.querySelector('.rate-level-select');
            
            if (role.includes('行政')) {
                rateSelect.innerHTML = `<option value="0">行政 (0元)</option>`;
                rateSelect.disabled = true;
            } else {
                rateSelect.innerHTML = `
                    <option value="A">A 級別</option>
                    <option value="AA">AA 級別</option>
                    <option value="AAA">AAA 級別</option>
                `;
                rateSelect.disabled = false;
            }
        }

        function calculateRowDuration(tr) {
            const start = tr.querySelector('.time-start').value;
            const end = tr.querySelector('.time-end').value;
            const durationDisplay = tr.querySelector('.row-duration');
            
            if (start && end) {
                let startDt = new Date(`1970-01-01T${start}`);
                let endDt = new Date(`1970-01-01T${end}`);
                let diff = (endDt - startDt) / (1000 * 60 * 60);
                if (diff < 0) diff += 24;
                durationDisplay.innerText = diff.toFixed(2);
                durationDisplay.setAttribute('data-val', diff.toFixed(2));
            } else {
                durationDisplay.innerText = "0.00";
                durationDisplay.setAttribute('data-val', "0");
            }
            updateScheduleTotalHours();
        }

        function updateScheduleTotalHours() {
            const rows = document.querySelectorAll('.row-duration');
            let total = 0;
            rows.forEach(r => total += parseFloat(r.getAttribute('data-val') || 0));
            const display = document.getElementById('sm-current-hours');
            display.innerText = `${total.toFixed(2)} H`;
            
            const target = parseFloat(currentScheduleClass.total_hours);
            if (Math.abs(total - target) > 0.01) {
                display.className = "text-rose-600 text-lg font-black bg-rose-100 px-2 py-0.5 rounded";
            } else {
                display.className = "text-emerald-700 text-lg font-black bg-emerald-100 px-2 py-0.5 rounded";
            }
        }

                <td class="p-2 flex items-center space-x-1">

                </td>
                <td class="p-2">
                    <select class="rate-level-select w-full border-slate-200 rounded-lg text-sm">
                        <option value="A">A 級別</option><option value="AA">AA 級別</option><option value="AAA">AAA 級別</option>
                    </select>
                </td>
                <td class="p-2 flex space-x-1">
                    <select class="input-exam-type border-slate-200 rounded-lg text-sm w-20">
                        <option value="none" ${data.examType==='none'?'selected':''}>不考試</option>
                        <option value="pre" ${data.examType==='pre'?'selected':''}>課前考</option>
                        <option value="post" ${data.examType==='post'?'selected':''}>課後考</option>
                    </select>
                    <input type="number" placeholder="分" value="${data.examMins || ''}" class="input-exam-mins w-16 border-slate-200 rounded-lg text-sm">
                </td>
                <td class="p-2 font-black text-center text-blue-700 row-duration" data-val="0">0.00</td>
                <td class="p-2 text-center">
                    <button onclick="this.closest('tr').remove(); updateScheduleTotalHours();" class="text-rose-500 hover:text-rose-700 font-bold text-lg">&times;</button>
                </td>
            `;
            tbody.appendChild(tr);
            
            const teacherSelect = tr.querySelector('.input-teacher');
            if(teacherSelect.value) handleTeacherChange(teacherSelect);
            
            if(data.rateLevel && data.rateLevel !== '0') {

        function batchGenerateSchedules() {
            const rows = document.querySelectorAll('.sched-row');
            if (rows.length === 0) return alert("⚠️ 請至少先新增一筆課程作為批次產生的範本！");
            
            const templates = Array.from(rows).map(tr => ({
                date: tr.querySelector('.input-date').value,
                startTime: tr.querySelector('.time-start').value,
                endTime: tr.querySelector('.time-end').value,
                subject: tr.querySelector('.input-subject').value,
                teacherId: tr.querySelector('.input-teacher').value,
                rateLevel: tr.querySelector('.rate-level-select').disabled ? '0' : tr.querySelector('.rate-level-select').value,
                examType: tr.querySelector('.input-exam-type').value,
                examMins: tr.querySelector('.input-exam-mins').value
            }));

            const totalWeeks = currentScheduleClass.total_weeks;
            for (let w = 1; w < totalWeeks; w++) {
                templates.forEach(t => {
                    if (!t.date) return;
                    addScheduleRow({
                        ...t,
                        date: addWeeksToDateStr(t.date, w)
                    });
                });
            }
            updateScheduleTotalHours();
        }

        async function saveSchedules() {
            const rows = document.querySelectorAll('.sched-row');
            let totalHrs = 0;
            let insertPayload = [];
            
            for (let i = 0; i < rows.length; i++) {
                const tr = rows[i];
                const date = tr.querySelector('.input-date').value;
                const startTime = tr.querySelector('.time-start').value;
                const endTime = tr.querySelector('.time-end').value;
                const teacherId = tr.querySelector('.input-teacher').value;
                const duration = parseFloat(tr.querySelector('.row-duration').getAttribute('data-val'));
                
                if (!date || !startTime || !endTime || !teacherId) {
                    return alert(`第 ${i+1} 列資料未填寫完整（日期、時間、老師皆必填）！`);
                }
                totalHrs += duration;

                const rowData = {
                    individual_class_id: currentScheduleClass.id,
                    student_id: currentScheduleClass.student_ids[0].student_id, 
                    class_date: date,
                    day_of_week: new Date(date).getDay(),
                    start_time: startTime,
                    end_time: endTime,
                    duration_hours: duration,
                    subject: tr.querySelector('.input-subject').value,
                    teacher_id: teacherId,
                    rate_level: tr.querySelector('.rate-level-select').disabled ? null : tr.querySelector('.rate-level-select').value,
                    exam_type: tr.querySelector('.input-exam-type').value,
                    exam_minutes: parseInt(tr.querySelector('.input-exam-mins').value) || 0
                };
                insertPayload.push(rowData);
            }

            if (Math.abs(totalHrs - currentScheduleClass.total_hours) > 0.01) {
                return alert(`⚠️ 總時數不符！\n此班別開單時設定為：${currentScheduleClass.total_hours} 小時\n您目前排出的總時數為：${totalHrs} 小時\n請修正後再送出。`);
            }

            try {
                const { data: dbSchedules } = await sb.from('individual_schedules').select('individual_class_id, student_id, teacher_id, class_date, start_time, end_time');
                
                for (let newRow of insertPayload) {
                    let newStartDt = new Date(`${newRow.class_date}T${newRow.start_time}`);
                    let newEndDt = new Date(`${newRow.class_date}T${newRow.end_time}`);

                    for (let exist of dbSchedules || []) {
                        if (exist.individual_class_id === currentScheduleClass.id) continue;

                        let existStartDt = new Date(`${exist.class_date}T${exist.start_time}`);
                        let existEndDt = new Date(`${exist.class_date}T${exist.end_time}`);

                        if (newStartDt < existEndDt && newEndDt > existStartDt) {
                            const isSameStudent = currentScheduleClass.student_ids.some(s => s.student_id === exist.student_id);
                            if (isSameStudent) {
                                return alert(`⛔ 學生課程時間衝突！\n\n日期：${newRow.class_date}\n時間：${newRow.start_time} ~ ${newRow.end_time}\n此學生在該時段已有其他排課！`);
                            }
                            if (newRow.teacher_id === exist.teacher_id) {
                                const teacherName = employeesData.find(e => e.id === newRow.teacher_id)?.name || '該老師';
                                return alert(`⛔ 老師課程時間衝突！\n\n日期：${newRow.class_date}\n時間：${newRow.start_time} ~ ${newRow.end_time}\n【${teacherName}】在該時段已被排課！`);
                            }
                        }
                    }
                }

                await sb.from('individual_schedules').delete().eq('individual_class_id', currentScheduleClass.id);
                
                let finalPayload = [];
                currentScheduleClass.student_ids.forEach(student => {
                    insertPayload.forEach(row => {
                        finalPayload.push({ ...row, student_id: student.student_id });
                    });
                });

                const { error } = await sb.from('individual_schedules').insert(finalPayload);
                if (error) throw error;
                
                alert("✅ 排課成功！時數相符且無衝突，資料已寫入！");
                closeScheduleModal();
                await fetchIndividualClasses();

            } catch (err) {
                alert("排課存檔失敗：" + err.message);
            }
        }

        async function deleteClass(id) {
            if (!confirm("⚠️ 確定要刪除此個指單據嗎？刪除後若需退費需於會計系統另外沖銷。")) return;
            try {
                const { error } = await sb.from('individual_classes').delete().eq('id', id);
                if (error) throw error;
                alert("🗑️ 已成功刪除單據。");
                await fetchIndividualClasses();
            } catch (err) { alert("刪除失敗。"); }
        }

        function openFullEditModal(id) {
            const item = classDataCache.find(c => c.id === id);
            if (!item) return;

            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-class-type').value = item.class_type;
            document.getElementById('edit-class-grade').value = item.grade;
            document.getElementById('edit-course-level').value = item.course_level;
            
            const subjSelect = document.getElementById('edit-subject');
            if (!Array.from(subjSelect.options).some(opt => opt.value === item.subject)) {
                subjSelect.add(new Option(item.subject, item.subject));
            }
            subjSelect.value = item.subject;

            document.getElementById('edit-hours-per-session').value = item.hours_per_session;
            document.getElementById('edit-sessions-per-week').value = item.sessions_per_week;
            document.getElementById('edit-total-weeks').value = item.total_weeks;
            document.getElementById('edit-misc-fee').value = item.misc_fee;
            document.getElementById('edit-discount').value = item.discount;
            document.getElementById('edit-discount-reason').value = item.discount_reason || '';
            document.getElementById('edit-start-date').value = item.start_date;
            document.getElementById('edit-operator').value = item.operator;
            document.getElementById('edit-due-date').value = item.due_date;

            performModalCalculations();

            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        document.getElementById('btn-close-modal').addEventListener('click', () => {
            document.getElementById('edit-modal').classList.add('hidden');
            document.getElementById('edit-modal').classList.remove('flex');
        });

        document.getElementById('btn-save-modal').addEventListener('click', async () => {
            const id = document.getElementById('edit-id').value;
            const updateData = {
                class_type: document.getElementById('edit-class-type').value,
                grade: document.getElementById('edit-class-grade').value,
                course_level: document.getElementById('edit-course-level').value,
                subject: document.getElementById('edit-subject').value,
                hours_per_session: parseFloat(document.getElementById('edit-hours-per-session').value),
                sessions_per_week: document.getElementById('edit-sessions-per-week').value,
                total_weeks: parseInt(document.getElementById('edit-total-weeks').value),
                total_sessions: parseInt(document.getElementById('edit-total-sessions').value),
                total_hours: parseFloat(document.getElementById('edit-total-hours').value),
                tuition: parseFloat(document.getElementById('edit-tuition-base').value),
                materials_fee: parseFloat(document.getElementById('edit-materials-fee').value),
                misc_fee: parseFloat(document.getElementById('edit-misc-fee').value) || 0,
                discount: parseFloat(document.getElementById('edit-discount').value) || 0,
                discount_reason: document.getElementById('edit-discount-reason').value,
                total_tuition: parseFloat(document.getElementById('edit-total-tuition').value),
                start_date: document.getElementById('edit-start-date').value,
                end_date: document.getElementById('edit-end-date').value,
                operator: document.getElementById('edit-operator').value,
                due_date: document.getElementById('edit-due-date').value
            };

            try {
                const { error } = await sb.from('individual_classes').update(updateData).eq('id', id);
                if (error) throw error;
                alert("✅ 全域設定修改成功！繳費與堂數皆已同步更新。");
                document.getElementById('edit-modal').classList.add('hidden');
                await fetchIndividualClasses();
            } catch (err) {
                alert("修改更新失敗：" + err.message);
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            document.getElementById('individual-class-form').reset();
            setupDates();
            performCalculations();
            renderStudentList();
        });
    </script>
</body>
