<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>班級組織與成員管理 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        
        /* 隱藏捲軸但可滾動 */
        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col overflow-hidden bg-slate-50">
    
    <header class="flex justify-between items-center mb-6 shrink-0 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <h1 class="text-2xl font-black text-slate-800">班級組織與成員管理</h1>
        <button type="button" onclick="openRateModal()" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl font-black shadow-sm hover:bg-indigo-100 transition border border-indigo-100">
            ⚙️ 鐘點級別設定
        </button>
    </header>
    
    <div class="flex gap-6 flex-1 min-h-0">
        <div class="w-1/3 max-w-sm bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
            <div class="p-4 border-b bg-slate-50 flex justify-between items-center shrink-0 flex-wrap gap-2">
                <div class="flex items-center gap-3">
                    <h2 class="font-black text-slate-700">📂 班級列表</h2>
                    <label class="flex items-center gap-1.5 text-[11px] font-bold text-slate-500 cursor-pointer hover:text-slate-700 bg-white px-2 py-1 rounded shadow-sm border border-slate-200">
                        <input type="checkbox" id="show-expired" class="w-3.5 h-3.5 rounded border-slate-300 cursor-pointer">
                        顯示過期
                    </label>
                </div>
                <button type="button" onclick="openClassModal()" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded-lg font-black shadow-sm hover:bg-slate-700 transition">＋ 主班級</button>
            </div>
            <div id="left-class-list" class="flex-1 overflow-y-auto scroll-area">
                <p class="text-center py-10 text-slate-400 font-bold">讀取中...</p>
            </div>
        </div>

        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
            <div id="right-class-detail" class="flex-1 overflow-y-auto p-6 scroll-area bg-slate-50/50">
                <div class="flex items-center justify-center h-full text-slate-400 font-bold">請從左側選擇或建立班級</div>
            </div>
        </div>
    </div>

    <div id="class-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 id="class-modal-title" class="text-lg font-black mb-4">設定主班級</h3>
            <input type="hidden" id="cls-id">
            
            <label class="block text-xs font-bold text-slate-400 mb-1">主班級名稱*</label>
            <input type="text" id="cls-name" class="w-full p-2 border rounded-lg mb-3 font-bold bg-slate-50 focus:bg-white outline-none">
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">開課日期</label>
                    <input type="date" id="cls-start" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">結業日期</label>
                    <input type="date" id="cls-end" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50">
                </div>
            </div>
            
            <div class="grid grid-cols-3 gap-2 mb-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">預設學費</label><input type="number" id="cls-fee" class="w-full p-2 border rounded-lg font-bold text-emerald-600 bg-slate-50" value="0"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">教材費</label><input type="number" id="cls-textbook" class="w-full p-2 border rounded-lg font-bold bg-slate-50" value="0"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">雜費</label><input type="number" id="cls-misc" class="w-full p-2 border rounded-lg font-bold bg-slate-50" value="0"></div>
            </div>
            
            <label class="block text-xs font-bold text-slate-400 mb-1">備註</label>
            <input type="text" id="cls-note" class="w-full p-2 border rounded-lg mb-6 font-bold bg-slate-50">
            
            <div class="flex gap-2">
                <button type="button" onclick="closeModal('class-modal')" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold hover:bg-slate-200 text-slate-600">取消</button>
                <button type="button" onclick="saveClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700">儲存</button>
            </div>
        </div>
    </div>

    <div id="sub-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto scroll-area">
            <h3 id="sub-modal-title" class="text-lg font-black mb-4">設定子班別</h3>
            <input type="hidden" id="sub-clsId">
            <input type="hidden" id="sub-idx">
            
            <label class="block text-xs font-bold text-slate-400 mb-1">子班別名稱*</label>
            <input type="text" id="sub-name" class="w-full p-2 border rounded-lg mb-3 font-bold bg-slate-50">
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-slate-400 mb-1">每週上課日*</label>
                    <select id="sub-day" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50">
                        <option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option>
                        <option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="0">星期日</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">開始時間</label>
                    <input type="time" id="sub-start" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">結束時間</label>
                    <input type="time" id="sub-end" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">學費</label><input type="number" id="sub-fee" class="w-full p-2 border rounded-lg font-bold text-emerald-600 bg-slate-50"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">教材費</label><input type="number" id="sub-textbook" class="w-full p-2 border rounded-lg font-bold bg-slate-50"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">雜費</label><input type="number" id="sub-misc" class="w-full p-2 border rounded-lg font-bold bg-slate-50"></div>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-3">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">課程級別</label>
                    <select id="sub-course-level" onchange="updateRateDropdown()" class="w-full p-2 border rounded-lg font-bold text-sm bg-indigo-50 text-indigo-700">
                        <option value="國中小">國中小</option>
                        <option value="高中">高中</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">鐘點級別</label>
                    <select id="sub-rate-level" onchange="toggleFixedRate()" class="w-full p-2 border rounded-lg font-bold text-sm bg-purple-50 text-purple-700">
                        </select>
                </div>
            </div>

            <div id="fixed-rate-container" class="mb-3 hidden">
                <label class="block text-xs font-bold text-rose-500 mb-1">設定固定鐘點金額</label>
                <input type="number" id="sub-fixed-rate" class="w-full p-2 border border-rose-200 rounded-lg font-bold text-rose-600 bg-rose-50" placeholder="輸入固定金額...">
            </div>

            <label class="block text-xs font-bold text-slate-400 mb-1">授課老師 (連動在職員工)</label>
            <select id="sub-teacher-id" class="w-full p-2 border rounded-lg mb-6 font-bold bg-slate-50">
                <option value="">請選擇授課老師...</option>
                </select>

            <div class="flex gap-2">
                <button type="button" onclick="closeModal('sub-modal')" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold hover:bg-slate-200 text-slate-600">取消</button>
                <button type="button" onclick="saveSubClass()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700">儲存</button>
            </div>
        </div>
    </div>

    <div id="student-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-lg font-black mb-4">加入學生至子班別</h3>
            <select id="grade-filter" onchange="filterStudents()" class="w-full p-2 border rounded-lg mb-2 font-bold text-sm bg-slate-50">
                <option value="">全部年級</option>
                <script>
                    const grades = ['小一','小二','小三','小四','小五','小六','國一','國二','國三','高一','高二','高三'];
                    grades.forEach((g,i) => document.write(`<option value="${i+1}">${g}</option>`));
                </script>
            </select>
            <input type="text" id="stu-search" oninput="filterStudents()" placeholder="搜尋姓名..." class="w-full p-2 border rounded-lg text-sm font-bold mb-4 bg-slate-50 outline-none focus:bg-white">
            <div id="student-list-container" class="flex-1 overflow-y-auto space-y-1 scroll-area"></div>
            <button type="button" onclick="closeModal('student-modal')" class="w-full py-3 mt-4 bg-slate-100 text-slate-700 hover:bg-slate-200 transition rounded-xl font-black">完成</button>
        </div>
    </div>

    <div id="transfer-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-black mb-4 flex items-center gap-2"><span>🔄</span> 學生無縫轉班</h3>
            <p class="text-sm font-bold text-slate-600 mb-4 bg-slate-50 p-3 rounded-lg border">
                將 <span id="trans-stu-name" class="text-indigo-600 font-black"></span> 從<br>
                <span id="trans-old-sub" class="text-rose-500 font-black mt-1 inline-block"></span><br>
                轉移至：
            </p>
            <input type="hidden" id="trans-clsId">
            <input type="hidden" id="trans-oldIdx">
            <input type="hidden" id="trans-memberValue">
            
            <label class="block text-xs font-bold text-slate-500 mb-1">目標子班別 (已為您排除該生已報名的班級)</label>
            <select id="trans-targetIdx" class="w-full p-2.5 border-2 border-indigo-200 rounded-lg mb-6 font-black bg-indigo-50 text-indigo-800 outline-none focus:border-indigo-500 shadow-inner"></select>
            
            <div class="flex gap-2">
                <button type="button" onclick="closeModal('transfer-modal')" class="flex-1 py-3 bg-slate-100 rounded-xl font-bold hover:bg-slate-200 text-slate-600 transition">取消</button>
                <button type="button" onclick="executeTransfer()" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-black hover:bg-indigo-700 shadow-md transition transform hover:-translate-y-0.5">確認轉班</button>
            </div>
        </div>
    </div>

    <div id="rate-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-3xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-black text-slate-800">⚙️ 鐘點級別全域設定</h3>
                <button type="button" onclick="closeModal('rate-modal')" class="text-slate-400 hover:text-rose-500 font-bold text-lg px-2">✕</button>
            </div>
            
            <div class="flex gap-2 mb-4">
                <button type="button" onclick="switchRateTab('國中小')" id="tab-btn-國中小" class="flex-1 py-2 rounded-lg font-black bg-indigo-600 text-white shadow">國中小標準</button>
                <button type="button" onclick="switchRateTab('高中')" id="tab-btn-高中" class="flex-1 py-2 rounded-lg font-black bg-slate-100 text-slate-600 hover:bg-slate-200">高中標準</button>
            </div>

            <div class="flex-1 overflow-y-auto scroll-area bg-slate-50 rounded-xl border border-slate-200 p-3" id="rate-container">
                <p class="text-center py-10 text-slate-400 font-bold">載入中...</p>
            </div>

            <div class="mt-4">
                <button type="button" onclick="saveRateSettings(this)" class="w-full py-3 bg-slate-800 text-white rounded-xl font-black shadow hover:bg-slate-700 transition">💾 儲存並套用所有變更</button>
            </div>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
        let allClassData = [], allStudents = [], targetClassId = '', targetSubIdx = 0;
        let selectedClassId = null; 
        let stuMap = {}; 
        
        let activeEmployees = []; 
        let allRates = [];
        let currentRateTab = '國中小';
        let draftRates = [];

        const dayMap = { '0': '日', '1': '一', '2': '二', '3': '三', '4': '四', '5': '五', '6': '六' };

        async function init() {
            const [ { data: classes }, { data: students }, { data: employees }, { data: rates, error: rateErr } ] = await Promise.all([
                sb.from('classes').select('*').order('created_at', { ascending: false }),
                sb.from('students').select('*'),
                sb.from('employees').select('id, name, stage_name, status').eq('status', '在職'),
                sb.from('hourly_rate_rules').select('*').order('course_level').order('rate_level').order('min_students')
            ]);

            allClassData = classes || [];
            allStudents = students || [];
            activeEmployees = employees || [];
            if(!rateErr && rates) allRates = rates;

            stuMap = {};
            allStudents.forEach(s => { stuMap[s.id] = s.name; });

            document.getElementById('show-expired').addEventListener('change', renderClassList);

            renderClassList();
            renderTeacherOptions();
        }

        function getMemberDisplayName(m) {
            if (stuMap[m]) return stuMap[m]; 
            if (m.length > 20) return '已刪除學生'; 
            return m; 
        }

        function renderClassList() {
            const leftList = document.getElementById('left-class-list');
            const showExpired = document.getElementById('show-expired').checked;
            const today = new Date().toISOString().split('T')[0];
            
            const displayClasses = allClassData.filter(cls => {
                if (showExpired) return true;
                if (!cls.end_date) return true;
                return cls.end_date >= today;
            });

            if (displayClasses.length > 0 && !selectedClassId) {
                selectedClassId = displayClasses[0].id;
            } else if (displayClasses.length > 0 && !displayClasses.find(c => c.id === selectedClassId)) {
                selectedClassId = displayClasses[0].id;
            } else if (displayClasses.length === 0) {
                selectedClassId = null;
            }

            if (displayClasses.length === 0) {
                leftList.innerHTML = '<p class="text-center py-10 text-slate-400 font-bold">目前無班級資料</p>';
            } else {
                leftList.innerHTML = displayClasses.map(cls => `
                    <div onclick="selectClass('${cls.id}')" class="p-4 border-b cursor-pointer transition-colors ${cls.id === selectedClassId ? 'bg-blue-50 border-l-4 border-l-blue-600' : 'bg-white hover:bg-slate-50 border-l-4 border-l-transparent'}">
                        <h4 class="font-black text-slate-800 ${cls.id === selectedClassId ? 'text-blue-800' : ''}">${cls.name}</h4>
                        <p class="text-[10px] text-slate-500 font-bold mt-1">
                            ${cls.start_date ? cls.start_date.replace(/-/g, '/') : '未定'} ~ ${cls.end_date ? cls.end_date.replace(/-/g, '/') : '未定'}
                        </p>
                    </div>
                `).join('');
            }
            
            renderRightPanel();
        }

        function selectClass(id) {
            selectedClassId = id;
            renderClassList();
        }

        function renderTeacherOptions() {
            const select = document.getElementById('sub-teacher-id');
            select.innerHTML = '<option value="">請選擇授課老師...</option>' + 
                activeEmployees.map(emp => {
                    const displayName = emp.stage_name ? emp.stage_name : emp.name;
                    return `<option value="${emp.id}">${displayName}</option>`;
                }).join('');
        }

        function renderRightPanel() {
            const rightPane = document.getElementById('right-class-detail');
            const cls = allClassData.find(c => c.id === selectedClassId);
            
            if (!cls) {
                rightPane.innerHTML = `<div class="flex items-center justify-center h-full text-slate-400 font-bold">請從左側選擇或建立班級</div>`;
                return;
            }

            rightPane.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 relative">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="font-black text-2xl text-slate-800">${cls.name}</h2>
                            <div class="flex gap-2 mt-2">
                                <span class="text-[11px] text-slate-500 bg-slate-100 px-2 py-1 rounded font-bold border">
                                    預設：學費 $${cls.default_fee||0} | 教材 $${cls.default_textbook_fee||0} | 雜費 $${cls.default_misc_fee||0}
                                </span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button type="button" onclick="openClassModal('${cls.id}')" class="text-xs bg-slate-100 text-slate-600 px-4 py-2 rounded-lg font-black hover:bg-slate-200 transition shadow-sm">⚙️ 編輯</button>
                            <button type="button" onclick="deleteClass('${cls.id}')" class="text-xs bg-rose-50 text-rose-600 px-4 py-2 rounded-lg font-black hover:bg-rose-100 transition shadow-sm">🗑️ 刪除</button>
                        </div>
                    </div>
                    <div class="absolute -bottom-4 right-6">
                        <button type="button" onclick="openSubModal('${cls.id}')" class="text-sm bg-emerald-500 text-white px-5 py-2 rounded-full font-black shadow-lg hover:bg-emerald-600 transition hover:-translate-y-1">＋ 新增子班別</button>
                    </div>
                </div>

                <h3 class="font-black text-slate-700 text-lg mb-4 ml-1">📚 子班別與學生名單</h3>
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                    ${(!cls.sub_classes || cls.sub_classes.length === 0) ? '<div class="col-span-full text-center py-10 text-slate-400 font-bold bg-white rounded-xl border border-dashed">尚無子班別</div>' : ''}
                    ${(cls.sub_classes || []).map((sub, idx) => `
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-3 border-b pb-3">
                                <div>
                                    <p class="font-black text-base text-slate-800 flex items-center gap-2">
                                        ${sub.name} 
                                        <span class="text-[10px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100 tracking-wider">
                                            $${sub.fee||0} / $${sub.textbook_fee||0} / $${sub.misc_fee||0}
                                        </span>
                                    </p>
                                    <p class="text-xs text-slate-500 font-bold mt-1.5 flex items-center gap-1">
                                        🕒 每週${sub.day ? dayMap[sub.day] : '未定'} | ${sub.start || '--:--'} ~ ${sub.end || '--:--'}
                                    </p>
                                    
                                    <div class="flex flex-wrap gap-1 mt-2">
                                        <span class="text-[11px] text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded border border-blue-100">👨‍🏫 老師：${sub.teacher || '未定'}</span>
                                        ${sub.course_level ? `<span class="text-[11px] text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">🎓 ${sub.course_level}</span>` : ''}
                                        ${sub.rate_level ? `<span class="text-[11px] text-purple-600 font-bold bg-purple-50 px-2 py-0.5 rounded border border-purple-100">💰 ${sub.rate_level} ${sub.rate_level === '固定鐘點' ? `($${sub.fixed_rate||0})` : ''}</span>` : ''}
                                    </div>
                                </div>
                                <div class="flex gap-1 flex-col h-fit shrink-0">
                                    <button type="button" onclick="openSubModal('${cls.id}', ${idx})" class="text-[10px] bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg font-black hover:bg-slate-200 text-left">⚙️ 編輯</button>
                                    <button type="button" onclick="deleteSub('${cls.id}', ${idx})" class="text-[10px] bg-rose-50 text-rose-500 px-3 py-1.5 rounded-lg font-black hover:bg-rose-100 text-left">🗑️ 刪除</button>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-slate-400">目前人數: ${(sub.members||[]).length}</span>
                                <button type="button" onclick="openStudentModal('${cls.id}', ${idx})" class="text-[10px] bg-blue-600 text-white px-3 py-1 rounded shadow hover:bg-blue-700 font-black">＋ 加入學生</button>
                            </div>
                            
                            <div class="flex flex-wrap gap-1.5 bg-slate-50 p-2 rounded-lg min-h-[50px] items-start content-start border border-slate-100">
                                ${(sub.members || []).map(m => `

            const targetNames = (cls.sub_classes || []).map(s => `${cls.name}-${s.name}`);

        // ✅ 防呆機制 1+2：刪除子班別前，先檢查是否有報名學生，再檢查是否有學生繳費入帳
        async function deleteSub(clsId, idx) { 
            const cls = allClassData.find(c => c.id === clsId);
            const sub = cls.sub_classes[idx];
            const targetName = `${cls.name}-${sub.name}`;
            
            // 【新增防呆】檢查名單內是否有學生
            if (sub.members && sub.members.length > 0) {
                return alert(`⚠️ 系統阻擋：無法刪除！\n\n此子班別目前尚有「${sub.members.length} 名學生」報名在內。\n請先將學生全部移除或轉班後，才能刪除該子班別。`);
            }

            // 掃描資料庫檢查是否有歷史帳務
            const { data } = await sb.from('payment_logs').select('allocation_details').not('allocation_details', 'is', null);
            const hasPayment = data && data.some(log => log.allocation_details && log.allocation_details.some(a => a.class_name === targetName));
            
            if (hasPayment) {
                return alert("⚠️ 系統阻擋：無法刪除！\n\n此子班別「已有學生繳費紀錄」。\n為確保帳務正確，請先至「會計系統」將相關繳費紀錄【反沖作廢】後，才能進行刪除。");

                init();

        // ✅ 防呆機制 3：從子班別移除學生(×)前，檢查該名學生是否有繳費該班
        async function removeStudent(clsId, idx, memberValue) { 
            const cls = allClassData.find(c => c.id === clsId);
            const sub = cls.sub_classes[idx];
            const targetName = `${cls.name}-${sub.name}`;
            const dispName = getMemberDisplayName(memberValue);
            
            // 轉換為精準的 UUID
            const stu = allStudents.find(s => s.id === memberValue || s.name === memberValue);
            const stuId = stu ? stu.id : memberValue;

            // 針對該學生的繳費紀錄進行掃描
            const { data } = await sb.from('payment_logs')
                .select('allocation_details')
                .eq('student_id', stuId)
                .not('allocation_details', 'is', null);
                
            const hasPayment = data && data.some(log => log.allocation_details && log.allocation_details.some(a => a.class_name === targetName));
            
            if (hasPayment) {
                return alert(`⚠️ 系統阻擋：無法移除！\n\n「${dispName}」在「${targetName}」已有實際繳費紀錄。\n為避免死帳產生，請先將該筆繳費【反沖作廢】後，才能將學生從班級名單中移除。`);
            }

            if(confirm(`確定要將 ${dispName} 從這個班別移除嗎？`)) { 
                let subs = [...cls.sub_classes]; 
                subs[idx].members = subs[idx].members.filter(m => m !== memberValue); 
                await sb.from('classes').update({ sub_classes: subs }).eq('id', clsId); 
                init(); 
            } 
        }

        // ✅ 核心黑科技：學生無縫轉班機制 (含目標防呆)
        // ==========================================
        function openTransferModal(clsId, idx, memberValue) {
            const cls = allClassData.find(c => c.id === clsId);
            if (!cls || !cls.sub_classes || cls.sub_classes.length <= 1) {
                return alert("⚠️ 此主班級下無其他子班別可供轉班！\n請先新增其他子班別。");
            }
            
            const dispName = getMemberDisplayName(memberValue);
            document.getElementById('trans-stu-name').innerText = dispName;
            document.getElementById('trans-old-sub').innerText = cls.sub_classes[idx].name;
            
            document.getElementById('trans-clsId').value = clsId;
            document.getElementById('trans-oldIdx').value = idx;
            document.getElementById('trans-memberValue').value = memberValue;
            
            // ✅ 新增防呆：過濾掉該學生已經報名的其他子班別
            const availableOptions = cls.sub_classes.map((s, i) => {
                if (i === idx) return null; // 排除自己目前的班別
                // 檢查該學生是否已在該目標子班別中
                const hasStudent = s.members && s.members.includes(memberValue);
                if (hasStudent) return null; // 排除已報名的班別
                return `<option value="${i}">${s.name}</option>`;
            }).filter(opt => opt !== null);

            if (availableOptions.length === 0) {
                return alert("⚠️ 系統阻擋：無法轉班！\n\n該名學生已經報名了此主班級下的「所有其他子班別」，沒有可供轉入的新目標班別。");
            }

            const sel = document.getElementById('trans-targetIdx');
            sel.innerHTML = availableOptions.join('');
            
            document.getElementById('transfer-modal').classList.add('active');
        }

        async function executeTransfer() {
            const clsId = document.getElementById('trans-clsId').value;
            const oldIdx = parseInt(document.getElementById('trans-oldIdx').value);
            const newIdx = parseInt(document.getElementById('trans-targetIdx').value);
            const memberValue = document.getElementById('trans-memberValue').value;
            
            const cls = allClassData.find(c => c.id === clsId);
            const oldName = `${cls.name}-${cls.sub_classes[oldIdx].name}`;
            const newName = `${cls.name}-${cls.sub_classes[newIdx].name}`;
            
            const stu = allStudents.find(s => s.id === memberValue || s.name === memberValue);
            const stuId = stu ? stu.id : memberValue;

            if(!confirm(`即將把該名學生轉至「${cls.sub_classes[newIdx].name}」\n系統將會自動連動其相關帳務與已繳紀錄。\n\n確定執行無縫轉班嗎？`)) return;

            try {
                // 1. 轉移名單 (Classes Table)
                let subs = JSON.parse(JSON.stringify(cls.sub_classes));
                subs[oldIdx].members = subs[oldIdx].members.filter(m => m !== memberValue);
                if (!subs[newIdx].members) subs[newIdx].members = [];
                if (!subs[newIdx].members.includes(memberValue)) subs[newIdx].members.push(memberValue);
                
                await sb.from('classes').update({ sub_classes: subs }).eq('id', clsId);
                
                // 2. 轉移學費折扣設定 (Student Bills Table)
                await sb.from('student_bills')
                        .update({ sub_idx: newIdx })
                        .eq('class_id', clsId)
                        .eq('sub_idx', oldIdx)
                        .eq('student_id', stuId);

                // 3. 轉移收據與繳費明細 (Payment Logs Allocation Details)
                const { data: logs } = await sb.from('payment_logs')
                    .select('*')
                    .eq('student_id', stuId)
                    .not('allocation_details', 'is', null);
                    
                if (logs && logs.length > 0) {
                    for (let log of logs) {
                        let changed = false;
                        let newAlloc = log.allocation_details.map(a => {
                            if (a.class_name === oldName) {
                                changed = true;
                                return { ...a, class_name: newName };
                            }
                            return a;
                        });
                        
                        // 若這張繳費單有包含該舊班別，將其名稱覆寫儲存，達成報表無縫轉移
                        if (changed) {
                            await sb.from('payment_logs').update({ allocation_details: newAlloc }).eq('serial_no', log.serial_no);
                        }
                    }
                }
                
                alert("✅ 轉班成功！該學生的名單、帳務明細、優惠設定皆已無縫轉移完畢。");
                closeModal('transfer-modal');
                init();
            } catch (err) {
                alert("轉班失敗：" + err.message);
            }
        }

                    if (r.rate_level === rateLvl) {

                            <span class="text-xs text-slate-400 font-bold">人 ${r.max_students >= 999 ? '(以上防呆)' : ''}</span>

                            <button type="button" onclick="deleteRuleDraft(${i})" class="text-slate-300 hover:text-rose-500 font-black px-2 py-1 text-lg leading-none transition">×</button>

                });

                html += `

                </div>`;
            });

            html += `<button type="button" onclick="addLevelDraft()" class="w-full py-4 border-2 border-dashed border-indigo-300 text-indigo-600 rounded-xl font-black hover:bg-indigo-50 transition bg-white shadow-sm">＋ 新增全新鐘點級別 (例如：A級、SSSS級)</button>`;
            
            container.innerHTML = html;
        }

        function deleteRuleDraft(index) {
            draftRates.splice(index, 1);
            renderRateUI();
        }

        function addRuleDraft(rateLvl) {
            const currentRules = draftRates.filter(r => r.rate_level === rateLvl).sort((a, b) => a.min_students - b.min_students);
            
            if (currentRules.length === 0) {
                draftRates.push({ course_level: currentRateTab, rate_level: rateLvl, min_students: 1, max_students: 999, amount: 0 });
            } else {
                let lastRule = currentRules[currentRules.length - 1];
                if (lastRule.max_students >= 100) {
                    const oldMin = lastRule.min_students;
                    lastRule.max_students = oldMin + 5;
                    draftRates.push({ 
                        course_level: currentRateTab, rate_level: rateLvl, min_students: oldMin + 6, max_students: 999, amount: lastRule.amount + 100 
                    });
                } else {
                    const nextMin = lastRule.max_students + 1;
                    draftRates.push({ 
                        course_level: currentRateTab, rate_level: rateLvl, min_students: nextMin, max_students: 999, amount: lastRule.amount + 100 
                    });
                }
            }
            renderRateUI();
        }

        function deleteLevelDraft(rateLvl) {
            if(confirm(`確定要刪除整個「${rateLvl}」的所有設定嗎？`)) {
                draftRates = draftRates.filter(r => r.rate_level !== rateLvl);
                renderRateUI();
            }
        }

        function addLevelDraft() {
            const newLvl = prompt("請輸入新級別名稱 (例如：A級、SSSS級)：");
            if(newLvl && newLvl.trim()) {
                const lvlName = newLvl.trim();
                if(draftRates.some(r => r.rate_level === lvlName)) return alert("此級別名稱已存在！");
                draftRates.push({ course_level: currentRateTab, rate_level: lvlName, min_students: 1, max_students: 999, amount: 500 });
                renderRateUI();
            }
        }

            await sb.from('hourly_rate_rules').delete().eq('course_level', currentRateTab);
            
            const insertData = draftRates.map(r => {
                const { id, ...rest } = r; 
                return rest;
            });
            
            if(insertData.length > 0) {
                await sb.from('hourly_rate_rules').insert(insertData);
            }
            
            const { data } = await sb.from('hourly_rate_rules').select('*').order('course_level').order('rate_level').order('min_students');
            allRates = data || [];
            
            btnElem.innerText = originalText;
            alert(`${currentRateTab} 的鐘點設定已儲存並套用成功！`);
            closeModal('rate-modal');
            init(); 
        }

        function calculateDisplayGrade(baseYear) { if (!baseYear) return null; const grade = getAcademicYear() - baseYear + 1; return grade > 12 ? 13 : grade; }
        
        function openStudentModal(clsId, idx) { 
            targetClassId = clsId; 
            targetSubIdx = idx; 
            document.getElementById('stu-search').value = ''; 
            document.getElementById('grade-filter').value = ''; 
            filterStudents(); 
            document.getElementById('student-modal').classList.add('active'); 
        }

        function filterStudents() {
            const k = document.getElementById('stu-search').value.toLowerCase();
            const g = document.getElementById('grade-filter').value;
            const cls = allClassData.find(c => c.id === targetClassId);
            const currentMembers = cls.sub_classes[targetSubIdx].members || [];
            
            const filtered = allStudents.filter(s => 
                s.name.toLowerCase().includes(k) && 
                (g === "" || String(calculateDisplayGrade(s.grade_base_year)) === g)
            );
            
            document.getElementById('student-list-container').innerHTML = filtered.map(s => {
                const isAdded = currentMembers.includes(s.id) || currentMembers.includes(s.name);
                return `<div class="p-3 border-b flex justify-between items-center ${isAdded ? 'bg-slate-50 opacity-50' : 'cursor-pointer hover:bg-slate-100 transition'}" onclick="${isAdded ? '' : `addStudent('${s.id}')`}">
                    <span class="font-bold text-sm text-slate-700">${s.name}</span>
                    ${isAdded ? '<span class="text-[10px] font-black text-slate-400 border px-1.5 py-0.5 rounded bg-white">已加入</span>' : '<span class="text-[10px] font-black text-white bg-blue-600 px-3 py-1 rounded shadow hover:bg-blue-700">＋ 加入</span>'}
                </div>`;
            }).join('');
        }

        async function addStudent(stuId) { 
            const cls = allClassData.find(c => c.id === targetClassId); 
            let subs = [...cls.sub_classes]; 
            subs[targetSubIdx].members = [...(subs[targetSubIdx].members || []), stuId]; 
            await sb.from('classes').update({ sub_classes: subs }).eq('id', targetClassId); 
            cls.sub_classes = subs; 
            filterStudents(); 
            renderClassList(); 
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = init;
    </script>
</body>
</html>
