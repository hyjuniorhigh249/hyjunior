<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>學生總檔 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        
        /* 自訂捲軸 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 列印排版設定 (QR Code 點名卡) */
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            @page { margin: 1cm; size: A4 portrait; }
            .qr-card { page-break-inside: avoid; border: 2px dashed #cbd5e1; padding: 15px; text-align: center; border-radius: 12px; margin-bottom: 15px; }
            .qr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; }
        }
    </style>
</head>
<body class="p-8">

    <div class="max-w-6xl mx-auto no-print">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-black text-slate-800">學生總檔管理</h1>
                <p class="text-sm font-bold text-slate-500 mt-1" id="student-count">共 0 位學生</p>
            </div>
            <div class="flex gap-3">
                <input type="text" id="search-input" oninput="renderStudents()" placeholder="搜尋姓名或學號..." class="p-2 border rounded-xl font-bold bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none w-64">
                <button onclick="printQRCodes()" class="bg-indigo-100 text-indigo-700 px-5 py-2 rounded-xl font-black shadow-sm hover:bg-indigo-200 transition flex items-center gap-2">
                    🖨️ 印 QR 點名卡
                </button>
                <button onclick="openModal()" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-black shadow-lg hover:bg-blue-700 transition flex items-center gap-2">
                    ＋ 新增學生
                </button>
            </div>
        </header>

        <div id="students-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>
    </div>

    <div id="student-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4 no-print overflow-y-auto">
        <div class="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden my-8">
            <div class="bg-slate-800 p-4 text-white flex justify-between items-center sticky top-0 z-10">
                <h3 id="modal-title" class="text-lg font-black tracking-wider">新增學生資料</h3>
                <button onclick="closeModal()" class="text-slate-300 hover:text-white text-xl font-black">&times;</button>
            </div>
            
            <div class="p-6">
                <input type="hidden" id="stu-id">
                <input type="hidden" id="stu-photo-url"> <div class="flex gap-6 mb-6 pb-6 border-b">
                    <div class="w-32 shrink-0 flex flex-col items-center gap-2">
                        <div class="w-24 h-24 rounded-full border-2 border-dashed border-slate-300 overflow-hidden bg-slate-50 flex items-center justify-center relative group">
                            <img id="photo-preview" src="" class="w-full h-full object-cover hidden">
                            <span id="photo-placeholder" class="text-3xl text-slate-300 group-hover:text-slate-400 transition">👤</span>
                            <input type="file" id="photo-upload" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handlePhotoUpload(event)">
                        </div>
                        <span class="text-[10px] font-bold text-slate-400 text-center">點擊上傳照片<br>(系統自動壓縮)</span>
                    </div>

                    <div class="flex-1 grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">姓名 *</label>
                            <input type="text" id="stu-name" class="w-full p-2 border rounded-lg font-black text-lg bg-slate-50 focus:ring-2 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">性別</label>
                            <select id="stu-gender" class="w-full p-2.5 border rounded-lg font-bold bg-slate-50 outline-none">
                                <option value="男">男</option><option value="女">女</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">學號前三碼 (入學年) *</label>
                            <input type="text" id="stu-prefix" placeholder="例如: 112" class="w-full p-2 border rounded-lg font-black text-blue-600 bg-blue-50 focus:ring-2 outline-none tracking-widest">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">學號後三碼 (系統自動補位)</label>
                            <input type="text" id="stu-suffix" placeholder="儲存後自動產生" readonly class="w-full p-2 border border-transparent rounded-lg font-black text-slate-400 bg-slate-100 outline-none tracking-widest text-center cursor-not-allowed">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div><label class="block text-[10px] font-bold text-slate-400 mb-1">年級基準年 (國一入學年) *</label><input type="number" id="stu-base-year" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50"></div>
                    <div><label class="block text-[10px] font-bold text-slate-400 mb-1">就讀學校</label><input type="text" id="stu-school" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50"></div>
                    <div><label class="block text-[10px] font-bold text-slate-400 mb-1">家長姓名</label><input type="text" id="stu-parent" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50"></div>
                    <div><label class="block text-[10px] font-bold text-slate-400 mb-1">聯絡電話</label><input type="text" id="stu-phone" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50"></div>
                    <div class="col-span-2"><label class="block text-[10px] font-bold text-slate-400 mb-1">聯絡地址</label><input type="text" id="stu-address" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50"></div>
                    <div><label class="block text-[10px] font-bold text-slate-400 mb-1">兄弟姐妹</label><input type="text" id="stu-siblings" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50" placeholder="例如: 王小明(哥)"></div>
                    <div><label class="block text-[10px] font-bold text-slate-400 mb-1">建檔日期</label><input type="date" id="stu-created" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50"></div>
                    <div class="col-span-2"><label class="block text-[10px] font-bold text-slate-400 mb-1">備註說明</label><input type="text" id="stu-note" class="w-full p-2 border rounded-lg font-bold text-sm bg-slate-50"></div>
                </div>

                <div class="flex gap-3 mt-8">
                    <button onclick="closeModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-black hover:bg-slate-200 transition">取消返回</button>
                    <button onclick="saveStudent()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-black hover:bg-blue-700 shadow-md transition text-lg tracking-wider">💾 儲存資料</button>
                </div>
            </div>
        </div>
    </div>

    <div id="print-area" class="hidden print-only">
        <h2 class="text-2xl font-black text-center mb-6 mt-4">昊學文教 - 學生專屬 QR 點名卡</h2>
        <div id="qr-print-grid" class="qr-grid"></div>
    </div>
    <script>
        // Supabase 初始化
        const sb = supabase.createClient('https://hlelxeiwamvrntsxnram.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM');
        let allStudents = [];

        // 頁面載入
        async function init() {
            document.getElementById('stu-created').value = new Date().toISOString().split('T')[0];
            await fetchStudents();
        }

        // 取得資料
        async function fetchStudents() {
            try {
                const { data, error } = await sb.from('students').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allStudents = data || [];
                document.getElementById('student-count').innerText = `共 ${allStudents.length} 位學生`;
                renderStudents();
            } catch (err) {
                alert("讀取資料失敗：" + err.message);
            }
        }

        // 計算年級顯示
        function getAcademicYear() { const d = new Date(); return (d.getMonth() + 1) >= 7 ? d.getFullYear() : d.getFullYear() - 1; }
        function calculateDisplayGrade(baseYear) {
            if (!baseYear) return '未定';
            const grade = getAcademicYear() - baseYear + 1;
            const grades = ['小一','小二','小三','小四','小五','小六','國一','國二','國三','高一','高二','高三'];
            return grade >= 1 && grade <= 12 ? grades[grade - 1] : '已畢業';
        }

        // 渲染學生清單
        function renderStudents() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const grid = document.getElementById('students-grid');
            
            const filtered = allStudents.filter(s => {
                const fullId = (s.student_id_prefix || '') + (s.student_id_suffix || '');
                return s.name.toLowerCase().includes(keyword) || fullId.includes(keyword);
            });

            grid.innerHTML = filtered.map(s => {
                const fullId = (s.student_id_prefix && s.student_id_suffix) ? `${s.student_id_prefix}${s.student_id_suffix}` : '無學號';
                const photoSrc = s.photo_url || '';
                
                return `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition relative flex flex-col">
                    <div class="flex items-start gap-4 mb-4">
                        <div class="w-16 h-16 shrink-0 rounded-full border border-slate-200 overflow-hidden bg-slate-50 flex items-center justify-center">
                            ${photoSrc ? `<img src="${photoSrc}" class="w-full h-full object-cover">` : `<span class="text-2xl text-slate-300">👤</span>`}
                        </div>
                        <div class="flex-1">
                            <h3 class="text-xl font-black text-slate-800">${s.name} <span class="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded border ml-1">${s.gender || '?'}</span></h3>
                            <p class="text-xs font-black text-blue-600 mt-1 tracking-widest bg-blue-50 inline-block px-2 py-0.5 rounded border border-blue-100">ID: ${fullId}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-y-2 text-xs font-bold text-slate-500 bg-slate-50 p-3 rounded-xl border mb-4">
                        <div class="truncate">🏫 ${s.school || '未登錄'}</div>
                        <div>📚 ${calculateDisplayGrade(s.grade_base_year)}</div>
                        <div class="truncate col-span-2">📞 ${s.parent_name || '家長'} - ${s.phone || '無電話'}</div>
                    </div>

                    <div class="mt-auto pt-3 border-t flex justify-between items-center">
                        <button onclick="showSingleQR('${s.name}', '${fullId}')" class="text-xs font-black text-indigo-500 hover:text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100 transition flex items-center gap-1">
                            📱 顯示專屬 QR
                        </button>
                        <div class="flex gap-2">
                            <button onclick="openModal('${s.id}')" class="text-xs font-black text-slate-600 hover:text-slate-800 bg-slate-100 px-3 py-1.5 rounded-lg transition">編輯</button>
                            <button onclick="deleteStudent('${s.id}', '${s.name}')" class="text-xs font-black text-red-500 hover:text-red-700 bg-red-50 px-3 py-1.5 rounded-lg transition">刪除</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // 處理照片上傳與自動壓縮 (Base64)
        function handlePhotoUpload(e) {
            const file = e.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    // 壓縮設定：最大寬度 300px
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // 轉為較低畫質的 JPEG 減少資料庫負擔
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    
                    document.getElementById('photo-preview').src = dataUrl;
                    document.getElementById('photo-preview').classList.remove('hidden');
                    document.getElementById('photo-placeholder').classList.add('hidden');
                    document.getElementById('stu-photo-url').value = dataUrl;
                }
                img.src = evt.target.result;
            }
            reader.readAsDataURL(file);
        }

        // 開啟與填寫表單
        function openModal(id = null) {
            document.getElementById('stu-id').value = id || '';
            document.getElementById('photo-upload').value = '';
            
            if(id) {
                const s = allStudents.find(x => x.id === id);
                document.getElementById('modal-title').innerText = '編輯學生資料';
                document.getElementById('stu-name').value = s.name;
                document.getElementById('stu-gender').value = s.gender || '男';
                document.getElementById('stu-prefix').value = s.student_id_prefix || '';
                document.getElementById('stu-suffix').value = s.student_id_suffix || '';
                document.getElementById('stu-base-year').value = s.grade_base_year || '';
                document.getElementById('stu-school').value = s.school || '';
                document.getElementById('stu-parent').value = s.parent_name || '';
                document.getElementById('stu-phone').value = s.phone || '';
                document.getElementById('stu-address').value = s.address || '';
                document.getElementById('stu-siblings').value = s.siblings || '';
                document.getElementById('stu-created').value = s.created_date || new Date().toISOString().split('T')[0];
                document.getElementById('stu-note').value = s.note || '';
                
                // 照片處理
                document.getElementById('stu-photo-url').value = s.photo_url || '';
                if(s.photo_url) {
                    document.getElementById('photo-preview').src = s.photo_url;
                    document.getElementById('photo-preview').classList.remove('hidden');
                    document.getElementById('photo-placeholder').classList.add('hidden');
                } else {
                    document.getElementById('photo-preview').src = '';
                    document.getElementById('photo-preview').classList.add('hidden');
                    document.getElementById('photo-placeholder').classList.remove('hidden');
                }
            } else {
                document.getElementById('modal-title').innerText = '新增學生資料';
                ['stu-name','stu-prefix','stu-suffix','stu-base-year','stu-school','stu-parent','stu-phone','stu-address','stu-siblings','stu-note','stu-photo-url'].forEach(id => document.getElementById(id).value = '');
                document.getElementById('stu-gender').value = '男';
                document.getElementById('stu-created').value = new Date().toISOString().split('T')[0];
                
                document.getElementById('photo-preview').src = '';
                document.getElementById('photo-preview').classList.add('hidden');
                document.getElementById('photo-placeholder').classList.remove('hidden');
            }
            
            document.getElementById('student-modal').classList.add('active');
        }

        // 關閉表單
        function closeModal() {
            document.getElementById('student-modal').classList.remove('active');
        }

        // 取得最小空缺後置碼 (核心演算法)
        async function getNextSuffix(prefix) {
            if(!prefix) return '';
            // 取出所有同 prefix 的 suffix
            const { data } = await sb.from('students').select('student_id_suffix').eq('student_id_prefix', prefix);
            if(!data || data.length === 0) return '001';
            
            // 轉為數字並排序
            const existing = data.map(d => parseInt(d.student_id_suffix, 10)).filter(n => !isNaN(n)).sort((a, b) => a - b);
            
            let next = 1;
            for(let num of existing) {
                if(num === next) next++;      // 連續，繼續找下一個
                else if(num > next) break;    // 發現斷層空缺！直接跳出迴圈
            }
            
            // 將數字補零至 3 碼
            return String(next).padStart(3, '0');
        }

        // 儲存資料
        async function saveStudent() {
            const id = document.getElementById('stu-id').value;
            const name = document.getElementById('stu-name').value.trim();
            let prefix = document.getElementById('stu-prefix').value.trim();
            let suffix = document.getElementById('stu-suffix').value;
            const baseYear = document.getElementById('stu-base-year').value;

            if(!name || !prefix || !baseYear) return alert("姓名、學號前三碼、年級基準年 為必填欄位！");

            try {
                // 如果是新增，或是 prefix 被改動過，重新取號
                if(!id || (id && allStudents.find(s=>s.id===id).student_id_prefix !== prefix)) {
                    suffix = await getNextSuffix(prefix);
                }

                const payload = {
                    name, 
                    gender: document.getElementById('stu-gender').value,
                    student_id_prefix: prefix,
                    student_id_suffix: suffix,
                    grade_base_year: parseInt(baseYear),
                    school: document.getElementById('stu-school').value.trim(),
                    parent_name: document.getElementById('stu-parent').value.trim(),
                    phone: document.getElementById('stu-phone').value.trim(),
                    address: document.getElementById('stu-address').value.trim(),
                    siblings: document.getElementById('stu-siblings').value.trim(),
                    created_date: document.getElementById('stu-created').value,
                    note: document.getElementById('stu-note').value.trim(),
                    photo_url: document.getElementById('stu-photo-url').value // 儲存 Base64 照片
                };

                if(id) {
                    await sb.from('students').update(payload).eq('id', id);
                    alert("更新成功！");
                } else {
                    await sb.from('students').insert([payload]);
                    alert(`新增成功！\n\n系統已自動配發學號：${prefix}${suffix}`);
                }
                
                closeModal();
                await fetchStudents();
                
            } catch (err) {
                alert("儲存失敗：" + err.message);
            }
        }

        // 刪除學生
        async function deleteStudent(id, name) {
            if(confirm(`確定要刪除學生「${name}」嗎？\n\n警告：刪除後，他的學號末三碼將會空出，並自動讓給下一位建立的同屆學生。`)) {
                await sb.from('students').delete().eq('id', id);
                await fetchStudents();
            }
        }

        // 顯示單一 QR Code 預覽 (SweetAlert 風格)
        function showSingleQR(name, fullId) {
            if(fullId === '無學號') return alert("該名學生尚未設定學號，無法產生 QR 碼。");
            
            // 建立一個臨時覆蓋層顯示大 QR 碼
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center';
            overlay.onclick = () => document.body.removeChild(overlay);
            
            const card = document.createElement('div');
            card.className = 'bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center';
            card.onclick = (e) => e.stopPropagation();
            
            card.innerHTML = `
                <h3 class="text-2xl font-black text-slate-800 mb-2">${name}</h3>
                <p class="text-sm font-bold text-slate-500 mb-6 tracking-widest">學號: ${fullId}</p>
                <div id="temp-qr" class="p-4 border-4 border-slate-100 rounded-2xl mb-6"></div>
                <button onclick="document.body.removeChild(this.parentElement.parentElement)" class="w-full py-3 bg-slate-100 text-slate-600 font-black rounded-xl hover:bg-slate-200">關閉</button>
            `;
            
            overlay.appendChild(card);
            document.body.appendChild(overlay);
            
            // 產生 QR 碼
            new QRCode(document.getElementById("temp-qr"), {
                text: fullId, width: 200, height: 200, colorDark : "#1e293b", colorLight : "#ffffff"
            });
        }

        // 合併列印全班 QR 碼
        function printQRCodes() {
            const validStudents = allStudents.filter(s => s.student_id_prefix && s.student_id_suffix);
            if(validStudents.length === 0) return alert("目前沒有建立學號的學生資料。");
            
            const grid = document.getElementById('qr-print-grid');
            grid.innerHTML = ''; // 清空
            
            validStudents.forEach(s => {
                const fullId = `${s.student_id_prefix}${s.student_id_suffix}`;
                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `
                    <div class="font-black text-xl mb-1">${s.name}</div>
                    <div class="text-xs text-slate-500 font-bold mb-3 tracking-wider">ID: ${fullId}</div>
                    <div id="print-qr-${s.id}" class="flex justify-center"></div>
                `;
                grid.appendChild(card);
                
                // 產生 QR 碼 (尺寸縮小適合列印)
                new QRCode(document.getElementById(`print-qr-${s.id}`), {
                    text: fullId, width: 100, height: 100
                });
            });

            // 等待 QR 碼渲染完成後再觸發列印
            setTimeout(() => { window.print(); }, 500);
        }

        // 啟動
        window.onload = init;
    </script>
</body>
</html>
