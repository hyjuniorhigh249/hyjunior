<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級管理 - 浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="pip-tool.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-open .accordion-content { max-height: 1000px; }
        .modal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="min-h-screen">

    <main class="p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-black text-slate-800">班級組織管理</h1>
                <p id="status-text" class="text-xs font-bold text-slate-400 mt-1">連線檢查中...</p>
            </div>
            <button onclick="openCreateModal()" class="bg-slate-800 text-white px-6 py-2 rounded-xl font-black hover:bg-slate-700 shadow-lg transition active:scale-95">＋ 建立新班級</button>
        </header>

        <section class="mb-12">
            <h2 class="font-black text-slate-400 text-[10px] uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-emerald-500 rounded-full"></span> 進行中班級
            </h2>
            <div id="active-classes-list" class="grid grid-cols-1 gap-4"></div>
        </section>

        <section class="opacity-60">
            <h2 class="font-black text-slate-400 text-[10px] uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-slate-400 rounded-full"></span> 歷史存檔班級
            </h2>
            <div id="archived-classes-list" class="grid grid-cols-1 gap-4"></div>
        </section>
    </main>

    <div id="class-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[32px] p-8 w-full max-w-md shadow-2xl">
            <h3 id="modal-title" class="text-xl font-black mb-6 flex items-center gap-2"><span class="text-2xl">🏫</span> 設定班級資訊</h3>
            <input type="hidden" id="m-class-id">
            <div class="space-y-4">
                <div><label class="text-[10px] font-black text-slate-400 uppercase ml-1">班級名稱*</label><input type="text" id="m-class-name" class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-800 font-bold" placeholder="例如：國三甲班"></div>
                <div><label class="text-[10px] font-black text-slate-400 uppercase ml-1">任課老師</label><input type="text" id="m-class-teacher" class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-800 font-bold" placeholder="填寫老師姓名"></div>
                <div><label class="text-[10px] font-black text-slate-400 uppercase ml-1">備註說明</label><textarea id="m-class-note" class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-800 h-24 font-bold" placeholder="關於此班級的雜項記錄..."></textarea></div>
            </div>
            <div class="flex gap-2 mt-8">
                <button onclick="closeModal('class-modal')" class="flex-1 py-3 font-bold text-slate-400">取消</button>
                <button id="save-btn" onclick="saveClass()" class="flex-1 py-3 bg-slate-800 text-white rounded-xl font-black shadow-lg hover:bg-slate-900 transition">儲存資訊</button>
            </div>
        </div>
    </div>

    <div id="member-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[32px] p-8 w-full max-w-lg shadow-2xl max-h-[80vh] flex flex-col">
            <h3 id="member-modal-title" class="text-xl font-black mb-4">加入學生成員</h3>
            <div class="relative mb-4">
                <input type="text" id="stu-search" oninput="searchStudentsForClass()" placeholder="搜尋學生姓名..." class="w-full p-3 pl-10 border border-slate-200 rounded-xl outline-none bg-slate-50 font-bold">
                <span class="absolute left-3 top-3.5">🔍</span>
            </div>
            <div id="stu-search-results" class="flex-1 overflow-y-auto space-y-2 mb-6"></div>
            <button onclick="closeModal('member-modal')" class="w-full py-3 bg-slate-100 rounded-xl font-black text-slate-600">完成並關閉</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeClassIdForMembers = null;
        let allClassData = [];

        async function init() { fetchClasses(); }

        async function fetchClasses() {
            document.getElementById('status-text').innerText = "更新中...";
            const { data } = await supabaseClient.from('classes').select('*').order('created_at', { ascending: false });
            allClassData = data || [];
            const activeList = document.getElementById('active-classes-list');
            const archiveList = document.getElementById('archived-classes-list');
            activeList.innerHTML = ""; archiveList.innerHTML = "";

            allClassData.forEach(cls => {
                const html = `
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm transition hover:shadow-md">
                    <div class="p-4 flex items-center justify-between cursor-pointer" onclick="this.parentElement.classList.toggle('accordion-open')">
                        <div class="flex items-center gap-4">
                            <span class="text-xl">📂</span>
                            <div>
                                <h4 class="font-black text-slate-800 text-lg">${cls.name}</h4>
                                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">老師：${cls.teacher || '未設定'} | 成員：${cls.members ? cls.members.length : 0} 位</p>
                            </div>
                        </div>
                        <div class="flex gap-2" onclick="event.stopPropagation()">
                            <button onclick="openEditModal('${cls.id}')" class="text-[10px] bg-slate-100 px-3 py-1.5 rounded-lg font-black text-slate-600 hover:bg-slate-200 transition">修改</button>
                            <button onclick="openMemberModal('${cls.id}', '${cls.name}')" class="text-[10px] bg-slate-800 px-3 py-1.5 rounded-lg font-black text-white hover:bg-slate-700 transition">管理</button>
                            <button onclick="deleteClass('${cls.id}', ${cls.members ? cls.members.length : 0})" class="text-[10px] bg-rose-50 px-3 py-1.5 rounded-lg font-black text-rose-400 hover:bg-rose-100 transition">刪除</button>
                        </div>
                    </div>
                    <div class="accordion-content bg-slate-50 border-t border-slate-100">
                        <div class="p-6">
                            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2">
                                ${cls.members && cls.members.length > 0 ? cls.members.map(m => `
                                    <div class="bg-white p-2 px-3 rounded-xl border border-slate-200 flex justify-between items-center group shadow-sm">
                                        <span class="font-bold text-slate-600">${m}</span>
                                        <button onclick="removeMember('${cls.id}', '${m}')" class="text-rose-300 opacity-0 group-hover:opacity-100 hover:text-rose-500 transition">✕</button>
                                    </div>
                                `).join('') : '<p class="text-slate-300 italic text-xs">目前沒有學生</p>'}
                            </div>
                        </div>
                    </div>
                </div>`;
                cls.is_archived ? archiveList.innerHTML += html : activeList.innerHTML += html;
            });
            document.getElementById('status-text').innerText = "最後同步：" + new Date().toLocaleTimeString();
        }

        async function saveClass() {
            const id = document.getElementById('m-class-id').value;
            const name = document.getElementById('m-class-name').value.trim();
            const teacher = document.getElementById('m-class-teacher').value.trim();
            const note = document.getElementById('m-class-note').value.trim();
            if(!name) return alert("請輸入名稱");
            if(id) await supabaseClient.from('classes').update({ name, teacher, note }).eq('id', id);
            else await supabaseClient.from('classes').insert([{ name, teacher, note, members: [] }]);
            closeModal('class-modal'); fetchClasses();
        }

        function openCreateModal() { document.getElementById('m-class-id').value = ""; openModal('class-modal'); }
        function openEditModal(id) { 
            const cls = allClassData.find(x => x.id === id);
            document.getElementById('m-class-id').value = cls.id;
            document.getElementById('m-class-name').value = cls.name;
            openModal('class-modal');
        }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        async function deleteClass(id, count) { if(count > 0) return alert("請先清空成員"); if(confirm("確定刪除？")) { await supabaseClient.from('classes').delete().eq('id', id); fetchClasses(); } }
        async function openMemberModal(id, name) { activeClassIdForMembers = id; openModal('member-modal'); searchStudentsForClass(); }
        async function searchStudentsForClass() {
            const keyword = document.getElementById('stu-search').value;
            const { data: students } = await supabaseClient.from('students').select('name').ilike('name', `%${keyword}%`).limit(10);
            const { data: cls } = await supabaseClient.from('classes').select('members').eq('id', activeClassIdForMembers).single();
            const results = document.getElementById('stu-search-results');
            results.innerHTML = students.map(s => {
                const isMember = cls.members && cls.members.includes(s.name);
                return `<div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl font-bold">${s.name} ${isMember ? '✅' : `<button onclick="addMember('${s.name}')" class="bg-slate-800 text-white px-3 py-1 rounded-lg">加入</button>`}</div>`;
            }).join('');
        }
        async function addMember(name) {
            const { data } = await supabaseClient.from('classes').select('members').eq('id', activeClassIdForMembers).single();
            await supabaseClient.from('classes').update({ members: [...(data.members || []), name] }).eq('id', activeClassIdForMembers);
            searchStudentsForClass(); fetchClasses();
        }
        async function removeMember(cid, name) {
            const { data } = await supabaseClient.from('classes').select('members').eq('id', cid).single();
            await supabaseClient.from('classes').update({ members: data.members.filter(m => m !== name) }).eq('id', cid);
            fetchClasses();
        }
        window.onload = init;
    </script>
</body>
</html>
