<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="pip-tool.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; }
        
        /* 側邊欄按鈕基礎樣式 - 依照截圖還原字體大小與間距 */
        .nav-link { 
            @apply flex items-center px-4 py-3 rounded-xl font-bold text-slate-600 
                   hover:bg-slate-50 transition-all text-[15px] gap-3 w-full text-left mb-1; 
        }

        /* 關鍵：右側截圖的深色選取樣式 */
        .nav-link.active { 
            @apply bg-[#1e293b] text-white shadow-md; 
        }

        /* 加大圖示顯示 */
        .nav-link span:first-child { @apply text-lg; }

        /* 標題與分隔線樣式 */
        .sidebar-header { @apply font-black text-xl mb-6 text-slate-800 border-b pb-3 text-center italic; }
        .section-label { @apply text-[11px] font-bold text-slate-400 uppercase mb-3 px-3 tracking-wider; }
    </style>
</head>
<body class="flex h-screen bg-white overflow-hidden">

    <nav class="w-48 bg-white border-r border-slate-200 p-4 flex flex-col shrink-0 h-screen sticky top-0">
        <div onclick="changePage('dashboard.html', document.getElementById('nav-dash'))" class="cursor-pointer sidebar-header">
            浩元行政
        </div>

        <div class="flex flex-col">
            <button id="nav-dash" onclick="changePage('dashboard.html', this)" class="nav-link">
                <span>🏠</span> 數據概況
            </button>
            <button id="nav-students" onclick="changePage('students.html', this)" class="nav-link active">
                <span>👥</span> 學生總檔
            </button>
            <button id="nav-classes" onclick="changePage('classes.html', this)" class="nav-link">
                <span>📚</span> 班級管理
            </button>
        </div>
        
        <div class="mt-6 pt-6 border-t border-slate-100">
            <p class="section-label">快捷工具</p>
            <button onclick="startPiP()" class="nav-link text-blue-600 hover:bg-blue-50">
                <span>📱</span> 迷你通訊窗
            </button>
        </div>

        <div class="mt-auto pt-6 border-t border-slate-100 px-2">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">管理員</p>
            <p class="text-[10px] font-medium text-slate-500 truncate mb-3">admin@hyjunior.app</p>
            <button class="w-full text-left text-[11px] font-bold text-red-400 hover:text-red-600 transition">登出系統</button>
        </div>
    </nav>

    <main class="flex-1 relative bg-slate-50">
        <iframe id="main-content" src="students.html" class="w-full h-full border-none"></iframe>
    </main>

    <script>
        function changePage(url, btn) {
            const iframe = document.getElementById('main-content');
            iframe.src = url;

            // 切換分頁時，更新按鈕的深色底色狀態
            if (btn) {
                document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
        }
    </script>
</body>
</html>
