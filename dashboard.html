<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數據概況 - 昊學行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .dashboard-card { background: white; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; }
        .course-card { background: #f8fafc; border-radius: 0.75rem; border-left: 6px solid #3b82f6; padding: 1rem; margin-bottom: 0.75rem; }
        .course-card.indiv { border-left-color: #8b5cf6; background: #f5f3ff; }
        .scroll-area { max-height: 350px; overflow-y: auto; padding-right: 0.5rem; }
        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="p-8 h-screen overflow-auto">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="dashboard-card bg-gradient-to-br from-blue-500 to-blue-700 text-white border-none">
                <h3 class="font-bold text-blue-100 text-sm">活躍繳費學生人數</h3>
                <div class="text-4xl font-black mt-2" id="stat-student-count">--</div>
                <p class="text-xs text-blue-200 mt-2">今日起有課(含個指) 且 總繳費≧3000</p>
            </div>
            
            <div class="dashboard-card bg-gradient-to-br from-rose-500 to-rose-700 text-white border-none">
                <h3 class="font-bold text-rose-100 text-sm">全班系尚欠總額</h3>
                <div class="text-4xl font-black mt-2" id="stat-total-debt">--</div>
                <p class="text-xs text-rose-200 mt-2">需催繳提醒 (包含個指)</p>
            </div>
            
            <div class="dashboard-card bg-gradient-to-br from-amber-500 to-amber-700 text-white border-none">
                <h3 class="font-bold text-amber-100 text-sm">今日請假人數</h3>
                <div class="text-4xl font-black mt-2" id="stat-absence-count">--</div>
                <p class="text-xs text-amber-200 mt-2">已於點名系統登記</p>
            </div>
            
            <div class="dashboard-card bg-gradient-to-br from-emerald-500 to-emerald-700 text-white border-none flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-emerald-100 text-sm" id="task-card-title">今日待辦事項</h3>
                    <span class="bg-emerald-800 text-emerald-100 px-2 py-0.5 rounded-full text-xs font-black" id="stat-task-count">0</span>
                </div>
                <div id="stat-task-preview" class="text-sm font-bold mt-2 space-y-1.5 flex-1">
                    <div class="text-emerald-200 text-xs">讀取中...</div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="space-y-6">
                <div class="dashboard-card">
                    <h3 class="font-black text-slate-800 text-lg mb-4 flex items-center gap-2">📅 今日課程 Schedule</h3>
                    <div id="today-classes-list" class="scroll-area">
                        <p class="text-slate-400 font-bold text-center py-4">讀取中...</p>
                    </div>
                </div>

                <div class="dashboard-card border-t-4 border-t-emerald-500">
                    <h3 class="font-black text-slate-800 text-lg mb-4 flex items-center gap-2">✅ 重要事項 Tasks</h3>
                    
                    <div class="flex gap-2 mb-4 bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="date" id="task-date" onchange="loadTasks()" class="border rounded p-2 text-sm font-bold outline-none bg-white">
                        <input type="text" id="task-content" placeholder="輸入待辦事項..." class="flex-1 border rounded p-2 text-sm font-bold outline-none bg-white">
                        <button onclick="addTask()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded font-black text-sm transition">新增</button>
                    </div>

                    <div id="today-tasks-list" class="space-y-2 scroll-area">
                        <p class="text-slate-400 font-bold text-center py-4">無事項</p>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="dashboard-card border-t-4 border-t-amber-500">
                    <h3 class="font-black text-slate-800 text-lg mb-4 flex items-center gap-2">⚠️ 今日缺席名單 Absences</h3>
                    <div class="overflow-x-auto scroll-area">
                        <table class="w-full text-left text-sm">
                            <thead class="text-slate-500 border-b"><tr><th class="pb-2">學生姓名</th><th class="pb-2">假別</th><th class="pb-2">事由</th></tr></thead>
                            <tbody id="absences-list" class="divide-y divide-slate-100">
                                <tr><td colspan="3" class="text-center py-6 text-slate-400 font-bold">讀取中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="dashboard-card border-t-4 border-t-rose-500">
                    <h3 class="font-black text-slate-800 text-lg mb-4 flex items-center gap-2">💰 欠費名單提醒 Unpaid Debts</h3>
                    <div class="overflow-x-auto scroll-area">
                        <table class="w-full text-left text-sm">
                            <thead class="text-slate-500 border-b"><tr><th class="pb-2">學生姓名</th><th class="pb-2 text-right">應繳</th><th class="pb-2 text-right">已繳</th><th class="pb-2 text-right text-rose-600">尚欠</th></tr></thead>
                            <tbody id="debts-list" class="divide-y divide-slate-100">
                                <tr><td colspan="4" class="text-center py-6 text-slate-400 font-bold">讀取中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const sb = supabase.createClient("https://hlelxeiwamvrntsxnram.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM");

        function getLocalToday() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        let isFirstLoad = true;

        async function loadDashboard() {
            const todayStr = getLocalToday();
            
            if (isFirstLoad) {
                document.getElementById('task-date').value = todayStr;
                isFirstLoad = false;
            }
            
            const currentDayOfWeek = new Date(todayStr).getDay().toString();

            // 🌟 核心升級：同時撈取團班資料與個指資料 (使用 select('*') 來防呆欄位變動)
            const [
                resStudents, resClasses, resAttendance, resPayments, resBills, resIndivClasses, resIndivSchedules
            ] = await Promise.all([
                sb.from('students').select('id, name'),
                sb.from('classes').select('*'),
                sb.from('attendance').select('student_id, leave_type, leave_reason').eq('check_date', todayStr),
                sb.from('payment_logs').select('student_id, amount'),
                sb.from('student_bills').select('student_id, class_id, sub_idx, discount_amount'),
                sb.from('individual_classes').select('*'), // 撈取個指費用主檔
                sb.from('individual_schedules').select('*') // 撈取個指排課檔
            ]);

            const students = resStudents.data || [];
            const classes = resClasses.data || [];
            const attendance = resAttendance.data || [];
            const payments = resPayments.data || [];
            const bills = resBills.data || [];
            
            // 若表格不存在，Supabase 會返回 error，我們防呆視為空陣列
            const indivClasses = resIndivClasses.data || [];
            const indivSchedules = resIndivSchedules.data || [];

            const stuIdToName = {};
            students.forEach(s => stuIdToName[s.id] = s.name);

            // 已繳總額計算 (這裡完全正確，所有繳費都在 payment_logs)
            const paidMap = {};
            payments.forEach(p => {
                if(p.student_id) paidMap[p.student_id] = (paidMap[p.student_id] || 0) + p.amount;
            });

            // ===============================
            // 1. 今日課程 (整合團班 + 個指)
            // ===============================
            let todaysEvents = [];
            
            // A. 團班
            classes.forEach(cls => {
                const isPast = cls.end_date && cls.end_date < todayStr;
                const isFuture = cls.start_date && cls.start_date > todayStr;
                if (!isPast && !isFuture && cls.sub_classes) {
                    cls.sub_classes.forEach(sub => {
                        if (sub.day === currentDayOfWeek || (sub.class_days && sub.class_days.includes(parseInt(currentDayOfWeek)))) {
                            todaysEvents.push({ ...sub, parentName: cls.name, type: 'group' });
                        }
                    });
                }
            });

            // B. 個別指導
            indivSchedules.forEach(sched => {
                if (sched.class_date === todayStr) {
                    todaysEvents.push({
                        start_time: sched.start_time || sched.start || '--:--',
                        end_time: sched.end_time || sched.end || '--:--',
                        parentName: '🎯 個別指導',
                        name: stuIdToName[sched.student_id] ? `${stuIdToName[sched.student_id]} 的專屬課程` : '專屬課程',
                        teacher_name: sched.teacher_name || sched.teacher || '未定',
                        type: 'indiv'
                    });
                }
            });

            // 依據時間排序
            todaysEvents.sort((a, b) => (a.start_time || a.start || '').localeCompare(b.start_time || b.start || ''));
            
            document.getElementById('today-classes-list').innerHTML = todaysEvents.length > 0 
                ? todaysEvents.map(e => `
                    <div class="course-card ${e.type === 'indiv' ? 'indiv' : ''}">
                        <span class="${e.type === 'indiv' ? 'bg-purple-600' : 'bg-blue-600'} text-white text-[10px] font-black px-2 py-0.5 rounded">${e.start_time || e.start || ''} - ${e.end_time || e.end || ''}</span>
                        <h4 class="text-base font-black mt-1 text-slate-800">${e.parentName} - ${e.name}</h4>
                        <p class="text-xs font-bold text-slate-500 mt-1">老師：${e.teacher_name || e.teacher || '未定'}</p>
                    </div>`).join('')
                : '<div class="text-center py-6 text-slate-400 font-bold border-2 border-dashed rounded-lg">今日無課程</div>';


            // ===============================
            // 2. 欠費名單 & 活躍學生 (完美雙軌制)
            // ===============================
            let totalSysDebt = 0;
            let debtsHtml = '';
            let activeStudentIds = new Set();

            students.forEach(stu => {
                let sPayable = 0;
                let isActiveStudent = false;

                // A. 團班判斷 (是否活躍、應繳學費)
                classes.forEach(c => {
                    if (!c.end_date || c.end_date >= todayStr) {
                        (c.sub_classes || []).forEach((sub, idx) => {
                            if (sub.members && (sub.members.includes(stu.id) || sub.members.includes(stu.name))) {
                                isActiveStudent = true; // 團班活躍
                                const b = bills.find(x => x.class_id === c.id && x.sub_idx === idx && x.student_id === stu.id);
                                const discount = b ? b.discount_amount : 0;
                                sPayable += (sub.fee||0) + (sub.textbook_fee||0) + (sub.misc_fee||0) - discount;
                            }
                        });
                    }
                });

                // B. 個指活躍判斷：如果今日或未來有個指排課，就算活躍
                indivSchedules.forEach(sched => {
                    if ((sched.student_id === stu.id || sched.student_id === stu.name) && sched.class_date >= todayStr) {
                        isActiveStudent = true;
                    }
                });

                // C. 個指應繳費用計算
                let hasIndivClassRecord = false;
                indivClasses.forEach(indiv => {
                    if (indiv.student_id === stu.id || indiv.student_id === stu.name) {
                        hasIndivClassRecord = true;
                        // 智能防呆：自動抓取可能的費用欄位
                        sPayable += (indiv.total_tuition || indiv.tuition || indiv.fee || indiv.amount || 0);
                    }
                });

                // 若 `individual_classes` 裡面沒找到該生，防呆去 `individual_schedules` 找是否有單堂費用
                if (!hasIndivClassRecord) {
                    indivSchedules.forEach(sched => {
                        if (sched.student_id === stu.id || sched.student_id === stu.name) {
                            sPayable += (sched.fee || sched.tuition || sched.amount || 0);
                        }
                    });
                }

                // 計算欠費
                const sPaid = paidMap[stu.id] || 0;
                const sDebt = sPayable - sPaid;
                
                // 🌟 最終活躍判定：只要 (有團班或個指) 且 (總繳費 >= 3000)
                if (isActiveStudent && sPaid >= 3000) activeStudentIds.add(stu.id);

                if (sDebt > 0) {
                    totalSysDebt += sDebt;
                    debtsHtml += `<tr class="hover:bg-rose-50 transition"><td class="py-2 font-bold">${stu.name}</td><td class="py-2 text-right text-slate-500">$${sPayable}</td><td class="py-2 text-right text-emerald-600">$${sPaid}</td><td class="py-2 text-right font-black text-rose-600">$${sDebt}</td></tr>`;
                }
            });

            document.getElementById('stat-student-count').innerText = activeStudentIds.size;
            document.getElementById('stat-total-debt').innerText = `$${totalSysDebt}`;
            document.getElementById('debts-list').innerHTML = debtsHtml || '<tr><td colspan="4" class="text-center py-6 text-slate-400 font-bold">目前無欠費學生</td></tr>';

            // ===============================
            // 3. 今日缺席名單
            // ===============================
            let absencesHtml = '';
            let absCount = 0;
            attendance.forEach(a => {
                if (a.leave_type && a.leave_type !== 'none') {
                    absCount++;
                    const sName = stuIdToName[a.student_id] || '未知';
                    absencesHtml += `<tr class="hover:bg-amber-50 transition"><td class="py-2 font-bold text-slate-800">${sName}</td><td class="py-2"><span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-xs font-black">${a.leave_type}</span></td><td class="py-2 text-xs text-slate-500 font-bold">${a.leave_reason || '--'}</td></tr>`;
                }
            });
            document.getElementById('stat-absence-count').innerText = absCount;
            document.getElementById('absences-list').innerHTML = absencesHtml || '<tr><td colspan="3" class="text-center py-6 text-slate-400 font-bold border-2 border-dashed rounded-lg">今日全員全勤</td></tr>';

            // 呼叫獨立的任務載入函數
            loadTasks();
        }

        // 🌟 獨立的任務載入函數 (負責更新清單與綠色卡片)
        async function loadTasks() {
            const selectedDate = document.getElementById('task-date').value || getLocalToday();
            const { data: todos } = await sb.from('todo_notes').select('id, content').eq('note_date', selectedDate).order('created_at', { ascending: false });
            
            // 1. 更新下方的清單
            document.getElementById('today-tasks-list').innerHTML = (todos || []).length > 0
                ? todos.map(t => `
                    <div class="flex items-center justify-between bg-white p-3 rounded border border-slate-200 shadow-sm">
                        <span class="font-bold text-slate-700 text-sm">🔹 ${t.content}</span>
                        <button onclick="deleteTask('${t.id}')" class="text-slate-400 hover:text-rose-500 font-black px-2 py-1 rounded transition">✕</button>
                    </div>`).join('')
                : '<div class="text-center py-4 text-slate-400 font-bold border-2 border-dashed rounded-lg bg-slate-50">無待辦事項</div>';

            // 2. 更新右上角的綠色卡片
            document.getElementById('stat-task-count').innerText = (todos || []).length;
            const isToday = selectedDate === getLocalToday();
            document.getElementById('task-card-title').innerText = isToday ? '今日待辦事項' : `${selectedDate.slice(5)} 待辦事項`;

            const previewBox = document.getElementById('stat-task-preview');
            if (todos && todos.length > 0) {
                // 最多顯示 3 筆在綠色卡片裡
                const previewHtml = todos.slice(0, 3).map(t => `<div class="truncate bg-emerald-800/40 px-2 py-1 rounded">🔹 ${t.content}</div>`).join('');
                previewBox.innerHTML = previewHtml + (todos.length > 3 ? `<div class="text-xs text-emerald-200 mt-1 pt-1 border-t border-emerald-600/50 text-center">...及其他 ${todos.length - 3} 項</div>` : '');
            } else {
                previewBox.innerHTML = '<div class="text-emerald-200 text-xs mt-2">目前無事項</div>';
            }
        }

        async function addTask() {
            const date = document.getElementById('task-date').value;
            const content = document.getElementById('task-content').value.trim();
            if(!date || !content) return alert("日期與事項內容不得為空！");
            
            const { error } = await sb.from('todo_notes').insert([{ note_date: date, content: content }]);
            if(error) return alert("新增失敗：" + error.message);
            
            document.getElementById('task-content').value = '';
            loadTasks(); 
        }

        async function deleteTask(id) {
            if(!confirm("確定要刪除/完成此事項嗎？")) return;
            const { error } = await sb.from('todo_notes').delete().eq('id', id);
            if(error) return alert("刪除失敗：" + error.message);
            loadTasks(); 
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
