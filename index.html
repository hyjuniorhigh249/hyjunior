<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="pip-tool.js"></script>
    
    <script>
        // Supabase 配置
        const supabaseUrl = 'https://hlelxeiwamvrntsxnram.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 頁面載入時立即檢查登入狀態
        async function checkAuth() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            if (!session) {
                // 偵測到未登入，直接觸發 Google OAuth 跳轉
                await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        // 登入成功後導回目前的網址
                        redirectTo: window.location.origin + window.location.pathname 
                    }
                });
            } else {
                // 已登入，顯示使用者帳號
                const emailElement = document.getElementById('admin-email');
                if (emailElement) emailElement.innerText = session.user.email;
            }
        }
        
        checkAuth();

        // 監聽驗證狀態，處理登出情況
        supabaseClient.auth.onAuthStateChange((event) => {
            if (event === 'SIGNED_OUT') {
                // 登出後重新載入，會再次觸發 checkAuth 並跳轉至 Google
                window.location.reload();
            }
        });
    </script>

    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; }
        
        .nav-link { 
            display: flex;
            align-items: center;
            padding: 0.5rem 0.75rem; 
            border-radius: 0.5rem; 
            font-weight: 700; 
            color: #475569; 
            transition: all 0.2s;
            font-size: 0.875rem; 
            gap: 0.5rem; 
            width: 100%;
            text-align: left;
            margin-bottom: 0.25rem;
        }

        .nav-link:hover { background-color: #f8fafc; }

        .nav-link.active { 
            background-color: #1e293b; 
            color: #ffffff; 
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); 
        }

        .sidebar-header { 
            font-weight: 900; 
            font-size: 1.125rem; 
            margin-bottom: 1rem; 
            color: #1e293b; 
            border-bottom: 1px solid #e2e8f0; 
            padding-bottom: 0.5rem; 
            text-align: center;
            font-style: italic;
            cursor: pointer;
        }
        
        .section-label { 
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8; 
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            letter-spacing: 0.05em;
        }

        .text-blue-link { color: #2563eb; }
        .text-blue-link:hover { background-color: #eff6ff; }
    </style>
</head>
<body class="flex h-screen bg-white overflow-hidden">

    <nav class="w-40 bg-white border-r border-slate-200 p-3 flex flex-col shrink-0 h-screen sticky top-0">
        <div onclick="changePage('dashboard.html', document.getElementById('nav-dash'))" class="sidebar-header">
            浩元行政
        </div>

        <div class="flex flex-col">
            <button id="nav-dash" onclick="changePage('dashboard.html', this)" class="nav-link active">
                <span>🏠</span> 系統首頁
            </button>
            <button id="nav-students" onclick="changePage('students.html', this)" class="nav-link">
                <span>👥</span> 學生總檔
            </button>
            <button id="nav-classes" onclick="changePage('classes.html', this)" class="nav-link">
                <span>👨‍🏫</span> 班級管理
            </button>
            <button id="nav-layout" onclick="changePage('layout_editor.html', this)" class="nav-link">
                <span>🪑</span> 教室座位
            </button>
            <button id="nav-attendance" onclick="changePage('attendance.html', this)" class="nav-link">
                <span>📚</span> 點名與成績
            </button>
        </div>
        
        <div class="mt-4 pt-4 border-t border-slate-100">
            <p class="section-label">快捷工具</p>
            <button onclick="startPiP()" class="nav-link text-blue-link">
                <span>📱</span> 迷你通訊窗
            </button>
        </div>

        <div class="mt-auto pt-4 border-t border-slate-100 px-2">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">管理員</p>
            <p id="admin-email" class="text-[10px] font-medium text-slate-500 truncate mb-2">驗證中...</p>
            <button onclick="logout()" class="w-full text-left text-[10px] font-bold text-red-400 hover:text-red-600 transition">登出系統</button>
        </div>
    </nav>

    <main class="flex-1 relative bg-slate-50">
        <iframe id="main-content" src="dashboard.html" class="w-full h-full border-none"></iframe>
    </main>

    <script>
        function changePage(url, btn) {
            const iframe = document.getElementById('main-content');
            if (iframe) {
                iframe.src = url;
            }

            if (btn) {
                document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
        }

        // 登出函式
        async function logout() {
            if(confirm("確定要登出系統嗎？")) {
                await supabaseClient.auth.signOut();
            }
        }
    </script>
</body>
</html>
