<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>學生總檔 - 浩元行政雲端系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f9; font-size: 13px; }
        .form-input { @apply w-full px-3 py-2 border border-slate-200 rounded-lg bg-white focus:ring-2 focus:ring-slate-800 outline-none transition-all; }
        .stu-table th { position: sticky; top: 0; background: #fff; z-index: 10; padding: 12px 10px; border-bottom: 2px solid #edf2f7; }
        .stu-table td { padding: 10px; border-bottom: 1px solid #edf2f7; }
        .loading-overlay { display: none; background: rgba(255,255,255,0.7); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="min-h-screen flex">

    <nav class="w-40 bg-white border-r border-slate-200 p-3 flex flex-col gap-1 shrink-0">
        <div class="font-black text-lg mb-4 text-slate-800 border-b pb-2 text-center italic">浩元行政</div>
        <a href="index.html" class="px-3 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-50 text-sm">🏠 首頁概況</a>
        <a href="students.html" class="px-3 py-2 rounded-lg font-bold bg-slate-800 text-white text-sm">👤 學生總檔</a>
        <a href="classes.html" class="px-3 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-50 text-sm">👥 班級管理</a>
    </nav>

    <main class="flex-1 flex flex-col min-h-0 relative">
        <div id="loading" class="loading-overlay absolute inset-0 z-50 flex items-center justify-center font-black text-slate-400">
            雲端資料處理中...
        </div>

        <div class="bg-white border-b border-slate-200 p-3 px-6 flex items-center gap-4 shadow-sm z-20">
            <div class="relative flex-1 max-w-2xl">
                <span class="absolute left-3 top-2.5 text-slate-400">🔍</span>
                <input type="text" id="global-search" oninput="fetchStudents()" 
                    placeholder="搜尋姓名、電話、學校、地址..." 
                    class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-full bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-800 outline-none transition-all font-bold">
            </div>
            <div id="auth-status" class="text-[10px] font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">檢查權限中...</div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 max-w-7xl mx-auto">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-black text-slate-700 flex items-center gap-2">
                        <span class="w-1.5 h-4 bg-slate-800 rounded-full"></span>
                        新增學生基本資料
                    </h3>
                    <button onclick="handleAddStudent()" class="bg-slate-800 text-white px-6 py-1.5 rounded-lg font-bold hover:bg-slate-700 active:scale-95 transition">
                        確認入庫
                    </button>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
                    <input type="text" id="f-name" class="form-input font-bold text-slate-800" placeholder="姓名*">
                    <input type="text" id="f-school" class="form-input" placeholder="就讀學校">
                    <input type="text" id="f-telP" class="form-input font-mono" placeholder="爸爸電話">
                    <input type="text" id="f-telM" class="form-input font-mono" placeholder="媽媽電話">
                    <input type="text" id="f-telO" class="form-input font-mono" placeholder="選填電話">
                    <input type="text" id="f-addr" class="form-input" placeholder="通訊地址">
                    <input type="text" id="f-note" class="form-input" placeholder="備註">
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-w-7xl mx-auto">
                <div class="overflow-x-auto" style="max-height: calc(100vh - 250px);">
                    <table class="stu-table w-full text-left border-collapse">
                        <thead class="text-[11px] font-black text-slate-400 uppercase tracking-tighter">
                            <tr>
                                <th class="w-24">姓名</th>
                                <th class="w-44">家長電話</th>
                                <th class="w-32">學校</th>
                                <th>通訊地址</th>
                                <th class="w-40">備註</th>
                                <th class="w-16 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="stu-table-body" class="text-slate-600">
                            </tbody>
                    </table>
                </div>
                <div class="p-2 px-4 bg-slate-50 border-t flex justify-end">
                    <span id="stu-count" class="text-[10px] font-bold text-slate-400">WAITING FOR DATA...</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://hlelxeiwamvrntsxnram.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWx4ZWl3YW12cm50c3hucmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDA1MDcsImV4cCI6MjA5MjQxNjUwN30.9HeOoGrhkZ3wIQ-tPutf1AQcS4lz3L1VIdTqMr5iqnM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        // 初始化檢查登入狀態
        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                alert("請先返回首頁登入！");
                window.location.href = "index.html";
                return;
            }
            currentUser = user;
            document.getElementById('auth-status').innerText = `管理員：${user.email}`;
            fetchStudents();
        }

        // 顯示/隱藏載入中
        function toggleLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        // 從 Supabase 抓取資料 (支援搜尋)
        async function fetchStudents() {
            const keyword = document.getElementById('global-search').value.trim();
            toggleLoading(true);

            let query = supabaseClient.from('students').select('*').order('created_at', { ascending: false });

            if (keyword) {
                // Supabase 的 or 語法，用於多欄位關鍵字搜尋
                query = query.or(`name.ilike.%${keyword}%,tel_p.ilike.%${keyword}%,tel_m.ilike.%${keyword}%,addr.ilike.%${keyword}%,school.ilike.%${keyword}%`);
            }

            const { data, error } = await query;

            toggleLoading(false);
            if (error) {
                console.error(error);
                document.getElementById('stu-table-body').innerHTML = `<tr><td colspan="6" class="text-center py-10 text-rose-400 font-bold">權限不足或連線失敗</td></tr>`;
                return;
            }

            renderTable(data);
        }

        // 渲染表格
        function renderTable(list) {
            const body = document.getElementById('stu-table-body');
            document.getElementById('stu-count').innerText = `TOTAL: ${list.length} STUDENTS`;
            
            if (list.length === 0) {
                body.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-slate-300">查無資料</td></tr>`;
                return;
            }

            body.innerHTML = list.map(s => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="font-black text-slate-800">${s.name}</td>
                    <td class="text-[11px] leading-tight text-slate-500 font-mono">
                        ${s.tel_p ? '<div>父: '+s.tel_p+'</div>' : ''}
                        ${s.tel_m ? '<div>母: '+s.tel_m+'</div>' : ''}
                        ${s.tel_o ? '<div class="text-slate-300">他: '+s.tel_o+'</div>' : ''}
                    </td>
                    <td class="text-slate-500">${s.school || '-'}</td>
                    <td class="text-xs max-w-[250px] truncate" title="${s.addr}">${s.addr || '-'}</td>
                    <td class="text-xs text-slate-400 italic">${s.note || '-'}</td>
                    <td class="text-center">
                        <button onclick="deleteStudent('${s.id}', '${s.name}')" class="text-slate-300 hover:text-rose-500 transition">✕</button>
                    </td>
                </tr>
            `).join('');
        }

        // 新增學生到 Supabase
        async function handleAddStudent() {
            const name = document.getElementById('f-name').value.trim();
            if (!name) return alert("姓名為必填項目！");

            const newStu = {
                name: name,
                school: document.getElementById('f-school').value.trim(),
                tel_p: document.getElementById('f-telP').value.trim(),
                tel_m: document.getElementById('f-telM').value.trim(),
                tel_o: document.getElementById('f-telO').value.trim(),
                addr: document.getElementById('f-addr').value.trim(),
                note: document.getElementById('f-note').value.trim(),
                created_by: currentUser.id
            };

            toggleLoading(true);
            const { error } = await supabaseClient.from('students').insert([newStu]);
            toggleLoading(false);

            if (error) {
                alert("新增失敗，請檢查權限：" + error.message);
            } else {
                // 清空輸入
                ['f-name','f-school','f-telP','f-telM','f-telO','f-addr','f-note'].forEach(id => document.getElementById(id).value = '');
                fetchStudents();
            }
        }

        // 刪除學生
        async function deleteStudent(id, name) {
            if (!confirm(`確定要刪除學生「${name}」嗎？此動作無法復原。`)) return;

            toggleLoading(true);
            const { error } = await supabaseClient.from('students').delete().eq('id', id);
            toggleLoading(false);

            if (error) {
                alert("刪除失敗：" + error.message);
            } else {
                fetchStudents();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
