<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浩元行政系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="pip-tool.js"></script>
    <style>
        /* 使用更現代的字體組合，增加閱讀舒適度 */
        body { 
            font-family: "Inter", "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background-color: #fcfcfc;
        }
        
        /* 導覽按鈕優化：增加垂直間隔、字距與內距 */
        .nav-btn { 
            @apply flex items-center w-full px-5 py-3.5 rounded-xl font-bold text-slate-500 
                   hover:bg-slate-50 hover:text-slate-800 transition-all mb-3 text-left;
            letter-spacing: 0.025em;
        }
        
        /* 啟用狀態的按鈕 */
        .nav-btn.active { 
            @apply bg-white text-slate-900 border border-slate-200 shadow-sm;
        }

        .nav-icon { @apply mr-3 text-lg opacity-80; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-56 bg-white border-r border-slate-200 p-6 flex flex-col shrink-0">
        
        <div onclick="changePage('dashboard.html', document.getElementById('btn-dash'))" class="cursor-pointer mb-10 group">
            <h1 class="text-2xl font-black text-slate-800 italic tracking-tighter group-hover:text-emerald-600 transition-colors">
                浩元行政
            </h1>
            <div class="h-1 w-8 bg-emerald-500 mt-1 rounded-full group-hover:w-12 transition-all"></div>
        </div>

        <nav class="flex-1">
            <button id="btn-dash" onclick="changePage('dashboard.html', this)" class="nav-btn">
                <span class="nav-icon">📊</span>
                <span>數據概況</span>
            </button>

            <button id="btn-students" onclick="changePage('students.html', this)" class="nav-btn active">
                <span class="nav-icon">👤</span>
                <span>學生總檔</span>
            </button>

            <button id="btn-classes" onclick="changePage('classes.html', this)" class="nav-btn">
                <span class="nav-icon">👥</span>
                <span>班級管理</span>
            </button>
        </nav>

        <div class="mt-auto pt-6 border-t border-slate-100">
            <button onclick="startPiP()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black text-xs shadow-md transition-all active:scale-95 flex items-center justify-center gap-2">
                <span>💬</span> 開啟通訊窗
            </button>
        </div>
    </aside>

    <main class="flex-1 bg-slate-50 relative">
        <iframe id="main-content" src="students.html" class="w-full h-full border-none"></iframe>
    </main>

    <script>
        function changePage(url, btn) {
            const iframe = document.getElementById('main-content');
            iframe.src = url;

            // 更新按鈕高亮狀態
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }
    </script>
</body>
</html>
